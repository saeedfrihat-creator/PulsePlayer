          /** Remembers the last scan of each network library on disk so the home screen opens instantly. */
          object LibraryCache {
              private const val FORMAT_VERSION = 4

              private fun fileFor(context: Context, sourceId: String): File =
                  File(context.filesDir, "library_" + sourceId.filter { it.isLetterOrDigit() } + ".json")

              fun delete(context: Context, sourceId: String) {
                  runCatching { fileFor(context, sourceId).delete() }
              }

              class Snapshot(val savedAtMs: Long, val songs: List<SongItem>)

              suspend fun load(context: Context, source: LibrarySource): Snapshot? = withContext(Dispatchers.IO) {
                  try {
                      readSnapshot(context, source)
                  } catch (e: Exception) {
                      null
                  }
              }

              suspend fun save(context: Context, source: LibrarySource, songs: List<SongItem>) {
                  withContext(Dispatchers.IO) {
                      try {
                          writeSnapshot(context, source, songs)
                      } catch (e: Exception) {
                          // A failed cache write only means a slower start next time.
                      }
                  }
              }

              private fun readSnapshot(context: Context, source: LibrarySource): Snapshot? {
                  val key = source.cacheKey
                  val file = fileFor(context, source.id)
                  if (!file.exists()) return null
                  val root = JSONObject(file.readText(Charsets.UTF_8))
                  if (root.optInt("v") != FORMAT_VERSION || root.optString("key") != key) return null
                  val arr = root.getJSONArray("songs")
                  val songs = ArrayList<SongItem>(arr.length())
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      songs.add(
                          SongItem(
                              id = o.getString("id"),
                              title = o.optString("t"),
                              artist = o.optString("a"),
                              album = o.optString("al"),
                              folder = o.optString("f"),
                              durationMs = o.optLong("d"),
                              uri = o.getString("u"),
                              isRemote = true,
                              sourceId = source.id,
                              coverArtId = o.optString("c")
                          )
                      )
                  }
                  return Snapshot(root.optLong("savedAt"), songs)
              }

              private fun writeSnapshot(context: Context, source: LibrarySource, songs: List<SongItem>) {
                  val key = source.cacheKey
                  val arr = JSONArray()
                  for (s in songs) {
                      arr.put(
                          JSONObject()
                              .put("id", s.id)
                              .put("t", s.title)
                              .put("a", s.artist)
                              .put("al", s.album)
                              .put("f", s.folder)
                              .put("d", s.durationMs)
                              .put("u", s.uri)
                              .put("c", s.coverArtId)
                      )
                  }
                  val root = JSONObject()
                      .put("v", FORMAT_VERSION)
                      .put("key", key)
                      .put("savedAt", System.currentTimeMillis())
                      .put("songs", arr)
                  val target = fileFor(context, source.id)
                  val temp = File(target.path + ".tmp")
                  temp.writeText(root.toString(), Charsets.UTF_8)
                  if (!temp.renameTo(target)) {
                      target.delete()
                      temp.renameTo(target)
                  }
              }
          }

          object MusicRepository {

