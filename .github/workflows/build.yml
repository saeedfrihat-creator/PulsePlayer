      - name: Download fonts (Alexandria + Amiri, SIL Open Font License)
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets/licenses
          base="https://raw.githubusercontent.com/google/fonts/main/ofl"
          fetch() {
            if ! curl -fsSL --retry 3 --retry-delay 2 -o "$2" "$1"; then
              rm -f "$2"
              echo "::warning title=Font download failed::$1 — the app will use the system font instead."
            fi
          }
          fetch "$base/alexandria/Alexandria%5Bwght%5D.ttf" app/src/main/res/font/alexandria.ttf
          fetch "$base/amiri/Amiri-Regular.ttf" app/src/main/res/font/amiri_regular.ttf
          fetch "$base/amiri/Amiri-Bold.ttf" app/src/main/res/font/amiri_bold.ttf
          fetch "$base/alexandria/OFL.txt" app/src/main/assets/licenses/alexandria-OFL.txt
          fetch "$base/amiri/OFL.txt" app/src/main/assets/licenses/amiri-OFL.txt
          ls -la app/src/main/res/font

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/pulse-release.jks" || {
              echo "::error title=Invalid signing key::SIGNING_KEYSTORE_BASE64 is not valid Base64. Re-create it with step 2 at the top of this file."
              exit 1
            }
            echo "PULSE_KEYSTORE_PATH=$RUNNER_TEMP/pulse-release.jks" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the fixed release key."
          else
            echo "::warning title=Signing key missing::Building a DEBUG APK with a throw-away key. It will NOT install over the previous build. Add the SIGNING_* secrets (see the top of this workflow) to fix this."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Universal APK (Phone + Android TV)
        env:
          BUILD_MODE: ${{ steps.signing.outputs.mode }}
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          PULSE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          PULSE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ "$BUILD_MODE" = "release" ]; then
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/PulsePlayer-v3.10.${GITHUB_RUN_NUMBER}.apk"
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/PulsePlayer-v3.10.${GITHUB_RUN_NUMBER}-debug-UNSIGNED-KEY.apk"
          fi

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/pulse-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PulsePlayer-Universal-TV-APK
          path: dist/*.apk
          if-no-files-found: error
