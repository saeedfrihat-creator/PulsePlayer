                      }
                      for (b in 0 until bands) {
                          val hz = eq.getCenterFreq(b.toShort()) / 1000
                          val ratio = when (preset) {
                              EQ_VOICE -> when {
                                  hz < 150 -> -0.25f
                                  hz < 500 -> 0.0f
                                  hz < 3500 -> 0.42f
                                  hz < 7000 -> 0.25f
                                  else -> -0.10f
                              }
                              EQ_BASS -> when {
                                  hz < 150 -> 0.65f
                                  hz < 350 -> 0.40f
                                  hz < 2000 -> 0.0f
                                  hz < 6000 -> 0.15f
                                  else -> 0.30f
                              }
                              EQ_WARM -> when {
                                  hz < 200 -> 0.30f
                                  hz < 800 -> 0.25f
                                  hz < 3000 -> 0.05f
                                  else -> -0.20f
                              }
                              else -> 0f
                          }
                          val target = (ratio * maxLvl).toInt().coerceIn(minLvl, maxLvl).toShort()
                          eq.setBandLevel(b.toShort(), target)
                      }
                      eq.enabled = true
                  }
              }

              private fun releaseEqualizer() {
                  runCatching { equalizer?.release() }
                  equalizer = null
                  eqSessionId = C.AUDIO_SESSION_ID_UNSET
              }

              fun shutdownService() {
                  lifecycleHandler.removeCallbacksAndMessages(null)
                  retryHandler.removeCallbacksAndMessages(null)
                  PlaybackBridge.sleepTimerTargetMs = 0L
                  AudioSpectrumBus.clear()
                  runCatching { stopForeground(STOP_FOREGROUND_REMOVE) }
                  stopSelf()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  return mediaSession
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val player = mediaSession?.player
                  if (PlaybackBridge.stopOnTaskRemoved) {
                      if (player != null) {
                          player.volume = 1f
                          player.playWhenReady = false
                          player.pause()
                          player.stop()
                          player.clearMediaItems()
                      }
                      shutdownService()
                      return
                  }
                  val activelyPlaying = player != null &&
                      player.playWhenReady &&
                      player.mediaItemCount > 0 &&
                      player.playbackState != Player.STATE_ENDED
                  if (!activelyPlaying) {
                      shutdownService()
                  }
              }

              override fun onDestroy() {
                  lifecycleHandler.removeCallbacksAndMessages(null)
                  retryHandler.removeCallbacksAndMessages(null)
                  releaseEqualizer()
                  PlaybackBridge.detach()
                  AudioSpectrumBus.clear()
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  // Closing SMB sends network packets, which is not allowed on the main thread.
                  Thread { SmbSharePool.invalidateAll() }.start()
                  super.onDestroy()
              }
          }
