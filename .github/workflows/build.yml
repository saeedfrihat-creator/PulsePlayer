          @Composable
          private fun SegmentPill(
              label: String,
              icon: ImageVector,
              selected: Boolean,
              onClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (isFocused) 1.03f else 1f, label = "segScale")
              val shape = RoundedCornerShape(14.dp)

              Box(
                  modifier = modifier
                      .scale(scale)
                      .height(44.dp)
                      .clip(shape)
                      .then(
                          if (selected) Modifier.background(AuraPalette.PrimaryGradient)
                          else if (isFocused) Modifier.background(Color(0x28FFFFFF))
                          else Modifier.background(Color.Transparent)
                      )
                      .border(
                          width = if (isFocused) 2.dp else 0.dp,
                          color = if (isFocused) AuraPalette.Cyan else Color.Transparent,
                          shape = shape
                      )
                      .onFocusChanged { isFocused = it.isFocused }
                      .clickable(onClick = onClick),
                  contentAlignment = Alignment.Center
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.Center,
                      modifier = Modifier.padding(horizontal = 10.dp)
                  ) {
                      Icon(
                          icon,
                          contentDescription = null,
                          tint = if (selected) Color.White else AuraPalette.MutedText,
                          modifier = Modifier.size(17.dp)
                      )
                      Spacer(Modifier.width(6.dp))
                      Text(
                          label,
                          color = if (selected) Color.White else AuraPalette.MutedText,
                          fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium,
                          fontSize = 13.sp,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

