          @Composable
          private fun MusicPortalCard(
              selected: Boolean,
              folderCount: Int,
              songCount: Int,
              isTv: Boolean,
              onClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              var focused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(
                  targetValue = when {
                      focused -> 1.035f
                      selected -> 1.01f
                      else -> 0.99f
                  },
                  animationSpec = tween(260),
                  label = "musicPortalScale"
              )
              val glowAlpha by animateFloatAsState(
                  targetValue = if (selected) 1f else if (focused) 0.72f else 0.25f,
                  animationSpec = tween(350),
                  label = "musicPortalGlow"
              )
              val shape = RoundedCornerShape(if (isTv) 26.dp else 22.dp)
              val borderBrush = if (selected || focused) {
                  Brush.linearGradient(listOf(Pal.Ember, Pal.Lilac))
              } else {
                  Brush.linearGradient(listOf(Color(0x28F4F1EA), Color(0x12FFFFFF)))
              }
              val bgBrush = if (selected) {
                  Brush.linearGradient(listOf(Color(0xFF2B192E), Color(0xFF1A1426), Color(0xFF110E18)))
              } else {
                  Brush.linearGradient(listOf(Color(0xFF181522), Color(0xFF100E16)))
              }

              Box(
                  modifier = modifier
                      .height(if (isTv) 134.dp else 112.dp)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .shadow(
                          elevation = if (selected || focused) 18.dp else 4.dp,
                          shape = shape,
                          ambientColor = Pal.Ember,
                          spotColor = if (selected || focused) Pal.Ember else Color.Black
                      )
                      .clip(shape)
                      .background(bgBrush)
                      .border(width = if (focused) 3.dp else if (selected) 2.dp else 1.dp, brush = borderBrush, shape = shape)
                      .onFocusChanged { focused = it.isFocused }
                      .clickable(role = Role.Tab, onClick = onClick)
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val w = size.width
                      val h = size.height
                      val waveCenterY = h * 0.50f
                      if (selected || focused) {
                          drawCircle(
                              brush = Brush.radialGradient(
                                  listOf(Pal.Ember.copy(alpha = 0.20f * glowAlpha), Color.Transparent),
                                  center = Offset(w * 0.20f, h * 0.45f),
                                  radius = h * 1.15f
                              ),
                              radius = h * 1.15f,
                              center = Offset(w * 0.20f, h * 0.45f)
                          )
                          drawCircle(
                              brush = Brush.radialGradient(
                                  listOf(Pal.Lilac.copy(alpha = 0.16f * glowAlpha), Color.Transparent),
                                  center = Offset(w * 0.82f, h * 0.80f),
                                  radius = h * 0.95f
                              ),
                              radius = h * 0.95f,
                              center = Offset(w * 0.82f, h * 0.80f)
                          )
                      }
                      val heights = floatArrayOf(0.18f, 0.34f, 0.56f, 0.82f, 0.48f, 0.92f, 0.64f, 0.40f, 0.22f)
                      val barCount = heights.size
                      val spanW = w * 0.36f
                      val startX = w * 0.08f
                      val step = spanW / barCount
                      val barW = (step * 0.46f).coerceAtLeast(2.2f * density)
                      val maxHalf = h * 0.30f
                      for (i in 0 until barCount) {
                          val halfH = maxHalf * heights[i]
                          val x = startX + i * step
                          val col = if (i % 2 == 0) Pal.Ember else Pal.Lilac
                          drawRoundRect(
                              color = col.copy(alpha = (0.45f * glowAlpha).coerceIn(0.08f, 0.55f)),
                              topLeft = Offset(x, waveCenterY - halfH),
                              size = Size(barW, halfH * 2f),
                              cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                          )
                      }
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
