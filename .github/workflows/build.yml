          /** Thin progress line, always left-to-right like the transport controls. */
          @Composable
          fun ProgressLine(
              progress: Float,
              accent: Color,
              track: Color,
              modifier: Modifier = Modifier,
              height: Dp = 4.dp,
              starThumb: Boolean = false
          ) {
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                  Canvas(modifier = modifier.fillMaxWidth().height(if (starThumb) 18.dp else height + 12.dp)) {
                      val h = height.toPx()
                      val cy = this.size.height / 2f
                      val p = progress.coerceIn(0f, 1f)
                      drawRoundRect(track, topLeft = Offset(0f, cy - h / 2f), size = Size(this.size.width, h), cornerRadius = CornerRadius(h, h))
                      drawRoundRect(accent, topLeft = Offset(0f, cy - h / 2f), size = Size(this.size.width * p, h), cornerRadius = CornerRadius(h, h))
                      val x = this.size.width * p
                      if (starThumb) {
                          // An eight-pointed star as the thumb (Sakina).
                          val half = 5.5.dp.toPx()
                          drawRect(accent, topLeft = Offset(x - half, cy - half), size = Size(half * 2f, half * 2f))
                          drawDiamond(Offset(x, cy), half, accent)
                          drawCircle(Pal.Night, radius = 1.8.dp.toPx(), center = Offset(x, cy))
                      } else {
                          drawCircle(accent.copy(alpha = 0.25f), radius = 9.dp.toPx(), center = Offset(x, cy))
                          drawCircle(Pal.Text, radius = 6.dp.toPx(), center = Offset(x, cy))
                      }
                  }
              }
          }

          /** Filled square turned 45°: with the plain square it makes the eight-pointed star thumb. */
          private fun DrawScope.drawDiamond(c: Offset, half: Float, color: Color) {
              rotate(45f, pivot = c) {
                  drawRect(color, topLeft = Offset(c.x - half, c.y - half), size = Size(half * 2f, half * 2f))
              }
          }

          @Composable
          fun SectionTitle(
              text: String,
              trailing: String? = null,
              modifier: Modifier = Modifier,
              titleColor: Color = Pal.Text,
              trailingColor: Color = Pal.Muted
          ) {
              Row(modifier = modifier, verticalAlignment = Alignment.Bottom, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text(text, fontSize = 18.sp, fontWeight = FontWeight.SemiBold, color = titleColor)
                  if (trailing != null) Text(trailing, fontSize = 13.sp, color = trailingColor)
              }
          }
