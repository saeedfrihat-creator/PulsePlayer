          enum class CoverKind { MUSIC, QURAN, DHIKR, FAVORITES }

          /**
           * A cover generated from a folder's name: the same name always gives the same artwork.
           * Coordinates are on a 100×100 grid.
           */
          @Immutable
          data class CoverSpec(
              val kind: CoverKind,
              val bg: Color,
              val c1: Color,
              val c2: Color,
              val c3: Color,
              val accent: Color,
              val ax: Float, val ay: Float, val ar: Float,
              val bx: Float, val by: Float, val br: Float,
              val dx: Float, val dy: Float, val dr: Float,
              val lineY: Float,
              val px: Float, val py: Float,
              val letter: String
          )

          object CoverArt {
              private class Palette(val bg: Long, val c1: Long, val c2: Long, val c3: Long, val accent: Long)

              private val palettes = listOf(
                  Palette(0xFF17143A, 0xFF7B6CFF, 0xFFFF8AB3, 0xFFF4F1EA, 0xFFFF8AB3), // indigo bloom
                  Palette(0xFF2A1512, 0xFFFF8A5B, 0xFFFFC37A, 0xFFF4F1EA, 0xFFFF8A5B), // ember dusk
                  Palette(0xFF0E2429, 0xFF3FC5B5, 0xFFE9E3C9, 0xFFFF8A5B, 0xFF4FD1C1), // sea glass
                  Palette(0xFF0E1A30, 0xFF5FA8FF, 0xFFFFD166, 0xFFF4F1EA, 0xFF7DB8FF), // night sky
                  Palette(0xFF1A2214, 0xFFA7C957, 0xFFF2E8CF, 0xFFF2E8CF, 0xFFB5D46A), // moss
                  Palette(0xFF241024, 0xFFE05A8A, 0xFFFFB86B, 0xFFF4F1EA, 0xFFFF7FA8), // plum sun
                  Palette(0xFF1B1530, 0xFFB388FF, 0xFF7CE0D3, 0xFFF4F1EA, 0xFFB79CFF), // violet mint
                  Palette(0xFF2B1A0E, 0xFFFFB347, 0xFFFF6B6B, 0xFFF4F1EA, 0xFFFFB347)  // amber coral
              )
              private val quranBackgrounds = listOf(0xFF0A2A21, 0xFF0B2232, 0xFF12261A)
              private val dhikrBackgrounds = listOf(0xFF13261F, 0xFF0F2428)

              private val cache = HashMap<String, CoverSpec>()

              fun forFavorites(isSakina: Boolean = false): CoverSpec = if (isSakina) {
                  CoverSpec(
                      kind = CoverKind.FAVORITES,
                      bg = Color(0xFF0A2A21),
                      c1 = Color(0xFF155E4B),
                      c2 = Pal.Gold,
                      c3 = Pal.GoldLight,
                      accent = Pal.Gold,
                      ax = 34f, ay = 34f, ar = 30f,
                      bx = 68f, by = 66f, br = 22f,
                      dx = 50f, dy = 50f, dr = 36f,
                      lineY = 0f, px = 0f, py = 0f, letter = ""
                  )
              } else {
                  CoverSpec(
                      kind = CoverKind.FAVORITES,
                      bg = Color(0xFF281022),
                      c1 = Color(0xFFFF6B8B),
                      c2 = Color(0xFFFF9A62),
                      c3 = Color(0xFFF4F1EA),
                      accent = Color(0xFFFF7A98),
                      ax = 34f, ay = 34f, ar = 30f,
                      bx = 68f, by = 66f, br = 24f,
                      dx = 50f, dy = 50f, dr = 36f,
                      lineY = 0f, px = 0f, py = 0f, letter = ""
                  )
              }

              fun forName(name: String, kind: IslamicKind): CoverSpec {
                  val key = kind.name + "|" + name
                  synchronized(cache) {
                      cache[key]?.let { return it }
                  }
                  val spec = build(name, kind)
                  synchronized(cache) {
                      if (cache.size > 400) cache.clear()
                      cache[key] = spec
                  }
                  return spec
              }

              private fun build(name: String, kind: IslamicKind): CoverSpec {
                  val rnd = Random(name.hashCode())
                  fun f(from: Int, to: Int): Float = from + rnd.nextFloat() * (to - from)
                  val letter = initialOf(name)
                  return when (kind) {
                      IslamicKind.QURAN -> plain(CoverKind.QURAN, Color(quranBackgrounds[rnd.nextInt(quranBackgrounds.size)]), letter)
                      IslamicKind.DHIKR -> plain(CoverKind.DHIKR, Color(dhikrBackgrounds[rnd.nextInt(dhikrBackgrounds.size)]), letter)
                      IslamicKind.NONE -> {
                          val p = palettes[rnd.nextInt(palettes.size)]
                          val ax = f(26, 72)
                          val ay = f(26, 72)
                          val ar = f(22, 35)
                          val bx = (100f - ax + f(-12, 12)).coerceIn(18f, 82f)
                          val by = (100f - ay + f(-12, 12)).coerceIn(18f, 82f)
                          val br = f(11, 29)
                          val ringOnA = rnd.nextBoolean()
                          CoverSpec(
                              kind = CoverKind.MUSIC,
                              bg = Color(p.bg), c1 = Color(p.c1), c2 = Color(p.c2), c3 = Color(p.c3), accent = Color(p.accent),
                              ax = ax, ay = ay, ar = ar,
                              bx = bx, by = by, br = br,
                              dx = if (ringOnA) ax else bx,
                              dy = if (ringOnA) ay else by,
                              dr = (if (ringOnA) ar else br) + f(7, 14),
                              lineY = f(12, 92),
                              px = if (ax > 50f) f(14, 30) else f(70, 86),
                              py = if (ay > 50f) f(14, 30) else f(70, 86),
                              letter = letter
                          )
                      }
                  }
              }

              private fun plain(kind: CoverKind, bg: Color, letter: String) = CoverSpec(
                  kind = kind, bg = bg, c1 = Pal.Gold, c2 = Pal.GoldLight, c3 = Pal.Gold, accent = Pal.Gold,
                  ax = 50f, ay = 50f, ar = 0f, bx = 50f, by = 50f, br = 0f, dx = 50f, dy = 50f, dr = 0f,
                  lineY = 0f, px = 0f, py = 0f, letter = letter
              )

              private fun initialOf(name: String): String {
                  val word = name.trim()
                      .split(' ', '-', '_', '—', '/', '.')
                      .firstOrNull { w -> w.any { it.isLetter() } } ?: return "ن"
                  val stripped = if (word.startsWith("ال") && word.length > 2) word.substring(2) else word
                  val ch = stripped.firstOrNull { it.isLetter() } ?: return "ن"
                  return ch.uppercaseChar().toString()
              }
          }

          internal fun DrawScope.drawStar8(center: Offset, half: Float, color: Color, strokeWidth: Float) {
              rotate(0f, pivot = center) {
                  drawRect(color, topLeft = Offset(center.x - half, center.y - half), size = Size(half * 2f, half * 2f), style = Stroke(strokeWidth))
              }
              rotate(45f, pivot = center) {
                  drawRect(color, topLeft = Offset(center.x - half, center.y - half), size = Size(half * 2f, half * 2f), style = Stroke(strokeWidth))
              }
          }

          internal fun DrawScope.drawCover(spec: CoverSpec) {
              val w = size.width
              val h = size.height
              val u = minOf(w, h) / 100f
              val ox = (w - 100f * u) / 2f
              val oy = (h - 100f * u) / 2f
              fun p(x: Float, y: Float) = Offset(ox + x * u, oy + y * u)

              drawRect(spec.bg)
              when (spec.kind) {
                  CoverKind.MUSIC -> {
                      drawCircle(spec.c1, radius = spec.ar * u, center = p(spec.ax, spec.ay))
                      drawCircle(spec.c2, radius = spec.br * u, center = p(spec.bx, spec.by), alpha = 0.92f, blendMode = BlendMode.Screen)
                      drawCircle(spec.c3, radius = spec.dr * u, center = p(spec.dx, spec.dy), alpha = 0.7f, style = Stroke(0.9f * u))
                      drawRect(spec.c3, topLeft = Offset(0f, oy + spec.lineY * u), size = Size(w, 0.7f * u), alpha = 0.45f)
                      drawCircle(spec.c3, radius = 2.2f * u, center = p(spec.px, spec.py))
                  }
                  CoverKind.QURAN -> {
                      val faint = Pal.Gold.copy(alpha = 0.32f)
                      drawStar8(p(0f, 0f), 12f * u, faint, 0.7f * u)
                      drawStar8(p(100f, 0f), 12f * u, faint, 0.7f * u)
                      drawStar8(p(0f, 100f), 12f * u, faint, 0.7f * u)
                      drawStar8(p(100f, 100f), 12f * u, faint, 0.7f * u)
                      drawStar8(p(50f, 50f), 23f * u, Pal.Gold, 1.1f * u)
                      drawCircle(Pal.Gold, radius = 16.5f * u, center = p(50f, 50f), style = Stroke(0.8f * u))
                  }
                  CoverKind.DHIKR -> {
                      val c = p(50f, 50f)
                      for (i in 0 until 6) {
                          rotate(i * 30f, pivot = c) {
                              drawOval(
                                  Pal.Gold.copy(alpha = 0.9f),
                                  topLeft = Offset(c.x - 34f * u, c.y - 11f * u),
                                  size = Size(68f * u, 22f * u),
                                  style = Stroke(0.9f * u)
                              )
                          }
                      }
                      drawCircle(Pal.Gold, radius = 5f * u, center = c)
                      drawCircle(Pal.Gold.copy(alpha = 0.4f), radius = 44f * u, center = c, style = Stroke(0.5f * u))
                  }
                  CoverKind.FAVORITES -> {
                      drawCircle(spec.c1.copy(alpha = 0.65f), radius = spec.ar * u, center = p(spec.ax, spec.ay))
                      drawCircle(spec.c2.copy(alpha = 0.55f), radius = spec.br * u, center = p(spec.bx, spec.by), blendMode = BlendMode.Screen)
                      drawCircle(spec.c3.copy(alpha = 0.35f), radius = spec.dr * u, center = p(spec.dx, spec.dy), style = Stroke(0.9f * u))
                  }
              }
          }

          /** Loads and caches embedded local album art and Navidrome cover art on a background thread. */
          object AlbumArtLoader {
              private val cache = object : LruCache<String, ImageBitmap>(48) {}
              private val failed = HashSet<String>()
              private val lock = Any()

              fun getCached(key: String?): ImageBitmap? {
                  if (key.isNullOrBlank()) return null
                  synchronized(lock) { return cache.get(key) }
              }

              fun clear() {
                  synchronized(lock) {
                      cache.evictAll()
                      failed.clear()
                  }
              }

              suspend fun load(context: Context, key: String): ImageBitmap? {
                  synchronized(lock) {
                      cache.get(key)?.let { return it }
                      if (key in failed) return null
                  }
                  val bmp = withContext(Dispatchers.IO) {
                      runCatching { decodeForKey(context.applicationContext, key) }.getOrNull()
                  }
                  val img = bmp?.asImageBitmap()
                  synchronized(lock) {
                      if (img != null) {
                          cache.put(key, img)
                      } else {
                          if (failed.size > 500) failed.clear()
                          failed.add(key)
                      }
                  }
                  return img
              }

              private fun decodeForKey(context: Context, key: String): Bitmap? {
                  return when {
                      key.startsWith("local|") -> {
                          val uriStr = key.removePrefix("local|")
                          val mmr = MediaMetadataRetriever()
                          try {
                              if (uriStr.startsWith("file://")) {
                                  val path = Uri.parse(uriStr).path ?: return null
                                  mmr.setDataSource(path)
                              } else {
                                  mmr.setDataSource(context, Uri.parse(uriStr))
                              }
                              val bytes = mmr.embeddedPicture ?: return null
                              decodeSampled(bytes, 512)
                          } finally {
                              runCatching { mmr.release() }
                          }
                      }
                      key.startsWith("nav|") -> {
                          val rest = key.removePrefix("nav|")
                          val sep = rest.indexOf('|')
                          if (sep <= 0) return null
                          val sourceId = rest.substring(0, sep)
                          val coverId = rest.substring(sep + 1)
                          val source = LibraryStore.source(context, sourceId) ?: return null
                          val url = NavidromeHelper.coverArtUrl(source, coverId, 512)
                          val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                              requestMethod = "GET"
                              connectTimeout = 6000
                              readTimeout = 8000
                          }
                          try {
                              if (conn.responseCode !in 200..299) return null
                              val bytes = conn.inputStream.use { it.readBytes() }
                              if (bytes.isEmpty()) return null
                              decodeSampled(bytes, 512)
                          } finally {
                              conn.disconnect()
                          }
                      }
                      else -> null
                  }
              }

              private fun decodeSampled(bytes: ByteArray, maxDim: Int): Bitmap? {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bounds)
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return null
                  var sample = 1
                  while (bounds.outWidth / sample > maxDim * 2 || bounds.outHeight / sample > maxDim * 2) {
                      sample *= 2
                  }
                  val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                  return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts)
              }
          }

          @Composable
          fun GenerativeCover(
              spec: CoverSpec,
              modifier: Modifier = Modifier,
              shape: Shape = RoundedCornerShape(22.dp),
              artKey: String? = null
          ) {
              val context = LocalContext.current
              val realArt by produceState<ImageBitmap?>(initialValue = AlbumArtLoader.getCached(artKey), key1 = artKey) {
                  value = if (artKey.isNullOrBlank()) null else AlbumArtLoader.load(context, artKey)
              }
              BoxWithConstraints(modifier = modifier.clip(shape), contentAlignment = Alignment.Center) {
                  val side: Dp = if (maxWidth < maxHeight) maxWidth else maxHeight
                  if (realArt != null) {
                      Image(
                          bitmap = realArt!!,
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else {
                      Canvas(
                          modifier = Modifier
                              .fillMaxSize()
                              .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                      ) {
                          drawCover(spec)
                      }
                      if (spec.kind == CoverKind.QURAN) {
                          Text(
                              spec.letter,
                              fontFamily = PulseFonts.quran,
                              fontWeight = FontWeight.Bold,
                              fontSize = (side.value * 0.22f).sp,
                              color = Pal.GoldLight,
                              modifier = Modifier.offset(y = -(side * 0.02f))
                          )
                      } else if (spec.kind == CoverKind.FAVORITES) {
                          Icon(
                              Icons.Rounded.Favorite,
                              contentDescription = null,
                              tint = if (spec.accent == Pal.Gold) Pal.GoldLight else Color(0xFFFFD6E0),
                              modifier = Modifier.size(side * 0.36f)
                          )
                      }
                  }
              }
          }

          /** Small round cover with a progress ring around it (mini player). */
          @Composable
          fun CoverProgressRing(
              spec: CoverSpec,
              progress: Float,
              accent: Color,
              track: Color,
              modifier: Modifier = Modifier,
              size: Dp = 54.dp,
              artKey: String? = null
          ) {
              Box(modifier = modifier.size(size), contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val stroke = 2.5.dp.toPx()
                      val inset = stroke / 2f
                      val arcSize = Size(this.size.width - stroke, this.size.height - stroke)
                      drawArc(track, 0f, 360f, false, topLeft = Offset(inset, inset), size = arcSize, style = Stroke(stroke))
                      drawArc(
                          accent, -90f, 360f * progress.coerceIn(0f, 1f), false,
                          topLeft = Offset(inset, inset), size = arcSize,
                          style = Stroke(stroke, cap = StrokeCap.Round)
                      )
                  }
                  GenerativeCover(spec = spec, artKey = artKey, modifier = Modifier.padding(size * 0.13f).fillMaxSize(), shape = CircleShape)
              }
          }
