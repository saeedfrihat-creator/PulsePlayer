          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.IntentSenderRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.annotation.RequiresApi
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.stringResource
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.delay
          import java.io.File

          @Composable
          fun PulseApp(vm: PulseViewModel, isResumed: Boolean) {
              val context = LocalContext.current
              val activity = context as? Activity
              val config = LocalConfiguration.current
              val isTv = (config.uiMode and Configuration.UI_MODE_TYPE_MASK) == Configuration.UI_MODE_TYPE_TELEVISION

              var showTvSearchDialog by remember { mutableStateOf(false) }
              var songToManage by remember { mutableStateOf<SongItem?>(null) }

              VisualizerTicker(clock = vm.clock, isPlaying = vm.isPlaying, isResumed = isResumed, isTv = isTv)

              DisposableEffect(vm.isFullScreen, isTv) {
                  if (vm.isFullScreen && isTv) {
                      activity?.window?.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
                  onDispose {
                      activity?.window?.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }

              val player = vm.player
              LaunchedEffect(player, vm.isPlaying, isResumed) {
                  while (player != null && vm.isPlaying && isResumed) {
                      vm.pollPosition()
                      delay(1000L)
                  }
              }
              LaunchedEffect(vm.rawFolders.size) {
                  if (vm.rawFolders.isNotEmpty()) {
                      vm.autoSelectInitialSectionIfNeeded()
                  }
              }

              // ---------------- Permissions ----------------
              val audioPermission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  Manifest.permission.READ_MEDIA_AUDIO
              } else {
                  Manifest.permission.READ_EXTERNAL_STORAGE
              }
              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { results ->
                  if (results.containsKey(audioPermission)) {
                      vm.onAudioPermission(results[audioPermission] == true)
                  }
              }
              fun requestAudioPermission() {
                  val perms = mutableListOf(audioPermission)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  permissionLauncher.launch(perms.toTypedArray())
              }
              LaunchedEffect(Unit) {
                  val granted = ContextCompat.checkSelfPermission(context, audioPermission) == PackageManager.PERMISSION_GRANTED
                  vm.onAudioPermission(granted)
                  vm.loadAll()
                  if (!granted && vm.sources.any { it.type == SourceType.DEVICE }) {
                      requestAudioPermission()
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED &&
                      vm.sources.isNotEmpty()
                  ) {
                      // The playback notification keeps music going in the background.
                      permissionLauncher.launch(arrayOf(Manifest.permission.POST_NOTIFICATIONS))
                  }
              }

              // ---------------- Deleting local files ----------------
              // On Android 10 the system asks for consent first; the delete is retried after "Allow".
              var pendingConsentDelete by remember { mutableStateOf<SongItem?>(null) }
              val deleteLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartIntentSenderForResult()
              ) { result ->
                  val retry = pendingConsentDelete
                  pendingConsentDelete = null
                  if (result.resultCode != Activity.RESULT_OK) return@rememberLauncherForActivityResult
                  if (retry == null) {
                      context.showToast(context.getString(R.string.toast_deleted))
                      vm.loadAll(force = false)
                      vm.sources.firstOrNull { it.type == SourceType.DEVICE }?.let { vm.refreshSource(it, force = true) }
                  } else {
                      val deleted = runCatching {
                          context.contentResolver.delete(Uri.parse(retry.uri), null, null) > 0
                      }.getOrDefault(false)
                      if (deleted) {
                          context.showToast(context.getString(R.string.toast_deleted))
                          vm.sources.firstOrNull { it.type == SourceType.DEVICE }?.let { vm.refreshSource(it, force = true) }
                      } else {
                          vm.hideSong(retry.id)
                          context.showToast(context.getString(R.string.toast_delete_failed_hidden))
                      }
                  }
              }

              fun refreshDevice() {
                  vm.sources.firstOrNull { it.type == SourceType.DEVICE }?.let { vm.refreshSource(it, force = true) }
              }

              fun deleteLocalSongPermanently(song: SongItem) {
                  if (vm.currentMediaId == song.id) vm.player?.pause()
                  val uri = Uri.parse(song.uri)
                  try {
                      when {
                          song.uri.startsWith("content://") && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R -> {
                              pendingConsentDelete = null
                              val pendingIntent = MediaStore.createDeleteRequest(context.contentResolver, listOf(uri))
                              deleteLauncher.launch(IntentSenderRequest.Builder(pendingIntent.intentSender).build())
                          }
                          song.uri.startsWith("content://") -> {
                              val deleted = context.contentResolver.delete(uri, null, null)
                              if (deleted > 0) {
                                  context.showToast(context.getString(R.string.toast_deleted))
                                  refreshDevice()
                              } else {
                                  vm.hideSong(song.id)
                                  context.showToast(context.getString(R.string.toast_delete_failed_hidden))
                              }
                          }
                          song.uri.startsWith("file://") -> {
                              val file = uri.path?.let { File(it) }
                              if (file != null && file.delete()) {
                                  context.showToast(context.getString(R.string.toast_deleted))
                                  refreshDevice()
                              } else {
                                  vm.hideSong(song.id)
                                  context.showToast(context.getString(R.string.toast_delete_failed_hidden))
                              }
                          }
                          else -> {
                              vm.hideSong(song.id)
                              context.showToast(context.getString(R.string.toast_song_hidden))
                          }
                      }
                  } catch (e: SecurityException) {
                      val consentSender = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) recoverableConsentSender(e) else null
                      if (consentSender != null) {
                          pendingConsentDelete = song
                          deleteLauncher.launch(IntentSenderRequest.Builder(consentSender).build())
                      } else {
                          vm.hideSong(song.id)
                          context.showToast(context.getString(R.string.toast_delete_failed_hidden))
                      }
                  } catch (e: Exception) {
                      vm.hideSong(song.id)
                      context.showToast(context.getString(R.string.toast_song_hidden))
                  }
              }

              // ---------------- Navigation ----------------
              BackHandler(enabled = vm.isFullScreen || vm.searchActive || vm.screen != Screen.Home) {
                  when {
                      vm.isFullScreen -> vm.isFullScreen = false
                      vm.searchActive -> {
                          vm.searchActive = false
                          vm.searchQuery = ""
                      }
                      else -> vm.back()
                  }
              }

              fun play(list: List<SongItem>, index: Int, shuffle: Boolean = false) {
                  if (vm.playList(list, index, shuffle) && isTv) vm.isFullScreen = true
              }

              fun openDevicePicker() {
                  vm.navigate(Screen.DevicePicker)
                  if (!vm.hasAudioPermission) requestAudioPermission()
              }

              val actions = HomeActions(
                  openSettings = { vm.navigate(Screen.Settings) },
                  openTvSearch = { showTvSearchDialog = true },
                  openFolder = { folder ->
                      vm.searchActive = false
                      vm.navigate(Screen.Folder(folder.key))
                  },
                  manageSong = { songToManage = it },
                  play = { list, index -> play(list, index) },
                  shuffleAll = { if (vm.shuffleSection() && isTv) vm.isFullScreen = true },
                  resumeLast = { if (vm.resumeSectionPlayback() && isTv) vm.isFullScreen = true },
                  openStudio = { vm.isFullScreen = true },
                  requestPermission = { requestAudioPermission() },
                  addDevice = { openDevicePicker() },
                  addNetwork = { vm.navigate(Screen.NetworkForm(null)) }
              )

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Pal.Ink)
              ) {
                  when (val screen = vm.screen) {
                      is Screen.Home -> HomeScreen(vm = vm, isTv = isTv, actions = actions)
                      is Screen.Folder -> FolderScreen(
                          vm = vm,
                          folderKey = screen.key,
                          isTv = isTv,
                          onBack = { vm.back() },
                          onPlay = { list, index, shuffle -> play(list, index, shuffle) },
                          onManageSong = { songToManage = it },
                          onOpenStudio = { vm.isFullScreen = true },
                          onOpenTvSearch = { showTvSearchDialog = true }
                      )
                      is Screen.Settings -> SettingsScreen(
                          vm = vm,
                          isTv = isTv,
                          onBack = { vm.back() },
                          onAddDevice = { openDevicePicker() },
                          onAddNetwork = { vm.navigate(Screen.NetworkForm(null)) },
                          onEditNetwork = { id -> vm.navigate(Screen.NetworkForm(id)) }
                      )
                      is Screen.NetworkForm -> NetworkFormScreen(vm = vm, editId = screen.editId, isTv = isTv, onBack = { vm.back() })
                      is Screen.DevicePicker -> DevicePickerScreen(
                          vm = vm,
                          isTv = isTv,
                          onBack = { vm.back() },
                          onRequestPermission = { requestAudioPermission() }
                      )
                  }

                  if (vm.isFullScreen) {
                      StudioScreen(vm = vm, isTv = isTv, onExit = { vm.isFullScreen = false })
                  }
              }

              // ---------------- Dialogs ----------------
              if (showTvSearchDialog) {
                  val inFolder = vm.screen is Screen.Folder
                  val folderName = (vm.screen as? Screen.Folder)?.let { vm.folderByKey(it.key)?.displayName }
                  TvSearchDialog(
                      initialQuery = if (inFolder) vm.folderQuery else vm.searchQuery,
                      placeholder = if (folderName != null) {
                          stringResource(R.string.search_in_folder, folderName)
                      } else {
                          val secLabel = stringResource(
                              if (vm.activeSection == LibrarySection.QURAN) R.string.section_quran else R.string.section_music
                          )
                          stringResource(R.string.search_in_section, secLabel)
                      },
                      onSearch = { query ->
                          if (inFolder) {
                              vm.folderQuery = query
                          } else {
                              vm.searchQuery = query
                              vm.searchActive = query.isNotBlank()
                          }
                          showTvSearchDialog = false
                      },
                      onClear = {
                          if (inFolder) {
                              vm.folderQuery = ""
                          } else {
                              vm.searchQuery = ""
                              vm.searchActive = false
                          }
                          showTvSearchDialog = false
                      },
                      onDismiss = { showTvSearchDialog = false }
                  )
              }

              songToManage?.let { song ->
                  val songKind = vm.kindOf(song)
                  val inQuran = songKind != IslamicKind.NONE
                  val folderLabel = song.folder.substringAfterLast('/').ifBlank { song.folder.ifBlank { "Pulse" } }
                  val cover = CoverArt.forName(folderLabel, songKind)
                  val artKey = if (!inQuran) vm.artKeyOf(song) else null
                  ManageSongDialog(
                      song = song,
                      cover = cover,
                      artKey = artKey,
                      isFavorite = vm.isFavorite(song.id),
                      isInQuranSection = inQuran,
                      canDelete = !song.isRemote,
                      onToggleFavorite = {
                          vm.toggleFavorite(song.id)
                          songToManage = null
                      },
                      onMoveSongSection = {
                          val target = if (inQuran) LibrarySection.MUSIC else LibrarySection.QURAN
                          vm.moveSongToSection(song, target)
                          songToManage = null
                      },
                      onMoveFolderSection = {
                          val target = if (inQuran) LibrarySection.MUSIC else LibrarySection.QURAN
                          vm.moveFolderToSection(song.folderKey, target)
                          songToManage = null
                      },
                      onHideSong = {
                          vm.hideSong(song.id)
                          songToManage = null
                          context.showToast(context.getString(R.string.toast_song_hidden))
                      },
                      onHideFolder = {
                          vm.hideFolder(song.folderKey)
                          songToManage = null
                          context.showToast(
                              context.getString(R.string.toast_folder_hidden, song.folder.substringAfterLast('/'))
                          )
                      },
                      onDelete = {
                          songToManage = null
                          deleteLocalSongPermanently(song)
                      },
                      onDismiss = { songToManage = null }
                  )
              }
          }

