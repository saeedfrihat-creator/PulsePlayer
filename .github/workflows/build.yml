          @Composable
          private fun StudioProgress(vm: PulseViewModel, mood: Mood, isSakina: Boolean, isTv: Boolean, onInteract: () -> Unit) {
              var dragging by remember { mutableStateOf(false) }
              var dragPos by remember { mutableFloatStateOf(0f) }
              val duration = vm.durationMs
              val shown = if (dragging) dragPos.toLong() else vm.positionMs
              val progress = if (duration > 0L) shown.toFloat() / duration else 0f
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                  Column(modifier = Modifier.fillMaxWidth().padding(horizontal = if (isTv) 0.dp else 12.dp)) {
                      if (isTv) {
                          ProgressLine(
                              progress = progress,
                              accent = mood.accent,
                              track = mood.accent.copy(alpha = 0.18f),
                              height = 6.dp,
                              starThumb = isSakina
                          )
                      } else {
                          Slider(
                              value = shown.coerceIn(0L, duration.coerceAtLeast(1L)).toFloat(),
                              onValueChange = {
                                  dragging = true
                                  dragPos = it
                                  onInteract()
                              },
                              onValueChangeFinished = {
                                  vm.seekTo(dragPos.toLong())
                                  dragging = false
                              },
                              valueRange = 0f..duration.coerceAtLeast(1L).toFloat(),
                              colors = SliderDefaults.colors(
                                  thumbColor = if (isSakina) Pal.GoldLight else Pal.Text,
                                  activeTrackColor = mood.accent,
                                  inactiveTrackColor = if (isSakina) mood.accent.copy(alpha = 0.20f) else mood.text.copy(alpha = 0.14f)
                              )
                          )
                      }
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(formatTime(shown), fontSize = 12.sp, color = mood.muted)
                          Text(formatTime(duration), fontSize = 12.sp, color = mood.muted)
                      }
                  }
              }
          }

          @Composable
          private fun StudioControls(vm: PulseViewModel, mood: Mood, isTv: Boolean, playFocus: FocusRequester, onInteract: () -> Unit) {
              val small = if (isTv) 54.dp else 44.dp
              val mid = if (isTv) 58.dp else 48.dp
              val big = if (isTv) 78.dp else 74.dp
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(horizontal = if (isTv) 0.dp else 6.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = if (isTv) Arrangement.spacedBy(14.dp) else Arrangement.SpaceEvenly
                  ) {
                      RoundIconButton(
                          icon = Icons.Rounded.SkipPrevious,
                          contentDescription = stringResource(R.string.cd_previous),
                          onClick = { onInteract(); vm.previous() },
                          size = mid, iconSize = 28.dp, tint = mood.text,
                          container = if (isTv) mood.text.copy(alpha = 0.06f) else Color.Transparent,
                          borderColor = Color.Transparent, ring = mood.accent
                      )
                      RoundIconButton(
                          icon = Icons.Rounded.FastRewind,
                          contentDescription = stringResource(R.string.cd_rewind),
                          onClick = { onInteract(); vm.rewind() },
                          size = small, iconSize = 24.dp, tint = mood.text,
                          container = mood.text.copy(alpha = 0.06f), borderColor = Color.Transparent, ring = mood.accent
                      )
                      Box(contentAlignment = Alignment.Center) {
                          Box(
                              modifier = Modifier
                                  .size(big + 14.dp)
                                  .clip(CircleShape)
                                  .background(mood.accent.copy(alpha = 0.10f))
                          )
                          RoundIconButton(
                              icon = if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                              contentDescription = stringResource(R.string.cd_play_pause),
                              onClick = { onInteract(); vm.playPause() },
                              modifier = Modifier.focusRequester(playFocus),
                              size = big, iconSize = 36.dp,
                              tint = mood.onAccent, container = mood.accent, borderColor = Color.Transparent
                          )
                      }
                      RoundIconButton(
                          icon = Icons.Rounded.FastForward,
                          contentDescription = stringResource(R.string.cd_forward),
                          onClick = { onInteract(); vm.forward() },
                          size = small, iconSize = 24.dp, tint = mood.text,
                          container = mood.text.copy(alpha = 0.06f), borderColor = Color.Transparent, ring = mood.accent
                      )
                      RoundIconButton(
                          icon = Icons.Rounded.SkipNext,
                          contentDescription = stringResource(R.string.cd_next),
                          onClick = { onInteract(); vm.next() },
                          size = mid, iconSize = 28.dp, tint = mood.text,
                          container = if (isTv) mood.text.copy(alpha = 0.06f) else Color.Transparent,
                          borderColor = Color.Transparent, ring = mood.accent
                      )
                  }
              }
          }

          @Composable
          private fun StudioQuickTools(
              vm: PulseViewModel,
              mood: Mood,
              isTv: Boolean,
              onOpenSleep: () -> Unit,
              onOpenEq: () -> Unit,
              onInteract: () -> Unit
          ) {
              val (modeIcon, modeTint) = when (vm.playbackMode) {
                  MODE_REPEAT_ALL -> Icons.Rounded.Repeat to mood.accent
                  MODE_REPEAT_ONE -> Icons.Rounded.RepeatOne to mood.accent
                  MODE_PLAY_ONCE -> Icons.Rounded.StopCircle to mood.accent
                  else -> Icons.Rounded.Repeat to mood.muted
              }
              val isFav = vm.currentMediaId.isNotBlank() && vm.isFavorite(vm.currentMediaId)
              val sleepSec = vm.sleepTimerRemainingSec
              val sleepActive = sleepSec != 0L
              val eqActive = vm.eqPreset != EQ_NORMAL
              val speedActive = kotlin.math.abs(vm.playbackSpeed - 1.0f) > 0.05f
              val speedLabel = if (vm.playbackSpeed % 1f == 0f) {
                  "${vm.playbackSpeed.toInt()}x"
              } else {
                  "${vm.playbackSpeed}x"
              }
              val btnSize = if (isTv) 48.dp else 42.dp

              Row(
                  modifier = Modifier.fillMaxWidth().padding(horizontal = if (isTv) 0.dp else 8.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = if (isTv) Arrangement.spacedBy(10.dp) else Arrangement.SpaceEvenly
              ) {
                  RoundIconButton(
                      icon = Icons.Rounded.Shuffle,
                      contentDescription = stringResource(R.string.cd_shuffle),
                      onClick = { onInteract(); vm.toggleShuffle() },
                      size = btnSize, iconSize = 20.dp,
                      tint = if (vm.shuffleEnabled) mood.accent else mood.muted,
                      container = if (vm.shuffleEnabled) mood.accent.copy(alpha = 0.12f) else Color.Transparent,
                      borderColor = Color.Transparent, ring = mood.accent
                  )
                  RoundIconButton(
                      icon = modeIcon,
                      contentDescription = stringResource(R.string.cd_repeat),
                      onClick = { onInteract(); vm.cyclePlaybackMode() },
                      size = btnSize, iconSize = 20.dp, tint = modeTint,
                      container = if (vm.playbackMode != MODE_REPEAT_OFF) mood.accent.copy(alpha = 0.12f) else Color.Transparent,
                      borderColor = Color.Transparent, ring = mood.accent
                  )
                  RoundIconButton(
                      icon = if (isFav) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                      contentDescription = stringResource(R.string.cd_favorite),
                      onClick = { onInteract(); vm.toggleFavorite(vm.currentMediaId) },
                      size = btnSize, iconSize = 20.dp,
                      tint = if (isFav) Color(0xFFFF6B8B) else mood.muted,
                      container = if (isFav) Color(0x24FF6B8B) else Color.Transparent,
                      borderColor = Color.Transparent, ring = mood.accent
                  )
                  val speedShape = RoundedCornerShape(999.dp)
                  Box(
                      modifier = Modifier
                          .height(btnSize)
                          .focusGlow(speedShape, ring = mood.accent, scaleTo = 1.08f)
                          .clip(speedShape)
                          .background(if (speedActive) mood.accent.copy(alpha = 0.16f) else mood.text.copy(alpha = 0.06f))
                          .border(1.dp, if (speedActive) mood.accent.copy(alpha = 0.45f) else mood.line, speedShape)
                          .clickable(role = Role.Button) { onInteract(); vm.cyclePlaybackSpeed() }
                          .padding(horizontal = 12.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          speedLabel,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold,
                          color = if (speedActive) mood.accent else mood.text
                      )
                  }
                  if (sleepActive) {
                      val sleepText = if (sleepSec < 0L) {
                          stringResource(R.string.sleep_badge_track)
                      } else {
                          formatTime(sleepSec * 1000L)
                      }
                      val sleepShape = RoundedCornerShape(999.dp)
                      Row(
                          modifier = Modifier
                              .height(btnSize)
                              .focusGlow(sleepShape, ring = mood.accent, scaleTo = 1.08f)
                              .clip(sleepShape)
                              .background(mood.accent.copy(alpha = 0.16f))
                              .border(1.dp, mood.accent.copy(alpha = 0.45f), sleepShape)
                              .clickable(role = Role.Button, onClick = onOpenSleep)
                              .padding(horizontal = 10.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(4.dp)
                      ) {
                          Icon(Icons.Rounded.Bedtime, contentDescription = stringResource(R.string.sleep_timer), tint = mood.accent, modifier = Modifier.size(16.dp))
                          Text(sleepText, fontSize = 11.sp, fontWeight = FontWeight.Bold, color = mood.accent)
                      }
                  } else {
                      RoundIconButton(
                          icon = Icons.Rounded.Bedtime,
                          contentDescription = stringResource(R.string.sleep_timer),
                          onClick = onOpenSleep,
                          size = btnSize, iconSize = 20.dp,
                          tint = mood.muted,
                          container = Color.Transparent,
                          borderColor = Color.Transparent, ring = mood.accent
                      )
                  }
                  RoundIconButton(
                      icon = Icons.Rounded.Equalizer,
                      contentDescription = stringResource(R.string.equalizer),
                      onClick = onOpenEq,
                      size = btnSize, iconSize = 20.dp,
                      tint = if (eqActive) mood.accent else mood.muted,
                      container = if (eqActive) mood.accent.copy(alpha = 0.14f) else Color.Transparent,
                      borderColor = Color.Transparent, ring = mood.accent
                  )
              }
          }

          @Composable
          private fun StudioChips(
              vm: PulseViewModel,
              mood: Mood,
              isSakina: Boolean,
              onInteract: () -> Unit,
              onExit: () -> Unit,
              showExit: Boolean
          ) {
              if (isSakina) {
                  val modeLabel = when (vm.playbackMode) {
                      MODE_REPEAT_ALL -> R.string.mode_repeat_all
                      MODE_REPEAT_ONE -> R.string.mode_repeat_one
                      MODE_PLAY_ONCE -> R.string.mode_play_once
                      else -> R.string.mode_repeat_off
                  }
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp, Alignment.CenterHorizontally)
                  ) {
                      PillButton(
                          text = stringResource(modeLabel),
                          onClick = { onInteract(); vm.cyclePlaybackMode() },
                          icon = Icons.Rounded.StopCircle,
                          container = Pal.Gold.copy(alpha = 0.10f),
                          content = Pal.GoldLight,
                          borderColor = Pal.Gold.copy(alpha = 0.3f),
                          height = 44.dp,
                          fontSize = 13,
                          ring = Pal.Gold
                      )
                      PillButton(
                          text = stringResource(R.string.scene_label, stringResource(R.string.scene_sakina)),
                          onClick = { onInteract(); vm.cycleScene() },
                          icon = Icons.Rounded.Brightness3,
                          container = Color.Transparent,
                          content = Pal.Mint,
                          borderColor = Pal.Mint.copy(alpha = 0.18f),
                          height = 44.dp,
                          fontSize = 13,
                          ring = Pal.Gold
                      )
                      if (showExit) {
                          RoundIconButton(
                              icon = Icons.Rounded.FullscreenExit,
                              contentDescription = stringResource(R.string.cd_exit_fullscreen),
                              onClick = onExit,
                              tint = Pal.Mint,
                              container = Color.Transparent,
                              borderColor = Pal.Mint.copy(alpha = 0.18f),
                              ring = Pal.Gold
                          )
                      }
                  }
              } else {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(14.dp, Alignment.CenterHorizontally),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      musicScenes.forEach { option ->
                          SceneChip(
                              icon = option.icon,
                              label = stringResource(option.label),
                              selected = vm.effectiveScene == option.scene,
                              mood = mood,
                              onClick = { onInteract(); vm.selectScene(option.scene) }
                          )
                      }
                      if (vm.currentKind != IslamicKind.NONE) {
                          SceneChip(
                              icon = Icons.Rounded.Brightness3,
                              label = stringResource(R.string.scene_sakina),
                              selected = false,
                              mood = mood,
                              onClick = { onInteract(); vm.selectScene(SCENE_SAKINA) }
                          )
                      }
                      if (showExit) {
                          RoundIconButton(
                              icon = Icons.Rounded.FullscreenExit,
                              contentDescription = stringResource(R.string.cd_exit_fullscreen),
                              onClick = onExit,
                              tint = mood.text,
                              container = Color.Transparent,
                              borderColor = mood.line,
                              ring = mood.accent
                          )
                      }
                  }
              }
          }

          @Composable
          private fun SceneChip(icon: ImageVector, label: String, selected: Boolean, mood: Mood, onClick: () -> Unit) {
              Column(
                  modifier = Modifier
                      .width(64.dp)
                      .focusGlow(RoundedCornerShape(16.dp), ring = mood.accent, scaleTo = 1.08f)
                      .clip(RoundedCornerShape(16.dp))
                      .clickable(role = Role.RadioButton, onClick = onClick),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .size(52.dp)
