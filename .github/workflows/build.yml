name: Build Pulse Player APK (Phone + Android TV)

# ──────────────────────────────────────────────────────────────────────────────
# التوقيع الثابت — تُجهَّز مرة واحدة فقط
#
# بدون هذه الخطوة يُوقَّع كل APK بمفتاح debug جديد، فلا يُثبَّت التحديث فوق النسخة
# السابقة. مع المفتاح الثابت تُثبَّت كل نسخة جديدة فوق القديمة وتبقى إعداداتك.
#
# 1) أنشئ المفتاح على جهازك (يحتاج Java أو Android Studio):
#      keytool -genkeypair -v -keystore pulse-release.jks -alias pulse -keyalg RSA -keysize 2048 -validity 10000
#
# 2) حوّل الملف إلى نص Base64:
#      Linux:       base64 -w0 pulse-release.jks
#      macOS:       base64 -i pulse-release.jks
#      PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("pulse-release.jks"))
#
# 3) في المستودع: Settings ← Secrets and variables ← Actions ← New repository secret
#      SIGNING_KEYSTORE_BASE64    = ناتج الخطوة 2
#      SIGNING_KEYSTORE_PASSWORD  = كلمة المرور التي اخترتها في الخطوة 1
#      SIGNING_KEY_ALIAS          = pulse
#      SIGNING_KEY_PASSWORD       = (اختياري) اتركه إن كانت نفس كلمة المرور
#
# احفظ pulse-release.jks وكلمة مروره في مكان آمن: ضياعه يعني أن التحديثات لن تُثبَّت
# فوق التطبيق مرة أخرى. لا ترفعه إلى المستودع.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/pulse/player \
                   app/src/main/res/drawable \
                   app/src/main/res/values \
                   app/src/main/res/values-ar

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PulsePlayer"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          // Every CI run gets a higher versionCode automatically, so updates always install on top.
          val ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 0

          // Fixed release key, provided by the workflow from GitHub Secrets.
          val releaseKeystorePath: String = System.getenv("PULSE_KEYSTORE_PATH") ?: ""
          val hasReleaseKeystore = releaseKeystorePath.isNotBlank() && file(releaseKeystorePath).exists()

          android {
              namespace = "com.pulse.player"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pulse.player"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 100 + ciRunNumber
                  versionName = "3.7.$ciRunNumber-KaabaEdition"
              }

              signingConfigs {
                  if (hasReleaseKeystore) {
                      create("release") {
                          storeFile = file(releaseKeystorePath)
                          storePassword = System.getenv("PULSE_KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("PULSE_KEY_ALIAS")
                          // keytool's default PKCS12 keystores use one password for both; the key password is optional.
                          keyPassword = System.getenv("PULSE_KEY_PASSWORD")?.takeIf { it.isNotBlank() }
                              ?: System.getenv("PULSE_KEYSTORE_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8 stays off: smbj and its crypto providers rely on reflection.
                      isMinifyEnabled = false
                      if (hasReleaseKeystore) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              packaging {
                  resources {
                      excludes += setOf(
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt",
                          "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
                      )
                  }
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
              implementation("androidx.media3:media3-common:1.4.1")
              implementation("com.google.guava:guava:33.3.1-android")

              implementation("com.hierynomus:smbj:0.13.0")
              implementation("org.slf4j:slf4j-nop:2.0.16")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
