          @Composable
          private fun LibraryRow(
              source: LibrarySource,
              folderCount: Int,
              isLoading: Boolean,
              error: String?,
              onEdit: () -> Unit,
              onRefresh: () -> Unit,
              onRemove: () -> Unit
          ) {
              val shape = RoundedCornerShape(20.dp)
              val icon = when (source.type) {
                  SourceType.DEVICE -> Icons.Rounded.PhoneAndroid
                  SourceType.SMB -> Icons.Rounded.Dns
                  SourceType.NAVIDROME -> Icons.Rounded.Cloud
              }
              val accent = if (source.type == SourceType.DEVICE) Pal.Ember else Pal.Teal
              val detail = when {
                  error != null -> error
                  isLoading -> stringResource(R.string.updating_library)
                  source.type == SourceType.DEVICE && source.deviceFolders.isEmpty() ->
                      stringResource(R.string.all_device_audio) + " · " + foldersCountText(folderCount)
                  source.type == SourceType.DEVICE -> foldersCountText(folderCount)
                  else -> source.address + " · " + foldersCountText(folderCount)
              }
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(shape)
                      .background(Pal.Surface)
                      .border(1.dp, Pal.Line, shape)
                      .padding(start = 14.dp, end = 6.dp, top = 10.dp, bottom = 10.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .size(44.dp)
                          .clip(RoundedCornerShape(14.dp))
                          .background(accent.copy(alpha = 0.14f)),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(icon, contentDescription = null, tint = accent, modifier = Modifier.size(22.dp))
                  }
                  Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      Text(source.label, fontSize = 15.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(
                          detail,
                          fontSize = 12.sp,
                          color = if (error != null) Pal.Danger else Pal.Muted,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
                  RoundIconButton(
                      icon = Icons.Rounded.Refresh,
                      contentDescription = stringResource(R.string.refresh),
                      onClick = onRefresh,
                      tint = Pal.Muted,
                      container = Color.Transparent,
                      borderColor = Color.Transparent
                  )
                  RoundIconButton(
                      icon = Icons.Rounded.Edit,
                      contentDescription = stringResource(R.string.edit),
                      onClick = onEdit,
                      tint = Pal.Muted,
                      container = Color.Transparent,
                      borderColor = Color.Transparent
                  )
                  RoundIconButton(
                      icon = Icons.Rounded.Delete,
                      contentDescription = stringResource(R.string.remove),
                      onClick = onRemove,
                      tint = Pal.Danger,
                      container = Color.Transparent,
                      borderColor = Color.Transparent,
                      ring = Pal.Danger
                  )
              }
          }

