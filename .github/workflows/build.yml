          package com.pulse.player

          import android.content.Context
          import android.net.Uri
          import androidx.annotation.OptIn
          import androidx.media3.common.C
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.datasource.BaseDataSource
          import androidx.media3.datasource.DataSource
          import androidx.media3.datasource.DataSourceException
          import androidx.media3.datasource.DataSpec
          import androidx.media3.datasource.DefaultDataSource
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.datasource.TransferListener
          import com.hierynomus.msdtyp.AccessMask
          import com.hierynomus.mssmb2.SMB2CreateDisposition
          import com.hierynomus.mssmb2.SMB2ShareAccess
          import com.hierynomus.mssmb2.SMBApiException
          import com.hierynomus.smbj.SMBClient
          import com.hierynomus.smbj.SmbConfig
          import com.hierynomus.smbj.auth.AuthenticationContext
          import com.hierynomus.smbj.connection.Connection
          import com.hierynomus.smbj.session.Session
          import com.hierynomus.smbj.share.DiskShare
          import com.hierynomus.smbj.share.File as SmbFile
          import java.io.IOException
          import java.util.EnumSet
          import java.util.concurrent.TimeUnit

          data class SmbConnectionConfig(
              val host: String,
              val share: String,
              val subFolder: String,
              val user: String,
              val pass: String
          ) {
              override fun toString(): String = "SmbConnectionConfig(host=$host, share=$share, subFolder=$subFolder, user=$user)"
          }

          object SmbHelper {
              const val SMB_SCHEME = "pulsesmb"

              fun configFrom(source: LibrarySource): SmbConnectionConfig = normalizeConfig(
                  rawHost = source.smbHost,
                  rawShare = source.smbShare,
                  rawSubFolder = source.smbSubFolder,
                  rawUser = source.smbUser,
                  rawPass = source.smbPass
              )

              fun normalizeConfig(
                  rawHost: String,
                  rawShare: String,
                  rawSubFolder: String,
                  rawUser: String,
                  rawPass: String
              ): SmbConnectionConfig {
                  var cleanedHost = rawHost.trim()
                      .removePrefix("smb://")
                      .removePrefix("http://")
                      .removePrefix("https://")
                      .replace('\\', '/')
                      .trim('/')

                  var cleanedShare = rawShare.trim().replace('\\', '/').trim('/')
                  var cleanedSub = rawSubFolder.trim().replace('\\', '/').trim('/')

                  if (cleanedHost.contains('/')) {
                      val parts = cleanedHost.split('/').filter { it.isNotBlank() }
                      if (parts.isNotEmpty()) {
                          cleanedHost = parts[0]
                          if (cleanedShare.isBlank() && parts.size >= 2) {
                              cleanedShare = parts[1]
                              if (cleanedSub.isBlank() && parts.size >= 3) {
                                  cleanedSub = parts.drop(2).joinToString("/")
                              }
                          }
                      }
                  }

                  if (cleanedShare.contains('/')) {
                      val parts = cleanedShare.split('/').filter { it.isNotBlank() }
                      cleanedShare = parts.firstOrNull() ?: ""
                      val extraSub = parts.drop(1).joinToString("/")
                      cleanedSub = listOf(extraSub, cleanedSub).filter { it.isNotBlank() }.joinToString("/")
                  }

                  return SmbConnectionConfig(
                      host = cleanedHost,
                      share = cleanedShare,
                      subFolder = cleanedSub.replace('/', '\\'),
                      user = rawUser.trim(),
                      pass = rawPass
                  )
              }

              fun createClient(): SMBClient {
                  val cfg = SmbConfig.builder()
                      .withTimeout(15, TimeUnit.SECONDS)
                      .withSoTimeout(25, TimeUnit.SECONDS)
                      .withMultiProtocolNegotiate(true)
                      .build()
                  return SMBClient(cfg)
              }

              fun connect(client: SMBClient, hostWithOptionalPort: String): Connection {
                  val hostParts = hostWithOptionalPort.split(':')
                  return if (hostParts.size == 2 && hostParts[1].toIntOrNull() != null) {
                      client.connect(hostParts[0], hostParts[1].toInt())
                  } else {
                      client.connect(hostWithOptionalPort)
                  }
              }

              fun authenticate(connection: Connection, user: String, pass: String): Session {
                  if (user.isNotBlank()) {
                      return connection.authenticate(
                          AuthenticationContext(user, pass.toCharArray(), "")
                      )
                  }
                  return runCatching {
                      connection.authenticate(AuthenticationContext.guest())
                  }.getOrElse {
                      connection.authenticate(AuthenticationContext.anonymous())
                  }
              }

              fun buildStreamUri(sourceId: String, smbRelativePath: String, fileName: String): String {
                  return Uri.Builder()
                      .scheme(SMB_SCHEME)
                      .authority("stream")
                      .appendPath(fileName)
                      .appendQueryParameter("src", sourceId)
                      .appendQueryParameter("path", smbRelativePath)
                      .build()
                      .toString()
              }
          }

          /**
           * Keeps an authenticated SMB share open per library. Opening a track or seeking only opens a
           * file handle on the existing share instead of a new TCP connection + login every time.
           * Changed settings get a fresh connection automatically (the config is the key).
           */
          object SmbSharePool {
              private class Entry(
                  val client: SMBClient,
                  val connection: Connection,
                  val session: Session,
                  val share: DiskShare
              )

              private const val MAX_OPEN = 3
              private val lock = Any()
              private val entries = LinkedHashMap<SmbConnectionConfig, Entry>()

              /** Must be called off the main thread: it may connect to the server. */
              fun acquire(cfg: SmbConnectionConfig): DiskShare {
                  synchronized(lock) {
                      val current = entries[cfg]
                      if (current != null && current.share.isConnected && current.connection.isConnected) {
                          // Move to the end: most recently used.
                          entries.remove(cfg)
                          entries[cfg] = current
                          return current.share
                      }
                      if (current != null) {
                          entries.remove(cfg)
                          closeEntry(current)
                      }
                      while (entries.size >= MAX_OPEN) {
                          val oldestKey = entries.keys.first()
                          entries.remove(oldestKey)?.let { closeEntry(it) }
                      }

                      val newClient = SmbHelper.createClient()
                      try {
                          val conn = SmbHelper.connect(newClient, cfg.host)
                          val sess = SmbHelper.authenticate(conn, cfg.user, cfg.pass)
                          val diskShare = sess.connectShare(cfg.share) as? DiskShare
                              ?: throw IOException("Share '${cfg.share}' is not a disk share")
                          entries[cfg] = Entry(newClient, conn, sess, diskShare)
                          return diskShare
                      } catch (e: Exception) {
                          runCatching { newClient.close() }
                          throw e
                      }
                  }
              }

              /** Drops one pooled connection. Call off the main thread. */
              fun invalidate(cfg: SmbConnectionConfig) {
                  synchronized(lock) { entries.remove(cfg)?.let { closeEntry(it) } }
              }

              /** Drops every pooled connection. Call off the main thread. */
              fun invalidateAll() {
                  synchronized(lock) {
                      entries.values.forEach { closeEntry(it) }
                      entries.clear()
                  }
              }

              private fun closeEntry(e: Entry) {
                  runCatching { e.share.close() }
                  runCatching { e.session.close() }
                  runCatching { e.connection.close() }
                  runCatching { e.client.close() }
              }
          }

          @OptIn(UnstableApi::class)
          class SmbDataSource(context: Context) : BaseDataSource(true) {
              private companion object {
                  // 64 KB works with every SMB dialect (SMB 2.0.2 caps a single read at 64 KB).
                  const val READ_AHEAD_BYTES = 64 * 1024
              }

              private val appContext = context.applicationContext
              private val readAhead = ByteArray(READ_AHEAD_BYTES)
              private var readAheadStart = 0L
              private var readAheadLength = 0

              private var smbFile: SmbFile? = null
              private var currentUri: Uri? = null
              private var currentPos: Long = 0L
              private var bytesRemaining: Long = 0L
              private var opened: Boolean = false

              override fun open(dataSpec: DataSpec): Long {
                  transferInitializing(dataSpec)
                  currentUri = dataSpec.uri
                  val smbPath = dataSpec.uri.getQueryParameter("path")
                      ?: throw IOException("Missing SMB file path")
                  val sourceId = dataSpec.uri.getQueryParameter("src") ?: ""
                  val source = LibraryStore.source(appContext, sourceId)
                      ?: LibraryStore.sources(appContext).firstOrNull { it.type == SourceType.SMB }
                      ?: throw DataSourceException(PlaybackException.ERROR_CODE_IO_FILE_NOT_FOUND)

                  val cfg = SmbHelper.configFrom(source)
                  if (cfg.host.isBlank() || cfg.share.isBlank()) {
                      throw IOException("SMB server settings are incomplete")
                  }

                  val file = try {
                      openFile(cfg, smbPath)
                  } catch (first: Exception) {
                      // The server may have dropped the pooled connection while idle: reconnect once.
                      SmbSharePool.invalidate(cfg)
                      try {
                          openFile(cfg, smbPath)
                      } catch (second: Exception) {
                          currentUri = null
                          throw when (second) {
                              // The server answered (missing file, no permission...): retrying will not help.
                              is SMBApiException -> DataSourceException(second, PlaybackException.ERROR_CODE_IO_FILE_NOT_FOUND)
                              is IOException -> second
                              else -> IOException("SMB open error: ${second.message}", second)
                          }
                      }
                  }
                  smbFile = file

                  try {
                      val fileLength = file.fileInformation.standardInformation.endOfFile
                      if (dataSpec.position > fileLength) {
                          throw DataSourceException(PlaybackException.ERROR_CODE_IO_READ_POSITION_OUT_OF_RANGE)
                      }
                      currentPos = dataSpec.position
                      readAheadStart = 0L
                      readAheadLength = 0
                      val remainingInFile = fileLength - currentPos
                      bytesRemaining = if (dataSpec.length != C.LENGTH_UNSET.toLong()) {
                          minOf(remainingInFile, dataSpec.length)
                      } else {
                          remainingInFile
                      }
                  } catch (e: Exception) {
                      closeFileQuietly()
                      currentUri = null
                      if (e is IOException) throw e
                      throw IOException("SMB open error: ${e.message}", e)
                  }

                  opened = true
                  transferStarted(dataSpec)
                  return bytesRemaining
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  if (length == 0) return 0
                  if (bytesRemaining <= 0L) return C.RESULT_END_OF_INPUT
                  val file = smbFile ?: return C.RESULT_END_OF_INPUT

                  // Extractors often read a few hundred bytes at a time (one MP3 frame). Serving those
                  // from a 64 KB read-ahead buffer avoids one network round trip per tiny read.
                  val bufferEnd = readAheadStart + readAheadLength
                  if (currentPos < readAheadStart || currentPos >= bufferEnd) {
                      val want = minOf(READ_AHEAD_BYTES.toLong(), bytesRemaining).toInt()
                      val got = try {
                          file.read(readAhead, currentPos, 0, want)
                      } catch (e: Exception) {
                          throw IOException("SMB read error: ${e.message}", e)
                      }
                      if (got <= 0) return C.RESULT_END_OF_INPUT
                      readAheadStart = currentPos
                      readAheadLength = got
                  }

                  val indexInBuffer = (currentPos - readAheadStart).toInt()
                  val available = readAheadLength - indexInBuffer
                  val toCopy = minOf(length.toLong(), available.toLong(), bytesRemaining).toInt()
                  System.arraycopy(readAhead, indexInBuffer, buffer, offset, toCopy)

                  currentPos += toCopy
                  bytesRemaining -= toCopy
                  bytesTransferred(toCopy)
                  return toCopy
              }

              override fun getUri(): Uri? = currentUri

              override fun close() {
                  currentUri = null
                  closeFileQuietly()
                  readAheadLength = 0
                  if (opened) {
                      opened = false
                      transferEnded()
                  }
              }

              private fun openFile(cfg: SmbConnectionConfig, path: String): SmbFile {
                  val share = SmbSharePool.acquire(cfg)
                  return share.openFile(
                      path,
                      EnumSet.of(AccessMask.GENERIC_READ),
                      null,
                      SMB2ShareAccess.ALL,
                      SMB2CreateDisposition.FILE_OPEN,
                      null
                  )
              }

              private fun closeFileQuietly() {
                  runCatching { smbFile?.close() }
                  smbFile = null
              }
          }

          @OptIn(UnstableApi::class)
          class PulseDataSourceFactory(private val context: Context) : DataSource.Factory {
              private val httpFactory = DefaultHttpDataSource.Factory()
                  .setConnectTimeoutMs(20_000)
                  .setReadTimeoutMs(30_000)
                  .setAllowCrossProtocolRedirects(true)
              private val defaultFactory = DefaultDataSource.Factory(context, httpFactory)

              override fun createDataSource(): DataSource {
                  return RoutingDataSource(
                      context = context.applicationContext,
                      smbSource = SmbDataSource(context),
                      defaultSource = defaultFactory.createDataSource()
                  )
              }
          }

          /**
           * Routes each URI to the right source:
           *  - pulsesmb://  -> SMB share (credentials read from encrypted settings)
           *  - pulsenav://  -> Navidrome stream URL built at open time, so the auth token
           *                    never sits inside queued media items or on disk
           *  - anything else -> local files / content:// / http
           */
          @OptIn(UnstableApi::class)
          private class RoutingDataSource(
              private val context: Context,
              private val smbSource: DataSource,
              private val defaultSource: DataSource
          ) : DataSource {
              private var activeSource: DataSource? = null

              override fun addTransferListener(transferListener: TransferListener) {
                  smbSource.addTransferListener(transferListener)
                  defaultSource.addTransferListener(transferListener)
              }

              override fun open(dataSpec: DataSpec): Long {
                  return when (dataSpec.uri.scheme) {
                      SmbHelper.SMB_SCHEME -> {
                          activeSource = smbSource
                          smbSource.open(dataSpec)
                      }
                      NavidromeHelper.NAV_SCHEME -> {
                          val songId = dataSpec.uri.getQueryParameter("id")
                              ?: throw IOException("Missing Navidrome song id")
                          val sourceId = dataSpec.uri.getQueryParameter("src") ?: ""
                          val source = LibraryStore.source(context, sourceId)
                              ?: LibraryStore.sources(context).firstOrNull { it.type == SourceType.NAVIDROME }
                              ?: throw DataSourceException(PlaybackException.ERROR_CODE_IO_FILE_NOT_FOUND)
                          if (!source.isConfigured) {
                              throw IOException("Navidrome settings are incomplete")
                          }
                          activeSource = defaultSource
                          defaultSource.open(dataSpec.withUri(NavidromeHelper.streamUri(source, songId)))
                      }
                      else -> {
                          activeSource = defaultSource
                          defaultSource.open(dataSpec)
                      }
                  }
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  return activeSource?.read(buffer, offset, length) ?: C.RESULT_END_OF_INPUT
              }

              override fun getUri(): Uri? = activeSource?.uri

              override fun getResponseHeaders(): Map<String, List<String>> {
                  return activeSource?.responseHeaders ?: emptyMap()
              }

              override fun close() {
                  try {
                      activeSource?.close()
                  } finally {
                      activeSource = null
                  }
              }
          }
