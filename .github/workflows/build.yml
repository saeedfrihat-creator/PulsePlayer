                      modifier = Modifier
                          .fillMaxWidth()
                          .navigationBarsPadding()
                          .padding(start = 16.dp, end = 16.dp, top = 10.dp, bottom = 12.dp)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(10.dp))
                              .clickable(onClick = onExpand)
                              .padding(vertical = 2.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          if (isPlaying) {
                              MiniEqualizerBars(phase = phase, amplitude = amplitude)
                              Spacer(Modifier.width(10.dp))
                          }
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  title,
                                  fontWeight = FontWeight.Bold,
                                  maxLines = 1,
                                  modifier = Modifier.basicMarquee()
                              )
                              if (artist.isNotBlank()) {
                                  Text(artist, fontSize = 12.sp, color = Color.Gray, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                          }
                          IconButton(onClick = onExpand, modifier = Modifier.size(36.dp)) {
                              Icon(
                                  Icons.Default.Fullscreen,
                                  contentDescription = stringResource(R.string.cd_fullscreen),
                                  tint = Color(0xFF00E5FF)
                              )
                          }
                      }

                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                          val safeMax = durationMs.coerceAtLeast(1L).toFloat()
                          Slider(
                              value = positionMs.coerceIn(0L, durationMs.coerceAtLeast(1L)).toFloat(),
                              onValueChange = { onSeek(it.toLong()) },
                              valueRange = 0f..safeMax,
                              modifier = Modifier.fillMaxWidth()
                          )

                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Text(formatTime(positionMs), fontSize = 11.sp, color = Color.Gray)
                              Text(formatTime(durationMs), fontSize = 11.sp, color = Color.Gray)
                          }

                          Spacer(Modifier.height(4.dp))

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceEvenly,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              TvIconButton(
                                  icon = Icons.Default.Shuffle,
                                  contentDescription = stringResource(R.string.cd_shuffle),
                                  onClick = onToggleShuffle,
                                  tint = if (shuffleEnabled) Color(0xFF00E5FF) else Color.Gray
                              )
                              TvIconButton(Icons.Default.SkipPrevious, stringResource(R.string.cd_previous), onPrev)
                              TvIconButton(
                                  icon = if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                  contentDescription = stringResource(R.string.cd_play_pause),
                                  onClick = onPlayPause,
                                  filled = true,
                                  size = 52
                              )
                              TvIconButton(Icons.Default.SkipNext, stringResource(R.string.cd_next), onNext)
                              TvIconButton(
                                  icon = if (repeatMode == Player.REPEAT_MODE_ONE) Icons.Default.RepeatOne else Icons.Default.Repeat,
                                  contentDescription = stringResource(R.string.cd_repeat),
                                  onClick = onToggleRepeat,
                                  tint = if (repeatMode != Player.REPEAT_MODE_OFF) Color(0xFF00E5FF) else Color.Gray
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun TvIconButton(
              icon: ImageVector,
              contentDescription: String,
              onClick: () -> Unit,
              tint: Color = Color.White,
              filled: Boolean = false,
              size: Int = 44
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val bgColor = when {
                  filled && isFocused -> Color(0xFF9E7BFF)
                  filled -> MaterialTheme.colorScheme.primary
                  isFocused -> Color(0x33BB86FC)
                  else -> Color.Transparent
              }
              val borderColor = if (isFocused) Color(0xFFBB86FC) else Color.Transparent

              IconButton(
                  onClick = onClick,
                  modifier = Modifier
                      .size(size.dp)
                      .clip(CircleShape)
                      .background(bgColor)
                      .border(2.dp, borderColor, CircleShape)
                      .onFocusChanged { isFocused = it.isFocused }
              ) {
                  Icon(icon, contentDescription = contentDescription, tint = tint)
              }
          }

          private fun formatTime(ms: Long): String {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val min = totalSec / 60
              val sec = totalSec % 60
              return String.format(Locale.US, "%d:%02d", min, sec)
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build Universal APK (Phone + Android TV)
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PulsePlayer-Universal-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
