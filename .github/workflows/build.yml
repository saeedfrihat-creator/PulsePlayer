          // ============================ Network folder ============================

          @Composable
          fun NetworkFormScreen(vm: PulseViewModel, editId: String?, isTv: Boolean, onBack: () -> Unit) {
              val existing = remember(editId) { editId?.let { id -> vm.sources.firstOrNull { it.id == id } } }
              var type by remember(editId) { mutableStateOf(existing?.type ?: SourceType.SMB) }
              var label by remember(editId) { mutableStateOf(existing?.label ?: "") }
              var smbHost by remember(editId) { mutableStateOf(existing?.smbHost ?: "") }
              var smbShare by remember(editId) { mutableStateOf(existing?.smbShare ?: "") }
              var smbSub by remember(editId) { mutableStateOf(existing?.smbSubFolder ?: "") }
              var smbUser by remember(editId) { mutableStateOf(existing?.smbUser ?: "") }
              var smbPass by remember(editId) { mutableStateOf(existing?.smbPass ?: "") }
              var navUrl by remember(editId) { mutableStateOf(existing?.navUrl?.ifBlank { null } ?: DEFAULT_NAVIDROME_URL) }
              var navUser by remember(editId) { mutableStateOf(existing?.navUser ?: "") }
              var navPass by remember(editId) { mutableStateOf(existing?.navPass ?: "") }
              var showError by remember(editId) { mutableStateOf(false) }

              val title = stringResource(if (existing != null) R.string.edit_network_folder else R.string.add_network_folder)
              ScreenScaffold(title = title, isTv = isTv, onBack = onBack) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(bottom = 32.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Text(stringResource(R.string.network_form_subtitle), fontSize = 13.sp, color = Pal.Muted)
                      SegmentedTabs(
                          options = listOf(
                              stringResource(R.string.mode_smb) to Icons.Rounded.FolderShared,
                              stringResource(R.string.mode_navidrome) to Icons.Rounded.Cloud
                          ),
                          selected = if (type == SourceType.NAVIDROME) 1 else 0,
                          onSelect = { type = if (it == 0) SourceType.SMB else SourceType.NAVIDROME }
                      )
                      if (type == SourceType.SMB) {
                          FormField(stringResource(R.string.smb_host_label), smbHost, { smbHost = it }, keyboardType = KeyboardType.Uri)
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              FormField(stringResource(R.string.smb_share_label), smbShare, { smbShare = it }, modifier = Modifier.weight(1f))
                              FormField(stringResource(R.string.smb_subfolder_label), smbSub, { smbSub = it }, modifier = Modifier.weight(1f))
                          }
                          FormField(stringResource(R.string.smb_user_label), smbUser, { smbUser = it })
                          PasswordField(smbPass) { smbPass = it }
                      } else {
                          FormField(stringResource(R.string.server_url_label), navUrl, { navUrl = it }, keyboardType = KeyboardType.Uri)
                          FormField(stringResource(R.string.username_label), navUser, { navUser = it })
                          PasswordField(navPass) { navPass = it }
                          Text(stringResource(R.string.navidrome_real_path_hint), fontSize = 12.sp, lineHeight = 18.sp, color = Pal.Muted)
                      }
                      FormField(stringResource(R.string.library_name_label), label, { label = it })
                      if (showError) {
                          Text(
                              stringResource(if (type == SourceType.SMB) R.string.error_smb_settings_incomplete else R.string.error_nav_settings_incomplete),
                              color = Pal.Danger,
                              fontSize = 13.sp
                          )
                      }
                      SecurityNote()
                      PillButton(
                          text = stringResource(R.string.save_and_connect),
                          onClick = {
                              val source = LibrarySource(
                                  id = existing?.id ?: LibraryStore.newId(),
                                  type = type,
                                  label = label,
                                  smbHost = smbHost,
                                  smbShare = smbShare,
                                  smbSubFolder = smbSub,
                                  smbUser = smbUser,
                                  smbPass = smbPass,
                                  navUrl = navUrl,
                                  navUser = navUser,
                                  navPass = navPass
                              )
                              if (source.isConfigured) {
                                  showError = false
                                  vm.saveNetworkSource(source)
                              } else {
                                  showError = true
                              }
                          },
                          modifier = Modifier.fillMaxWidth(),
                          height = 56.dp,
                          fontSize = 16
                      )
                  }
              }
          }

          @Composable
          private fun FormField(
              label: String,
              value: String,
              onChange: (String) -> Unit,
              modifier: Modifier = Modifier,
              keyboardType: KeyboardType = KeyboardType.Text
          ) {
              OutlinedTextField(
                  value = value,
                  onValueChange = onChange,
                  label = { Text(label) },
                  singleLine = true,
                  shape = RoundedCornerShape(16.dp),
                  keyboardOptions = KeyboardOptions(keyboardType = keyboardType),
                  colors = pulseFieldColors(Pal.Ember),
                  modifier = modifier.fillMaxWidth()
              )
          }

          @Composable
          private fun PasswordField(value: String, onChange: (String) -> Unit) {
              var visible by remember { mutableStateOf(false) }
              OutlinedTextField(
                  value = value,
                  onValueChange = onChange,
                  label = { Text(stringResource(R.string.password_label)) },
                  visualTransformation = if (visible) VisualTransformation.None else PasswordVisualTransformation(),
                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                  trailingIcon = {
                      IconButton(onClick = { visible = !visible }) {
                          Icon(
                              if (visible) Icons.Rounded.VisibilityOff else Icons.Rounded.Visibility,
                              contentDescription = stringResource(if (visible) R.string.hide_password else R.string.show_password),
                              tint = Pal.Muted
                          )
                      }
                  },
                  singleLine = true,
                  shape = RoundedCornerShape(16.dp),
                  colors = pulseFieldColors(Pal.Ember),
                  modifier = Modifier.fillMaxWidth()
              )
          }

          // ============================ Device folders ============================

          @Composable
          fun DevicePickerScreen(vm: PulseViewModel, isTv: Boolean, onBack: () -> Unit, onRequestPermission: () -> Unit) {
              val existing = vm.sources.firstOrNull { it.type == SourceType.DEVICE }
              var allFolders by remember { mutableStateOf(existing == null || existing.deviceFolders.isEmpty()) }
              var selected by remember { mutableStateOf(existing?.deviceFolders?.toSet() ?: emptySet()) }

              LaunchedEffect(vm.hasAudioPermission) {
                  if (vm.hasAudioPermission) vm.loadDeviceFolderChoices()
              }

              ScreenScaffold(title = stringResource(R.string.device_folders_title), isTv = isTv, onBack = onBack) {
                  if (!vm.hasAudioPermission) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(top = 40.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(16.dp)
                      ) {
                          Icon(Icons.Rounded.FolderOpen, contentDescription = null, tint = Pal.Ember, modifier = Modifier.size(52.dp))
                          Text(stringResource(R.string.permission_needed), color = Pal.Muted, textAlign = TextAlign.Center)
                          PillButton(text = stringResource(R.string.allow), onClick = onRequestPermission)
                      }
                      return@ScreenScaffold
                  }
                  val choices = vm.deviceFolderChoices
                  Text(stringResource(R.string.device_folders_subtitle), fontSize = 13.sp, color = Pal.Muted)
                  Spacer(Modifier.height(12.dp))
                  val shape = RoundedCornerShape(18.dp)
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .focusGlow(shape, ring = Pal.Ember, scaleTo = 1.02f)
                          .clip(shape)
                          .background(Pal.Surface)
                          .clickable(role = Role.Switch) { allFolders = !allFolders }
                          .padding(horizontal = 16.dp, vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(stringResource(R.string.all_device_audio), fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
                          Text(stringResource(R.string.all_device_audio_desc), fontSize = 12.sp, color = Pal.Muted)
                      }
                      Switch(
                          checked = allFolders,
                          onCheckedChange = null,
                          colors = SwitchDefaults.colors(checkedTrackColor = Pal.Ember, checkedThumbColor = Pal.Ink)
                      )
                  }
                  Spacer(Modifier.height(10.dp))
                  Box(modifier = Modifier.weight(1f).fillMaxWidth()) {
                      when {
                          choices == null -> CircularProgressIndicator(color = Pal.Ember, modifier = Modifier.align(Alignment.Center))
                          choices.isEmpty() -> Text(
                              stringResource(R.string.no_local_folders),
                              color = Pal.Muted,
                              textAlign = TextAlign.Center,
                              modifier = Modifier.align(Alignment.Center)
                          )
                          else -> LazyColumn(
                              modifier = Modifier.fillMaxSize(),
                              verticalArrangement = Arrangement.spacedBy(4.dp),
                              contentPadding = PaddingValues(bottom = 16.dp)
                          ) {
                              items(choices, key = { it.path }) { folder ->
                                  val checked = allFolders || folder.path in selected
                                  val rowShape = RoundedCornerShape(16.dp)
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .focusGlow(rowShape, ring = Pal.Ember, scaleTo = 1.02f)
                                          .clip(rowShape)
                                          .clickable(enabled = !allFolders, role = Role.Checkbox) {
                                              selected = if (folder.path in selected) selected - folder.path else selected + folder.path
                                          }
                                          .padding(horizontal = 8.dp, vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                                  ) {
                                      Checkbox(
                                          checked = checked,
                                          onCheckedChange = null,
                                          enabled = !allFolders,
                                          colors = CheckboxDefaults.colors(checkedColor = Pal.Ember, checkmarkColor = Pal.Ink)
                                      )
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text(folder.displayName, fontSize = 15.sp, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                          val sub = listOf(songsCountText(folder.count), folder.parentPath).filter { it.isNotBlank() }.joinToString(" · ")
                                          Text(sub, fontSize = 12.sp, color = Pal.Muted, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      }
                                  }
                              }
                          }
                      }
                  }
                  PillButton(
                      text = stringResource(R.string.save),
                      onClick = {
                          if (allFolders || selected.isNotEmpty()) vm.saveDeviceSelection(allFolders, selected)
                      },
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(vertical = 12.dp),
                      container = if (allFolders || selected.isNotEmpty()) Pal.Ember else Pal.Surface2,
                      content = if (allFolders || selected.isNotEmpty()) Pal.Ink else Pal.Muted,
                      height = 56.dp,
                      fontSize = 16
                  )
              }
          }
