              val defaultPrompt = stringResource(R.string.select_song_prompt)
              var isPlaying by remember { mutableStateOf(false) }
              var currentTitle by remember { mutableStateOf(defaultPrompt) }
              var currentArtist by remember { mutableStateOf("") }
