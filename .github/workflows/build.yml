          // ============================ Phone ============================

          @Composable
          private fun PhoneHome(vm: PulseViewModel, actions: HomeActions) {
              val isQuranTab = vm.activeSection == LibrarySection.QURAN
              val homeMood = if (isQuranTab) Mood.Sakina else Mood.Ember
              val animatedAccent by animateColorAsState(homeMood.accent, tween(450), label = "phoneAccent")
              val folders = vm.sectionFolders
              val multipleSources = vm.sources.size > 1
              Box(modifier = Modifier.fillMaxSize()) {
                  HomeAnimatedBackdrop(isQuranTab = isQuranTab, musicGlowColor = Pal.Ember, isTv = false)
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                  ) {
                      if (vm.searchActive) {
                          SearchHeader(vm, homeMood)
                          SearchResults(vm, actions, homeMood, bottomPad = 120)
                      } else {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(start = 20.dp, end = 20.dp, top = 12.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  PulseLogo(accent = animatedAccent)
                                  Text(
                                      "Pulse",
                                      fontSize = 22.sp,
                                      fontWeight = FontWeight.Bold,
                                      letterSpacing = (-0.4).sp,
                                      color = homeMood.text
                                  )
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  RoundIconButton(
                                      icon = Icons.Rounded.Search,
                                      contentDescription = stringResource(R.string.search_action),
                                      onClick = { vm.searchActive = true },
                                      tint = homeMood.text,
                                      container = homeMood.surface.copy(alpha = 0.85f),
                                      borderColor = homeMood.line,
                                      ring = animatedAccent
                                  )
                                  RoundIconButton(
                                      icon = Icons.Rounded.Tune,
                                      contentDescription = stringResource(R.string.settings),
                                      onClick = actions.openSettings,
                                      tint = homeMood.text,
                                      container = homeMood.surface.copy(alpha = 0.85f),
                                      borderColor = homeMood.line,
                                      ring = animatedAccent
                                  )
                              }
                          }
                          LazyVerticalGrid(
                              columns = GridCells.Adaptive(minSize = 150.dp),
                              modifier = Modifier.fillMaxSize(),
                              contentPadding = PaddingValues(start = 20.dp, end = 20.dp, top = 8.dp, bottom = 128.dp),
                              horizontalArrangement = Arrangement.spacedBy(14.dp),
                              verticalArrangement = Arrangement.spacedBy(18.dp)
                          ) {
                              item(span = { GridItemSpan(maxLineSpan) }) {
                                  HomeIntro(vm, actions, homeMood, isTv = false)
                              }
                              if (folders.isEmpty() && !vm.isAnyLoading) {
                                  item(span = { GridItemSpan(maxLineSpan) }) {
                                      EmptyLibrary(vm, actions, homeMood)
                                  }
                              }
                              items(folders, key = { it.key }) { folder ->
                                  FolderTile(
                                      folder = folder,
                                      cover = vm.coverOf(folder),
                                      artKey = vm.artKeyOf(folder),
                                      sourceLabel = if (multipleSources) vm.sourceLabel(folder.sourceId) else null,
                                      sourceType = vm.sourceTypeOf(folder.sourceId),
                                      isMixed = vm.isMixedFolder(folder.rawKey),
                                      onClick = { actions.openFolder(folder) },
                                      mood = homeMood
                                  )
                              }
                          }
                      }
                  }
                  if (vm.hasActiveTrack) {
                      val mood = Mood.fromCover(vm.currentCover)
                      MiniPlayer(
                          title = vm.currentTitle.ifBlank { stringResource(R.string.select_song_prompt) },
                          subtitle = nowPlayingSubtitle(vm),
                          cover = vm.currentCover,
                          artKey = vm.currentArtKey,
                          progress = if (vm.durationMs > 0L) vm.positionMs.toFloat() / vm.durationMs else 0f,
                          isPlaying = vm.isPlaying,
                          mood = mood,
                          onOpen = actions.openStudio,
                          onPlayPause = { vm.playPause() },
                          onNext = { vm.next() },
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .navigationBarsPadding()
                              .padding(horizontal = 14.dp, vertical = 14.dp)
                      )
                  }
              }
          }

          @Composable
          internal fun nowPlayingSubtitle(vm: PulseViewModel): String {
              val folder = vm.currentAlbum.substringAfterLast('/')
              return if (vm.queueSize > 1) {
                  stringResource(R.string.queue_position, folder, vm.queueIndex, vm.queueSize)
              } else {
                  folder.ifBlank { vm.currentArtist }
              }
          }

          /** Hero portals, greeting, section resume, counts & shuffle, and status banners. */
          @Composable
          private fun HomeIntro(vm: PulseViewModel, actions: HomeActions, mood: Mood, isTv: Boolean) {
              val hour = remember { Calendar.getInstance().get(Calendar.HOUR_OF_DAY) }
              val isDay = hour in 4..15
              Column(verticalArrangement = Arrangement.spacedBy(14.dp), modifier = Modifier.padding(top = if (isTv) 0.dp else 10.dp)) {
                  HomePortalSwitcher(vm = vm, isTv = isTv)
                  if (!isTv && vm.canResumeActiveSection) {
                      vm.activeResumeSnapshot?.let { snap ->
                          ContinueListeningCard(vm = vm, snap = snap, onResume = actions.resumeLast)
                      }
                  }
                  val songCount = vm.sectionSongs.size
                  if (songCount > 0) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(top = 2.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {
                              Text(
                                  stringResource(
                                      when {
                                          mood.isSakina -> R.string.headline_quran
                                          isDay -> R.string.headline_day
                                          else -> R.string.headline_evening
                                      }
                                  ),
                                  fontSize = if (mood.isSakina) 21.sp else 18.sp,
                                  fontFamily = if (mood.isSakina) PulseFonts.quran else null,
                                  fontWeight = FontWeight.Bold,
                                  color = if (mood.isSakina) Pal.GoldLight else mood.text
                              )
                              Text(
                                  songsCountText(songCount) + " · " + foldersCountText(vm.sectionFolders.size),
                                  fontSize = 12.sp,
                                  color = mood.muted
                              )
                          }
                          PillButton(
                              text = stringResource(R.string.shuffle_all),
                              onClick = actions.shuffleAll,
                              icon = Icons.Rounded.Shuffle,
                              container = mood.surface.copy(alpha = 0.72f),
                              content = mood.text,
                              borderColor = mood.line,
                              height = 42.dp,
                              fontSize = 13,
                              ring = mood.accent
                          )
                      }
                  }
                  LibraryBanners(vm, actions)
              }
          }

          @Composable
          private fun ContinueListeningCard(vm: PulseViewModel, snap: ResumeSnapshot, onResume: () -> Unit, isTv: Boolean = false) {
              val kind = vm.kindOfResume(snap)
              val folderLabel = snap.folder.substringAfterLast('/').ifBlank { snap.folder.ifBlank { "Pulse" } }
              val cover = CoverArt.forName(folderLabel, kind)
              val mood = Mood.fromCover(cover)
              val song = remember(vm.visibleSongs, snap.songId) { vm.visibleSongs.firstOrNull { it.id == snap.songId } }
              val artKey = if (kind == IslamicKind.NONE && song != null) vm.artKeyOf(song) else null
              val progress = if (snap.durationMs > 0L) (snap.positionMs.toFloat() / snap.durationMs).coerceIn(0f, 1f) else 0f
              val shape = RoundedCornerShape(22.dp)
              val glassBrush = if (mood.isSakina) {
                  Brush.linearGradient(listOf(Color(0xD90E2920), Color(0xCC091C16)))
              } else {
                  Brush.linearGradient(listOf(Color(0xD9201B2B), Color(0xCC15121D)))
              }
              val borderBrush = if (mood.isSakina) {
                  Brush.linearGradient(listOf(Pal.Gold.copy(alpha = 0.42f), Pal.Gold.copy(alpha = 0.14f)))
              } else {
                  Brush.linearGradient(listOf(mood.accent.copy(alpha = 0.36f), Color(0x18FFFFFF)))
              }

              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .focusGlow(shape, ring = mood.accent, scaleTo = 1.02f)
                      .clip(shape)
                      .background(glassBrush)
                      .border(1.dp, borderBrush, shape)
                      .clickable(role = Role.Button, onClick = onResume)
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = if (isTv) 18.dp else 14.dp, vertical = if (isTv) 14.dp else 12.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      GenerativeCover(
                          spec = cover,
                          artKey = artKey,
                          modifier = Modifier.size(if (isTv) 62.dp else 54.dp),
                          shape = RoundedCornerShape(14.dp)
                      )
                      Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              Icon(Icons.Rounded.History, contentDescription = null, tint = mood.accent, modifier = Modifier.size(14.dp))
                              Text(stringResource(R.string.continue_listening), fontSize = 11.sp, color = mood.accent, fontWeight = FontWeight.SemiBold)
                          }
                          Text(
                              snap.title.ifBlank { folderLabel },
                              fontSize = if (isTv) 19.sp else 15.sp,
                              fontWeight = FontWeight.Bold,
                              fontFamily = if (mood.isSakina) PulseFonts.quran else null,
                              color = if (mood.isSakina) Pal.GoldLight else Pal.Text,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          val timeInfo = if (snap.durationMs > 0L) "${formatTime(snap.positionMs)} / ${formatTime(snap.durationMs)}" else formatTime(snap.positionMs)
                          Text(
                              listOf(folderLabel, timeInfo).filter { it.isNotBlank() }.joinToString(" · "),
                              fontSize = 12.sp,
                              color = mood.muted,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      RoundIconButton(
                          icon = Icons.Rounded.PlayArrow,
                          contentDescription = stringResource(R.string.resume_btn),
                          onClick = onResume,
                          size = if (isTv) 52.dp else 46.dp,
                          iconSize = if (isTv) 28.dp else 24.dp,
                          tint = mood.onAccent,
                          container = mood.accent,
                          borderColor = Color.Transparent
                      )
                  }
                  if (snap.durationMs > 0L) {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(start = 14.dp, end = 14.dp, bottom = 10.dp)
                                  .height(3.5.dp)
                                  .clip(RoundedCornerShape(999.dp))
                                  .background(mood.accent.copy(alpha = 0.16f))
                          ) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth(progress)
                                      .fillMaxHeight()
                                      .clip(RoundedCornerShape(999.dp))
                                      .background(
                                          Brush.horizontalGradient(
                                              if (mood.isSakina) listOf(Pal.GoldDeep, Pal.Gold, Pal.GoldLight)
                                              else listOf(mood.accent, Pal.Lilac)
                                          )
                                      )
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun LibraryBanners(vm: PulseViewModel, actions: HomeActions) {
              val needsPermission = !vm.hasAudioPermission && vm.sources.any { it.type == SourceType.DEVICE }
              if (needsPermission) {
                  StatusBanner(
                      text = stringResource(R.string.permission_needed),
                      isError = true,
                      showProgress = false,
                      actionLabel = stringResource(R.string.allow),
                      onAction = actions.requestPermission
                  )
              }
              if (vm.isAnyLoading && vm.visibleSongs.isNotEmpty()) {
                  StatusBanner(text = stringResource(R.string.updating_library), isError = false, showProgress = true)
              }
              vm.sourceErrors.forEach { (id, message) ->
                  val source = vm.sources.firstOrNull { it.id == id } ?: return@forEach
                  StatusBanner(
                      text = source.label + " — " + message,
                      isError = true,
                      showProgress = false,
                      actionLabel = stringResource(R.string.retry),
                      onAction = { vm.refreshSource(source, force = true) }
                  )
              }
          }

          @Composable
          private fun EmptyLibrary(vm: PulseViewModel, actions: HomeActions, mood: Mood) {
              val hasAnySongs = vm.visibleSongs.isNotEmpty()
              val isQuran = vm.activeSection == LibrarySection.QURAN
              val otherSection = if (isQuran) LibrarySection.MUSIC else LibrarySection.QURAN
              val otherLabel = stringResource(if (isQuran) R.string.section_music else R.string.section_quran)
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(vertical = 44.dp, horizontal = 16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  Icon(
                      if (isQuran) Icons.Rounded.MenuBook else Icons.Rounded.LibraryMusic,
                      contentDescription = null,
                      tint = mood.accent.copy(alpha = 0.65f),
                      modifier = Modifier.size(52.dp)
                  )
                  Text(
                      stringResource(
                          when {
                              !hasAnySongs -> R.string.library_empty
                              isQuran -> R.string.section_empty_quran
                              else -> R.string.section_empty_music
                          }
                      ),
                      color = mood.muted,
                      textAlign = TextAlign.Center
                  )
                  if (hasAnySongs) {
                      PillButton(
                          text = stringResource(R.string.switch_to_section, otherLabel),
                          onClick = { vm.selectSection(otherSection) },
                          icon = Icons.Rounded.SwapHoriz,
                          container = mood.accent,
                          content = mood.onAccent,
                          height = 48.dp,
                          ring = mood.accent
                      )
                  }
                  if (vm.hiddenFolders.isNotEmpty() || vm.hiddenSongIds.isNotEmpty()) {
                      PillButton(
                          text = stringResource(R.string.restore_hidden_btn),
                          onClick = { vm.restoreHidden() },
                          container = Color.Transparent,
                          content = mood.text,
                          borderColor = mood.line,
                          height = 46.dp,
                          fontSize = 13,
                          ring = mood.accent
                      )
                  }
                  if (!hasAnySongs) {
                      PillButton(
                          text = stringResource(R.string.add_folder),
                          onClick = actions.openSettings,
                          icon = Icons.Rounded.Add,
                          container = mood.accent,
                          content = mood.onAccent,
                          height = 48.dp
                      )
                  }
              }
          }

          @Composable
          private fun SearchHeader(vm: PulseViewModel, mood: Mood) {
              val focus = remember { FocusRequester() }
              val secLabel = stringResource(
                  if (vm.activeSection == LibrarySection.QURAN) R.string.section_quran else R.string.section_music
              )
              LaunchedEffect(Unit) {
                  delay(100L)
                  runCatching { focus.requestFocus() }
              }
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(start = 16.dp, end = 16.dp, top = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  RoundIconButton(
                      icon = Icons.AutoMirrored.Rounded.ArrowBack,
                      contentDescription = stringResource(R.string.close),
                      onClick = {
                          vm.searchActive = false
                          vm.searchQuery = ""
                      },
                      tint = mood.text,
                      container = mood.surface,
                      borderColor = mood.line,
                      ring = mood.accent
                  )
                  OutlinedTextField(
                      value = vm.searchQuery,
                      onValueChange = { vm.searchQuery = it },
                      placeholder = { Text(stringResource(R.string.search_in_section, secLabel), color = mood.muted, fontSize = 14.sp) },
                      leadingIcon = { Icon(Icons.Rounded.Search, contentDescription = null, tint = mood.accent) },
                      singleLine = true,
                      shape = RoundedCornerShape(16.dp),
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                      colors = pulseFieldColors(mood.accent),
                      modifier = Modifier
                          .weight(1f)
                          .focusRequester(focus)
                  )
              }
          }

          @Composable
          internal fun pulseFieldColors(accent: Color) = OutlinedTextFieldDefaults.colors(
              focusedContainerColor = Pal.Field,
              unfocusedContainerColor = Pal.Field,
              focusedBorderColor = accent,
              unfocusedBorderColor = Pal.Line,
              focusedTextColor = Pal.Text,
              unfocusedTextColor = Pal.Text,
              cursorColor = accent,
              focusedLabelColor = accent,
              unfocusedLabelColor = Pal.Muted
          )

          @Composable
          private fun SearchResults(vm: PulseViewModel, actions: HomeActions, mood: Mood, bottomPad: Int) {
              val query = vm.searchQuery.trim()
              val folders = vm.sectionFolders
              val songs = vm.sectionSongs
              val matchedFolders = remember(folders, query) {
                  if (query.isBlank()) emptyList() else folders.filter { it.path.contains(query, ignoreCase = true) }.take(12)
              }
              val matchedSongs = remember(songs, query) {
                  if (query.isBlank()) emptyList() else songs.filter {
                      it.title.contains(query, ignoreCase = true) || it.artist.contains(query, ignoreCase = true)
                  }.take(200)
              }
              if (query.isNotBlank() && matchedFolders.isEmpty() && matchedSongs.isEmpty()) {
                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Text(stringResource(R.string.no_search_results), color = mood.muted)
                  }
                  return
              }
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(start = 12.dp, end = 12.dp, top = 12.dp, bottom = bottomPad.dp),
                  verticalArrangement = Arrangement.spacedBy(4.dp)
              ) {
                  items(matchedFolders, key = { "f_" + it.key }) { folder ->
                      val shape = RoundedCornerShape(18.dp)
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .focusGlow(shape, ring = mood.accent, scaleTo = 1.02f)
                              .clip(shape)
                              .clickable(role = Role.Button) { actions.openFolder(folder) }
                              .padding(horizontal = 8.dp, vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          GenerativeCover(spec = vm.coverOf(folder), artKey = vm.artKeyOf(folder), modifier = Modifier.size(52.dp), shape = RoundedCornerShape(14.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text(folder.displayName, fontSize = 15.sp, fontWeight = FontWeight.SemiBold, color = mood.text, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(songsCountText(folder.songs.size), fontSize = 12.sp, color = mood.muted)
                          }
                      }
                  }
                  itemsIndexed(matchedSongs, key = { i, s -> "s_${s.id}_$i" }) { index, song ->
                      TrackRow(
                          number = index + 1,
                          song = song,
                          isCurrent = song.id == vm.currentMediaId,
                          isPlaying = vm.isPlaying,
                          clock = vm.clock,
                          mood = mood,
                          showFolder = true,
                          onClick = { actions.play(matchedSongs, index) },
                          onManage = { actions.manageSong(song) }
                      )
                  }
              }
          }

          // ============================ TV ============================

          @Composable
          private fun TvHome(vm: PulseViewModel, actions: HomeActions) {
              val isQuranTab = vm.activeSection == LibrarySection.QURAN
              val homeMood = if (isQuranTab) Mood.Sakina else Mood.Ember
              val animatedAccent by animateColorAsState(homeMood.accent, tween(450), label = "tvAccent")
              val folders = vm.sectionFolders
              val multipleSources = vm.sources.size > 1
              val cover = vm.currentCover
              val heroAccent = if (vm.hasActiveTrack && vm.currentSection == vm.activeSection) {
                  Mood.fromCover(cover).accent
              } else {
                  Pal.Ember
              }
              Box(modifier = Modifier.fillMaxSize()) {
                  HomeAnimatedBackdrop(isQuranTab = isQuranTab, musicGlowColor = heroAccent, isTv = true)
                  LazyVerticalGrid(
                      columns = GridCells.Adaptive(minSize = 176.dp),
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(start = 56.dp, end = 56.dp, top = 26.dp, bottom = 40.dp),
                      horizontalArrangement = Arrangement.spacedBy(28.dp),
                      verticalArrangement = Arrangement.spacedBy(22.dp)
                  ) {
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                  PulseLogo(size = 38.dp, accent = animatedAccent)
                                  Text("Pulse", fontSize = 27.sp, fontWeight = FontWeight.Bold, color = homeMood.text)
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                  RoundIconButton(
                                      Icons.Rounded.Search, stringResource(R.string.search_action), actions.openTvSearch,
                                      size = 52.dp, iconSize = 22.dp, tint = homeMood.text, container = homeMood.surface.copy(alpha = 0.82f), borderColor = homeMood.line, ring = animatedAccent
                                  )
                                  RoundIconButton(
                                      Icons.Rounded.Refresh, stringResource(R.string.refresh), { vm.refreshAll() },
                                      size = 52.dp, iconSize = 22.dp, tint = homeMood.text, container = homeMood.surface.copy(alpha = 0.82f), borderColor = homeMood.line, ring = animatedAccent
                                  )
                                  RoundIconButton(
                                      Icons.Rounded.Tune, stringResource(R.string.settings), actions.openSettings,
                                      size = 52.dp, iconSize = 22.dp, tint = homeMood.text, container = homeMood.surface.copy(alpha = 0.82f), borderColor = homeMood.line, ring = animatedAccent
                                  )
                              }
                          }
                      }
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          HomePortalSwitcher(vm = vm, isTv = true)
                      }
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          when {
                              vm.hasActiveTrack -> Column(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                                  TvNowPlayingHero(vm, actions)
                                  if (vm.canResumeActiveSection && vm.activeResumeSnapshot != null) {
                                      ContinueListeningCard(vm = vm, snap = vm.activeResumeSnapshot!!, onResume = actions.resumeLast, isTv = true)
                                  }
                              }
                              vm.canResumeActiveSection && vm.activeResumeSnapshot != null -> ContinueListeningCard(
                                  vm = vm,
                                  snap = vm.activeResumeSnapshot!!,
                                  onResume = actions.resumeLast,
                                  isTv = true
                              )
                              else -> Spacer(Modifier.height(2.dp))
                          }
                      }
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              LibraryBanners(vm, actions)
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                  SectionTitle(
                                      text = stringResource(if (isQuranTab) R.string.section_quran else R.string.section_music),
                                      trailing = foldersCountText(folders.size) + " · " + songsCountText(vm.sectionSongs.size),
                                      titleColor = if (isQuranTab) Pal.GoldLight else homeMood.text,
                                      trailingColor = homeMood.muted
                                  )
                                  if (vm.sectionSongs.isNotEmpty()) {
                                      PillButton(
                                          text = stringResource(R.string.shuffle_all),
                                          onClick = actions.shuffleAll,
                                          icon = Icons.Rounded.Shuffle,
                                          container = homeMood.surface.copy(alpha = 0.82f),
                                          content = homeMood.text,
                                          borderColor = homeMood.line,
                                          height = 48.dp,
                                          fontSize = 14,
                                          ring = animatedAccent
                                      )
                                  }
                              }
                          }
                      }
                      if (folders.isEmpty() && !vm.isAnyLoading) {
                          item(span = { GridItemSpan(maxLineSpan) }) { EmptyLibrary(vm, actions, homeMood) }
                      }
                      items(folders, key = { it.key }) { folder ->
                          FolderTile(
                              folder = folder,
                              cover = vm.coverOf(folder),
                              artKey = vm.artKeyOf(folder),
                              sourceLabel = if (multipleSources) vm.sourceLabel(folder.sourceId) else null,
                              sourceType = vm.sourceTypeOf(folder.sourceId),
                              isMixed = vm.isMixedFolder(folder.rawKey),
                              onClick = { actions.openFolder(folder) },
                              titleSize = 16,
                              mood = homeMood
                          )
                      }
                  }
              }
          }

          @Composable
          private fun TvNowPlayingHero(vm: PulseViewModel, actions: HomeActions) {
              val cover = vm.currentCover
              val mood = Mood.fromCover(cover)
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(44.dp)) {
                  GenerativeCover(spec = cover, artKey = vm.currentArtKey, modifier = Modifier.size(230.dp), shape = RoundedCornerShape(32.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          if (vm.isPlaying) PlayingBars(clock = vm.clock, color = mood.accent)
                          Text(stringResource(R.string.now_playing_label), fontSize = 15.sp, color = mood.accent, fontWeight = FontWeight.SemiBold)
                      }
                      Spacer(Modifier.height(10.dp))
                      Text(
                          vm.currentTitle.ifBlank { stringResource(R.string.select_song_prompt) },
                          fontSize = 46.sp,
                          fontWeight = FontWeight.Bold,
                          fontFamily = if (mood.isSakina) PulseFonts.quran else null,
                          color = if (mood.isSakina) Pal.GoldLight else Pal.Text,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(6.dp))
                      Text(nowPlayingSubtitle(vm), fontSize = 18.sp, color = Pal.Muted, maxLines = 1)
                      Spacer(Modifier.height(22.dp))
                      Box(modifier = Modifier.widthIn(max = 640.dp)) {
                          ProgressLine(
                              progress = if (vm.durationMs > 0L) vm.positionMs.toFloat() / vm.durationMs else 0f,
                              accent = mood.accent,
                              track = Pal.LineStrong,
                              height = 6.dp
                          )
                      }
                      Spacer(Modifier.height(16.dp))
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                              RoundIconButton(Icons.Rounded.SkipPrevious, stringResource(R.string.cd_previous), { vm.previous() }, size = 56.dp, iconSize = 26.dp, container = Pal.Surface)
                              RoundIconButton(
                                  icon = if (vm.isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                  contentDescription = stringResource(R.string.cd_play_pause),
                                  onClick = { vm.playPause() },
                                  size = 76.dp,
                                  iconSize = 34.dp,
                                  tint = mood.onAccent,
                                  container = mood.accent,
                                  borderColor = Color.Transparent
                              )
                              RoundIconButton(Icons.Rounded.SkipNext, stringResource(R.string.cd_next), { vm.next() }, size = 56.dp, iconSize = 26.dp, container = Pal.Surface)
                              RoundIconButton(Icons.Rounded.Stop, stringResource(R.string.cd_stop), { vm.stopPlayback() }, size = 56.dp, iconSize = 24.dp, tint = Pal.Danger, container = Pal.Surface)
                              PillButton(
                                  text = stringResource(R.string.open_studio),
                                  onClick = actions.openStudio,
                                  icon = Icons.Rounded.AutoAwesome,
                                  container = Pal.Surface,
                                  content = Pal.Text,
                                  borderColor = Pal.Line,
                                  height = 56.dp
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun TvResumeHero(vm: PulseViewModel, snap: ResumeSnapshot, onResume: () -> Unit) {
              val kind = vm.kindOfResume(snap)
              val folderLabel = snap.folder.substringAfterLast('/').ifBlank { snap.folder.ifBlank { "Pulse" } }
              val cover = CoverArt.forName(folderLabel, kind)
              val mood = Mood.fromCover(cover)
              val song = remember(vm.visibleSongs, snap.songId) { vm.visibleSongs.firstOrNull { it.id == snap.songId } }
              val artKey = if (kind == IslamicKind.NONE && song != null) vm.artKeyOf(song) else null
              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(36.dp)) {
                  GenerativeCover(spec = cover, artKey = artKey, modifier = Modifier.size(196.dp), shape = RoundedCornerShape(28.dp))
                  Column(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Icon(Icons.Rounded.History, contentDescription = null, tint = mood.accent, modifier = Modifier.size(20.dp))
                          Text(stringResource(R.string.continue_listening), fontSize = 15.sp, color = mood.accent, fontWeight = FontWeight.SemiBold)
                      }
                      Text(
                          snap.title.ifBlank { folderLabel },
                          fontSize = 38.sp,
                          fontWeight = FontWeight.Bold,
                          fontFamily = if (mood.isSakina) PulseFonts.quran else null,
                          color = if (mood.isSakina) Pal.GoldLight else Pal.Text,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      val timeInfo = if (snap.durationMs > 0L) "${formatTime(snap.positionMs)} / ${formatTime(snap.durationMs)}" else formatTime(snap.positionMs)
                      Text(
                          listOf(folderLabel, timeInfo).filter { it.isNotBlank() }.joinToString(" · "),
                          fontSize = 17.sp,
                          color = Pal.Muted,
                          maxLines = 1
                      )
                      Spacer(Modifier.height(6.dp))
                      PillButton(
                          text = stringResource(R.string.resume_btn),
                          onClick = onResume,
                          icon = Icons.Rounded.PlayArrow,
                          container = mood.accent,
                          content = mood.onAccent,
                          height = 56.dp,
                          fontSize = 16
                      )
                  }
              }
          }

