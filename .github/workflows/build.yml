          /** Remote-friendly focus: the focused element grows a little and gets a bright ring. */
          internal fun Modifier.focusGlow(
              shape: Shape,
              ring: Color = Pal.Text,
              scaleTo: Float = 1.06f
          ): Modifier = composed {
              var focused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (focused) scaleTo else 1f, label = "focusScale")
              this
                  .graphicsLayer {
                      scaleX = scale
                      scaleY = scale
                  }
                  .border(if (focused) 3.dp else 0.dp, if (focused) ring else Color.Transparent, shape)
                  .onFocusChanged { focused = it.isFocused || it.hasFocus }
          }

