          @Composable
          fun FullScreenStudio(
              title: String,
              artist: String,
              isPlaying: Boolean,
              hasActiveTrack: Boolean,
              isTv: Boolean,
              positionMs: Long,
              durationMs: Long,
              shuffleEnabled: Boolean,
              playbackMode: Int,
              style: Int,
              clock: VisualizerClock,
              onSeek: (Long) -> Unit,
              onPlayPause: () -> Unit,
              onStopPlayback: () -> Unit,
              onNext: () -> Unit,
              onPrev: () -> Unit,
              onRewind: () -> Unit,
              onForward: () -> Unit,
              onToggleShuffle: () -> Unit,
              onCyclePlaybackMode: () -> Unit,
              onCycleStyle: () -> Unit,
              onExit: () -> Unit
          ) {
              val context = LocalContext.current
              val activity = context as? Activity

              val isIslamic = style == STYLE_ISLAMIC
              val activeGrad = if (isIslamic) AuraPalette.GoldGradient else AuraPalette.PrimaryGradient
              val activeAccent = if (isIslamic) AuraPalette.GoldLight else AuraPalette.Cyan

              var isDragging by remember { mutableStateOf(false) }
              var dragPos by remember { mutableFloatStateOf(0f) }

              var controlsVisible by remember { mutableStateOf(true) }
              var interactionTick by remember { mutableIntStateOf(0) }

              val rootFocusRequester = remember { FocusRequester() }
              val playPauseFocusRequester = remember { FocusRequester() }

              fun bumpActivity() {
                  interactionTick++
              }

              LaunchedEffect(controlsVisible, interactionTick, isPlaying, isDragging) {
                  if (controlsVisible && isPlaying && !isDragging) {
                      delay(6000L)
                      controlsVisible = false
                  }
              }

              LaunchedEffect(controlsVisible) {
                  if (!controlsVisible) {
                      runCatching { rootFocusRequester.requestFocus() }
                  } else if (isTv) {
                      delay(120L)
                      runCatching { playPauseFocusRequester.requestFocus() }
                  }
              }

              DisposableEffect(controlsVisible) {
                  val window = activity?.window
                  if (window != null) {
                      val controller = WindowCompat.getInsetsController(window, window.decorView)
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      if (!controlsVisible) {
                          controller.hide(WindowInsetsCompat.Type.systemBars())
                      } else {
                          controller.show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
                  onDispose {}
              }

              DisposableEffect(Unit) {
                  onDispose {
                      activity?.window?.let { win ->
                          WindowCompat.getInsetsController(win, win.decorView)
                              .show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }

              val stageTopPad by animateDpAsState(
                  targetValue = if (controlsVisible) 64.dp else 16.dp,
                  animationSpec = tween(550),
                  label = "stageTop"
              )
              val stageBottomPad by animateDpAsState(
                  targetValue = if (controlsVisible) 210.dp else 64.dp,
                  animationSpec = tween(550),
                  label = "stageBottom"
              )

              val styleName = when (style) {
                  0 -> stringResource(R.string.style_neon_bars)
                  1 -> stringResource(R.string.style_aurora_waves)
                  2 -> stringResource(R.string.style_radial_pulse)
                  3 -> stringResource(R.string.style_stardust)
                  else -> stringResource(R.string.style_islamic)
              }

              val progress = if (durationMs > 0L) (positionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f) else 0f

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .focusRequester(rootFocusRequester)
                      .focusable()
                      .onPreviewKeyEvent { keyEvent ->
                          if (keyEvent.type == KeyEventType.KeyDown) {
                              if (!controlsVisible) {
                                  if (keyEvent.key == Key.Back) {
                                      return@onPreviewKeyEvent false
                                  }
                                  controlsVisible = true
                                  bumpActivity()
                                  return@onPreviewKeyEvent true
                              } else {
                                  bumpActivity()
                              }
                          }
                          false
                      }
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null
                      ) {
                          controlsVisible = !controlsVisible
                          if (controlsVisible) bumpActivity()
                      }
              ) {
                  VisualizerStage(
                      style = style,
                      clock = clock,
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(top = stageTopPad, bottom = stageBottomPad)
                  )

                  AnimatedVisibility(
                      visible = !controlsVisible,
                      enter = fadeIn(tween(650)),
                      exit = fadeOut(tween(250)),
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 28.dp, vertical = 18.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              title,
                              fontSize = if (isTv) 24.sp else 17.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = (if (isIslamic) AuraPalette.GoldLight else Color.White).copy(alpha = 0.85f),
                              maxLines = 1,
                              modifier = Modifier.basicMarquee()
                          )
                          if (artist.isNotBlank()) {
                              Spacer(Modifier.height(2.dp))
                              Text(
                                  artist,
                                  fontSize = if (isTv) 14.sp else 12.sp,
                                  color = AuraPalette.MutedText.copy(alpha = 0.75f),
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                          Spacer(Modifier.height(10.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth(if (isTv) 0.45f else 0.72f)
                                      .height(2.5.dp)
                                      .clip(RoundedCornerShape(2.dp))
                                      .background(Color(0x22FFFFFF))
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .fillMaxWidth(progress)
                                          .fillMaxHeight()
                                          .background(activeGrad)
                                  )
                              }
                          }
                      }
                  }

                  AnimatedVisibility(
                      visible = controlsVisible,
                      enter = fadeIn(tween(300)),
                      exit = fadeOut(tween(600)),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .statusBarsPadding()
                              .navigationBarsPadding()
                              .padding(horizontal = 20.dp, vertical = 12.dp),
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  AuraIconButton(
                                      icon = if (isTv) Icons.Default.FullscreenExit else Icons.Default.KeyboardArrowDown,
                                      contentDescription = stringResource(R.string.cd_exit_fullscreen),
                                      onClick = onExit,
                                      glass = true,
                                      size = 44
                                  )
                                  if (hasActiveTrack) {
                                      AuraIconButton(
                                          icon = Icons.Default.Stop,
                                          contentDescription = stringResource(R.string.cd_stop),
                                          onClick = { bumpActivity(); onStopPlayback() },
                                          tint = AuraPalette.Danger,
                                          glass = true,
                                          size = 44
                                      )
                                  }
                              }

                              Text(
                                  if (isIslamic) stringResource(R.string.quran_header) else stringResource(R.string.now_playing_header),
                                  fontSize = 12.sp,
                                  letterSpacing = 1.8.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isIslamic) AuraPalette.GoldLight else AuraPalette.MutedText
                              )

                              Surface(
                                  onClick = {
                                      bumpActivity()
                                      onCycleStyle()
                                  },
                                  shape = RoundedCornerShape(24.dp),
                                  color = if (isIslamic) Color(0x33D4AF37) else Color(0x28FFFFFF),
                                  border = BorderStroke(1.dp, if (isIslamic) AuraPalette.Gold.copy(alpha = 0.6f) else Color(0x5506B6D4))
                              ) {
                                  Row(
                                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                                  ) {
                                      Icon(
                                          Icons.Default.Palette,
                                          contentDescription = stringResource(R.string.cd_change_style),
                                          tint = activeAccent,
                                          modifier = Modifier.size(16.dp)
                                      )
                                      Text(styleName, fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Color.White)
                                  }
                              }
                          }

                          Spacer(Modifier.weight(1f))

                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(28.dp))
                                  .background(if (isIslamic) AuraPalette.EmeraldGlass else AuraPalette.GlassStrong)
                                  .border(
                                      1.dp,
                                      if (isIslamic) AuraPalette.Gold.copy(alpha = 0.4f) else AuraPalette.GlassBorder,
                                      RoundedCornerShape(28.dp)
                                  )
                                  .clickable(
                                      interactionSource = remember { MutableInteractionSource() },
                                      indication = null
                                  ) { bumpActivity() }
                                  .padding(horizontal = 22.dp, vertical = 18.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              if (playbackMode == MODE_PLAY_ONCE) {
                                  Box(
                                      modifier = Modifier
                                          .padding(bottom = 8.dp)
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(AuraPalette.PlayOnceGradient)
                                          .padding(horizontal = 10.dp, vertical = 3.dp)
                                  ) {
                                      Text(
                                          stringResource(R.string.badge_play_once),
                                          fontSize = 10.sp,
                                          fontWeight = FontWeight.ExtraBold,
                                          color = Color.White
                                      )
                                  }
                              }

                              Text(
                                  title,
                                  fontSize = if (isTv) 26.sp else 21.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isIslamic) AuraPalette.GoldLight else Color.White,
                                  maxLines = 1,
                                  modifier = Modifier.basicMarquee()
                              )
                              if (artist.isNotBlank()) {
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      artist,
                                      fontSize = if (isTv) 16.sp else 13.sp,
                                      color = AuraPalette.MutedText,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }

                              Spacer(Modifier.height(10.dp))

                              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                                  val shownPos = if (isDragging) dragPos.toLong() else positionMs
                                  if (isTv) {
                                      Box(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .height(7.dp)
                                              .clip(RoundedCornerShape(4.dp))
                                              .background(Color(0x28FFFFFF))
                                      ) {
                                          Box(
                                              modifier = Modifier
                                                  .fillMaxWidth(progress)
                                                  .fillMaxHeight()
                                                  .background(activeGrad)
                                          )
                                      }
                                  } else {
                                      val safeMax = durationMs.coerceAtLeast(1L).toFloat()
                                      Slider(
                                          value = shownPos.coerceIn(0L, durationMs.coerceAtLeast(1L)).toFloat(),
                                          onValueChange = {
                                              isDragging = true
                                              dragPos = it
                                              bumpActivity()
                                          },
                                          onValueChangeFinished = {
                                              onSeek(dragPos.toLong())
                                              isDragging = false
                                              bumpActivity()
                                          },
                                          valueRange = 0f..safeMax,
                                          colors = SliderDefaults.colors(
                                              thumbColor = activeAccent,
                                              activeTrackColor = if (isIslamic) AuraPalette.Gold else AuraPalette.Violet,
                                              inactiveTrackColor = Color(0x30FFFFFF)
                                          ),
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                  }

                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(formatTime(shownPos), fontSize = 12.sp, color = AuraPalette.MutedText)
                                      Text(formatTime(durationMs), fontSize = 12.sp, color = AuraPalette.MutedText)
                                  }

                                  Spacer(Modifier.height(10.dp))

                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceEvenly,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      AuraIconButton(
                                          icon = Icons.Default.Shuffle,
                                          contentDescription = stringResource(R.string.cd_shuffle),
                                          onClick = { bumpActivity(); onToggleShuffle() },
                                          tint = if (shuffleEnabled) activeAccent else AuraPalette.MutedText,
                                          glass = shuffleEnabled
                                      )
                                      AuraIconButton(
                                          icon = Icons.Default.SkipPrevious,
                                          contentDescription = stringResource(R.string.cd_previous),
                                          onClick = { bumpActivity(); onPrev() },
                                          glass = true
                                      )
                                      if (isTv) {
                                          AuraIconButton(
                                              icon = Icons.Default.FastRewind,
                                              contentDescription = stringResource(R.string.cd_rewind),
                                              onClick = { bumpActivity(); onRewind() },
                                              glass = true
                                          )
                                      }
                                      AuraIconButton(
                                          icon = if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                          contentDescription = stringResource(R.string.cd_play_pause),
                                          onClick = { bumpActivity(); onPlayPause() },
                                          gradient = true,
                                          gradientBrush = activeGrad,
                                          size = 66,
                                          modifier = Modifier.focusRequester(playPauseFocusRequester)
                                      )
                                      if (isTv) {
                                          AuraIconButton(
                                              icon = Icons.Default.FastForward,
                                              contentDescription = stringResource(R.string.cd_forward),
                                              onClick = { bumpActivity(); onForward() },
                                              glass = true
                                          )
                                      }
                                      AuraIconButton(
                                          icon = Icons.Default.SkipNext,
                                          contentDescription = stringResource(R.string.cd_next),
                                          onClick = { bumpActivity(); onNext() },
                                          glass = true
                                      )
                                      PlaybackModeButton(
                                          playbackMode = playbackMode,
                                          accentColor = activeAccent,
                                          onClick = { bumpActivity(); onCyclePlaybackMode() }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun VisualizerStage(
              style: Int,
              clock: VisualizerClock,
              modifier: Modifier = Modifier
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 2f || h <= 2f) return@Canvas

                  @Suppress("UNUSED_VARIABLE")
                  val tick = clock.frameTick
                  val phase = clock.phase
                  val bass = clock.bass
                  val mid = clock.mid
                  val high = clock.high
                  val overall = clock.overall
                  val beat = clock.beat
                  val bands = clock.bands
                  val peaks = clock.peaks
                  val bandCount = bands.size

                  val cx = w / 2f
                  val cy = h / 2f
                  val minDim = minOf(w, h)

                  when (style) {
                      0 -> {
                          val discCenter = Offset(cx, h * 0.39f)
                          val discRadius = (minDim * 0.24f).coerceAtLeast(24f)
                          val pulse = 1f + bass * 0.14f + beat * 0.10f

                          for (ring in 0..2) {
                              val baseScale = 1.12f + ring * 0.28f + bass * (0.18f + ring * 0.08f) + beat * 0.14f
                              val r = discRadius * baseScale
                              val alpha = ((0.14f + bass * 0.42f + beat * 0.35f) * (1f - ring * 0.26f)).coerceIn(0f, 0.85f)
                              if (alpha > 0.02f) {
                                  drawCircle(
                                      color = when (ring) {
                                          0 -> AuraPalette.Cyan.copy(alpha = alpha)
                                          1 -> AuraPalette.Violet.copy(alpha = alpha)
                                          else -> AuraPalette.Rose.copy(alpha = alpha)
                                      },
                                      radius = r,
                                      center = discCenter,
                                      style = Stroke(width = 2.5f + beat * 2.5f)
                                  )
                              }
                          }

                          rotate(degrees = (phase * 36f) % 360f, pivot = discCenter) {
                              drawCircle(
                                  brush = Brush.radialGradient(
                                      colors = listOf(Color(0xFF2D1E5E), Color(0xFF101020), Color(0xFF06060D)),
                                      center = discCenter,
                                      radius = (discRadius * pulse).coerceAtLeast(10f)
                                  ),
                                  radius = discRadius * pulse,
                                  center = discCenter
                              )
                              drawCircle(Color(0x38FFFFFF), radius = discRadius * 0.80f * pulse, center = discCenter, style = Stroke(1.6f))
                              drawCircle(Color(0x3006B6D4), radius = discRadius * 0.60f * pulse, center = discCenter, style = Stroke(1.4f))
                              drawArc(
                                  brush = AuraPalette.PrimaryGradient,
                                  startAngle = -40f,
                                  sweepAngle = 115f,
                                  useCenter = false,
                                  topLeft = Offset(discCenter.x - discRadius * 0.88f * pulse, discCenter.y - discRadius * 0.88f * pulse),
                                  size = Size(discRadius * 1.76f * pulse, discRadius * 1.76f * pulse),
                                  style = Stroke(width = 4.5f + beat * 2f, cap = StrokeCap.Round)
                              )
                              drawCircle(brush = AuraPalette.PrimaryGradient, radius = discRadius * (0.28f + beat * 0.05f), center = discCenter)
                              drawCircle(color = AuraPalette.Obsidian, radius = discRadius * 0.09f, center = discCenter)
                          }

                          val margin = w * 0.06f
                          val usableW = (w - margin * 2f).coerceAtLeast(10f)
                          val step = usableW / bandCount
                          val barW = (step * 0.62f).coerceAtLeast(2f)
                          val maxBarH = (h * 0.30f).coerceAtLeast(16f)
                          val baselineY = h * 0.94f

                          val barBrush = Brush.verticalGradient(
                              colors = listOf(AuraPalette.Cyan, AuraPalette.Violet, AuraPalette.Rose),
                              startY = baselineY - maxBarH,
                              endY = baselineY
                          )

                          for (i in 0 until bandCount) {
                              val level = bands[i].coerceIn(0f, 1f)
                              val barH = (maxBarH * (0.03f + 0.97f * level)).coerceAtLeast(4f)
                              val x = margin + i * step + (step - barW) / 2f

                              drawRoundRect(
                                  brush = barBrush,
                                  topLeft = Offset(x, baselineY - barH),
                                  size = Size(barW, barH),
                                  cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                              )

                              val peakLevel = peaks[i].coerceIn(0f, 1f)
                              if (peakLevel > 0.04f) {
                                  val peakY = baselineY - (maxBarH * (0.03f + 0.97f * peakLevel)) - 5f
                                  drawRoundRect(
                                      color = Color(0xFFE0F2FE).copy(alpha = (0.35f + peakLevel * 0.65f).coerceIn(0f, 1f)),
                                      topLeft = Offset(x, peakY),
                                      size = Size(barW, 3.2f),
                                      cornerRadius = CornerRadius(2f, 2f)
                                  )
                              }
                          }
                      }

                      1 -> {
                          val layers = listOf(
                              Triple(AuraPalette.Cyan, 0, bass),
                              Triple(AuraPalette.Violet, 1, mid),
                              Triple(AuraPalette.Rose, 2, high)
                          )
                          layers.forEach { (color, idx, layerEnergy) ->
                              val path = Path()
                              val steps = 60
                              val maxAmp = h * (0.28f - idx * 0.04f)
                              for (s in 0..steps) {
                                  val t = s.toFloat() / steps
                                  val x = t * w
                                  val envelope = sin(t * PI).toFloat()
                                  val bIdx = ((t * (bandCount - 1)).toInt()).coerceIn(0, bandCount - 1)
                                  val localSpec = bands[bIdx]
                                  val carrier = sin(t * (7f + idx * 3f) + phase * (2.6f + idx * 0.9f) + idx * 1.9f)
                                  val amp = maxAmp * (0.04f + localSpec * 0.65f + layerEnergy * 0.35f + beat * 0.18f)
                                  val y = cy + carrier * amp * envelope
                                  if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                              }
                              drawPath(
                                  path,
                                  color = color.copy(alpha = (0.16f + layerEnergy * 0.22f).coerceIn(0f, 0.5f)),
                                  style = Stroke(width = 16f + beat * 6f, cap = StrokeCap.Round)
                              )
                              drawPath(
                                  path,
                                  color = color.copy(alpha = 0.95f),
                                  style = Stroke(width = 4.2f, cap = StrokeCap.Round)
                              )
                          }
                      }

                      2 -> {
                          val baseR = (minDim * (0.21f + bass * 0.03f)).coerceAtLeast(24f)
                          val maxRay = (minDim * 0.24f).coerceAtLeast(16f)
                          val rays = 54
                          val halfRays = rays / 2

                          for (i in 0 until rays) {
                              val mirrored = if (i < halfRays) i else (rays - 1 - i)
                              val bIdx = ((mirrored.toFloat() / halfRays) * (bandCount - 1)).toInt().coerceIn(0, bandCount - 1)
                              val level = bands[bIdx]
                              val angleRad = (i.toFloat() / rays) * (2f * PI.toFloat()) + phase * 0.18f
                              val rayLen = maxRay * (0.05f + 0.95f * level + beat * 0.10f)

                              val start = Offset(cx + cos(angleRad) * baseR, cy + sin(angleRad) * baseR)
                              val end = Offset(cx + cos(angleRad) * (baseR + rayLen), cy + sin(angleRad) * (baseR + rayLen))
                              val rayColor = when (i % 3) {
                                  0 -> AuraPalette.Cyan
                                  1 -> AuraPalette.Violet
                                  else -> AuraPalette.Rose
                              }
                              drawLine(color = rayColor, start = start, end = end, strokeWidth = 5f, cap = StrokeCap.Round)
                          }

                          val innerPulse = baseR * (0.85f + bass * 0.11f + beat * 0.09f)
                          drawCircle(
                              brush = Brush.radialGradient(
                                  colors = listOf(AuraPalette.Violet, Color(0xFF121226)),
                                  center = Offset(cx, cy),
                                  radius = innerPulse.coerceAtLeast(10f)
                              ),
                              radius = innerPulse,
                              center = Offset(cx, cy)
                          )
                          drawCircle(
                              color = AuraPalette.Cyan.copy(alpha = (0.55f + beat * 0.45f).coerceIn(0f, 1f)),
                              radius = innerPulse,
                              center = Offset(cx, cy),
                              style = Stroke(2.5f + beat * 2f)
                          )
                      }

                      3 -> {
                          val particleCount = 28
                          for (p in 0 until particleCount) {
                              val speed = 0.10f + (p % 5) * 0.04f
                              val life = ((phase * speed + p * 0.137f) % 1f)
                              val px = ((p * 0.371f + sin(phase * 0.5f + p) * 0.04f) % 1f).let { if (it < 0f) it + 1f else it } * w
                              val py = h * (1f - life)
                              val alpha = (sin(life * PI).toFloat() * (0.20f + overall * 0.60f + beat * 0.35f)).coerceIn(0f, 1f)
                              val radius = (2.8f + (p % 4) * 2.0f) * (0.75f + high * 0.45f + beat * 0.35f)
                              val col = when (p % 3) {
                                  0 -> AuraPalette.Cyan
                                  1 -> AuraPalette.Violet
                                  else -> AuraPalette.Rose
                              }
                              drawCircle(col.copy(alpha = alpha * 0.35f), radius = radius * 2.2f, center = Offset(px, py))
                              drawCircle(col.copy(alpha = alpha), radius = radius, center = Offset(px, py))
                          }

                          val margin = w * 0.07f
                          val usableW = (w - margin * 2f).coerceAtLeast(10f)
                          val step = usableW / bandCount
                          val barW = (step * 0.58f).coerceAtLeast(2f)
                          val maxHalf = h * 0.27f

                          val mirrorBrush = Brush.verticalGradient(
                              colors = listOf(AuraPalette.Cyan, AuraPalette.Violet, AuraPalette.Rose, AuraPalette.Violet, AuraPalette.Cyan),
                              startY = cy - maxHalf,
                              endY = cy + maxHalf
                          )

                          for (i in 0 until bandCount) {
                              val level = bands[i].coerceIn(0f, 1f)
                              val halfH = (maxHalf * (0.03f + 0.97f * level)).coerceAtLeast(3.5f)
                              val x = margin + i * step + (step - barW) / 2f
                              drawRoundRect(
                                  brush = mirrorBrush,
                                  topLeft = Offset(x, cy - halfH),
                                  size = Size(barW, halfH * 2f),
                                  cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                              )
                          }
                      }

                      else -> {
                          val center = Offset(cx, h * 0.46f)
                          val voiceEnergy = (mid * 0.65f + overall * 0.35f).coerceIn(0f, 1f)
                          val breathe = 1f + voiceEnergy * 0.09f
                          val pulseScale = (0.95f + beat * 0.06f).coerceIn(0.9f, 1.1f)

                          val haloR = (minDim * 0.46f * breathe).coerceAtLeast(30f)
                          drawCircle(
                              brush = Brush.radialGradient(
                                  colors = listOf(
                                      AuraPalette.Gold.copy(alpha = 0.18f + 0.24f * voiceEnergy),
                                      AuraPalette.EmeraldGlow.copy(alpha = 0.10f + 0.08f * voiceEnergy),
                                      Color.Transparent
                                  ),
                                  center = center,
                                  radius = haloR
                              ),
                              radius = haloR,
                              center = center
                          )

                          val archW = minDim * 0.72f
                          val archTop = (center.y - minDim * 0.42f).coerceAtLeast(8f)
                          val archMid = center.y - minDim * 0.12f
                          val archBottom = (h * 0.90f).coerceAtLeast(center.y + minDim * 0.22f)
                          val archPath = Path().apply {
                              moveTo(cx - archW / 2f, archBottom)
                              lineTo(cx - archW / 2f, archMid)
                              cubicTo(
                                  cx - archW / 2f, archTop + minDim * 0.10f,
                                  cx - archW * 0.16f, archTop + minDim * 0.04f,
                                  cx, archTop
                              )
                              cubicTo(
                                  cx + archW * 0.16f, archTop + minDim * 0.04f,
                                  cx + archW / 2f, archTop + minDim * 0.10f,
                                  cx + archW / 2f, archMid
                              )
                              lineTo(cx + archW / 2f, archBottom)
                          }
                          drawPath(
                              path = archPath,
                              color = AuraPalette.Gold.copy(alpha = 0.14f + 0.12f * voiceEnergy),
                              style = Stroke(width = 8f, cap = StrokeCap.Round)
                          )
                          drawPath(
                              path = archPath,
                              color = AuraPalette.GoldLight.copy(alpha = 0.30f + 0.25f * voiceEnergy),
                              style = Stroke(width = 2f, cap = StrokeCap.Round)
                          )

                          for (p in 0 until 22) {
                              val speed = 0.042f + (p % 4) * 0.015f
                              val life = ((phase * speed + p * 0.173f) % 1f)
                              val px = ((p * 0.419f + sin(phase * 0.30f + p) * 0.03f) % 1f).let { if (it < 0f) it + 1f else it } * w
                              val py = h * (0.95f - life * 0.88f)
                              val alpha = (sin(life * PI).toFloat() * (0.18f + 0.55f * voiceEnergy)).coerceIn(0f, 1f)
                              val r = 2.2f + (p % 3) * 1.4f
                              drawCircle(AuraPalette.Gold.copy(alpha = alpha * 0.35f), radius = r * 2.6f, center = Offset(px, py))
                              drawCircle(AuraPalette.GoldLight.copy(alpha = alpha), radius = r, center = Offset(px, py))
                          }

                          val s = (minDim * 0.17f * breathe * pulseScale).coerceAtLeast(30f)
                          val cyOffset = -s * 0.18f
                          val base = Offset(cx, center.y + cyOffset)

                          val roofTop = Offset(cx, base.y - s * 1.55f)
                          val roofLeft = Offset(cx - s * 0.98f, base.y - s * 0.94f)
                          val roofRight = Offset(cx + s * 0.98f, base.y - s * 0.94f)
                          val roofCenter = Offset(cx, base.y - s * 0.33f)

                          val botLeft = Offset(cx - s * 0.98f, base.y + s * 0.48f)
                          val botCenter = Offset(cx, base.y + s * 1.10f)
                          val botRight = Offset(cx + s * 0.98f, base.y + s * 0.48f)

                          fun getFacePt(u: Float, v: Float, tL: Offset, tR: Offset, bL: Offset, bR: Offset): Offset {
                              val t = Offset(tL.x + u * (tR.x - tL.x), tL.y + u * (tR.y - tL.y))
                              val b = Offset(bL.x + u * (bR.x - bL.x), bL.y + u * (bR.y - bL.y))
                              return Offset(t.x + v * (b.x - t.x), t.y + v * (b.y - t.y))
                          }

                          val botCenterExt = getFacePt(0f, 1.08f, roofCenter, roofRight, botCenter, botRight)

                          val marbleBaseLeft = Path().apply {
                              moveTo(botLeft.x - 8f, botLeft.y - 2f)
                              lineTo(botCenter.x, botCenter.y + 12f)
                              lineTo(botCenterExt.x, botCenterExt.y + 16f)
                              lineTo(botLeft.x - 12f, botLeft.y + 6f)
                          }
                          val marbleBaseRight = Path().apply {
                              moveTo(botCenter.x, botCenter.y + 12f)
                              lineTo(botRight.x + 8f, botRight.y - 2f)
                              lineTo(botRight.x + 12f, botRight.y + 6f)
                              lineTo(botCenterExt.x, botCenterExt.y + 16f)
                          }
                          drawPath(marbleBaseLeft, Color.White.copy(alpha = 0.85f))
                          drawPath(marbleBaseRight, Color(0xFFE2E8F0).copy(alpha = 0.85f))

                          val roofPath = Path().apply {
                              moveTo(roofTop.x, roofTop.y)
                              lineTo(roofLeft.x, roofLeft.y)
                              lineTo(roofCenter.x, roofCenter.y)
                              lineTo(roofRight.x, roofRight.y)
                          }
                          drawPath(roofPath, Brush.linearGradient(listOf(Color(0xFF1E1E1E), Color(0xFF0F0F0F))))

                          val leftFacePath = Path().apply {
                              moveTo(roofLeft.x, roofLeft.y)
                              lineTo(roofCenter.x, roofCenter.y)
                              lineTo(botCenter.x, botCenter.y)
                              lineTo(botLeft.x, botLeft.y)
                          }
                          drawPath(leftFacePath, Brush.linearGradient(listOf(Color(0xFF131317), Color(0xFF07070B), Color(0xFF031411))))

                          val rightFacePath = Path().apply {
                              moveTo(roofCenter.x, roofCenter.y)
                              lineTo(roofRight.x, roofRight.y)
                              lineTo(botRight.x, botRight.y)
                              lineTo(botCenter.x, botCenter.y)
                          }
                          drawPath(rightFacePath, Brush.linearGradient(listOf(Color(0xFF1B1B1F), Color(0xFF0C0C0E), Color(0xFF030D0A))))

                          val hL1 = getFacePt(0f, 0.10f, roofLeft, roofCenter, botLeft, botCenter)
                          val hC1 = getFacePt(1f, 0.10f, roofLeft, roofCenter, botLeft, botCenter)
                          val hC2 = getFacePt(1f, 0.22f, roofLeft, roofCenter, botLeft, botCenter)
                          val hL2 = getFacePt(0f, 0.22f, roofLeft, roofCenter, botLeft, botCenter)
                          val leftBand = Path().apply {
                              moveTo(hL1.x, hL1.y)
                              lineTo(hC1.x, hC1.y)
                              lineTo(hC2.x, hC2.y)
                              lineTo(hL2.x, hL2.y)
                          }
                          drawPath(leftBand, AuraPalette.GoldGradient)

                          val hR1 = getFacePt(1f, 0.10f, roofCenter, roofRight, botCenter, botRight)
                          val hR2 = getFacePt(1f, 0.22f, roofCenter, roofRight, botCenter, botRight)
                          val rightBand = Path().apply {
                              moveTo(hC1.x, hC1.y)
                              lineTo(hR1.x, hR1.y)
                              lineTo(hR2.x, hR2.y)
                              lineTo(hC2.x, hC2.y)
                          }
                          drawPath(rightBand, AuraPalette.GoldGradient)

                          for (st in 0..14) {
                              val pL = getFacePt(st.toFloat() / 14f, 0.16f, roofLeft, roofCenter, botLeft, botCenter)
                              val pR = getFacePt(st.toFloat() / 14f, 0.16f, roofCenter, roofRight, botCenter, botRight)
                              drawCircle(Color(0xFF451A03).copy(alpha = 0.5f), radius = 1.2f, center = pL)
                              drawCircle(Color(0xFF451A03).copy(alpha = 0.5f), radius = 1.2f, center = pR)
                          }

                          val doorTL = getFacePt(0.20f, 0.35f, roofCenter, roofRight, botCenter, botRight)
                          val doorTR = getFacePt(0.48f, 0.35f, roofCenter, roofRight, botCenter, botRight)
                          val doorBR = getFacePt(0.48f, 0.88f, roofCenter, roofRight, botCenter, botRight)
                          val doorBL = getFacePt(0.20f, 0.88f, roofCenter, roofRight, botCenter, botRight)
                          val doorPath = Path().apply {
                              moveTo(doorTL.x, doorTL.y)
                              lineTo(doorTR.x, doorTR.y)
                              lineTo(doorBR.x, doorBR.y)
                              lineTo(doorBL.x, doorBL.y)
                          }
                          drawPath(doorPath, Brush.verticalGradient(listOf(AuraPalette.GoldLight, AuraPalette.Gold, Color(0xFF78350F))))
                          drawPath(doorPath, AuraPalette.GoldLight, style = Stroke(1.8f))

                          val curtainTL = getFacePt(0.18f, 0.25f, roofCenter, roofRight, botCenter, botRight)
                          val curtainTR = getFacePt(0.50f, 0.25f, roofCenter, roofRight, botCenter, botRight)
                          val curtainBR = getFacePt(0.50f, 0.35f, roofCenter, roofRight, botCenter, botRight)
                          val curtainBL = getFacePt(0.18f, 0.35f, roofCenter, roofRight, botCenter, botRight)
                          val curtainPath = Path().apply {
                              moveTo(curtainTL.x, curtainTL.y)
                              lineTo(curtainTR.x, curtainTR.y)
                              lineTo(curtainBR.x, curtainBR.y)
                              lineTo(curtainBL.x, curtainBL.y)
                          }
                          drawPath(curtainPath, AuraPalette.GoldGradient)
                          drawPath(curtainPath, Color(0xFFFCD34D), style = Stroke(1f))

                          val blackStoneAnchor = getFacePt(0.96f, 0.94f, roofLeft, roofCenter, botLeft, botCenter)
                          drawCircle(
                              brush = Brush.radialGradient(listOf(Color.White, Color(0xFF708090), Color.Transparent)),
                              radius = s * 0.09f,
                              center = blackStoneAnchor
                          )
                          drawCircle(
                              color = Color(0xFF1A1A1A),
                              radius = s * 0.04f,
                              center = blackStoneAnchor
                          )

                          val baseTrimPathLeft = Path().apply {
                              moveTo(botLeft.x, botLeft.y)
                              lineTo(botCenter.x, botCenter.y)
                          }
                          val baseTrimPathRight = Path().apply {
                              moveTo(botCenter.x, botCenter.y)
                              lineTo(botRight.x, botRight.y)
                          }
                          drawPath(baseTrimPathLeft, AuraPalette.GoldGradient, style = Stroke(1.5f))
                          drawPath(baseTrimPathRight, AuraPalette.GoldGradient, style = Stroke(1.5f))

                          val baseWaveY = h * 0.88f
                          for (layer in 0..1) {
                              val path = Path()
                              val steps = 56
                              val maxAmp = h * (if (layer == 0) 0.055f else 0.038f)
                              val spd = if (layer == 0) 1.2f else 1.7f
                              for (s in 0..steps) {
                                  val t = s.toFloat() / steps
                                  val x = t * w
                                  val env = sin(t * PI).toFloat()
                                  val vocalBin = (4 + (t * 18f).toInt()).coerceIn(0, bandCount - 1)
                                  val vocalAmp = (0.08f + bands[vocalBin] * 0.92f)
                                  val y = baseWaveY + sin(t * 7f + phase * spd + layer * 2.1f) * maxAmp * vocalAmp * env
                                  if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                              }
                              drawPath(
                                  path = path,
                                  color = if (layer == 0) AuraPalette.Gold.copy(alpha = 0.35f + 0.35f * voiceEnergy)
                                  else AuraPalette.EmeraldGlow.copy(alpha = 0.25f + 0.30f * voiceEnergy),
                                  style = Stroke(width = if (layer == 0) 3f else 2f, cap = StrokeCap.Round)
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun MiniEqualizerBars(
              clock: VisualizerClock,
              tintPrimary: Color = AuraPalette.Cyan,
              tintSecondary: Color = AuraPalette.Violet,
              modifier: Modifier = Modifier.size(width = 20.dp, height = 16.dp)
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 1f || h <= 1f) return@Canvas
                  @Suppress("UNUSED_VARIABLE")
                  val tick = clock.frameTick
                  val levels = floatArrayOf(clock.bass, clock.mid, clock.high, clock.overall)
                  val bars = 4
                  val step = w / bars
                  val barW = step * 0.58f
                  for (i in 0 until bars) {
                      val barH = h * (0.14f + 0.86f * levels[i].coerceIn(0f, 1f))
                      val x = i * step + (step - barW) / 2f
                      drawRoundRect(
                          color = if (i % 2 == 0) tintPrimary else tintSecondary,
                          topLeft = Offset(x, h - barH),
                          size = Size(barW, barH),
                          cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                      )
                  }
              }
          }

          @Composable
          fun GradientActionButton(text: String, onClick: () -> Unit) {
              var isFocused by remember { mutableStateOf(false) }
              val shape = RoundedCornerShape(16.dp)
              Box(
                  modifier = Modifier
                      .clip(shape)
                      .background(AuraPalette.PrimaryGradient)
                      .border(if (isFocused) 2.dp else 0.dp, Color.White, shape)
                      .onFocusChanged { isFocused = it.isFocused }
                      .clickable(onClick = onClick)
                      .padding(horizontal = 22.dp, vertical = 12.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Text(text, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
              }
          }

          @Composable
          fun AuraIconButton(
              icon: ImageVector,
              contentDescription: String,
              onClick: () -> Unit,
              tint: Color = Color.White,
              gradient: Boolean = false,
              gradientBrush: Brush = AuraPalette.PrimaryGradient,
              glass: Boolean = false,
              size: Int = 44,
              modifier: Modifier = Modifier
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (isFocused) 1.12f else 1f, label = "btnScale")

              val bgModifier = when {
                  gradient -> Modifier.background(gradientBrush)
                  isFocused -> Modifier.background(Color(0x3806B6D4))
                  glass -> Modifier.background(Color(0x18FFFFFF))
                  else -> Modifier.background(Color.Transparent)
              }
              val borderColor = when {
                  isFocused -> AuraPalette.Cyan
                  glass -> AuraPalette.GlassBorder
                  else -> Color.Transparent
              }

              IconButton(
                  onClick = onClick,
                  modifier = modifier
                      .scale(scale)
                      .size(size.dp)
                      .clip(CircleShape)
                      .then(bgModifier)
                      .border(if (isFocused) 2.dp else 1.dp, borderColor, CircleShape)
                      .onFocusChanged { isFocused = it.isFocused }
              ) {
                  Icon(
                      icon,
                      contentDescription = contentDescription,
                      tint = if (gradient) Color.White else tint,
                      modifier = Modifier.size((size * 0.50f).dp)
                  )
              }
          }

          private fun formatTime(ms: Long): String {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val min = totalSec / 60
              val sec = totalSec % 60
              return String.format(Locale.US, "%d:%02d", min, sec)
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build Universal APK (Phone + Android TV)
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PulsePlayer-Universal-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
