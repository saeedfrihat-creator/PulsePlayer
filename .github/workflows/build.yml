                  val sessionToken = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  controllerFuture = MediaController.Builder(this, sessionToken).buildAsync()
                  controllerFuture?.addListener({
                      playerState.value = controllerFuture?.get()
                  }, ContextCompat.getMainExecutor(this))
              }

              override fun onResume() {
                  super.onResume()
                  isResumedState.value = true
                  PlaybackBridge.setVisualizerActive(true)
              }

              override fun onPause() {
                  isResumedState.value = false
                  PlaybackBridge.setVisualizerActive(false)
                  super.onPause()
              }

              override fun onStop() {
                  controllerFuture?.let { MediaController.releaseFuture(it) }
                  controllerFuture = null
                  playerState.value = null
                  super.onStop()
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_MEDIA_STOP -> {
                              PlaybackBridge.stopPlayback(stopService = false)
                              Toast.makeText(this, getString(R.string.toast_stopped), Toast.LENGTH_SHORT).show()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                              playerState.value?.let { if (it.isPlaying) it.pause() else it.play() }
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PAUSE -> {
                              playerState.value?.pause()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PLAY -> {
                              playerState.value?.play()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_NEXT -> {
                              playerState.value?.let { it.seekToNext(); it.play() }
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS -> {
                              playerState.value?.let { it.seekToPrevious(); it.play() }
                              return true
                          }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

