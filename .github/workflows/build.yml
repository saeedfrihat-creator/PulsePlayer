          package com.pulse.player

          import android.content.Context
          import android.net.Uri
          import androidx.annotation.OptIn
          import androidx.media3.common.C
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.datasource.BaseDataSource
          import androidx.media3.datasource.DataSource
          import androidx.media3.datasource.DataSourceException
          import androidx.media3.datasource.DataSpec
          import androidx.media3.datasource.DefaultDataSource
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.datasource.TransferListener
          import com.hierynomus.msdtyp.AccessMask
          import com.hierynomus.mssmb2.SMB2CreateDisposition
          import com.hierynomus.mssmb2.SMB2ShareAccess
          import com.hierynomus.smbj.SMBClient
          import com.hierynomus.smbj.SmbConfig
          import com.hierynomus.smbj.auth.AuthenticationContext
          import com.hierynomus.smbj.connection.Connection
          import com.hierynomus.smbj.session.Session
          import com.hierynomus.smbj.share.DiskShare
          import com.hierynomus.smbj.share.File as SmbFile
          import java.io.IOException
          import java.util.EnumSet
          import java.util.concurrent.TimeUnit

          data class SmbConnectionConfig(
              val host: String,
              val share: String,
              val subFolder: String,
              val user: String,
              val pass: String
          )

          object SmbHelper {
              const val SMB_SCHEME = "pulsesmb"

              fun loadConfig(context: Context): SmbConnectionConfig {
                  val prefs = context.getSharedPreferences("homelab_prefs", Context.MODE_PRIVATE)
                  return normalizeConfig(
                      rawHost = prefs.getString("smb_host", "") ?: "",
                      rawShare = prefs.getString("smb_share", "") ?: "",
                      rawSubFolder = prefs.getString("smb_subfolder", "") ?: "",
                      rawUser = prefs.getString("smb_user", "") ?: "",
                      rawPass = prefs.getString("smb_pass", "") ?: ""
                  )
              }

              fun normalizeConfig(
                  rawHost: String,
                  rawShare: String,
                  rawSubFolder: String,
                  rawUser: String,
                  rawPass: String
              ): SmbConnectionConfig {
                  var cleanedHost = rawHost.trim()
                      .removePrefix("smb://")
                      .removePrefix("http://")
                      .removePrefix("https://")
                      .replace('\\', '/')
                      .trim('/')

                  var cleanedShare = rawShare.trim().replace('\\', '/').trim('/')
                  var cleanedSub = rawSubFolder.trim().replace('\\', '/').trim('/')

                  if (cleanedHost.contains('/')) {
                      val parts = cleanedHost.split('/').filter { it.isNotBlank() }
                      if (parts.isNotEmpty()) {
                          cleanedHost = parts[0]
                          if (cleanedShare.isBlank() && parts.size >= 2) {
                              cleanedShare = parts[1]
                              if (cleanedSub.isBlank() && parts.size >= 3) {
                                  cleanedSub = parts.drop(2).joinToString("/")
                              }
                          }
                      }
                  }

                  if (cleanedShare.contains('/')) {
                      val parts = cleanedShare.split('/').filter { it.isNotBlank() }
                      cleanedShare = parts.firstOrNull() ?: ""
                      val extraSub = parts.drop(1).joinToString("/")
                      cleanedSub = listOf(extraSub, cleanedSub).filter { it.isNotBlank() }.joinToString("/")
                  }

                  return SmbConnectionConfig(
                      host = cleanedHost,
                      share = cleanedShare,
                      subFolder = cleanedSub.replace('/', '\\'),
                      user = rawUser.trim(),
                      pass = rawPass
                  )
              }

              fun createClient(): SMBClient {
                  val cfg = SmbConfig.builder()
                      .withTimeout(15, TimeUnit.SECONDS)
                      .withSoTimeout(25, TimeUnit.SECONDS)
                      .withMultiProtocolNegotiate(true)
                      .build()
                  return SMBClient(cfg)
              }

              fun connect(client: SMBClient, hostWithOptionalPort: String): Connection {
                  val hostParts = hostWithOptionalPort.split(':')
                  return if (hostParts.size == 2 && hostParts[1].toIntOrNull() != null) {
                      client.connect(hostParts[0], hostParts[1].toInt())
                  } else {
                      client.connect(hostWithOptionalPort)
                  }
              }

              fun authenticate(connection: Connection, user: String, pass: String): Session {
                  if (user.isNotBlank()) {
                      return connection.authenticate(
                          AuthenticationContext(user, pass.toCharArray(), "")
                      )
                  }
                  return runCatching {
                      connection.authenticate(AuthenticationContext.guest())
                  }.getOrElse {
                      connection.authenticate(AuthenticationContext.anonymous())
                  }
              }

              fun buildStreamUri(smbRelativePath: String, fileName: String): String {
                  return Uri.Builder()
                      .scheme(SMB_SCHEME)
                      .authority("stream")
                      .appendPath(fileName)
                      .appendQueryParameter("path", smbRelativePath)
                      .build()
                      .toString()
              }
          }

          @OptIn(UnstableApi::class)
          class SmbDataSource(private val context: Context) : BaseDataSource(true) {
              private var client: SMBClient? = null
              private var connection: Connection? = null
              private var session: Session? = null
              private var share: DiskShare? = null
              private var smbFile: SmbFile? = null
              private var currentUri: Uri? = null
              private var currentPos: Long = 0L
              private var bytesRemaining: Long = 0L
              private var opened: Boolean = false

              override fun open(dataSpec: DataSpec): Long {
                  transferInitializing(dataSpec)
                  currentUri = dataSpec.uri
                  val smbPath = dataSpec.uri.getQueryParameter("path")
                      ?: throw IOException("Missing SMB file path")

                  val cfg = SmbHelper.loadConfig(context)
                  if (cfg.host.isBlank() || cfg.share.isBlank()) {
                      throw IOException("SMB server settings are incomplete")
                  }

                  try {
                      val c = SmbHelper.createClient()
                      client = c
                      val conn = SmbHelper.connect(c, cfg.host)
                      connection = conn
                      val sess = SmbHelper.authenticate(conn, cfg.user, cfg.pass)
                      session = sess
                      val sh = sess.connectShare(cfg.share) as? DiskShare
                          ?: throw IOException("Share '${cfg.share}' is not a DiskShare")
                      share = sh
                      val file = sh.openFile(
                          smbPath,
                          EnumSet.of(AccessMask.GENERIC_READ),
                          null,
                          SMB2ShareAccess.ALL,
                          SMB2CreateDisposition.FILE_OPEN,
                          null
                      )
                      smbFile = file

                      val fileLength = file.fileInformation.standardInformation.endOfFile
                      if (dataSpec.position > fileLength) {
                          throw DataSourceException(PlaybackException.ERROR_CODE_IO_READ_POSITION_OUT_OF_RANGE)
                      }

                      currentPos = dataSpec.position
                      val remainingInFile = fileLength - currentPos
                      bytesRemaining = if (dataSpec.length != C.LENGTH_UNSET.toLong()) {
                          minOf(remainingInFile, dataSpec.length)
                      } else {
                          remainingInFile
                      }

                      opened = true
                      transferStarted(dataSpec)
                      return bytesRemaining
                  } catch (e: Exception) {
                      close()
                      if (e is IOException) throw e
                      throw IOException("SMB open error: ${e.message}", e)
                  }
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  if (length == 0) return 0
                  if (bytesRemaining <= 0L) return C.RESULT_END_OF_INPUT

                  val file = smbFile ?: return C.RESULT_END_OF_INPUT
                  val toRead = minOf(length.toLong(), bytesRemaining).toInt()

                  val bytesRead = try {
                      file.read(buffer, currentPos, offset, toRead)
                  } catch (e: Exception) {
                      throw IOException("SMB read error: ${e.message}", e)
                  }

                  if (bytesRead <= 0) {
                      return C.RESULT_END_OF_INPUT
                  }

                  currentPos += bytesRead
                  bytesRemaining -= bytesRead
                  bytesTransferred(bytesRead)
                  return bytesRead
              }

              override fun getUri(): Uri? = currentUri

              override fun close() {
                  currentUri = null
                  runCatching { smbFile?.close() }
                  smbFile = null
                  runCatching { share?.close() }
                  share = null
                  runCatching { session?.close() }
                  session = null
                  runCatching { connection?.close() }
                  connection = null
                  runCatching { client?.close() }
                  client = null
                  if (opened) {
                      opened = false
                      transferEnded()
                  }
              }
          }

          @OptIn(UnstableApi::class)
          class PulseDataSourceFactory(private val context: Context) : DataSource.Factory {
              private val httpFactory = DefaultHttpDataSource.Factory()
                  .setConnectTimeoutMs(20_000)
                  .setReadTimeoutMs(30_000)
                  .setAllowCrossProtocolRedirects(true)
              private val defaultFactory = DefaultDataSource.Factory(context, httpFactory)

              override fun createDataSource(): DataSource {
                  return RoutingDataSource(
                      smbSource = SmbDataSource(context),
                      defaultSource = defaultFactory.createDataSource()
                  )
              }
          }

          @OptIn(UnstableApi::class)
          private class RoutingDataSource(
              private val smbSource: DataSource,
              private val defaultSource: DataSource
          ) : DataSource {
              private var activeSource: DataSource? = null

              override fun addTransferListener(transferListener: TransferListener) {
                  smbSource.addTransferListener(transferListener)
                  defaultSource.addTransferListener(transferListener)
              }

              override fun open(dataSpec: DataSpec): Long {
                  val target = if (dataSpec.uri.scheme == SmbHelper.SMB_SCHEME) smbSource else defaultSource
                  activeSource = target
                  return target.open(dataSpec)
              }

              override fun read(buffer: ByteArray, offset: Int, length: Int): Int {
                  return activeSource?.read(buffer, offset, length) ?: C.RESULT_END_OF_INPUT
              }

              override fun getUri(): Uri? = activeSource?.uri

              override fun getResponseHeaders(): Map<String, List<String>> {
                  return activeSource?.responseHeaders ?: emptyMap()
              }

              override fun close() {
                  try {
                      activeSource?.close()
                  } finally {
                      activeSource = null
                  }
              }
          }
