                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val albumCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          val nameCol = cursor.getColumnIndex(MediaStore.Audio.Media.DISPLAY_NAME)
                          val pathCol = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              cursor.getColumnIndex(MediaStore.Audio.Media.RELATIVE_PATH)
                          } else {
                              @Suppress("DEPRECATION")
                              cursor.getColumnIndex(MediaStore.Audio.Media.DATA)
                          }

                          while (cursor.moveToNext()) {
                              val displayName = if (nameCol >= 0) cursor.getString(nameCol) ?: "" else ""
                              if (!isPlayableName(displayName)) continue

                              val id = cursor.getLong(idCol)
                              val uri = ContentUris.withAppendedId(
                                  MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id
                              ).toString()
                              val rawPath = if (pathCol >= 0) cursor.getString(pathCol) ?: "" else ""
                              val folderName = cleanLocalFolder(context, rawPath)
                              songs.add(
                                  SongItem(
                                      id = "local_$id",
                                      title = cursor.getString(titleCol) ?: untitled,
                                      artist = cursor.getString(artistCol)?.takeIf { it != "<unknown>" } ?: unknownArtist,
                                      album = cursor.getString(albumCol) ?: "",
                                      folder = folderName,
                                      durationMs = cursor.getLong(durCol),
                                      uri = uri,
                                      isRemote = false
                                  )
                              )
                          }
                      }
                  }

                  if (songs.isEmpty()) {
                      songs.addAll(scanFallbackFolders(context))
                  }
                  songs
              }

              /**
               * Same folder key on every Android version: the path relative to the storage root,
               * e.g. "Music/Quran/Alafasy". (Older versions used only the last segment, which merged
               * different folders that shared a name.)
               */
              private fun cleanLocalFolder(context: Context, rawPath: String): String {
                  val rootFallback = context.getString(R.string.root_folder)
                  val normalized = rawPath.replace('\\', '/').trim('/')
                  if (normalized.isBlank()) return rootFallback
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) return normalized

                  val parent = File(rawPath).parentFile ?: return rootFallback
                  @Suppress("DEPRECATION")
                  val storageRoot = Environment.getExternalStorageDirectory().absolutePath.trimEnd('/')
                  val parentPath = parent.absolutePath
                  val relative = if (parentPath.startsWith("$storageRoot/")) {
                      parentPath.substring(storageRoot.length + 1)
                  } else {
                      parent.name
                  }
                  return relative.trim('/').ifBlank { rootFallback }
              }

              private fun scanFallbackFolders(context: Context): List<SongItem> {
                  val localFallback = context.getString(R.string.local_folder)
                  @Suppress("DEPRECATION")
                  val storageRoot = Environment.getExternalStorageDirectory().absolutePath.trimEnd('/')
                  val dirs = listOfNotNull(
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MUSIC),
                      Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                  )
                  val found = mutableListOf<SongItem>()
                  dirs.forEach { dir ->
                      runCatching {
                          if (dir.exists() && dir.isDirectory) {
                              dir.walkTopDown().maxDepth(4).forEach { file ->
                                  if (file.isFile && file.extension.lowercase() in PLAYABLE_AUDIO_EXTENSIONS) {
                                      val parentPath = file.parentFile?.absolutePath ?: ""
                                      val folderName = if (parentPath.startsWith("$storageRoot/")) {
                                          parentPath.substring(storageRoot.length + 1)
                                      } else {
                                          file.parentFile?.name ?: localFallback
                                      }
                                      found.add(
                                          SongItem(
                                              id = "file_${file.absolutePath.hashCode()}",
                                              title = file.nameWithoutExtension,
                                              artist = file.parentFile?.name ?: localFallback,
                                              album = "",
                                              folder = folderName.ifBlank { localFallback },
                                              durationMs = 0L,
                                              uri = Uri.fromFile(file).toString(),
                                              isRemote = false
                                          )
                                      )
                                  }
                              }
                          }
                      }
                  }
                  return found.sortedBy { it.title.lowercase() }
              }

              suspend fun loadSmbSongs(context: Context, source: LibrarySource): Result<List<SongItem>> =
                  withContext(Dispatchers.IO) {
                      runCatching {
                          val cfg = SmbHelper.configFrom(source)
                          if (cfg.host.isBlank() || cfg.share.isBlank()) {
                              throw IOException(context.getString(R.string.error_smb_settings_incomplete))
                          }
                          val rootLabel = context.getString(R.string.root_folder)
                          val found = mutableListOf<SongItem>()

                          SmbHelper.createClient().use { client ->
                              SmbHelper.connect(client, cfg.host).use { conn ->
                                  SmbHelper.authenticate(conn, cfg.user, cfg.pass).use { session ->
                                      val diskShare = session.connectShare(cfg.share) as? DiskShare
                                          ?: throw IOException(context.getString(R.string.error_share_not_found, cfg.share))
                                      diskShare.use { share ->
                                          walkSmbDirectory(
                                              sourceId = source.id,
                                              share = share,
                                              currentDir = cfg.subFolder,
                                              baseDir = cfg.subFolder,
                                              rootLabel = rootLabel,
                                              depth = 0,
                                              out = found
                                          )
                                      }
                                  }
                              }
                          }
                          found
                      }
                  }

              private fun walkSmbDirectory(
                  sourceId: String,
                  share: DiskShare,
                  currentDir: String,
                  baseDir: String,
                  rootLabel: String,
                  depth: Int,
                  out: MutableList<SongItem>
              ) {
                  if (depth > 6 || out.size >= 20000) return
                  val entries = runCatching { share.list(currentDir) }.getOrElse {
                      if (depth == 0) throw it else return
                  }

                  val displayFolder = extractSmbDisplayFolder(currentDir, baseDir, rootLabel)

                  for (entry in entries) {
                      val name = entry.fileName ?: continue
                      if (name == "." || name == ".." || name.startsWith(".") || name.startsWith("@") || name == "#recycle") continue

                      val childPath = if (currentDir.isBlank()) name else "$currentDir\\$name"
                      val isDir = (entry.fileAttributes and 0x10L) != 0L

                      if (isDir) {
                          walkSmbDirectory(sourceId, share, childPath, baseDir, rootLabel, depth + 1, out)
                      } else {
                          val ext = name.substringAfterLast('.', "").lowercase()
                          if (ext in PLAYABLE_AUDIO_EXTENSIONS) {
                              val title = name.substringBeforeLast('.', name)
                              val streamUri = SmbHelper.buildStreamUri(sourceId, childPath, name)
                              out.add(
                                  SongItem(
                                      id = "smb_${sourceId}_${childPath.hashCode()}",
                                      title = title,
                                      artist = displayFolder.substringAfterLast('/'),
                                      album = displayFolder,
                                      folder = displayFolder,
                                      durationMs = 0L,
                                      uri = streamUri,
                                      isRemote = true,
                                      sourceId = sourceId
                                  )
                              )
                              if (out.size >= 20000) return
                          }
                      }
                  }
              }

              private fun extractSmbDisplayFolder(currentDir: String, baseDir: String, rootLabel: String): String {
                  val normCurrent = currentDir.replace('\\', '/').trim('/')
                  val normBase = baseDir.replace('\\', '/').trim('/')
                  val relative = when {
                      normCurrent.isBlank() -> ""
                      normBase.isBlank() -> normCurrent
                      normCurrent.equals(normBase, ignoreCase = true) -> ""
                      normCurrent.startsWith("$normBase/", ignoreCase = true) ->
                          normCurrent.substring(normBase.length + 1)
                      else -> normCurrent
                  }
                  return relative.ifBlank { rootLabel }
              }

              suspend fun loadNavidromeSongs(context: Context, source: LibrarySource): Result<List<SongItem>> =
                  withContext(Dispatchers.IO) {
                      runCatching {
                          val untitled = context.getString(R.string.untitled)
                          val loginFailed = context.getString(R.string.login_failed)
                          val baseUrl = NavidromeHelper.normalizeUrl(source.navUrl)

                          val allSongs = mutableListOf<SongItem>()
                          val pageSize = 500
                          var offset = 0

                          while (offset < 20000) {
                              val authParams = NavidromeHelper.authParams(source.navUser, source.navPass)
                              val apiUrl = "$baseUrl/rest/search3.view?query=&songCount=$pageSize&songOffset=$offset" +
                                  "&albumCount=0&artistCount=0&$authParams&f=json"
                              val conn = (URL(apiUrl).openConnection() as HttpURLConnection).apply {
                                  requestMethod = "GET"
                                  connectTimeout = 8000
                                  readTimeout = 20000
                              }

                              val body = try {
                                  val code = conn.responseCode
                                  if (code !in 200..299) throw IOException("HTTP $code")
                                  conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                              } finally {
                                  conn.disconnect()
                              }

                              val subsonic = JSONObject(body).getJSONObject("subsonic-response")
                              if (subsonic.optString("status") != "ok") {
                                  val errMsg = subsonic.optJSONObject("error")?.optString("message")
                                      ?.takeIf { it.isNotBlank() } ?: loginFailed
                                  throw IOException(errMsg)
                              }

                              val songArray = subsonic.optJSONObject("searchResult3")?.optJSONArray("song")
                              if (songArray == null || songArray.length() == 0) break

                              for (i in 0 until songArray.length()) {
                                  val obj = songArray.getJSONObject(i)
                                  val songId = obj.getString("id")
                                  val rawPath = obj.optString("path", "").replace('\\', '/').trim('/')
                                  val album = obj.optString("album", "")
                                  val folderName = extractRemoteFolder(context, rawPath, album)
                                  val fileNameTitle = rawPath.substringAfterLast('/').substringBeforeLast('.')
                                  val title = obj.optString("title", "").ifBlank {
                                      fileNameTitle.ifBlank { untitled }
                                  }
                                  val artist = obj.optString("artist", "").ifBlank { folderName.substringAfterLast('/') }
                                  val coverArtId = obj.optString("coverArt", "")

                                  allSongs.add(
                                      SongItem(
                                          id = "nav_${source.id}_$songId",
                                          title = title,
                                          artist = artist,
                                          album = album,
                                          folder = folderName,
                                          durationMs = obj.optLong("duration", 0L) * 1000L,
                                          uri = NavidromeHelper.songUri(source.id, songId),
                                          isRemote = true,
                                          sourceId = source.id,
                                          coverArtId = coverArtId
                                      )
                                  )
                              }

                              if (songArray.length() < pageSize) break
                              offset += pageSize
                          }
                          allSongs
                      }
                  }

              private fun extractRemoteFolder(context: Context, rawPath: String, fallbackAlbum: String): String {
                  val rootFallback = context.getString(R.string.root_folder)
                  if (rawPath.isNotBlank()) {
                      val parentPath = rawPath.substringBeforeLast('/', "")
                      return if (parentPath.isNotBlank()) parentPath else rootFallback
                  }
                  return fallbackAlbum.ifBlank { rootFallback }
              }
          }
