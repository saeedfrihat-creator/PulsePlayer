          @Composable
          fun SettingsScreen(
              vm: PulseViewModel,
              isTv: Boolean,
              onBack: () -> Unit,
              onAddDevice: () -> Unit,
              onAddNetwork: () -> Unit,
              onEditNetwork: (String) -> Unit
          ) {
              var pendingRemoval by remember { mutableStateOf<LibrarySource?>(null) }
              var showEqDialog by remember { mutableStateOf(false) }
              val context = LocalContext.current
              val version = remember {
                  runCatching { context.packageManager.getPackageInfo(context.packageName, 0).versionName }.getOrNull() ?: ""
              }
              val hasDevice = vm.sources.any { it.type == SourceType.DEVICE }

              ScreenScaffold(title = stringResource(R.string.settings), isTv = isTv, onBack = onBack) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(bottom = 32.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      SectionTitle(stringResource(R.string.libraries_title), modifier = Modifier.padding(top = 8.dp))
                      if (vm.sources.isEmpty()) {
                          Text(stringResource(R.string.no_libraries_yet), color = Pal.Muted, fontSize = 14.sp)
                      }
                      vm.sources.forEach { source ->
                          val folderCount = vm.rawFolders.count { it.sourceId == source.id }
                          LibraryRow(
                              source = source,
                              folderCount = folderCount,
                              isLoading = source.id in vm.loadingSources,
                              error = vm.sourceErrors[source.id],
                              onEdit = {
                                  if (source.type == SourceType.DEVICE) onAddDevice() else onEditNetwork(source.id)
                              },
                              onRefresh = { vm.refreshSource(source, force = true) },
                              onRemove = { pendingRemoval = source }
                          )
                      }

                      Text(
                          stringResource(R.string.add_folder),
                          fontSize = 14.sp,
                          color = Pal.Muted,
                          modifier = Modifier.padding(top = 10.dp)
                      )
                      val deviceButton: @Composable (Modifier) -> Unit = { mod ->
                          AddSourceButton(
                              icon = if (isTv) Icons.Rounded.Tv else Icons.Rounded.PhoneAndroid,
                              text = stringResource(if (hasDevice) R.string.choose_device_folders else R.string.add_device_folders),
                              accent = Pal.Ember,
                              onClick = onAddDevice,
                              modifier = mod
                          )
                      }
                      val networkButton: @Composable (Modifier) -> Unit = { mod ->
                          AddSourceButton(
                              icon = Icons.Rounded.Dns,
                              text = stringResource(R.string.add_network_folder),
                              accent = Pal.Teal,
                              onClick = onAddNetwork,
                              modifier = mod
                          )
                      }
                      if (isTv) {
                          Row(horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                              deviceButton(Modifier.weight(1f))
                              networkButton(Modifier.weight(1f))
                          }
                      } else {
                          deviceButton(Modifier.fillMaxWidth())
                          networkButton(Modifier.fillMaxWidth())
                      }

                      SectionTitle(stringResource(R.string.playback_prefs_title), modifier = Modifier.padding(top = 16.dp))
                      SettingsSwitchRow(
                          title = stringResource(R.string.stop_on_close_title),
                          subtitle = stringResource(R.string.stop_on_close_desc),
                          checked = vm.stopOnTaskRemoved,
                          onToggle = { vm.setStopOnTaskRemovedPref(!vm.stopOnTaskRemoved) }
                      )
                      SettingsSwitchRow(
                          title = stringResource(R.string.real_album_art_title),
                          subtitle = stringResource(R.string.real_album_art_desc),
                          checked = vm.useRealAlbumArt,
                          onToggle = { vm.setUseRealAlbumArtPref(!vm.useRealAlbumArt) }
                      )
                      val eqLabel = stringResource(
                          when (vm.eqPreset) {
                              EQ_VOICE -> R.string.eq_voice
                              EQ_BASS -> R.string.eq_bass
                              EQ_WARM -> R.string.eq_warm
                              else -> R.string.eq_normal
                          }
                      )
                      val eqShape = RoundedCornerShape(18.dp)
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .focusGlow(eqShape, ring = Pal.Ember, scaleTo = 1.02f)
                              .clip(eqShape)
                              .background(Pal.Surface)
                              .border(1.dp, Pal.Line, eqShape)
                              .clickable(role = Role.Button) { showEqDialog = true }
                              .padding(horizontal = 16.dp, vertical = 14.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Icon(Icons.Rounded.Equalizer, contentDescription = null, tint = Pal.Ember, modifier = Modifier.size(22.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text(stringResource(R.string.equalizer), fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
                              Text(eqLabel, fontSize = 12.sp, color = Pal.Muted)
                          }
                          Icon(Icons.Rounded.ChevronRight, contentDescription = null, tint = Pal.Muted)
                      }

                      if (vm.manualOverrideCount > 0) {
                          PillButton(
                              text = stringResource(R.string.reset_categories_btn, vm.manualOverrideCount),
                              onClick = { vm.resetFolderOverrides() },
                              icon = Icons.Rounded.SwapHoriz,
                              container = Color.Transparent,
                              content = Pal.Text,
                              borderColor = Pal.LineStrong,
                              height = 48.dp,
                              fontSize = 14
                          )
                      }

                      if (vm.hiddenFolders.isNotEmpty() || vm.hiddenSongIds.isNotEmpty()) {
                          SectionTitle(stringResource(R.string.hidden_title), modifier = Modifier.padding(top = 16.dp))
                          PillButton(
                              text = stringResource(R.string.restore_hidden_count, vm.hiddenFolders.size, vm.hiddenSongIds.size),
                              onClick = {
                                  vm.restoreHidden()
                                  context.showToast(context.getString(R.string.toast_restored))
                              },
                              icon = Icons.Rounded.Restore,
                              container = Color.Transparent,
                              content = Pal.Text,
                              borderColor = Pal.LineStrong,
                              height = 48.dp,
                              fontSize = 14
                          )
                      }

                      SecurityNote(modifier = Modifier.padding(top = 16.dp))
                      if (version.isNotBlank()) {
                          Text("Pulse $version", fontSize = 12.sp, color = Pal.Faint)
                      }
                  }
              }

              pendingRemoval?.let { source ->
                  AlertDialog(
                      onDismissRequest = { pendingRemoval = null },
                      containerColor = Pal.Sheet,
                      title = { Text(stringResource(R.string.remove_library_title), fontWeight = FontWeight.Bold) },
                      text = { Text(stringResource(R.string.remove_library_body, source.label), color = Pal.Muted) },
                      confirmButton = {
                          TextButton(onClick = {
                              vm.removeSource(source.id)
                              pendingRemoval = null
                          }) { Text(stringResource(R.string.remove), color = Pal.Danger, fontWeight = FontWeight.Bold) }
                      },
                      dismissButton = {
                          TextButton(onClick = { pendingRemoval = null }) { Text(stringResource(R.string.cancel)) }
                      }
                  )
              }

              if (showEqDialog) {
                  EqualizerDialog(
                      currentPreset = vm.eqPreset,
                      onSelect = { preset ->
                          vm.setEqPresetPref(preset)
                          showEqDialog = false
                      },
                      onDismiss = { showEqDialog = false }
                  )
              }
          }

          @Composable
          private fun SettingsSwitchRow(
              title: String,
              subtitle: String,
