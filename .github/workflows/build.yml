          @Composable
          fun AuraSongCard(
              song: SongItem,
              isCurrent: Boolean,
              isPlaying: Boolean,
              clock: VisualizerClock,
              showFolderBadge: Boolean,
              onClick: () -> Unit,
              onManageClick: (() -> Unit)?
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (isFocused) 1.015f else 1f, label = "songScale")
              val isQuranSong = isQuranContent(song.title, song.artist, song.folder)
              val shape = RoundedCornerShape(16.dp)

              Row(
                  modifier = Modifier.fillMaxWidth().scale(scale),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .weight(1f)
                          .clip(shape)
                          .then(
                              if (isCurrent) {
                                  Modifier.background(
                                      Brush.horizontalGradient(
                                          if (isQuranSong) listOf(Color(0x4410B981), Color(0x28D4AF37))
                                          else listOf(Color(0x448B5CF6), Color(0x2806B6D4))
                                      )
                                  )
                              } else if (isFocused) {
                                  Modifier.background(Color(0x28FFFFFF))
                              } else {
                                  Modifier.background(AuraPalette.GlassFill)
                              }
                          )
                          .border(
                              width = if (isFocused) 2.dp else 1.dp,
                              color = when {
                                  isFocused -> if (isQuranSong) AuraPalette.Gold else AuraPalette.Cyan
                                  isCurrent -> if (isQuranSong) AuraPalette.Gold.copy(alpha = 0.7f) else AuraPalette.Violet.copy(alpha = 0.7f)
                                  else -> Color(0x16FFFFFF)
                              },
                              shape = shape
                          )
                          .onFocusChanged { isFocused = it.isFocused }
                          .clickable(onClick = onClick)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 12.dp, vertical = 12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(40.dp)
                                  .clip(RoundedCornerShape(12.dp))
                                  .background(
                                      if (isCurrent) {
                                          if (isQuranSong) AuraPalette.GoldGradient else AuraPalette.PrimaryGradient
                                      } else {
                                          Brush.linearGradient(listOf(Color(0x20FFFFFF), Color(0x10FFFFFF)))
                                      }
                                  ),
                              contentAlignment = Alignment.Center
                          ) {
                              if (isCurrent && isPlaying) {
                                  MiniEqualizerBars(clock = clock, tintPrimary = Color.White, tintSecondary = Color(0xFFE0F2FE))
                              } else {
                                  Icon(
                                      if (isQuranSong) Icons.Default.MenuBook else if (song.isRemote) Icons.Default.Storage else Icons.Default.MusicNote,
                                      contentDescription = null,
                                      tint = if (isCurrent) Color.White else if (isQuranSong) AuraPalette.GoldLight else AuraPalette.Cyan,
                                      modifier = Modifier.size(20.dp)
                                  )
                              }
                          }
                          Spacer(Modifier.width(12.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  song.title,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  color = Color.White,
                                  fontWeight = if (isCurrent || isFocused) FontWeight.Bold else FontWeight.Medium,
                                  fontSize = 15.sp
                              )
                              val subtitle = if (showFolderBadge) "${song.folder} • ${song.artist}" else song.artist
                              Text(
                                  subtitle,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  color = if (isCurrent) {
                                      if (isQuranSong) AuraPalette.GoldLight else Color(0xFFD8B4FE)
                                  } else {
                                      AuraPalette.MutedText
                                  },
                                  fontSize = 12.sp
                              )
                          }
                          if (song.durationMs > 0L) {
                              Spacer(Modifier.width(8.dp))
                              Box(
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(8.dp))
                                      .background(Color(0x22000000))
                                      .padding(horizontal = 7.dp, vertical = 3.dp)
                              ) {
                                  Text(formatTime(song.durationMs), fontSize = 11.sp, color = Color(0xFFD1D5DB))
                              }
                          }
                      }
                  }

                  if (onManageClick != null) {
                      AuraIconButton(
                          icon = Icons.Default.Delete,
                          contentDescription = stringResource(R.string.cd_delete_or_hide),
                          onClick = onManageClick,
                          tint = AuraPalette.Danger,
                          glass = true,
                          size = 42
                      )
                  }
