              SceneOption(SCENE_STARDUST, Icons.Rounded.AutoAwesome, R.string.scene_stardust)
          )

          /** Full-screen player. Music takes its colours from the cover; Quran opens in Sakina. */
          @Composable
          fun StudioScreen(vm: PulseViewModel, isTv: Boolean, onExit: () -> Unit) {
              val scene = vm.effectiveScene
              val isSakina = scene == SCENE_SAKINA
              val cover = vm.currentCover
              val mood = if (isSakina) Mood.Sakina else Mood.fromCover(cover)
              val title = vm.currentTitle.ifBlank { stringResource(R.string.select_song_prompt) }

              var controlsVisible by remember { mutableStateOf(true) }
              var interactionTick by remember { mutableIntStateOf(0) }
              var showSleepDialog by remember { mutableStateOf(false) }
              var showEqDialog by remember { mutableStateOf(false) }
              val rootFocus = remember { FocusRequester() }
              val playFocus = remember { FocusRequester() }
              fun bump() {
                  interactionTick++
              }

              // TV: controls fade away after a while, leaving the scene alone on screen.
              LaunchedEffect(controlsVisible, interactionTick, vm.isPlaying, isTv) {
                  if (isTv && controlsVisible && vm.isPlaying) {
                      delay(8000L)
                      controlsVisible = false
                  }
              }
              LaunchedEffect(controlsVisible, isTv) {
                  if (!isTv) return@LaunchedEffect
                  delay(150L)
                  runCatching { if (controlsVisible) playFocus.requestFocus() else rootFocus.requestFocus() }
              }

              val activity = LocalContext.current as? Activity
              DisposableEffect(controlsVisible, isTv) {
                  val window = activity?.window
                  if (window != null && isTv) {
                      val controller = WindowCompat.getInsetsController(window, window.decorView)
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                  }
                  onDispose {
                      activity?.window?.let { win ->
                          WindowCompat.getInsetsController(win, win.decorView).show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(mood.bg)
                      .focusRequester(rootFocus)
                      .focusable()
                      .onPreviewKeyEvent { event ->
                          if (event.type == KeyEventType.KeyDown) {
                              if (!controlsVisible && isTv) {
                                  if (event.key == Key.Back) return@onPreviewKeyEvent false
                                  controlsVisible = true
                                  bump()
                                  return@onPreviewKeyEvent true
                              }
                              bump()
                          }
                          false
                      }
                      .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {
                          if (isTv) {
                              controlsVisible = !controlsVisible
                              if (controlsVisible) bump()
                          }
                      }
              ) {
                  StudioBackdrop(mood = mood, cover = cover, isSakina = isSakina)

                  if (isTv) {
                      Row(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(horizontal = 56.dp, vertical = 40.dp),
                          horizontalArrangement = Arrangement.spacedBy(48.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          SceneStage(scene = scene, clock = vm.clock, cover = cover, artKey = vm.currentArtKey, modifier = Modifier.weight(1.15f).fillMaxHeight())
                          AnimatedVisibility(
                              visible = controlsVisible,
                              enter = fadeIn(tween(300)),
                              exit = fadeOut(tween(700)),
                              modifier = Modifier.width(490.dp)
                          ) {
                              Column(verticalArrangement = Arrangement.spacedBy(14.dp)) {
                                  StudioHeaderLabel(vm, mood, isSakina)
                                  StudioTitle(title = title, artist = vm.currentArtist, mood = mood, isSakina = isSakina, centered = false, large = true, queueText = queueText(vm))
                                  StudioProgress(vm, mood, isSakina, isTv = true, onInteract = { bump() })
                                  StudioControls(vm, mood, isTv = true, playFocus = playFocus, onInteract = { bump() })
                                  StudioQuickTools(
                                      vm = vm,
                                      mood = mood,
                                      isTv = true,
                                      onOpenSleep = { bump(); showSleepDialog = true },
                                      onOpenEq = { bump(); showEqDialog = true },
                                      onInteract = { bump() }
                                  )
                                  StudioChips(vm, mood, isSakina, onInteract = { bump() }, onExit = onExit, showExit = true)
                              }
                          }
                      }
                      AnimatedVisibility(
                          visible = !controlsVisible,
                          enter = fadeIn(tween(700)),
                          exit = fadeOut(tween(250)),
                          modifier = Modifier
                              .align(Alignment.BottomStart)
                              .padding(48.dp)
                      ) {
                          Column {
                              Text(
                                  title,
                                  fontSize = 26.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  fontFamily = if (isSakina) PulseFonts.quran else null,
                                  color = (if (isSakina) Pal.GoldLight else mood.text).copy(alpha = 0.85f),
                                  maxLines = 1
                              )
                              if (vm.currentArtist.isNotBlank()) {
                                  Text(vm.currentArtist, fontSize = 15.sp, color = mood.muted.copy(alpha = 0.8f), maxLines = 1)
                              }
                          }
                      }
                  } else {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .statusBarsPadding()
                              .navigationBarsPadding()
                              .padding(horizontal = 16.dp, vertical = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              RoundIconButton(
                                  icon = Icons.Rounded.KeyboardArrowDown,
                                  contentDescription = stringResource(R.string.cd_exit_fullscreen),
                                  onClick = onExit,
                                  tint = mood.text,
                                  container = mood.text.copy(alpha = 0.07f),
                                  borderColor = mood.line
                              )
                              StudioHeaderLabel(vm, mood, isSakina, centered = true)
                              RoundIconButton(
                                  icon = Icons.Rounded.Stop,
                                  contentDescription = stringResource(R.string.cd_stop),
                                  onClick = { vm.stopPlayback() },
                                  tint = mood.text,
                                  container = mood.text.copy(alpha = 0.07f),
                                  borderColor = mood.line
                              )
                          }
                          SceneStage(
                              scene = scene,
                              clock = vm.clock,
                              cover = cover,
                              artKey = vm.currentArtKey,
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxWidth()
                                  .padding(vertical = 6.dp)
                          )
                          StudioTitle(title = title, artist = vm.currentArtist, mood = mood, isSakina = isSakina, centered = isSakina, large = false, queueText = queueText(vm))
                          Spacer(Modifier.height(10.dp))
                          StudioProgress(vm, mood, isSakina, isTv = false, onInteract = {})
                          Spacer(Modifier.height(8.dp))
                          StudioControls(vm, mood, isTv = false, playFocus = playFocus, onInteract = {})
                          Spacer(Modifier.height(10.dp))
                          StudioQuickTools(
                              vm = vm,
                              mood = mood,
                              isTv = false,
                              onOpenSleep = { showSleepDialog = true },
                              onOpenEq = { showEqDialog = true },
                              onInteract = {}
                          )
                          Spacer(Modifier.height(12.dp))
                          StudioChips(vm, mood, isSakina, onInteract = {}, onExit = onExit, showExit = false)
                          Spacer(Modifier.height(8.dp))
                      }
                  }
              }

              if (showSleepDialog) {
                  SleepTimerDialog(
                      remainingSec = vm.sleepTimerRemainingSec,
                      onSelectMinutes = { mins ->
                          vm.setSleepTimer(mins)
                          showSleepDialog = false
                      },
                      onDismiss = { showSleepDialog = false }
                  )
              }
              if (showEqDialog) {
                  EqualizerDialog(
                      currentPreset = vm.eqPreset,
                      onSelect = { preset ->
                          vm.setEqPresetPref(preset)
                          showEqDialog = false
                      },
                      onDismiss = { showEqDialog = false }
                  )
              }
          }

