          @Composable
          fun FullScreenStudio(
              title: String,
              artist: String,
              isPlaying: Boolean,
              isTv: Boolean,
              positionMs: Long,
              durationMs: Long,
              shuffleEnabled: Boolean,
              playbackMode: Int,
              style: Int,
              clock: VisualizerClock,
              onSeek: (Long) -> Unit,
              onPlayPause: () -> Unit,
              onNext: () -> Unit,
              onPrev: () -> Unit,
              onRewind: () -> Unit,
              onForward: () -> Unit,
              onToggleShuffle: () -> Unit,
              onCyclePlaybackMode: () -> Unit,
              onCycleStyle: () -> Unit,
              onExit: () -> Unit
          ) {
              val context = LocalContext.current
              val activity = context as? Activity

              val isIslamic = style == STYLE_ISLAMIC
              val activeGrad = if (isIslamic) AuraPalette.GoldGradient else AuraPalette.PrimaryGradient
              val activeAccent = if (isIslamic) AuraPalette.GoldLight else AuraPalette.Cyan

              var isDragging by remember { mutableStateOf(false) }
              var dragPos by remember { mutableFloatStateOf(0f) }

              var controlsVisible by remember { mutableStateOf(true) }
              var interactionTick by remember { mutableIntStateOf(0) }

              val rootFocusRequester = remember { FocusRequester() }
              val playPauseFocusRequester = remember { FocusRequester() }

              fun bumpActivity() {
                  interactionTick++
              }

              LaunchedEffect(controlsVisible, interactionTick, isPlaying, isDragging) {
                  if (controlsVisible && isPlaying && !isDragging) {
                      delay(6000L)
                      controlsVisible = false
                  }
              }

              LaunchedEffect(controlsVisible) {
                  if (!controlsVisible) {
                      runCatching { rootFocusRequester.requestFocus() }
                  } else if (isTv) {
                      delay(120L)
                      runCatching { playPauseFocusRequester.requestFocus() }
                  }
              }

              DisposableEffect(controlsVisible) {
                  val window = activity?.window
                  if (window != null) {
                      val controller = WindowCompat.getInsetsController(window, window.decorView)
                      controller.systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      if (!controlsVisible) {
                          controller.hide(WindowInsetsCompat.Type.systemBars())
                      } else {
                          controller.show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
                  onDispose {}
              }

              DisposableEffect(Unit) {
                  onDispose {
                      activity?.window?.let { win ->
                          WindowCompat.getInsetsController(win, win.decorView)
                              .show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }

              val stageTopPad by animateDpAsState(
                  targetValue = if (controlsVisible) 64.dp else 16.dp,
                  animationSpec = tween(550),
                  label = "stageTop"
              )
              val stageBottomPad by animateDpAsState(
                  targetValue = if (controlsVisible) 210.dp else 64.dp,
                  animationSpec = tween(550),
                  label = "stageBottom"
              )

              val styleName = when (style) {
                  0 -> stringResource(R.string.style_neon_bars)
                  1 -> stringResource(R.string.style_aurora_waves)
                  2 -> stringResource(R.string.style_radial_pulse)
                  3 -> stringResource(R.string.style_stardust)
                  else -> stringResource(R.string.style_islamic)
              }

              val progress = if (durationMs > 0L) (positionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f) else 0f

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .focusRequester(rootFocusRequester)
                      .focusable()
                      .onPreviewKeyEvent { keyEvent ->
                          if (keyEvent.type == KeyEventType.KeyDown) {
                              if (!controlsVisible) {
                                  if (keyEvent.key == Key.Back) {
                                      return@onPreviewKeyEvent false
                                  }
                                  controlsVisible = true
                                  bumpActivity()
                                  return@onPreviewKeyEvent true
                              } else {
                                  bumpActivity()
                              }
                          }
                          false
                      }
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null
                      ) {
                          controlsVisible = !controlsVisible
                          if (controlsVisible) bumpActivity()
                      }
              ) {
                  VisualizerStage(
                      style = style,
                      clock = clock,
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(top = stageTopPad, bottom = stageBottomPad)
                  )

                  AnimatedVisibility(
                      visible = !controlsVisible,
                      enter = fadeIn(tween(650)),
                      exit = fadeOut(tween(250)),
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .fillMaxWidth()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 28.dp, vertical = 18.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              title,
                              fontSize = if (isTv) 24.sp else 17.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = (if (isIslamic) AuraPalette.GoldLight else Color.White).copy(alpha = 0.85f),
                              maxLines = 1,
                              modifier = Modifier.basicMarquee()
                          )
                          if (artist.isNotBlank()) {
                              Spacer(Modifier.height(2.dp))
                              Text(
                                  artist,
                                  fontSize = if (isTv) 14.sp else 12.sp,
                                  color = AuraPalette.MutedText.copy(alpha = 0.75f),
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                          Spacer(Modifier.height(10.dp))
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth(if (isTv) 0.45f else 0.72f)
                                      .height(2.5.dp)
                                      .clip(RoundedCornerShape(2.dp))
                                      .background(Color(0x22FFFFFF))
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .fillMaxWidth(progress)
                                          .fillMaxHeight()
                                          .background(activeGrad)
                                  )
                              }
                          }
                      }
                  }

                  AnimatedVisibility(
                      visible = controlsVisible,
                      enter = fadeIn(tween(300)),
                      exit = fadeOut(tween(600)),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .statusBarsPadding()
                              .navigationBarsPadding()
                              .padding(horizontal = 20.dp, vertical = 12.dp),
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              AuraIconButton(
                                  icon = if (isTv) Icons.Default.FullscreenExit else Icons.Default.KeyboardArrowDown,
                                  contentDescription = stringResource(R.string.cd_exit_fullscreen),
                                  onClick = onExit,
                                  glass = true,
                                  size = 44
                              )

                              Text(
                                  if (isIslamic) stringResource(R.string.quran_header) else stringResource(R.string.now_playing_header),
                                  fontSize = 12.sp,
                                  letterSpacing = 1.8.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isIslamic) AuraPalette.GoldLight else AuraPalette.MutedText
                              )

                              Surface(
                                  onClick = {
                                      bumpActivity()
                                      onCycleStyle()
                                  },
                                  shape = RoundedCornerShape(24.dp),
                                  color = if (isIslamic) Color(0x33D4AF37) else Color(0x28FFFFFF),
                                  border = BorderStroke(1.dp, if (isIslamic) AuraPalette.Gold.copy(alpha = 0.6f) else Color(0x5506B6D4))
                              ) {
                                  Row(
                                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                                  ) {
                                      Icon(
                                          Icons.Default.Palette,
                                          contentDescription = stringResource(R.string.cd_change_style),
                                          tint = activeAccent,
                                          modifier = Modifier.size(16.dp)
                                      )
                                      Text(styleName, fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Color.White)
                                  }
                              }
                          }

                          Spacer(Modifier.weight(1f))

                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(28.dp))
                                  .background(if (isIslamic) AuraPalette.EmeraldGlass else AuraPalette.GlassStrong)
                                  .border(
                                      1.dp,
                                      if (isIslamic) AuraPalette.Gold.copy(alpha = 0.4f) else AuraPalette.GlassBorder,
                                      RoundedCornerShape(28.dp)
                                  )
                                  .clickable(
                                      interactionSource = remember { MutableInteractionSource() },
                                      indication = null
                                  ) { bumpActivity() }
                                  .padding(horizontal = 22.dp, vertical = 18.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              if (playbackMode == MODE_PLAY_ONCE) {
                                  Box(
                                      modifier = Modifier
                                          .padding(bottom = 8.dp)
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(AuraPalette.PlayOnceGradient)
                                          .padding(horizontal = 10.dp, vertical = 3.dp)
                                  ) {
                                      Text(
                                          stringResource(R.string.badge_play_once),
                                          fontSize = 10.sp,
                                          fontWeight = FontWeight.ExtraBold,
                                          color = Color.White
                                      )
                                  }
                              }

                              Text(
                                  title,
                                  fontSize = if (isTv) 26.sp else 21.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isIslamic) AuraPalette.GoldLight else Color.White,
                                  maxLines = 1,
                                  modifier = Modifier.basicMarquee()
                              )
                              if (artist.isNotBlank()) {
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      artist,
                                      fontSize = if (isTv) 16.sp else 13.sp,
                                      color = AuraPalette.MutedText,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }

                              Spacer(Modifier.height(10.dp))

                              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                                  val shownPos = if (isDragging) dragPos.toLong() else positionMs
                                  if (isTv) {
                                      Box(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .height(7.dp)
                                              .clip(RoundedCornerShape(4.dp))
                                              .background(Color(0x28FFFFFF))
                                      ) {
                                          Box(
                                              modifier = Modifier
                                                  .fillMaxWidth(progress)
                                                  .fillMaxHeight()
                                                  .background(activeGrad)
                                          )
                                      }
                                  } else {
                                      val safeMax = durationMs.coerceAtLeast(1L).toFloat()
                                      Slider(
                                          value = shownPos.coerceIn(0L, durationMs.coerceAtLeast(1L)).toFloat(),
                                          onValueChange = {
                                              isDragging = true
                                              dragPos = it
                                              bumpActivity()
                                          },
                                          onValueChangeFinished = {
                                              onSeek(dragPos.toLong())
                                              isDragging = false
                                              bumpActivity()
                                          },
                                          valueRange = 0f..safeMax,
                                          colors = SliderDefaults.colors(
                                              thumbColor = activeAccent,
                                              activeTrackColor = if (isIslamic) AuraPalette.Gold else AuraPalette.Violet,
                                              inactiveTrackColor = Color(0x30FFFFFF)
                                          ),
                                          modifier = Modifier.fillMaxWidth()
                                      )
                                  }

                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(formatTime(shownPos), fontSize = 12.sp, color = AuraPalette.MutedText)
                                      Text(formatTime(durationMs), fontSize = 12.sp, color = AuraPalette.MutedText)
                                  }

                                  Spacer(Modifier.height(10.dp))

                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceEvenly,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      AuraIconButton(
                                          icon = Icons.Default.Shuffle,
                                          contentDescription = stringResource(R.string.cd_shuffle),
                                          onClick = { bumpActivity(); onToggleShuffle() },
                                          tint = if (shuffleEnabled) activeAccent else AuraPalette.MutedText,
                                          glass = shuffleEnabled
                                      )
                                      AuraIconButton(
                                          icon = Icons.Default.SkipPrevious,
                                          contentDescription = stringResource(R.string.cd_previous),
                                          onClick = { bumpActivity(); onPrev() },
                                          glass = true
                                      )
                                      if (isTv) {
                                          AuraIconButton(
                                              icon = Icons.Default.FastRewind,
                                              contentDescription = stringResource(R.string.cd_rewind),
                                              onClick = { bumpActivity(); onRewind() },
                                              glass = true
                                          )
                                      }
                                      AuraIconButton(
                                          icon = if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                          contentDescription = stringResource(R.string.cd_play_pause),
                                          onClick = { bumpActivity(); onPlayPause() },
                                          gradient = true,
                                          gradientBrush = activeGrad,
                                          size = 66,
                                          modifier = Modifier.focusRequester(playPauseFocusRequester)
                                      )
                                      if (isTv) {
                                          AuraIconButton(
                                              icon = Icons.Default.FastForward,
                                              contentDescription = stringResource(R.string.cd_forward),
                                              onClick = { bumpActivity(); onForward() },
                                              glass = true
                                          )
                                      }
                                      AuraIconButton(
                                          icon = Icons.Default.SkipNext,
                                          contentDescription = stringResource(R.string.cd_next),
                                          onClick = { bumpActivity(); onNext() },
                                          glass = true
                                      )
                                      PlaybackModeButton(
                                          playbackMode = playbackMode,
                                          accentColor = activeAccent,
                                          onClick = { bumpActivity(); onCyclePlaybackMode() }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun VisualizerStage(
              style: Int,
              clock: VisualizerClock,
              modifier: Modifier = Modifier
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 2f || h <= 2f) return@Canvas

                  val phase = clock.phase
                  val amplitude = clock.amplitude
                  val cx = w / 2f
                  val cy = h / 2f
                  val minDim = minOf(w, h)

                  when (style) {
                      0 -> {
                          val discCenter = Offset(cx, h * 0.40f)
                          val discRadius = (minDim * 0.25f).coerceAtLeast(24f)
                          val pulse = (1f + 0.08f * sin(phase * 5.2f) * amplitude)

                          for (ring in 0..2) {
                              val ringProg = ((phase * 0.55f + ring * 0.33f) % 1f)
                              val r = discRadius * (1.06f + ringProg * 0.90f)
                              val alpha = ((1f - ringProg) * 0.48f * amplitude).coerceIn(0f, 1f)
                              if (alpha > 0.01f) {
                                  drawCircle(
                                      color = when (ring) {
                                          0 -> AuraPalette.Cyan.copy(alpha = alpha)
                                          1 -> AuraPalette.Violet.copy(alpha = alpha)
                                          else -> AuraPalette.Rose.copy(alpha = alpha)
                                      },
                                      radius = r,
                                      center = discCenter,
                                      style = Stroke(width = 3f)
                                  )
                              }
                          }

                          rotate(degrees = (phase * 44f) % 360f, pivot = discCenter) {
                              drawCircle(
                                  brush = Brush.radialGradient(
                                      colors = listOf(Color(0xFF2D1E5E), Color(0xFF101020), Color(0xFF06060D)),
                                      center = discCenter,
                                      radius = discRadius * pulse
                                  ),
                                  radius = discRadius * pulse,
                                  center = discCenter
                              )
                              drawCircle(Color(0x33FFFFFF), radius = discRadius * 0.80f * pulse, center = discCenter, style = Stroke(1.6f))
                              drawCircle(Color(0x2806B6D4), radius = discRadius * 0.60f * pulse, center = discCenter, style = Stroke(1.4f))
                              drawArc(
                                  brush = AuraPalette.PrimaryGradient,
                                  startAngle = -40f,
                                  sweepAngle = 110f,
                                  useCenter = false,
                                  topLeft = Offset(discCenter.x - discRadius * 0.88f * pulse, discCenter.y - discRadius * 0.88f * pulse),
                                  size = Size(discRadius * 1.76f * pulse, discRadius * 1.76f * pulse),
                                  style = Stroke(width = 4.5f, cap = StrokeCap.Round)
                              )
                              drawCircle(brush = AuraPalette.PrimaryGradient, radius = discRadius * 0.30f, center = discCenter)
                              drawCircle(color = AuraPalette.Obsidian, radius = discRadius * 0.09f, center = discCenter)
                          }

                          val barCount = 36
                          val margin = w * 0.06f
                          val usableW = (w - margin * 2f).coerceAtLeast(10f)
                          val step = usableW / barCount
                          val barW = (step * 0.60f).coerceAtLeast(2f)
                          val maxBarH = (h * 0.28f).coerceAtLeast(16f)
                          val baselineY = h * 0.94f

                          val barBrush = Brush.verticalGradient(
                              colors = listOf(AuraPalette.Cyan, AuraPalette.Violet, AuraPalette.Rose),
                              startY = baselineY - maxBarH,
                              endY = baselineY
                          )

                          for (i in 0 until barCount) {
                              val norm = i.toFloat() / (barCount - 1)
                              val centerBoost = 1f - abs(norm - 0.5f) * 0.85f
                              val wave1 = sin(phase * 4.8f + i * 0.42f) * 0.5f + 0.5f
                              val wave2 = cos(phase * 7.6f - i * 0.78f) * 0.5f + 0.5f
                              val wave3 = sin(phase * 3.0f + i * 1.18f) * 0.5f + 0.5f
                              val energy = (0.45f * wave1 + 0.35f * wave2 + 0.20f * wave3) * centerBoost
                              val barH = (maxBarH * (0.08f + 0.92f * energy * amplitude)).coerceAtLeast(6f)
                              val x = margin + i * step + (step - barW) / 2f

                              drawRoundRect(
                                  brush = barBrush,
                                  topLeft = Offset(x, baselineY - barH),
                                  size = Size(barW, barH),
                                  cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                              )
                          }
                      }

                      1 -> {
                          val waveConfigs = listOf(
                              Triple(AuraPalette.Cyan, 1.0f, 3.2f),
                              Triple(AuraPalette.Violet, 0.80f, 4.4f),
                              Triple(AuraPalette.Rose, 0.62f, 2.5f)
                          )
                          waveConfigs.forEachIndexed { idx, (color, ampScale, speed) ->
                              val path = Path()
                              val steps = 64
                              val maxAmp = h * 0.23f * ampScale * (0.15f + 0.85f * amplitude)
                              for (s in 0..steps) {
                                  val t = s.toFloat() / steps
                                  val x = t * w
                                  val envelope = sin(t * PI).toFloat()
                                  val y = cy +
                                      sin(t * 9f + phase * speed + idx * 1.8f) * maxAmp * envelope +
                                      cos(t * 17f - phase * (speed * 1.3f)) * (maxAmp * 0.35f) * envelope
                                  if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                              }
                              drawPath(path, color = color.copy(alpha = 0.24f), style = Stroke(width = 16f, cap = StrokeCap.Round))
                              drawPath(path, color = color.copy(alpha = 0.95f), style = Stroke(width = 4.5f, cap = StrokeCap.Round))
                          }
                      }

                      2 -> {
                          val baseR = (minDim * 0.22f).coerceAtLeast(24f)
                          val maxRay = (minDim * 0.21f).coerceAtLeast(14f)
                          val rays = 54

                          for (i in 0 until rays) {
                              val angleRad = (i.toFloat() / rays) * (2f * PI.toFloat()) + phase * 0.35f
                              val v1 = sin(phase * 5.4f + i * 0.60f) * 0.5f + 0.5f
                              val v2 = cos(phase * 8.1f - i * 1.05f) * 0.5f + 0.5f
                              val rayLen = maxRay * (0.12f + 0.88f * (0.55f * v1 + 0.45f * v2) * amplitude)

                              val start = Offset(cx + cos(angleRad) * baseR, cy + sin(angleRad) * baseR)
                              val end = Offset(cx + cos(angleRad) * (baseR + rayLen), cy + sin(angleRad) * (baseR + rayLen))
                              val rayColor = when (i % 3) {
                                  0 -> AuraPalette.Cyan
                                  1 -> AuraPalette.Violet
                                  else -> AuraPalette.Rose
                              }
                              drawLine(color = rayColor, start = start, end = end, strokeWidth = 5f, cap = StrokeCap.Round)
                          }

                          val innerPulse = baseR * (0.86f + 0.07f * sin(phase * 6f) * amplitude)
                          drawCircle(
                              brush = Brush.radialGradient(
                                  colors = listOf(AuraPalette.Violet, Color(0xFF121226)),
                                  center = Offset(cx, cy),
                                  radius = innerPulse.coerceAtLeast(10f)
                              ),
                              radius = innerPulse,
                              center = Offset(cx, cy)
                          )
                          drawCircle(color = AuraPalette.Cyan, radius = innerPulse, center = Offset(cx, cy), style = Stroke(2.5f))
                      }

                      3 -> {
                          val particleCount = 28
                          for (p in 0 until particleCount) {
                              val speed = 0.14f + (p % 5) * 0.05f
                              val life = ((phase * speed + p * 0.137f) % 1f)
                              val px = ((p * 0.371f + sin(phase * 0.7f + p) * 0.05f) % 1f).let { if (it < 0f) it + 1f else it } * w
                              val py = h * (1f - life)
                              val alpha = (sin(life * PI).toFloat() * (0.35f + 0.65f * amplitude)).coerceIn(0f, 1f)
                              val radius = (3f + (p % 4) * 2.2f) * (0.7f + 0.4f * amplitude)
                              val col = when (p % 3) {
                                  0 -> AuraPalette.Cyan
                                  1 -> AuraPalette.Violet
                                  else -> AuraPalette.Rose
                              }
                              drawCircle(col.copy(alpha = alpha * 0.35f), radius = radius * 2.2f, center = Offset(px, py))
                              drawCircle(col.copy(alpha = alpha), radius = radius, center = Offset(px, py))
                          }

                          val bars = 32
                          val margin = w * 0.08f
                          val usableW = (w - margin * 2f).coerceAtLeast(10f)
                          val step = usableW / bars
                          val barW = (step * 0.56f).coerceAtLeast(2f)
                          val maxHalf = h * 0.24f

                          val mirrorBrush = Brush.verticalGradient(
                              colors = listOf(AuraPalette.Cyan, AuraPalette.Violet, AuraPalette.Rose, AuraPalette.Violet, AuraPalette.Cyan),
                              startY = cy - maxHalf,
                              endY = cy + maxHalf
                          )

                          for (i in 0 until bars) {
                              val norm = i.toFloat() / (bars - 1)
                              val env = sin(norm * PI).toFloat()
                              val e1 = sin(phase * 5.2f + i * 0.55f) * 0.5f + 0.5f
                              val e2 = cos(phase * 8.4f - i * 0.90f) * 0.5f + 0.5f
                              val halfH = (maxHalf * env * (0.12f + 0.88f * (0.55f * e1 + 0.45f * e2) * amplitude)).coerceAtLeast(5f)
                              val x = margin + i * step + (step - barW) / 2f
                              drawRoundRect(
                                  brush = mirrorBrush,
                                  topLeft = Offset(x, cy - halfH),
                                  size = Size(barW, halfH * 2f),
                                  cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                              )
                          }
                      }

                      else -> {
                          val center = Offset(cx, h * 0.46f)
                          val breathe = 1f + 0.045f * sin(phase * 1.8f) * amplitude

                          val haloR = (minDim * 0.46f * breathe).coerceAtLeast(30f)
                          drawCircle(
                              brush = Brush.radialGradient(
                                  colors = listOf(
                                      AuraPalette.Gold.copy(alpha = 0.24f + 0.12f * amplitude),
                                      AuraPalette.EmeraldGlow.copy(alpha = 0.12f),
                                      Color.Transparent
                                  ),
                                  center = center,
                                  radius = haloR
                              ),
                              radius = haloR,
                              center = center
                          )

                          val archW = minDim * 0.72f
                          val archTop = (center.y - minDim * 0.42f).coerceAtLeast(8f)
                          val archMid = center.y - minDim * 0.12f
                          val archBottom = (h * 0.90f).coerceAtLeast(center.y + minDim * 0.22f)
                          val archPath = Path().apply {
                              moveTo(cx - archW / 2f, archBottom)
                              lineTo(cx - archW / 2f, archMid)
                              cubicTo(
                                  cx - archW / 2f, archTop + minDim * 0.10f,
                                  cx - archW * 0.16f, archTop + minDim * 0.04f,
                                  cx, archTop
                              )
                              cubicTo(
                                  cx + archW * 0.16f, archTop + minDim * 0.04f,
                                  cx + archW / 2f, archTop + minDim * 0.10f,
                                  cx + archW / 2f, archMid
                              )
                              lineTo(cx + archW / 2f, archBottom)
                          }
                          drawPath(
                              path = archPath,
                              color = AuraPalette.Gold.copy(alpha = 0.16f),
                              style = Stroke(width = 8f, cap = StrokeCap.Round)
                          )
                          drawPath(
                              path = archPath,
                              color = AuraPalette.GoldLight.copy(alpha = 0.34f),
                              style = Stroke(width = 2f, cap = StrokeCap.Round)
                          )

                          for (p in 0 until 22) {
                              val speed = 0.055f + (p % 4) * 0.018f
                              val life = ((phase * speed + p * 0.173f) % 1f)
                              val px = ((p * 0.419f + sin(phase * 0.35f + p) * 0.03f) % 1f).let { if (it < 0f) it + 1f else it } * w
                              val py = h * (0.95f - life * 0.88f)
                              val alpha = (sin(life * PI).toFloat() * (0.25f + 0.45f * amplitude)).coerceIn(0f, 1f)
                              val r = 2.2f + (p % 3) * 1.4f
                              drawCircle(AuraPalette.Gold.copy(alpha = alpha * 0.35f), radius = r * 2.6f, center = Offset(px, py))
                              drawCircle(AuraPalette.GoldLight.copy(alpha = alpha), radius = r, center = Offset(px, py))
                          }

                          val outerR = (minDim * 0.31f * breathe).coerceAtLeast(28f)
                          drawCircle(
                              color = AuraPalette.Gold.copy(alpha = 0.28f),
                              radius = outerR,
                              center = center,
                              style = Stroke(width = 2f)
                          )
                          drawCircle(
                              color = AuraPalette.GoldLight.copy(alpha = 0.16f),
                              radius = outerR * 1.07f,
                              center = center,
                              style = Stroke(width = 1.2f)
                          )

                          val slowAngle = (phase * 5.5f) % 360f
                          val dotCount = 16
                          for (i in 0 until dotCount) {
                              val rad = ((i * (360f / dotCount) + slowAngle) * PI / 180.0).toFloat()
                              val dotPos = Offset(center.x + cos(rad) * outerR * 1.035f, center.y + sin(rad) * outerR * 1.035f)
                              drawCircle(AuraPalette.GoldLight.copy(alpha = 0.65f), radius = 2.6f, center = dotPos)
                          }

                          val sOuter = outerR * 0.68f
                          for (rot in listOf(slowAngle, slowAngle + 45f)) {
                              rotate(degrees = rot, pivot = center) {
                                  drawRect(
                                      color = AuraPalette.Gold.copy(alpha = 0.08f),
                                      topLeft = Offset(center.x - sOuter, center.y - sOuter),
                                      size = Size(sOuter * 2f, sOuter * 2f)
                                  )
                                  drawRect(
                                      color = AuraPalette.Gold.copy(alpha = 0.30f),
                                      topLeft = Offset(center.x - sOuter, center.y - sOuter),
                                      size = Size(sOuter * 2f, sOuter * 2f),
                                      style = Stroke(width = 6f)
                                  )
                                  drawRect(
                                      color = AuraPalette.GoldLight.copy(alpha = 0.85f),
                                      topLeft = Offset(center.x - sOuter, center.y - sOuter),
                                      size = Size(sOuter * 2f, sOuter * 2f),
                                      style = Stroke(width = 2.2f)
                                  )
                              }
                          }

                          val sInner = outerR * 0.43f
                          val reverseAngle = (-phase * 3.8f) % 360f
                          for (rot in listOf(reverseAngle, reverseAngle + 45f)) {
                              rotate(degrees = rot, pivot = center) {
                                  drawRect(
                                      color = AuraPalette.EmeraldGlow.copy(alpha = 0.14f),
                                      topLeft = Offset(center.x - sInner, center.y - sInner),
                                      size = Size(sInner * 2f, sInner * 2f)
                                  )
                                  drawRect(
                                      color = AuraPalette.Gold.copy(alpha = 0.72f),
                                      topLeft = Offset(center.x - sInner, center.y - sInner),
                                      size = Size(sInner * 2f, sInner * 2f),
                                      style = Stroke(width = 1.8f)
                                  )
                              }
                          }

                          val coreR = (outerR * 0.24f).coerceAtLeast(10f)
                          drawCircle(
                              brush = Brush.radialGradient(
                                  colors = listOf(AuraPalette.GoldLight, AuraPalette.Gold, Color(0xFF0A4A3B)),
                                  center = center,
                                  radius = coreR
                              ),
                              radius = coreR,
                              center = center
                          )
                          drawCircle(
                              color = AuraPalette.GoldLight.copy(alpha = 0.9f),
                              radius = coreR * 0.45f,
                              center = center,
                              style = Stroke(width = 1.5f)
                          )

                          val baseWaveY = h * 0.88f
                          for (layer in 0..1) {
                              val path = Path()
                              val steps = 56
                              val waveAmp = h * (if (layer == 0) 0.032f else 0.022f) * (0.25f + 0.75f * amplitude)
                              val spd = if (layer == 0) 1.3f else 1.8f
                              for (s in 0..steps) {
                                  val t = s.toFloat() / steps
                                  val x = t * w
                                  val env = sin(t * PI).toFloat()
                                  val y = baseWaveY + sin(t * 7f + phase * spd + layer * 2.1f) * waveAmp * env
                                  if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                              }
                              drawPath(
                                  path = path,
                                  color = if (layer == 0) AuraPalette.Gold.copy(alpha = 0.45f) else AuraPalette.EmeraldGlow.copy(alpha = 0.35f),
                                  style = Stroke(width = if (layer == 0) 3f else 2f, cap = StrokeCap.Round)
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun MiniEqualizerBars(
              clock: VisualizerClock,
              tintPrimary: Color = AuraPalette.Cyan,
              tintSecondary: Color = AuraPalette.Violet,
              modifier: Modifier = Modifier.size(width = 20.dp, height = 16.dp)
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 1f || h <= 1f) return@Canvas
                  val phase = clock.phase
                  val amplitude = clock.amplitude
                  val bars = 4
                  val step = w / bars
                  val barW = step * 0.58f
                  for (i in 0 until bars) {
                      val wave = sin(phase * 7.8f + i * 1.9f) * 0.5f + 0.5f
                      val barH = h * (0.20f + 0.80f * wave * amplitude)
                      val x = i * step + (step - barW) / 2f
                      drawRoundRect(
                          color = if (i % 2 == 0) tintPrimary else tintSecondary,
                          topLeft = Offset(x, h - barH),
                          size = Size(barW, barH),
                          cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                      )
                  }
              }
          }

          @Composable
          fun GradientActionButton(text: String, onClick: () -> Unit) {
              var isFocused by remember { mutableStateOf(false) }
              val shape = RoundedCornerShape(16.dp)
              Box(
                  modifier = Modifier
                      .clip(shape)
                      .background(AuraPalette.PrimaryGradient)
                      .border(if (isFocused) 2.dp else 0.dp, Color.White, shape)
                      .onFocusChanged { isFocused = it.isFocused }
                      .clickable(onClick = onClick)
                      .padding(horizontal = 22.dp, vertical = 12.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Text(text, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
              }
          }

          @Composable
          fun AuraIconButton(
              icon: ImageVector,
              contentDescription: String,
              onClick: () -> Unit,
              tint: Color = Color.White,
              gradient: Boolean = false,
              gradientBrush: Brush = AuraPalette.PrimaryGradient,
              glass: Boolean = false,
              size: Int = 44,
              modifier: Modifier = Modifier
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (isFocused) 1.12f else 1f, label = "btnScale")

              val bgModifier = when {
                  gradient -> Modifier.background(gradientBrush)
                  isFocused -> Modifier.background(Color(0x3806B6D4))
                  glass -> Modifier.background(Color(0x18FFFFFF))
                  else -> Modifier.background(Color.Transparent)
              }
              val borderColor = when {
                  isFocused -> AuraPalette.Cyan
                  glass -> AuraPalette.GlassBorder
                  else -> Color.Transparent
              }

              IconButton(
                  onClick = onClick,
                  modifier = modifier
                      .scale(scale)
                      .size(size.dp)
                      .clip(CircleShape)
                      .then(bgModifier)
                      .border(if (isFocused) 2.dp else 1.dp, borderColor, CircleShape)
                      .onFocusChanged { isFocused = it.isFocused }
              ) {
                  Icon(
                      icon,
                      contentDescription = contentDescription,
                      tint = if (gradient) Color.White else tint,
                      modifier = Modifier.size((size * 0.50f).dp)
                  )
              }
          }

          private fun formatTime(ms: Long): String {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val min = totalSec / 60
              val sec = totalSec % 60
              return String.format(Locale.US, "%d:%02d", min, sec)
          }
