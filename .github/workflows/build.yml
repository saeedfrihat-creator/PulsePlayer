          package com.pulse.player

          import android.content.ComponentName
          import android.os.Bundle
          import android.view.KeyEvent
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.ui.Modifier
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.ViewModelProvider
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.ListenableFuture

          class MainActivity : ComponentActivity() {
              private lateinit var viewModel: PulseViewModel
              private var controllerFuture: ListenableFuture<MediaController>? = null
              private val isResumedState = mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  viewModel = ViewModelProvider(this)[PulseViewModel::class.java]
                  PulseFonts.init(this)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  setContent {
                      PulseTheme {
                          Surface(modifier = Modifier.fillMaxSize(), color = Pal.Ink) {
                              PulseApp(vm = viewModel, isResumed = isResumedState.value)
                          }
                      }
                  }
              }

              override fun onStart() {
                  super.onStart()
                  PlaybackBridge.uiVisible = true
                  val sessionToken = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  val future = MediaController.Builder(this, sessionToken).buildAsync()
                  controllerFuture = future
                  future.addListener({
                      // Ignore a controller that finished connecting after we already stopped.
                      if (controllerFuture === future) {
                          val controller = try {
                              future.get()
                          } catch (e: Exception) {
                              null
                          }
                          if (controller != null) viewModel.attachPlayer(controller)
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              override fun onResume() {
                  super.onResume()
                  isResumedState.value = true
                  PlaybackBridge.setVisualizerActive(true)
              }

              override fun onPause() {
                  viewModel.savePlaybackState(force = true)
                  isResumedState.value = false
                  PlaybackBridge.setVisualizerActive(false)
                  super.onPause()
              }

              override fun onStop() {
                  viewModel.savePlaybackState(force = true)
                  PlaybackBridge.uiVisible = false
                  viewModel.detachPlayer()
                  controllerFuture?.let { MediaController.releaseFuture(it) }
                  controllerFuture = null
                  super.onStop()
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      when (event.keyCode) {
                          KeyEvent.KEYCODE_MEDIA_STOP -> {
                              viewModel.stopPlayback()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                              viewModel.playPause()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PAUSE -> {
                              viewModel.player?.pause()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PLAY -> {
                              viewModel.player?.play()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_NEXT -> {
                              viewModel.next()
                              return true
                          }
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS -> {
                              viewModel.previous()
                              return true
                          }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }
          }
