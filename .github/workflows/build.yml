          sealed class Screen {
              data object Home : Screen()
              data class Folder(val key: String) : Screen()
              data object Settings : Screen()
              data class NetworkForm(val editId: String?) : Screen()
              data object DevicePicker : Screen()
          }

          /**
           * Holds everything the screens show. It survives rotation, theme and language changes,
           * so libraries are not rescanned and the open screen is kept.
           */
          class PulseViewModel(app: Application) : AndroidViewModel(app) {
              private val appContext: Context = app.applicationContext
              private val prefs = LibraryStore.prefs(app)

              val clock = VisualizerClock()

              // ---------------- Libraries ----------------
              var sources by mutableStateOf(LibraryStore.sources(app))
                  private set
              var songsBySource by mutableStateOf<Map<String, List<SongItem>>>(emptyMap())
                  private set
              var loadingSources by mutableStateOf<Set<String>>(emptySet())
                  private set
              var sourceErrors by mutableStateOf<Map<String, String>>(emptyMap())
                  private set
              var hasAudioPermission by mutableStateOf(false)
                  private set

              /** Folder picker data: null while not loaded. */
              var deviceFolderChoices by mutableStateOf<List<DeviceFolder>?>(null)
                  private set

              // ---------------- Navigation ----------------
              var screenStack by mutableStateOf<List<Screen>>(listOf(Screen.Home))
                  private set
              val screen: Screen
                  get() = screenStack.last()
              var isFullScreen by mutableStateOf(false)
              var searchActive by mutableStateOf(false)
              var searchQuery by mutableStateOf("")
              var folderQuery by mutableStateOf("")

              // ---------------- Preferences ----------------
              var visualizerStyle by mutableIntStateOf(prefs.getInt("scene", SCENE_HALO).mod(SCENE_SAKINA))
                  private set
              var manualStyleOverrideId by mutableStateOf<String?>(null)
                  private set
              var playbackMode by mutableIntStateOf(prefs.getInt("playback_mode", MODE_REPEAT_ALL).coerceIn(0, 3))
                  private set
              var playbackSpeed by mutableStateOf(prefs.getFloat("playback_speed", 1.0f).coerceIn(0.75f, 2.0f))
                  private set
              var eqPreset by mutableIntStateOf(prefs.getInt("eq_preset", EQ_NORMAL).coerceIn(EQ_NORMAL, EQ_WARM))
                  private set
              var stopOnTaskRemoved by mutableStateOf(prefs.getBoolean("stop_on_task_removed", true))
                  private set
              var useRealAlbumArt by mutableStateOf(prefs.getBoolean("use_real_album_art", true))
                  private set
              var sleepTimerRemainingSec by mutableLongStateOf(PlaybackBridge.sleepTimerRemainingSec())
                  private set
              var activeSection by mutableStateOf(
                  if (prefs.getString("active_section", "QURAN") == "MUSIC") LibrarySection.MUSIC else LibrarySection.QURAN
              )
                  private set
              private var userExplicitlyChoseSection = prefs.contains("active_section")

              var forcedQuranFolders by mutableStateOf(prefs.getStringSet("forced_quran_folders_v1", emptySet())?.toSet() ?: emptySet())
                  private set
              var forcedMusicFolders by mutableStateOf(prefs.getStringSet("forced_music_folders_v1", emptySet())?.toSet() ?: emptySet())
                  private set
              var forcedQuranSongs by mutableStateOf(prefs.getStringSet("forced_quran_songs_v1", emptySet())?.toSet() ?: emptySet())
                  private set
              var forcedMusicSongs by mutableStateOf(prefs.getStringSet("forced_music_songs_v1", emptySet())?.toSet() ?: emptySet())
                  private set
              var favoriteSongIds by mutableStateOf(prefs.getStringSet("favorite_songs_v1", emptySet())?.toSet() ?: emptySet())
                  private set
              var hiddenSongIds by mutableStateOf(prefs.getStringSet("hidden_songs_v2", emptySet())?.toSet() ?: emptySet())
                  private set
              var hiddenFolders by mutableStateOf(prefs.getStringSet("hidden_folders_v2", emptySet())?.toSet() ?: emptySet())
                  private set
              var quranResume by mutableStateOf<ResumeSnapshot?>(loadResumeSnapshot("quran"))
                  private set
              var musicResume by mutableStateOf<ResumeSnapshot?>(loadResumeSnapshot("music"))
                  private set
              private var lastResumePersistMs = 0L

              init {
                  PlaybackBridge.stopOnTaskRemoved = stopOnTaskRemoved
                  PlaybackBridge.setEqPreset(eqPreset)
                  migrateLegacyResumeIfNeeded()
              }

              // ---------------- Player ----------------
              var player by mutableStateOf<Player?>(null)
                  private set
              var isPlaying by mutableStateOf(false)
                  private set
              /** Empty means nothing is loaded: the UI shows its prompt in the current language. */
              var currentTitle by mutableStateOf("")
                  private set
              var currentArtist by mutableStateOf("")
                  private set
              /** Folder path of the current track (stored as the media item's album). */
              var currentAlbum by mutableStateOf("")
                  private set
              var currentMediaId by mutableStateOf("")
                  private set
              var positionMs by mutableLongStateOf(0L)
                  private set
              var durationMs by mutableLongStateOf(0L)
                  private set
              var shuffleEnabled by mutableStateOf(false)
                  private set
              var queueIndex by mutableIntStateOf(0)
                  private set
              var queueSize by mutableIntStateOf(0)
                  private set

              // ---------------- Derived ----------------
              val needsOnboarding: Boolean
                  get() = sources.isEmpty()

              val hasActiveTrack: Boolean
                  get() = currentMediaId.isNotEmpty() || isPlaying

              val visibleSongs by derivedStateOf {
                  songsBySource.values.flatten().filter { it.id !in hiddenSongIds && it.folderKey !in hiddenFolders }
              }

              val rawFolders by derivedStateOf {
                  visibleSongs.groupBy { it.folderKey }
                      .map { (key, list) ->
                          val first = list.first()
                          FolderGroup(key, first.sourceId, first.folder, list.sortedBy { it.title.lowercase() })
                      }
                      .sortedWith(compareBy<FolderGroup>({ it.displayName.lowercase() }, { it.key.lowercase() }))
              }

              val quranSongs by derivedStateOf {
                  visibleSongs.filter { sectionOf(it) == LibrarySection.QURAN }
              }

              val musicSongs by derivedStateOf {
                  visibleSongs.filter { sectionOf(it) == LibrarySection.MUSIC }
              }

              val quranFolders by derivedStateOf {
                  val real = quranSongs.groupBy { it.folderKey }
                      .map { (rawKey, list) ->
                          val first = list.first()
                          FolderGroup(
                              key = sectionFolderKey(LibrarySection.QURAN, rawKey),
                              sourceId = first.sourceId,
                              path = first.folder,
                              songs = list.sortedBy { it.title.lowercase() },
                              rawKey = rawKey
                          )
                      }
                      .sortedWith(compareBy<FolderGroup>({ it.displayName.lowercase() }, { it.rawKey.lowercase() }))
                  val favs = quranSongs.filter { it.id in favoriteSongIds }.sortedBy { it.title.lowercase() }
                  if (favs.isNotEmpty()) {
                      listOf(
                          FolderGroup(
                              key = FAVORITES_QURAN_KEY,
                              sourceId = FAVORITES_QURAN_KEY,
                              path = appContext.getString(R.string.favorites_quran_folder),
                              songs = favs,
                              rawKey = FAVORITES_QURAN_KEY
                          )
                      ) + real
                  } else {
                      real
                  }
              }

              val musicFolders by derivedStateOf {
                  val real = musicSongs.groupBy { it.folderKey }
                      .map { (rawKey, list) ->
                          val first = list.first()
                          FolderGroup(
                              key = sectionFolderKey(LibrarySection.MUSIC, rawKey),
                              sourceId = first.sourceId,
                              path = first.folder,
                              songs = list.sortedBy { it.title.lowercase() },
                              rawKey = rawKey
                          )
                      }
                      .sortedWith(compareBy<FolderGroup>({ it.displayName.lowercase() }, { it.rawKey.lowercase() }))
                  val favs = musicSongs.filter { it.id in favoriteSongIds }.sortedBy { it.title.lowercase() }
                  if (favs.isNotEmpty()) {
                      listOf(
                          FolderGroup(
                              key = FAVORITES_MUSIC_KEY,
                              sourceId = FAVORITES_MUSIC_KEY,
                              path = appContext.getString(R.string.favorites_music_folder),
                              songs = favs,
                              rawKey = FAVORITES_MUSIC_KEY
                          )
                      ) + real
                  } else {
                      real
                  }
              }

              val sectionFolders by derivedStateOf {
                  if (activeSection == LibrarySection.QURAN) quranFolders else musicFolders
              }

              val sectionSongs by derivedStateOf {
                  if (activeSection == LibrarySection.QURAN) quranSongs else musicSongs
              }

              val folders by derivedStateOf { quranFolders + musicFolders }

              val currentKind by derivedStateOf {
                  val song = if (currentMediaId.isNotBlank()) visibleSongs.firstOrNull { it.id == currentMediaId } else null
                  if (song != null) return@derivedStateOf kindOf(song)
                  ContentClassifier.classify(currentTitle, currentArtist, currentAlbum)
              }

              val currentSection: LibrarySection
                  get() = if (currentKind != IslamicKind.NONE) LibrarySection.QURAN else LibrarySection.MUSIC

              /** The current track's cover: generated from its folder name, like the folder tile. */
              val currentCover by derivedStateOf {
                  val folderName = currentAlbum.substringAfterLast('/').ifBlank { currentAlbum.ifBlank { "Pulse" } }
                  CoverArt.forName(folderName, currentKind)
              }

              val effectiveScene by derivedStateOf {
                  if (currentKind != IslamicKind.NONE && manualStyleOverrideId != currentMediaId) {
                      SCENE_SAKINA
                  } else {
                      visualizerStyle
                  }
              }

              val currentArtKey by derivedStateOf {
                  if (!useRealAlbumArt || currentKind != IslamicKind.NONE || currentMediaId.isBlank()) {
                      null
                  } else {
                      visibleSongs.firstOrNull { it.id == currentMediaId }?.let { artKeyOf(it) }
                  }
              }

              val activeResumeSnapshot: ResumeSnapshot?
                  get() = if (activeSection == LibrarySection.QURAN) quranResume else musicResume

              val canResumeActiveSection by derivedStateOf {
                  val snap = activeResumeSnapshot ?: return@derivedStateOf false
                  val inSection = sectionSongs.any { it.id == snap.songId }
                  if (!inSection) return@derivedStateOf false
                  !hasActiveTrack || (currentSection != activeSection && snap.songId != currentMediaId)
              }

              val manualOverrideCount: Int
                  get() = forcedQuranFolders.size + forcedMusicFolders.size + forcedQuranSongs.size + forcedMusicSongs.size

              val isAnyLoading: Boolean
                  get() = loadingSources.isNotEmpty()

              private val folderKinds = HashMap<String, IslamicKind>()
              private val remoteJobs = HashMap<String, Job>()

              private val playerListener = object : Player.Listener {
                  override fun onEvents(player: Player, events: Player.Events) = syncFromPlayer()
              }

              // ================= Sections & Folder helpers =================

              fun isVirtualFolderKey(key: String): Boolean =
                  key == FAVORITES_QURAN_KEY || key == FAVORITES_MUSIC_KEY

              fun selectSection(section: LibrarySection) {
                  userExplicitlyChoseSection = true
                  if (activeSection == section) return
                  activeSection = section
                  prefs.edit().putString("active_section", section.name).apply()
                  if (searchActive) searchQuery = ""
              }

              fun sectionFolderKey(section: LibrarySection, rawFolderKey: String): String =
                  (if (section == LibrarySection.QURAN) QURAN_KEY_PREFIX else MUSIC_KEY_PREFIX) + rawFolderKey

              /** On first run with no saved tab, pick Music automatically if only Music tracks exist. */
              fun autoSelectInitialSectionIfNeeded() {
                  if (userExplicitlyChoseSection) return
                  val hasQuran = quranSongs.isNotEmpty()
                  val hasMusic = musicSongs.isNotEmpty()
                  if (!hasQuran && hasMusic) {
                      activeSection = LibrarySection.MUSIC
                  } else if (hasQuran && !hasMusic) {
                      activeSection = LibrarySection.QURAN
                  }
              }

              fun folderByKey(key: String): FolderGroup? = folders.firstOrNull { it.key == key }

              fun sourceLabel(sourceId: String): String =
                  if (isVirtualFolderKey(sourceId)) "" else sources.firstOrNull { it.id == sourceId }?.label ?: ""

              fun sourceTypeOf(sourceId: String): SourceType? =
                  if (isVirtualFolderKey(sourceId)) null else sources.firstOrNull { it.id == sourceId }?.type

              /**
               * Per-track classification with clear priority:
               * 1) Manual per-track move
               * 2) Manual whole-folder move
               * 3) Automatic classification using track title, artist, and folder path
               * This allows mixed folders (like Downloads) to split automatically across Quran & Music.
               */
              fun kindOf(song: SongItem): IslamicKind {
                  if (song.id in forcedMusicSongs) return IslamicKind.NONE
                  if (song.id in forcedQuranSongs) {
                      return if (ContentClassifier.classify(song.title, song.artist) == IslamicKind.DHIKR) {
                          IslamicKind.DHIKR
                      } else {
                          IslamicKind.QURAN
                      }
                  }
                  if (song.folderKey in forcedMusicFolders) return IslamicKind.NONE
                  if (song.folderKey in forcedQuranFolders) {
                      return if (ContentClassifier.classify(song.folder, song.title, song.artist) == IslamicKind.DHIKR) {
                          IslamicKind.DHIKR
                      } else {
                          IslamicKind.QURAN
                      }
                  }
                  return ContentClassifier.classify(song.title, song.artist, song.folder)
              }

              fun sectionOf(song: SongItem): LibrarySection =
                  if (kindOf(song) != IslamicKind.NONE) LibrarySection.QURAN else LibrarySection.MUSIC

              fun kindOf(folder: FolderGroup): IslamicKind {
                  if (folder.key == FAVORITES_QURAN_KEY) return IslamicKind.QURAN
                  if (folder.key == FAVORITES_MUSIC_KEY) return IslamicKind.NONE
                  if (folder.key.startsWith(MUSIC_KEY_PREFIX)) return IslamicKind.NONE
                  if (folder.key.startsWith(QURAN_KEY_PREFIX)) {
                      val hasQuran = folder.songs.any { kindOf(it) == IslamicKind.QURAN }
                      return if (hasQuran) IslamicKind.QURAN else IslamicKind.DHIKR
                  }
                  return folder.songs.firstOrNull()?.let { kindOf(it) } ?: IslamicKind.NONE
              }

              fun kindOfResume(snap: ResumeSnapshot): IslamicKind {
                  visibleSongs.firstOrNull { it.id == snap.songId }?.let { return kindOf(it) }
                  return ContentClassifier.classify(snap.title, snap.artist, snap.folder)
              }

              fun isMixedFolder(rawFolderKey: String): Boolean {
                  if (isVirtualFolderKey(rawFolderKey)) return false
                  val inQ = quranFolders.any { it.rawKey == rawFolderKey }
                  val inM = musicFolders.any { it.rawKey == rawFolderKey }
                  return inQ && inM
              }

              fun moveSongToSection(song: SongItem, target: LibrarySection) {
                  val nextQuran: Set<String>
                  val nextMusic: Set<String>
                  if (target == LibrarySection.QURAN) {
                      nextQuran = forcedQuranSongs + song.id
                      nextMusic = forcedMusicSongs - song.id
                  } else {
                      nextMusic = forcedMusicSongs + song.id
                      nextQuran = forcedQuranSongs - song.id
                  }
                  forcedQuranSongs = nextQuran
                  forcedMusicSongs = nextMusic
                  prefs.edit()
                      .putStringSet("forced_quran_songs_v1", HashSet(nextQuran))
                      .putStringSet("forced_music_songs_v1", HashSet(nextMusic))
                      .apply()
                  val msgRes = if (target == LibrarySection.QURAN) R.string.toast_song_moved_to_quran else R.string.toast_song_moved_to_music
                  appContext.showToast(appContext.getString(msgRes, song.title))
              }

              fun moveFolderToSection(rawFolderKey: String, target: LibrarySection) {
                  if (isVirtualFolderKey(rawFolderKey)) return
                  val songIdsInFolder = visibleSongs.filter { it.folderKey == rawFolderKey }.map { it.id }.toSet()
                  val displayName = rawFolders.firstOrNull { it.rawKey == rawFolderKey }?.displayName
                      ?: rawFolderKey.substringAfter('|').substringAfterLast('/')
                  val nextQuranFolders: Set<String>
                  val nextMusicFolders: Set<String>
                  if (target == LibrarySection.QURAN) {
                      nextQuranFolders = forcedQuranFolders + rawFolderKey
                      nextMusicFolders = forcedMusicFolders - rawFolderKey
                  } else {
                      nextMusicFolders = forcedMusicFolders + rawFolderKey
                      nextQuranFolders = forcedQuranFolders - rawFolderKey
                  }
                  // Clear per-track overrides inside this folder so the entire folder moves cleanly together.
                  val nextQuranSongs = forcedQuranSongs - songIdsInFolder
                  val nextMusicSongs = forcedMusicSongs - songIdsInFolder

                  forcedQuranFolders = nextQuranFolders
                  forcedMusicFolders = nextMusicFolders
                  forcedQuranSongs = nextQuranSongs
                  forcedMusicSongs = nextMusicSongs
                  folderKinds.clear()
                  prefs.edit()
                      .putStringSet("forced_quran_folders_v1", HashSet(nextQuranFolders))
                      .putStringSet("forced_music_folders_v1", HashSet(nextMusicFolders))
                      .putStringSet("forced_quran_songs_v1", HashSet(nextQuranSongs))
                      .putStringSet("forced_music_songs_v1", HashSet(nextMusicSongs))
                      .apply()

                  selectSection(target)
                  val top = screenStack.lastOrNull() as? Screen.Folder
                  if (top != null && (
                          top.key == sectionFolderKey(LibrarySection.QURAN, rawFolderKey) ||
                              top.key == sectionFolderKey(LibrarySection.MUSIC, rawFolderKey)
                          )
                  ) {
                      screenStack = screenStack.dropLast(1) + Screen.Folder(sectionFolderKey(target, rawFolderKey))
                  }
                  val msgRes = if (target == LibrarySection.QURAN) R.string.toast_moved_to_quran else R.string.toast_moved_to_music
                  appContext.showToast(appContext.getString(msgRes, displayName))
              }

              fun resetFolderOverrides() {
                  forcedQuranFolders = emptySet()
                  forcedMusicFolders = emptySet()
                  forcedQuranSongs = emptySet()
                  forcedMusicSongs = emptySet()
                  folderKinds.clear()
                  prefs.edit()
                      .remove("forced_quran_folders_v1")
                      .remove("forced_music_folders_v1")
                      .remove("forced_quran_songs_v1")
                      .remove("forced_music_songs_v1")
                      .apply()
                  appContext.showToast(appContext.getString(R.string.toast_categories_reset))
              }

              fun coverOf(folder: FolderGroup): CoverSpec = when (folder.key) {
                  FAVORITES_QURAN_KEY -> CoverArt.forFavorites(isSakina = true)
                  FAVORITES_MUSIC_KEY -> CoverArt.forFavorites(isSakina = false)
                  else -> CoverArt.forName(folder.displayName, kindOf(folder))
              }

              fun artKeyOf(song: SongItem): String? {
                  if (!useRealAlbumArt) return null
                  return when {
                      !song.isRemote -> "local|${song.uri}"
                      song.coverArtId.isNotBlank() -> "nav|${song.sourceId}|${song.coverArtId}"
                      else -> null
                  }
              }

              fun artKeyOf(folder: FolderGroup): String? {
                  if (!useRealAlbumArt || isVirtualFolderKey(folder.key) || kindOf(folder) != IslamicKind.NONE) {
                      return null
                  }
                  return folder.songs.firstNotNullOfOrNull { artKeyOf(it) }
              }

              fun isFavorite(songId: String): Boolean = songId in favoriteSongIds

              fun toggleFavorite(songId: String, announce: Boolean = true) {
                  if (songId.isBlank()) return
                  val next = if (songId in favoriteSongIds) favoriteSongIds - songId else favoriteSongIds + songId
                  val added = songId in next
                  favoriteSongIds = next
                  prefs.edit().putStringSet("favorite_songs_v1", HashSet(next)).apply()
                  if (announce) {
                      appContext.showToast(
                          appContext.getString(if (added) R.string.toast_added_favorite else R.string.toast_removed_favorite)
                      )
                  }
              }

              fun setStopOnTaskRemovedPref(enabled: Boolean) {
                  stopOnTaskRemoved = enabled
                  PlaybackBridge.stopOnTaskRemoved = enabled
                  prefs.edit().putBoolean("stop_on_task_removed", enabled).apply()
              }

              fun setUseRealAlbumArtPref(enabled: Boolean) {
                  useRealAlbumArt = enabled
                  prefs.edit().putBoolean("use_real_album_art", enabled).apply()
              }

              fun setEqPresetPref(preset: Int) {
                  val clean = preset.coerceIn(EQ_NORMAL, EQ_WARM)
                  eqPreset = clean
                  prefs.edit().putInt("eq_preset", clean).apply()
                  PlaybackBridge.setEqPreset(clean)
              }

              fun setSleepTimer(minutes: Int) {
                  PlaybackBridge.setSleepTimerMinutes(minutes)
                  sleepTimerRemainingSec = when {
                      minutes < 0 -> -1L
                      minutes == 0 -> 0L
                      else -> minutes * 60L
                  }
                  if (minutes == 0) {
                      appContext.showToast(appContext.getString(R.string.toast_sleep_off))
                  } else {
                      val labelRes = when (minutes) {
                          15 -> R.string.sleep_15
                          30 -> R.string.sleep_30
                          45 -> R.string.sleep_45
                          60 -> R.string.sleep_60
                          else -> R.string.sleep_end_of_track
                      }
                      appContext.showToast(appContext.getString(R.string.toast_sleep_set, appContext.getString(labelRes)))
                  }
              }

              fun cyclePlaybackSpeed() {
                  val steps = floatArrayOf(0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
                  val curIdx = steps.indexOfFirst { kotlin.math.abs(it - playbackSpeed) < 0.05f }
                  val next = steps[(curIdx + 1) % steps.size]
                  playbackSpeed = next
                  prefs.edit().putFloat("playback_speed", next).apply()
                  player?.setPlaybackSpeed(next)
              }

              private fun loadResumeSnapshot(prefix: String): ResumeSnapshot? {
                  val id = prefs.getString("${prefix}_last_song_id", null)?.takeIf { it.isNotBlank() } ?: return null
                  return ResumeSnapshot(
                      songId = id,
                      folderKey = prefs.getString("${prefix}_last_folder_key", "") ?: "",
                      title = prefs.getString("${prefix}_last_song_title", "") ?: "",
                      artist = prefs.getString("${prefix}_last_song_artist", "") ?: "",
                      folder = prefs.getString("${prefix}_last_song_folder", "") ?: "",
                      positionMs = prefs.getLong("${prefix}_last_position_ms", 0L).coerceAtLeast(0L),
                      durationMs = prefs.getLong("${prefix}_last_duration_ms", 0L).coerceAtLeast(0L)
                  )
              }

              private fun persistResumeSnapshot(prefix: String, snap: ResumeSnapshot) {
                  prefs.edit()
                      .putString("${prefix}_last_song_id", snap.songId)
                      .putString("${prefix}_last_folder_key", snap.folderKey)
                      .putString("${prefix}_last_song_title", snap.title)
                      .putString("${prefix}_last_song_artist", snap.artist)
                      .putString("${prefix}_last_song_folder", snap.folder)
                      .putLong("${prefix}_last_position_ms", snap.positionMs)
                      .putLong("${prefix}_last_duration_ms", snap.durationMs)
                      .apply()
              }

              private fun migrateLegacyResumeIfNeeded() {
                  if (quranResume != null || musicResume != null) return
                  val id = prefs.getString("last_song_id", null)?.takeIf { it.isNotBlank() } ?: return
                  val snap = ResumeSnapshot(
                      songId = id,
                      folderKey = prefs.getString("last_folder_key", "") ?: "",
                      title = prefs.getString("last_song_title", "") ?: "",
                      artist = prefs.getString("last_song_artist", "") ?: "",
                      folder = prefs.getString("last_song_folder", "") ?: "",
                      positionMs = prefs.getLong("last_position_ms", 0L).coerceAtLeast(0L),
                      durationMs = prefs.getLong("last_duration_ms", 0L).coerceAtLeast(0L)
                  )
                  val isQuran = ContentClassifier.classify(snap.title, snap.artist, snap.folder) != IslamicKind.NONE
                  if (isQuran) {
                      quranResume = snap
                      persistResumeSnapshot("quran", snap)
                  } else {
                      musicResume = snap
                      persistResumeSnapshot("music", snap)
                  }
              }

              fun savePlaybackState(force: Boolean = true) {
                  val id = currentMediaId
                  if (id.isBlank()) return
                  val now = System.currentTimeMillis()
                  if (!force && now - lastResumePersistMs < 5_000L) return
                  lastResumePersistMs = now
                  val pos = player?.currentPosition?.coerceAtLeast(0L) ?: positionMs
                  val dur = player?.duration?.coerceAtLeast(0L) ?: durationMs
                  val safePos = if (dur > 10_000L && pos >= dur - 3_000L) 0L else pos
                  val song = visibleSongs.firstOrNull { it.id == id }
                  val section = if (song != null) sectionOf(song) else currentSection
                  val existing = if (section == LibrarySection.QURAN) quranResume else musicResume
                  val snap = ResumeSnapshot(
                      songId = id,
                      folderKey = song?.folderKey ?: (existing?.folderKey ?: ""),
                      title = currentTitle.ifBlank { song?.title ?: "" },
                      artist = currentArtist.ifBlank { song?.artist ?: "" },
                      folder = currentAlbum.ifBlank { song?.folder ?: "" },
                      positionMs = safePos,
                      durationMs = dur
                  )
                  if (section == LibrarySection.QURAN) {
                      quranResume = snap
                      persistResumeSnapshot("quran", snap)
                  } else {
                      musicResume = snap
                      persistResumeSnapshot("music", snap)
                  }
              }

              fun resumeSectionPlayback(section: LibrarySection = activeSection): Boolean {
                  val snap = (if (section == LibrarySection.QURAN) quranResume else musicResume) ?: return false
                  val secSongs = if (section == LibrarySection.QURAN) quranSongs else musicSongs
                  val scopedKey = sectionFolderKey(section, snap.folderKey)
                  val folderSongs = folderByKey(scopedKey)?.songs
                  val list = if (folderSongs != null && folderSongs.any { it.id == snap.songId }) {
                      folderSongs
                  } else {
                      secSongs
                  }
                  val index = list.indexOfFirst { it.id == snap.songId }
                  if (index < 0) return false
                  return playList(list, index, shuffle = false, startPositionMs = snap.positionMs)
              }

              // ================= Navigation =================

              fun navigate(target: Screen) {
                  if (screenStack.lastOrNull() == target) return
                  screenStack = screenStack + target
                  folderQuery = ""
              }

              /** Returns false when already on the home screen. */
              fun back(): Boolean {
                  if (screenStack.size <= 1) return false
                  screenStack = screenStack.dropLast(1)
                  folderQuery = ""
                  return true
              }

              private fun backTo(predicate: (Screen) -> Boolean) {
                  val index = screenStack.indexOfLast(predicate)
                  screenStack = if (index >= 0) screenStack.subList(0, index + 1).toList() else listOf(Screen.Home)
              }

              // ================= Player connection =================

              fun attachPlayer(newPlayer: Player) {
                  if (player === newPlayer) return
                  player?.removeListener(playerListener)
                  player = newPlayer
                  newPlayer.addListener(playerListener)
                  applyPlaybackMode(playbackMode, announce = false)
                  newPlayer.setPlaybackSpeed(playbackSpeed)
                  syncFromPlayer()
              }

              fun detachPlayer() {
                  player?.removeListener(playerListener)
                  player = null
                  isPlaying = false
              }

              private fun syncFromPlayer() {
                  val p = player ?: return
                  isPlaying = p.isPlaying
                  currentMediaId = p.currentMediaItem?.mediaId ?: ""
                  currentTitle = p.mediaMetadata.title?.toString() ?: ""
                  currentArtist = p.mediaMetadata.artist?.toString() ?: ""
                  currentAlbum = p.mediaMetadata.albumTitle?.toString() ?: ""
                  durationMs = p.duration.coerceAtLeast(0L)
                  positionMs = p.currentPosition.coerceAtLeast(0L)
                  shuffleEnabled = p.shuffleModeEnabled
                  queueSize = p.mediaItemCount
                  queueIndex = if (p.mediaItemCount > 0) p.currentMediaItemIndex + 1 else 0
                  sleepTimerRemainingSec = PlaybackBridge.sleepTimerRemainingSec()
                  if (currentMediaId.isNotBlank()) savePlaybackState(force = !isPlaying)
              }

              fun pollPosition() {
                  val p = player ?: return
                  positionMs = p.currentPosition.coerceAtLeast(0L)
                  durationMs = p.duration.coerceAtLeast(0L)
                  sleepTimerRemainingSec = PlaybackBridge.sleepTimerRemainingSec()
                  savePlaybackState(force = false)
              }

              // ================= Libraries =================

              fun onAudioPermission(granted: Boolean) {
                  val changed = granted != hasAudioPermission
                  hasAudioPermission = granted
                  if (granted && changed) {
                      sources.firstOrNull { it.type == SourceType.DEVICE }?.let { refreshSource(it, force = true) }
                  }
              }

              /** Loads every library: cached network libraries show at once and refresh when stale. */
              fun loadAll(force: Boolean = false) {
                  sources.forEach { refreshSource(it, force) }
              }

              fun refreshSource(source: LibrarySource, force: Boolean) {
                  when (source.type) {
                      SourceType.DEVICE -> {
                          if (!hasAudioPermission) return
                          viewModelScope.launch {
                              setLoading(source.id, true)
                              val songs = MusicRepository.loadDeviceSongs(appContext, source)
                              if (sources.any { it.id == source.id }) {
                                  songsBySource = songsBySource + (source.id to songs)
                                  sourceErrors = sourceErrors - source.id
                              }
                              setLoading(source.id, false)
                          }
                      }
                      SourceType.SMB, SourceType.NAVIDROME -> {
                          if (!source.isConfigured) return
                          if (!force && remoteJobs[source.id]?.isActive == true) return
                          remoteJobs[source.id]?.cancel()
                          remoteJobs[source.id] = viewModelScope.launch {
                              if (!force && songsBySource[source.id] == null) {
                                  val snapshot = LibraryCache.load(appContext, source)
                                  if (snapshot != null && snapshot.songs.isNotEmpty()) {
                                      songsBySource = songsBySource + (source.id to snapshot.songs)
                                      val age = System.currentTimeMillis() - snapshot.savedAtMs
                                      if (age in 0..REMOTE_AUTO_REFRESH_MS) return@launch
                                  }
                              } else if (!force) {
                                  return@launch
                              }
                              setLoading(source.id, true)
                              val result = if (source.type == SourceType.SMB) {
                                  MusicRepository.loadSmbSongs(appContext, source)
                              } else {
                                  MusicRepository.loadNavidromeSongs(appContext, source)
                              }
                              val stillThere = sources.firstOrNull { it.id == source.id }
                              if (stillThere != null && stillThere.cacheKey == source.cacheKey) {
                                  val songs = result.getOrNull()
                                  if (songs != null) {
                                      songsBySource = songsBySource + (source.id to songs)
                                      sourceErrors = sourceErrors - source.id
                                      LibraryCache.save(appContext, source, songs)
                                  } else {
                                      val e = result.exceptionOrNull()
                                      val reason = e?.localizedMessage?.takeIf { it.isNotBlank() } ?: e?.javaClass?.simpleName ?: ""
                                      sourceErrors = sourceErrors + (source.id to appContext.getString(R.string.connection_failed, reason))
                                  }
                              }
                              setLoading(source.id, false)
                          }
                      }
                  }
              }

              private fun setLoading(id: String, loading: Boolean) {
                  loadingSources = if (loading) loadingSources + id else loadingSources - id
              }

              fun refreshAll() {
                  loadAll(force = true)
              }

              fun saveNetworkSource(source: LibrarySource) {
                  val previous = sources.firstOrNull { it.id == source.id }
                  val label = source.label.ifBlank {
                      when (source.type) {
                          SourceType.SMB -> source.smbSubFolder.trim().replace('\\', '/').trim('/').substringAfterLast('/')
                              .ifBlank { source.smbShare.trim() }
                              .ifBlank { appContext.getString(R.string.mode_smb) }
                          else -> appContext.getString(R.string.mode_navidrome)
                      }
                  }
                  LibraryStore.upsert(appContext, source.copy(label = label))
                  sources = LibraryStore.sources(appContext)
                  val saved = sources.first { it.id == source.id }
                  if (previous != null && previous.cacheKey != saved.cacheKey) {
                      songsBySource = songsBySource - saved.id
                      LibraryCache.delete(appContext, saved.id)
                  }
                  sourceErrors = sourceErrors - saved.id
                  finishLibraryEdit()
                  refreshSource(saved, force = true)
              }

              fun loadDeviceFolderChoices() {
                  if (!hasAudioPermission) return
                  viewModelScope.launch {
                      deviceFolderChoices = null
                      deviceFolderChoices = MusicRepository.listDeviceFolders(appContext)
                  }
              }

              /** allFolders = every audio folder on the device, now and in the future. */
              fun saveDeviceSelection(allFolders: Boolean, selected: Set<String>) {
                  val existing = sources.firstOrNull { it.type == SourceType.DEVICE }
                  val source = LibrarySource(
                      id = existing?.id ?: DEVICE_SOURCE_ID,
                      type = SourceType.DEVICE,
                      label = existing?.label?.ifBlank { null } ?: appContext.getString(R.string.library_device),
                      deviceFolders = if (allFolders) emptyList() else selected.sorted()
                  )
                  LibraryStore.upsert(appContext, source)
                  sources = LibraryStore.sources(appContext)
                  finishLibraryEdit()
                  refreshSource(sources.first { it.id == source.id }, force = true)
              }

              fun removeSource(id: String) {
                  LibraryStore.remove(appContext, id)
                  LibraryCache.delete(appContext, id)
                  remoteJobs.remove(id)?.cancel()
                  sources = LibraryStore.sources(appContext)
                  songsBySource = songsBySource - id
                  sourceErrors = sourceErrors - id
                  setLoading(id, false)
              }

              /** After adding a library: from first run go home; from settings return to settings. */
              private fun finishLibraryEdit() {
                  if (screenStack.any { it is Screen.Settings }) {
                      backTo { it is Screen.Settings }
                  } else {
                      screenStack = listOf(Screen.Home)
                  }
              }

              // ================= Hide / restore =================

              private fun saveHidden(songs: Set<String>, folders: Set<String>) {
                  hiddenSongIds = songs
                  hiddenFolders = folders
                  prefs.edit()
                      .putStringSet("hidden_songs_v2", HashSet(songs))
                      .putStringSet("hidden_folders_v2", HashSet(folders))
                      .apply()
              }

              fun hideSong(songId: String) {
                  saveHidden(hiddenSongIds + songId, hiddenFolders)
                  if (currentMediaId == songId) player?.pause()
              }

              fun hideFolder(rawFolderKey: String) {
                  saveHidden(hiddenSongIds, hiddenFolders + rawFolderKey)
                  val topKey = (screen as? Screen.Folder)?.key
                  if (topKey == rawFolderKey ||
                      topKey == sectionFolderKey(LibrarySection.QURAN, rawFolderKey) ||
                      topKey == sectionFolderKey(LibrarySection.MUSIC, rawFolderKey)
                  ) {
                      back()
                  }
              }

              fun restoreHidden() {
                  saveHidden(emptySet(), emptySet())
              }

              // ================= Playback =================

              /** Returns true when playback started. */
              fun playList(
                  list: List<SongItem>,
                  index: Int,
                  shuffle: Boolean = false,
                  startPositionMs: Long = 0L
              ): Boolean {
                  val p = player ?: return false
                  if (list.isEmpty()) return false
                  val mediaItems = list.map { song ->
                      MediaItem.Builder()
                          .setMediaId(song.id)
                          .setUri(song.uri)
                          .setMediaMetadata(
                              MediaMetadata.Builder()
                                  .setTitle(song.title)
                                  .setArtist(song.artist)
                                  .setAlbumTitle(song.folder)
                                  .build()
                          )
                          .build()
                  }
                  applyPlaybackMode(playbackMode, announce = false)
                  p.setPlaybackSpeed(playbackSpeed)
                  p.shuffleModeEnabled = shuffle
                  val start = if (shuffle) (mediaItems.indices).random() else index.coerceIn(0, mediaItems.lastIndex)
                  p.setMediaItems(mediaItems, start, startPositionMs.coerceAtLeast(0L))
                  p.prepare()
                  p.play()
                  return true
              }

              fun shuffleSection(): Boolean = playList(sectionSongs, 0, shuffle = true)

              fun playPause() {
                  val p = player ?: return
                  if (p.isPlaying) {
                      p.pause()
                  } else {
                      if (p.playbackState == Player.STATE_IDLE && p.mediaItemCount > 0) {
                          p.prepare()
                      }
                      if (p.playbackState == Player.STATE_ENDED ||
                          (p.duration > 0L && p.currentPosition >= p.duration - 500L)
                      ) {
                          p.seekTo(0L)
                      }
                      p.play()
                  }
              }

              fun stopPlayback(announce: Boolean = true) {
                  savePlaybackState(force = true)
                  PlaybackBridge.setSleepTimerMinutes(0)
                  sleepTimerRemainingSec = 0L
                  AudioSpectrumBus.clear()
                  val p = player
                  if (p != null) {
                      p.playWhenReady = false
                      p.stop()
                      p.clearMediaItems()
                  } else {
                      PlaybackBridge.stopPlayback(stopService = false)
                  }
                  isPlaying = false
                  currentMediaId = ""
                  currentTitle = ""
                  currentArtist = ""
                  currentAlbum = ""
                  positionMs = 0L
                  durationMs = 0L
                  queueIndex = 0
                  queueSize = 0
                  isFullScreen = false
                  if (announce) appContext.showToast(appContext.getString(R.string.toast_stopped))
              }

              fun next() {
                  player?.let { it.seekToNext(); it.play() }
              }

              fun previous() {
                  player?.let { it.seekToPrevious(); it.play() }
              }

              fun rewind() {
                  player?.let { it.seekTo((it.currentPosition - 15_000L).coerceAtLeast(0L)) }
              }

              fun forward() {
                  player?.let { p ->
                      val limit = p.duration.takeIf { it > 0L } ?: Long.MAX_VALUE
                      p.seekTo((p.currentPosition + 15_000L).coerceAtMost(limit))
                  }
              }

              fun seekTo(positionMs: Long) {
                  player?.seekTo(positionMs.coerceAtLeast(0L))
              }

              fun toggleShuffle() {
                  player?.let { it.shuffleModeEnabled = !it.shuffleModeEnabled }
              }

              fun applyPlaybackMode(mode: Int, announce: Boolean) {
                  playbackMode = mode
                  prefs.edit().putInt("playback_mode", mode).apply()
                  val p = player
                  val label = when (mode) {
                      MODE_REPEAT_ALL -> {
                          PlaybackBridge.setStopAfterCurrent(false)
                          p?.repeatMode = Player.REPEAT_MODE_ALL
                          R.string.mode_repeat_all
                      }
                      MODE_REPEAT_ONE -> {
                          PlaybackBridge.setStopAfterCurrent(false)
                          p?.repeatMode = Player.REPEAT_MODE_ONE
                          R.string.mode_repeat_one
                      }
                      MODE_PLAY_ONCE -> {
                          p?.repeatMode = Player.REPEAT_MODE_OFF
                          PlaybackBridge.setStopAfterCurrent(true)
                          R.string.mode_play_once
                      }
                      else -> {
                          PlaybackBridge.setStopAfterCurrent(false)
                          p?.repeatMode = Player.REPEAT_MODE_OFF
                          R.string.mode_repeat_off
                      }
                  }
                  if (announce) appContext.showToast(appContext.getString(label))
              }

              fun cyclePlaybackMode() {
                  applyPlaybackMode((playbackMode + 1) % 4, announce = true)
              }

              /** Picks a scene; choosing one on a Quran track overrides Sakina for that track only. */
              fun selectScene(scene: Int) {
                  if (scene == SCENE_SAKINA) {
                      manualStyleOverrideId = null
                      return
                  }
                  visualizerStyle = scene.mod(SCENE_SAKINA)
                  manualStyleOverrideId = currentMediaId
                  prefs.edit().putInt("scene", visualizerStyle).apply()
              }

              fun cycleScene() {
                  val next = if (effectiveScene == SCENE_SAKINA) 0 else (effectiveScene + 1)
                  if (next >= SCENE_SAKINA && currentKind != IslamicKind.NONE) {
                      selectScene(SCENE_SAKINA)
                  } else {
                      selectScene(next.mod(SCENE_SAKINA))
                  }
              }

              override fun onCleared() {
                  player?.removeListener(playerListener)
                  player = null
                  super.onCleared()
              }
          }
