                  val base = normalizeUrl(source.navUrl)
                  val encId = URLEncoder.encode(coverArtId, "UTF-8")
                  return "$base/rest/getCoverArt.view?id=$encId&size=$size&${authParams(source.navUser, source.navPass)}"
              }

              private fun md5(input: String): String {
                  val bytes = MessageDigest.getInstance("MD5").digest(input.toByteArray(Charsets.UTF_8))
                  return bytes.joinToString("") { "%02x".format(it) }
              }
