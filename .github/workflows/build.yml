          object NavidromeHelper {
              const val NAV_SCHEME = "pulsenav"
              /** Shows up as a player named "PulsePlayer" in Navidrome's Players page. */
              const val CLIENT_NAME = "PulsePlayer"

              /** Stored in the library and media items instead of the real stream URL (which embeds a token). */
              fun songUri(sourceId: String, songId: String): String = Uri.Builder()
                  .scheme(NAV_SCHEME)
                  .authority("song")
                  .appendQueryParameter("src", sourceId)
                  .appendQueryParameter("id", songId)
                  .build()
                  .toString()

              fun normalizeUrl(url: String): String {
                  val trimmed = url.trim().trimEnd('/')
                  return if (trimmed.startsWith("http://") || trimmed.startsWith("https://")) trimmed else "http://$trimmed"
              }

              /** Fresh salt + token per call (Subsonic token auth). */
              fun authParams(user: String, pass: String): String {
                  val salt = UUID.randomUUID().toString().replace("-", "").take(12)
                  val token = md5(pass + salt)
                  val encUser = URLEncoder.encode(user, "UTF-8")
                  return "u=$encUser&t=$token&s=$salt&v=1.16.1&c=$CLIENT_NAME"
              }

              fun streamUri(source: LibrarySource, songId: String): Uri {
                  val base = normalizeUrl(source.navUrl)
                  val encId = URLEncoder.encode(songId, "UTF-8")
                  return Uri.parse("$base/rest/stream.view?id=$encId&${authParams(source.navUser, source.navPass)}")
