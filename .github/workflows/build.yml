                  "abdulbasit", "abdul basit", "abdelbasset", "abd al-basit", "dosari", "dossari",
                  "ghamdi", "shuraim", "qatami", "ajmi", "hudhaify", "hazza", "balooshi", "balushi",
                  "abkar", "tablawi", "luhaydan"
              )

              // Supplications and remembrance: Islamic, but not Quran, so they get their own header.
              private val dhikrKeywords = arrayOf(
                  "أذكار", "اذكار", "ذكر الله", "دعاء", "أدعية", "ادعية", "تسبيح", "استغفار", "تهليل",
