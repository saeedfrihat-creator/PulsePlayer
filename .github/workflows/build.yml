                                          it.folder.contains(searchQuery, ignoreCase = true)
                                  }
                                  if (matchedSongs.isEmpty()) {
                                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                          Text(stringResource(R.string.no_search_results), color = Color.Gray)
                                      }
                                  } else {
                                      LazyColumn(
                                          modifier = Modifier.fillMaxSize(),
                                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                                          verticalArrangement = Arrangement.spacedBy(6.dp)
                                      ) {
                                          itemsIndexed(matchedSongs, key = { idx, item -> "${item.id}_s_$idx" }) { index, song ->
                                              SongRowItem(
                                                  song = song,
                                                  isCurrent = song.id == currentMediaId,
                                                  isPlaying = isPlaying,
                                                  phase = animPhase,
                                                  amplitude = activeAmplitude,
                                                  showFolderBadge = true,
                                                  onClick = { playListFromIndex(matchedSongs, index) },
                                                  onManageClick = if (!song.isRemote) { { songToManage = song } } else null
                                              )
                                          }
                                      }
                                  }
                              } else if (activeFolders.isEmpty()) {
                                  Column(
                                      Modifier.fillMaxSize().padding(24.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center
                                  ) {
                                      Text(
                                          if (selectedTab == 0) {
                                              stringResource(R.string.no_local_folders)
                                          } else {
                                              stringResource(R.string.connect_navidrome_hint)
                                          },
                                          color = Color.Gray,
                                          textAlign = TextAlign.Center
                                      )
                                      if (selectedTab == 0 && (hiddenLocalFolders.isNotEmpty() || hiddenSongIds.isNotEmpty())) {
                                          Spacer(Modifier.height(12.dp))
                                          Button(onClick = { saveHiddenSets(emptySet(), emptySet()) }) {
                                              Text(stringResource(R.string.restore_hidden_btn))
                                          }
                                      }
                                  }
                              } else {
                                  LazyColumn(
                                      modifier = Modifier.fillMaxSize(),
                                      contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                                      verticalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      items(activeFolders, key = { it.name }) { folder ->
                                          FolderRowItem(
                                              folder = folder,
                                              isRemote = selectedTab == 1,
                                              onOpen = {
                                                  if (selectedTab == 0) selectedLocalFolder = folder.name
                                                  else selectedRemoteFolder = folder.name
                                              },
                                              onHideFolder = if (selectedTab == 0) {
                                                  {
                                                      hideLocalFolder(folder.name)
                                                      Toast.makeText(
                                                          context,
                                                          context.getString(R.string.toast_folder_hidden, folder.name),
                                                          Toast.LENGTH_SHORT
                                                      ).show()
                                                  }
                                              } else null
                                          )
                                      }
                                  }
                              }
                          } else {
                              val folderSongs = (activeFolders.firstOrNull { it.name == currentOpenFolder }?.songs ?: emptyList())
                                  .filter {
                                      searchQuery.isBlank() ||
                                          it.title.contains(searchQuery, ignoreCase = true) ||
                                          it.artist.contains(searchQuery, ignoreCase = true)
                                  }

                              if (folderSongs.isEmpty()) {
                                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                      Text(stringResource(R.string.no_songs_in_folder), color = Color.Gray)
                                  }
                              } else {
                                  LazyColumn(
                                      modifier = Modifier.fillMaxSize(),
                                      contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp),
                                      verticalArrangement = Arrangement.spacedBy(6.dp)
                                  ) {
                                      itemsIndexed(folderSongs, key = { idx, item -> "${item.id}_$idx" }) { index, song ->
                                          SongRowItem(
                                              song = song,
                                              isCurrent = song.id == currentMediaId,
                                              isPlaying = isPlaying,
                                              phase = animPhase,
                                              amplitude = activeAmplitude,
                                              showFolderBadge = false,
                                              onClick = { playListFromIndex(folderSongs, index) },
                                              onManageClick = if (!song.isRemote) { { songToManage = song } } else null
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  if (isWideScreen) {
                      Row(
                          modifier = Modifier
                              .padding(padding)
                              .fillMaxSize()
                              .padding(horizontal = 16.dp, vertical = 10.dp),
                          horizontalArrangement = Arrangement.spacedBy(16.dp)
                      ) {
                          libraryContent(Modifier.weight(1.3f).fillMaxHeight())
                          TvNowPlayingPanel(
                              title = currentTitle,
                              artist = currentArtist,
                              isPlaying = isPlaying,
                              positionMs = positionMs,
                              durationMs = durationMs,
                              shuffleEnabled = shuffleEnabled,
                              repeatMode = repeatMode,
                              style = visualizerStyle,
                              phase = animPhase,
                              amplitude = activeAmplitude,
                              onPlayPause = onPlayPause,
                              onNext = onNext,
                              onPrev = onPrev,
                              onRewind = onRewind,
                              onForward = onForward,
                              onToggleShuffle = onToggleShuffle,
                              onToggleRepeat = onToggleRepeat,
                              onCycleStyle = { cycleVisualizerStyle() },
                              onFullScreen = { isFullScreen = true },
                              modifier = Modifier.weight(1.0f).fillMaxHeight()
                          )
                      }
                  } else {
                      libraryContent(Modifier.padding(padding).fillMaxSize())
                  }
              }

              songToManage?.let { song ->
                  AlertDialog(
                      onDismissRequest = { songToManage = null },
                      title = { Text(stringResource(R.string.manage_audio_title), fontWeight = FontWeight.Bold) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text(song.title, color = MaterialTheme.colorScheme.secondary, fontWeight = FontWeight.SemiBold)
                              Text(stringResource(R.string.folder_label, song.folder), fontSize = 12.sp, color = Color.Gray)
                              Spacer(Modifier.height(4.dp))
                              Button(
                                  onClick = {
                                      hideSong(song.id)
                                      songToManage = null
                                      Toast.makeText(context, context.getString(R.string.toast_song_hidden), Toast.LENGTH_SHORT).show()
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(stringResource(R.string.hide_song_only))
                              }
                              OutlinedButton(
                                  onClick = {
                                      hideLocalFolder(song.folder)
                                      songToManage = null
                                      Toast.makeText(
                                          context,
                                          context.getString(R.string.toast_folder_hidden, song.folder),
                                          Toast.LENGTH_SHORT
                                      ).show()
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(stringResource(R.string.hide_entire_folder, song.folder))
                              }
                              Button(
                                  onClick = {
                                      val target = song
                                      songToManage = null
                                      deleteLocalSongPermanently(target)
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFB71C1C)),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(stringResource(R.string.delete_permanently), color = Color.White)
                              }
                          }
                      },
                      confirmButton = {},
                      dismissButton = {
                          TextButton(onClick = { songToManage = null }) { Text(stringResource(R.string.cancel)) }
                      }
                  )
              }

              if (showServerDialog) {
                  AlertDialog(
                      onDismissRequest = { showServerDialog = false },
                      title = { Text(stringResource(R.string.settings_dialog_title)) },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = serverUrl,
                                  onValueChange = { serverUrl = it },
                                  label = { Text(stringResource(R.string.server_url_label)) },
                                  singleLine = true
                              )
                              OutlinedTextField(
                                  value = serverUser,
                                  onValueChange = { serverUser = it },
                                  label = { Text(stringResource(R.string.username_label)) },
                                  singleLine = true
                              )
                              OutlinedTextField(
                                  value = serverPass,
                                  onValueChange = { serverPass = it },
                                  label = { Text(stringResource(R.string.password_label)) },
                                  visualTransformation = PasswordVisualTransformation(),
                                  singleLine = true
                              )
                              if (hiddenLocalFolders.isNotEmpty() || hiddenSongIds.isNotEmpty()) {
                                  HorizontalDivider(modifier = Modifier.padding(vertical = 6.dp))
                                  OutlinedButton(
                                      onClick = {
                                          saveHiddenSets(emptySet(), emptySet())
                                          Toast.makeText(context, context.getString(R.string.toast_restored), Toast.LENGTH_SHORT).show()
                                      },
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Icon(Icons.Default.Restore, contentDescription = null, modifier = Modifier.size(18.dp))
                                      Spacer(Modifier.width(6.dp))
                                      Text(stringResource(R.string.restore_hidden_count, hiddenLocalFolders.size, hiddenSongIds.size))
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              prefs.edit()
                                  .putString("url", serverUrl)
                                  .putString("user", serverUser)
                                  .putString("pass", serverPass)
                                  .apply()
                              showServerDialog = false
                              selectedTab = 1
                              selectedRemoteFolder = null
                              refreshHomeLab()
                          }) { Text(stringResource(R.string.save_and_connect)) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showServerDialog = false }) { Text(stringResource(R.string.close)) }
                      }
                  )
              }
          }

          @Composable
          fun VisualizerStage(
              style: Int,
              phase: Float,
              amplitude: Float,
              modifier: Modifier = Modifier
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 2f || h <= 2f) return@Canvas

                  val cx = w / 2f
                  val cy = h / 2f
                  val minDim = minOf(w, h)

                  // خلفية متوهجة متحركة (Ambient Orbs)
                  val orb1X = cx + cos(phase * 0.55f) * w * 0.24f
                  val orb1Y = cy + sin(phase * 0.42f) * h * 0.20f
                  val orb2X = cx + cos(phase * 0.38f + 2.4f) * w * 0.26f
                  val orb2Y = cy + sin(phase * 0.61f + 1.2f) * h * 0.22f
                  val orbR = (minDim * (0.48f + 0.08f * sin(phase * 1.4f) * amplitude)).coerceAtLeast(10f)

                  drawCircle(
                      brush = Brush.radialGradient(
                          colors = listOf(Color(0x557C4DFF), Color.Transparent),
                          center = Offset(orb1X, orb1Y),
                          radius = orbR
                      ),
                      radius = orbR,
                      center = Offset(orb1X, orb1Y)
                  )
                  drawCircle(
                      brush = Brush.radialGradient(
                          colors = listOf(Color(0x4400E5FF), Color.Transparent),
                          center = Offset(orb2X, orb2Y),
                          radius = orbR * 0.9f
                      ),
                      radius = orbR * 0.9f,
                      center = Offset(orb2X, orb2Y)
                  )

                  when (style) {
                      // 0: أسطوانة دوّارة + أعمدة طيف نيون
                      0 -> {
                          val discCenter = Offset(cx, h * 0.38f)
                          val discRadius = (minDim * 0.24f).coerceAtLeast(24f)
                          val pulse = (1f + 0.08f * sin(phase * 5.2f) * amplitude)

                          // حلقات نبض متوسعة
                          for (ring in 0..2) {
                              val ringProg = ((phase * 0.55f + ring * 0.33f) % 1f)
                              val r = discRadius * (1.05f + ringProg * 0.85f)
                              val alpha = ((1f - ringProg) * 0.42f * amplitude).coerceIn(0f, 1f)
                              if (alpha > 0.01f) {
                                  drawCircle(
                                      color = if (ring % 2 == 0) Color(0xFFBB86FC).copy(alpha = alpha)
                                      else Color(0xFF00E5FF).copy(alpha = alpha),
                                      radius = r,
                                      center = discCenter,
                                      style = Stroke(width = 3f)
                                  )
                              }
                          }

                          // الأسطوانة الدوارة
                          rotate(degrees = (phase * 42f) % 360f, pivot = discCenter) {
                              drawCircle(
                                  brush = Brush.radialGradient(
                                      colors = listOf(Color(0xFF2F2654), Color(0xFF141422), Color(0xFF090910)),
                                      center = discCenter,
                                      radius = discRadius * pulse
                                  ),
                                  radius = discRadius * pulse,
                                  center = discCenter
                              )
                              // خطوط الأسطوانة
                              drawCircle(
                                  color = Color(0x33FFFFFF),
                                  radius = discRadius * 0.78f * pulse,
                                  center = discCenter,
                                  style = Stroke(width = 1.8f)
                              )
                              drawCircle(
                                  color = Color(0x28BB86FC),
                                  radius = discRadius * 0.58f * pulse,
                                  center = discCenter,
                                  style = Stroke(width = 1.5f)
                              )
                              // نقطة لمعان تتحرك مع الدوران
                              drawArc(
                                  color = Color(0x6600E5FF),
                                  startAngle = -35f,
                                  sweepAngle = 70f,
                                  useCenter = false,
                                  topLeft = Offset(
                                      discCenter.x - discRadius * 0.86f * pulse,
                                      discCenter.y - discRadius * 0.86f * pulse
                                  ),
                                  size = Size(discRadius * 1.72f * pulse, discRadius * 1.72f * pulse),
                                  style = Stroke(width = 4f, cap = StrokeCap.Round)
                              )
                              // مركز الأسطوانة
                              drawCircle(
                                  brush = Brush.linearGradient(listOf(Color(0xFF7C4DFF), Color(0xFF00E5FF))),
                                  radius = discRadius * 0.30f,
                                  center = discCenter
                              )
                              drawCircle(
                                  color = Color(0xFF0E0E14),
                                  radius = discRadius * 0.09f,
                                  center = discCenter
                              )
                          }

                          // أعمدة الطيف الصوتي في الأسفل
                          val barCount = 32
                          val horizontalMargin = w * 0.06f
                          val usableW = (w - horizontalMargin * 2f).coerceAtLeast(10f)
                          val step = usableW / barCount
                          val barW = (step * 0.62f).coerceAtLeast(2f)
                          val maxBarH = (h * 0.30f).coerceAtLeast(16f)
                          val baselineY = h * 0.94f

                          val barBrush = Brush.verticalGradient(
                              colors = listOf(Color(0xFF00E5FF), Color(0xFFBB86FC), Color(0xFF7C4DFF)),
                              startY = baselineY - maxBarH,
                              endY = baselineY
                          )

                          for (i in 0 until barCount) {
                              val norm = i.toFloat() / (barCount - 1)
                              val centerBoost = 1f - abs(norm - 0.5f) * 0.85f
                              val wave1 = sin(phase * 4.8f + i * 0.45f) * 0.5f + 0.5f
                              val wave2 = cos(phase * 7.6f - i * 0.82f) * 0.5f + 0.5f
                              val wave3 = sin(phase * 2.9f + i * 1.25f) * 0.5f + 0.5f
                              val energy = (0.45f * wave1 + 0.35f * wave2 + 0.20f * wave3) * centerBoost
                              val barH = (maxBarH * (0.08f + 0.92f * energy * amplitude)).coerceAtLeast(6f)
                              val x = horizontalMargin + i * step + (step - barW) / 2f

                              drawRoundRect(
                                  brush = barBrush,
                                  topLeft = Offset(x, baselineY - barH),
                                  size = Size(barW, barH),
                                  cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                              )
                          }
                      }

                      // 1: أمواج الشفق (Aurora Waves)
                      1 -> {
                          val waveConfigs = listOf(
                              Triple(Color(0xFF00E5FF), 1.0f, 3.2f),
                              Triple(Color(0xFFBB86FC), 0.78f, 4.5f),
                              Triple(Color(0xFFFF4081), 0.60f, 2.4f)
                          )
                          waveConfigs.forEachIndexed { idx, (color, ampScale, speed) ->
                              val path = Path()
                              val steps = 64
                              val maxAmp = h * 0.22f * ampScale * (0.15f + 0.85f * amplitude)
                              for (s in 0..steps) {
                                  val t = s.toFloat() / steps
                                  val x = t * w
                                  val envelope = sin(t * PI).toFloat()
                                  val y = cy +
                                      sin(t * 9f + phase * speed + idx * 1.8f) * maxAmp * envelope +
                                      cos(t * 17f - phase * (speed * 1.3f)) * (maxAmp * 0.35f) * envelope
                                  if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                              }
                              drawPath(
                                  path = path,
                                  color = color.copy(alpha = 0.25f),
                                  style = Stroke(width = 14f, cap = StrokeCap.Round)
                              )
                              drawPath(
                                  path = path,
                                  color = color.copy(alpha = 0.92f),
                                  style = Stroke(width = 4.5f, cap = StrokeCap.Round)
                              )
                          }
                      }

                      // 2: النبض الدائري (Radial Pulse 360°)
                      else -> {
                          val baseR = (minDim * 0.22f).coerceAtLeast(24f)
                          val maxRay = (minDim * 0.20f).coerceAtLeast(14f)
                          val rays = 48

                          for (i in 0 until rays) {
                              val angleRad = (i.toFloat() / rays) * (2f * PI.toFloat()) + phase * 0.35f
                              val v1 = sin(phase * 5.4f + i * 0.65f) * 0.5f + 0.5f
                              val v2 = cos(phase * 8.1f - i * 1.1f) * 0.5f + 0.5f
                              val rayLen = maxRay * (0.12f + 0.88f * (0.55f * v1 + 0.45f * v2) * amplitude)

                              val start = Offset(
                                  cx + cos(angleRad) * baseR,
                                  cy + sin(angleRad) * baseR
                              )
                              val end = Offset(
                                  cx + cos(angleRad) * (baseR + rayLen),
                                  cy + sin(angleRad) * (baseR + rayLen)
                              )
                              val rayColor = if (i % 3 == 0) Color(0xFF00E5FF)
                              else if (i % 3 == 1) Color(0xFFBB86FC)
                              else Color(0xFFFF4081)

                              drawLine(
                                  color = rayColor,
                                  start = start,
                                  end = end,
                                  strokeWidth = 5f,
                                  cap = StrokeCap.Round
                              )
                          }

                          val innerPulse = baseR * (0.86f + 0.06f * sin(phase * 6f) * amplitude)
                          drawCircle(
                              brush = Brush.radialGradient(
                                  colors = listOf(Color(0xFF7C4DFF), Color(0xFF171722)),
                                  center = Offset(cx, cy),
                                  radius = innerPulse.coerceAtLeast(10f)
                              ),
                              radius = innerPulse,
                              center = Offset(cx, cy)
                          )
                          drawCircle(
                              color = Color(0xFF00E5FF),
                              radius = innerPulse,
                              center = Offset(cx, cy),
                              style = Stroke(width = 2.5f)
                          )
                      }
                  }
              }
          }

          @Composable
          fun MiniEqualizerBars(
              phase: Float,
              amplitude: Float,
              modifier: Modifier = Modifier.size(width = 22.dp, height = 18.dp)
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 1f || h <= 1f) return@Canvas
                  val bars = 3
                  val step = w / bars
                  val barW = step * 0.62f
                  for (i in 0 until bars) {
                      val wave = sin(phase * 7.5f + i * 2.1f) * 0.5f + 0.5f
                      val barH = h * (0.22f + 0.78f * wave * amplitude)
                      val x = i * step + (step - barW) / 2f
                      drawRoundRect(
                          color = if (i == 1) Color(0xFF00E5FF) else Color(0xFFBB86FC),
                          topLeft = Offset(x, h - barH),
                          size = Size(barW, barH),
                          cornerRadius = CornerRadius(barW / 2f, barW / 2f)
                      )
                  }
              }
          }

          @Composable
          fun FullScreenVisualizer(
              title: String,
              artist: String,
              isPlaying: Boolean,
              isTv: Boolean,
              positionMs: Long,
              durationMs: Long,
              shuffleEnabled: Boolean,
              repeatMode: Int,
              style: Int,
              phase: Float,
              amplitude: Float,
              onSeek: (Long) -> Unit,
              onPlayPause: () -> Unit,
              onNext: () -> Unit,
              onPrev: () -> Unit,
              onRewind: () -> Unit,
              onForward: () -> Unit,
              onToggleShuffle: () -> Unit,
              onToggleRepeat: () -> Unit,
              onCycleStyle: () -> Unit,
              onExit: () -> Unit
          ) {
              val styleName = when (style) {
                  0 -> stringResource(R.string.style_neon_bars)
                  1 -> stringResource(R.string.style_aurora_waves)
                  else -> stringResource(R.string.style_radial_pulse)
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              listOf(Color(0xFF0A0A14), Color(0xFF131026), Color(0xFF090910))
                          )
                      )
              ) {
                  // خلفية الحركة الكاملة
                  VisualizerStage(
                      style = style,
                      phase = phase,
                      amplitude = amplitude,
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(top = 56.dp, bottom = 190.dp)
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .padding(horizontal = 20.dp, vertical = 12.dp),
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      // الشريط العلوي (خروج + تبديل نمط الحركة)
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          TvIconButton(
                              icon = Icons.Default.FullscreenExit,
                              contentDescription = stringResource(R.string.cd_exit_fullscreen),
                              onClick = onExit
                          )

                          Surface(
                              onClick = onCycleStyle,
                              shape = RoundedCornerShape(24.dp),
                              color = Color(0x441F1C33),
                              border = BorderStroke(1.dp, Color(0x66BB86FC))
                          ) {
                              Row(
                                  modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  Icon(
                                      Icons.Default.Palette,
                                      contentDescription = stringResource(R.string.cd_change_style),
                                      tint = Color(0xFF00E5FF),
                                      modifier = Modifier.size(18.dp)
                                  )
                                  Text(styleName, fontSize = 13.sp, fontWeight = FontWeight.SemiBold, color = Color.White)
                              }
                          }
                      }

                      Spacer(Modifier.weight(1f))

                      // لوحة المعلومات والتحكم السفلية
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(24.dp))
                              .background(Color(0xAA141422))
                              .padding(horizontal = 20.dp, vertical = 16.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              title,
                              fontSize = if (isTv) 26.sp else 20.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color.White,
                              maxLines = 1,
                              modifier = Modifier.basicMarquee()
                          )
                          if (artist.isNotBlank()) {
                              Spacer(Modifier.height(4.dp))
                              Text(
                                  artist,
                                  fontSize = if (isTv) 16.sp else 13.sp,
                                  color = Color(0xFFB3B3CC),
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }

                          Spacer(Modifier.height(10.dp))

                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              if (isTv) {
                                  val progress = if (durationMs > 0L) (positionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f) else 0f
                                  LinearProgressIndicator(
                                      progress = { progress },
                                      modifier = Modifier.fillMaxWidth().height(7.dp).clip(RoundedCornerShape(4.dp))
                                  )
                              } else {
                                  val safeMax = durationMs.coerceAtLeast(1L).toFloat()
                                  Slider(
                                      value = positionMs.coerceIn(0L, durationMs.coerceAtLeast(1L)).toFloat(),
                                      onValueChange = { onSeek(it.toLong()) },
                                      valueRange = 0f..safeMax,
                                      modifier = Modifier.fillMaxWidth()
                                  )
                              }

                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(formatTime(positionMs), fontSize = 12.sp, color = Color(0xFFB3B3CC))
                                  Text(formatTime(durationMs), fontSize = 12.sp, color = Color(0xFFB3B3CC))
                              }

                              Spacer(Modifier.height(8.dp))

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceEvenly,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  TvIconButton(
                                      icon = Icons.Default.Shuffle,
                                      contentDescription = stringResource(R.string.cd_shuffle),
                                      onClick = onToggleShuffle,
                                      tint = if (shuffleEnabled) Color(0xFF00E5FF) else Color.Gray
                                  )
                                  TvIconButton(Icons.Default.SkipPrevious, stringResource(R.string.cd_previous), onPrev)
                                  if (isTv) {
                                      TvIconButton(Icons.Default.FastRewind, stringResource(R.string.cd_rewind), onRewind)
                                  }
                                  TvIconButton(
                                      icon = if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      contentDescription = stringResource(R.string.cd_play_pause),
                                      onClick = onPlayPause,
                                      filled = true,
                                      size = 62
                                  )
                                  if (isTv) {
                                      TvIconButton(Icons.Default.FastForward, stringResource(R.string.cd_forward), onForward)
                                  }
                                  TvIconButton(Icons.Default.SkipNext, stringResource(R.string.cd_next), onNext)
                                  TvIconButton(
                                      icon = if (repeatMode == Player.REPEAT_MODE_ONE) Icons.Default.RepeatOne else Icons.Default.Repeat,
                                      contentDescription = stringResource(R.string.cd_repeat),
                                      onClick = onToggleRepeat,
                                      tint = if (repeatMode != Player.REPEAT_MODE_OFF) Color(0xFF00E5FF) else Color.Gray
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FolderRowItem(
              folder: FolderGroup,
