          internal const val SCENE_HALO = 0
          internal const val SCENE_DISC = 1
          internal const val SCENE_WAVES = 2
          internal const val SCENE_STARDUST = 3
          internal const val SCENE_SAKINA = 4
          internal const val SCENE_COUNT = 5

          @Stable
          class VisualizerClock {
              var phase by mutableFloatStateOf(0f)
              var bass by mutableFloatStateOf(0f)
              var mid by mutableFloatStateOf(0f)
              var high by mutableFloatStateOf(0f)
              var overall by mutableFloatStateOf(0f)
              var beat by mutableFloatStateOf(0f)
              var frameTick by mutableIntStateOf(0)
              val bands = FloatArray(AudioSpectrumBus.BAND_COUNT)
              val peaks = FloatArray(AudioSpectrumBus.BAND_COUNT)
          }

          /** One stage for every scene. Sakina is chosen automatically for Quran and dhikr. */
          @Composable
          fun SceneStage(
              scene: Int,
              clock: VisualizerClock,
              cover: CoverSpec,
              modifier: Modifier = Modifier,
              artKey: String? = null
          ) {
              when (scene) {
                  SCENE_HALO -> HaloScene(clock, cover, artKey, modifier)
                  SCENE_DISC -> DiscScene(clock, cover, artKey, modifier)
                  SCENE_WAVES -> WavesScene(clock, cover, modifier)
                  SCENE_STARDUST -> StardustScene(clock, cover, modifier)
                  else -> SakinaScene(clock, modifier)
              }
          }

          /** The cover as a turning record, with the spectrum as a ring of light around it. */
          @Composable
          private fun HaloScene(clock: VisualizerClock, cover: CoverSpec, artKey: String?, modifier: Modifier) {
              BoxWithConstraints(modifier = modifier, contentAlignment = Alignment.Center) {
                  val side: Dp = if (maxWidth < maxHeight) maxWidth else maxHeight
                  val disc = side * 0.66f
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      @Suppress("UNUSED_VARIABLE")
                      val tick = clock.frameTick
                      val discR = disc.toPx() / 2f
                      val inner = discR + 10.dp.toPx()
                      val maxLen = (minOf(size.width, size.height) / 2f - inner - 4.dp.toPx()).coerceAtLeast(8f)
                      val bands = clock.bands
                      val n = 72
                      val half = n / 2
                      val bar = (2.2f * density).coerceAtLeast(2f)
                      drawCircle(
                          cover.accent.copy(alpha = (0.08f + clock.beat * 0.16f).coerceIn(0f, 0.4f)),
                          radius = inner - 4.dp.toPx(),
                          style = Stroke(1.5.dp.toPx())
                      )
                      for (i in 0 until n) {
                          val mirrored = if (i < half) i else n - 1 - i
                          val bIdx = ((mirrored.toFloat() / (half - 1)) * (bands.size - 1)).toInt().coerceIn(0, bands.size - 1)
                          val level = bands[bIdx]
                          val len = maxLen * (0.07f + 0.93f * level)
                          val angle = (i.toFloat() / n) * 2f * PI.toFloat() - PI.toFloat() / 2f + clock.phase * 0.04f
                          val ca = cos(angle)
                          val sa = sin(angle)
                          val t = (ca + 1f) / 2f
                          drawLine(
                              color = lerp(cover.c1, cover.accent, t),
                              start = Offset(center.x + ca * inner, center.y + sa * inner),
                              end = Offset(center.x + ca * (inner + len), center.y + sa * (inner + len)),
                              strokeWidth = bar,
                              cap = StrokeCap.Round
                          )
                      }
                  }
                  SpinningCoverDisc(clock = clock, cover = cover, artKey = artKey, size = disc)
              }
          }

          @Composable
          private fun SpinningCoverDisc(clock: VisualizerClock, cover: CoverSpec, artKey: String?, size: Dp) {
              Box(
                  modifier = Modifier
                      .size(size)
                      .graphicsLayer {
                          rotationZ = (clock.phase * 9f) % 360f
                          val pulse = 1f + clock.bass * 0.035f + clock.beat * 0.02f
                          scaleX = pulse
                          scaleY = pulse
                      },
                  contentAlignment = Alignment.Center
              ) {
                  GenerativeCover(spec = cover, artKey = artKey, modifier = Modifier.fillMaxSize(), shape = CircleShape)
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val r = minOf(this.size.width, this.size.height) / 2f
                      for (k in 1..5) {
                          drawCircle(Color.White.copy(alpha = 0.07f), radius = r * (1f - k * 0.12f), style = Stroke(0.6f * density))
                      }
                      drawCircle(Pal.Ink, radius = r * 0.13f)
                      drawCircle(Color.White.copy(alpha = 0.35f), radius = r * 0.13f, style = Stroke(0.8f * density))
                  }
              }
          }

          /** Turning record with spectrum bars and falling peaks underneath. */
          @Composable
          private fun DiscScene(clock: VisualizerClock, cover: CoverSpec, artKey: String?, modifier: Modifier) {
              BoxWithConstraints(modifier = modifier) {
                  val disc = minOf(maxWidth * 0.62f, maxHeight * 0.52f)
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      @Suppress("UNUSED_VARIABLE")
                      val tick = clock.frameTick
                      val w = size.width
                      val h = size.height
                      val bands = clock.bands
                      val peaks = clock.peaks
                      val n = bands.size
                      val margin = w * 0.06f
                      val step = (w - margin * 2f) / n
                      val barW = (step * 0.6f).coerceAtLeast(2f)
                      val maxBarH = h * 0.26f
                      val baseline = h * 0.96f
                      val brush = Brush.verticalGradient(listOf(cover.accent, cover.c1), startY = baseline - maxBarH, endY = baseline)
                      for (i in 0 until n) {
                          val level = bands[i].coerceIn(0f, 1f)
                          val barH = (maxBarH * (0.04f + 0.96f * level)).coerceAtLeast(3f)
                          val x = margin + i * step + (step - barW) / 2f
                          drawRoundRect(brush, topLeft = Offset(x, baseline - barH), size = Size(barW, barH), cornerRadius = CornerRadius(barW / 2f, barW / 2f))
                          val peak = peaks[i].coerceIn(0f, 1f)
                          if (peak > 0.04f) {
                              val py = baseline - maxBarH * (0.04f + 0.96f * peak) - 4f * density
                              drawRoundRect(cover.c3.copy(alpha = 0.4f + peak * 0.6f), topLeft = Offset(x, py), size = Size(barW, 2.5f * density), cornerRadius = CornerRadius(2f, 2f))
                          }
                      }
                  }
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .graphicsLayer { translationY = -(maxHeight.toPx() * 0.12f) },
                      contentAlignment = Alignment.Center
                  ) {
                      SpinningCoverDisc(clock = clock, cover = cover, artKey = artKey, size = disc)
                  }
              }
          }

          /** Three layers of light that follow bass, mids and highs, in the cover's colours. */
          @Composable
          private fun WavesScene(clock: VisualizerClock, cover: CoverSpec, modifier: Modifier) {
              Canvas(modifier = modifier) {
                  @Suppress("UNUSED_VARIABLE")
                  val tick = clock.frameTick
                  val w = size.width
                  val h = size.height
                  val cy = h / 2f
                  val bands = clock.bands
                  val layers = listOf(
                      Triple(cover.c1, 0, clock.bass),
                      Triple(cover.accent, 1, clock.mid),
                      Triple(cover.c2, 2, clock.high)
                  )
                  drawCircle(
                      Brush.radialGradient(listOf(cover.accent.copy(alpha = 0.18f + clock.overall * 0.2f), Color.Transparent), center = center, radius = minOf(w, h) * 0.6f),
                      radius = minOf(w, h) * 0.6f
                  )
                  layers.forEach { (color, idx, energy) ->
                      val path = Path()
                      val steps = 64
                      val maxAmp = h * (0.26f - idx * 0.04f)
                      for (s in 0..steps) {
                          val t = s.toFloat() / steps
                          val x = t * w
                          val envelope = sin(t * PI).toFloat()
                          val bIdx = ((t * (bands.size - 1)).toInt()).coerceIn(0, bands.size - 1)
                          val carrier = sin(t * (7f + idx * 3f) + clock.phase * (2.4f + idx * 0.8f) + idx * 1.9f)
                          val amp = maxAmp * (0.05f + bands[bIdx] * 0.62f + energy * 0.33f + clock.beat * 0.15f)
                          val y = cy + carrier * amp * envelope
                          if (s == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      drawPath(path, color = color.copy(alpha = (0.14f + energy * 0.22f).coerceIn(0f, 0.45f)), style = Stroke(width = 14f * density, cap = StrokeCap.Round))
                      drawPath(path, color = color.copy(alpha = 0.95f), style = Stroke(width = 2.6f * density, cap = StrokeCap.Round))
                  }
              }
          }

          /** Rising particles over a mirrored spectrum. */
          @Composable
          private fun StardustScene(clock: VisualizerClock, cover: CoverSpec, modifier: Modifier) {
              Canvas(modifier = modifier) {
                  @Suppress("UNUSED_VARIABLE")
                  val tick = clock.frameTick
                  val w = size.width
                  val h = size.height
                  val cy = h / 2f
                  val colors = listOf(cover.c1, cover.accent, cover.c2)
                  for (p in 0 until 30) {
                      val speed = 0.10f + (p % 5) * 0.04f
                      val life = ((clock.phase * speed + p * 0.137f) % 1f)
                      val px = ((p * 0.371f + sin(clock.phase * 0.5f + p) * 0.04f) % 1f).let { if (it < 0f) it + 1f else it } * w
                      val py = h * (1f - life)
                      val alpha = (sin(life * PI).toFloat() * (0.2f + clock.overall * 0.6f + clock.beat * 0.3f)).coerceIn(0f, 1f)
                      val radius = (2.6f + (p % 4) * 1.8f) * density * (0.75f + clock.high * 0.45f + clock.beat * 0.3f)
                      val col = colors[p % 3]
                      drawCircle(col.copy(alpha = alpha * 0.3f), radius = radius * 2.2f, center = Offset(px, py))
                      drawCircle(col.copy(alpha = alpha), radius = radius, center = Offset(px, py))
                  }
                  val bands = clock.bands
                  val n = bands.size
                  val margin = w * 0.07f
                  val step = (w - margin * 2f) / n
                  val barW = (step * 0.56f).coerceAtLeast(2f)
                  val maxHalf = h * 0.24f
                  val brush = Brush.verticalGradient(listOf(cover.c1, cover.accent, cover.c1), startY = cy - maxHalf, endY = cy + maxHalf)
                  for (i in 0 until n) {
                      val level = bands[i].coerceIn(0f, 1f)
                      val halfH = (maxHalf * (0.03f + 0.97f * level)).coerceAtLeast(3f)
                      val x = margin + i * step + (step - barW) / 2f
                      drawRoundRect(brush, topLeft = Offset(x, cy - halfH), size = Size(barW, halfH * 2f), cornerRadius = CornerRadius(barW / 2f, barW / 2f))
                  }
              }
          }

          /** Sakina: a slow golden rosette around the Kaaba, breathing with the reciter's voice. */
          @Composable
          fun SakinaScene(clock: VisualizerClock, modifier: Modifier = Modifier) {
              Canvas(modifier = modifier) {
                  @Suppress("UNUSED_VARIABLE")
                  val tick = clock.frameTick
                  val c = center
                  val side = minOf(size.width, size.height)
                  val s = side / 300f
                  val voice = (clock.mid * 0.65f + clock.overall * 0.35f).coerceIn(0f, 1f)
                  val breathe = 0.92f + voice * 0.10f + 0.05f * sin(clock.phase * 1.3f)
                  val gold = Pal.Gold

                  // Twinkling stars around the rosette.
                  val stars = listOf(0.12f to 0.18f, 0.86f to 0.12f, 0.92f to 0.62f, 0.08f to 0.74f, 0.30f to 0.04f, 0.70f to 0.94f)
                  stars.forEachIndexed { i, (fx, fy) ->
                      val a = 0.15f + 0.75f * (0.5f + 0.5f * sin(clock.phase * 0.9f + i * 1.7f))
                      drawCircle(Pal.GoldLight.copy(alpha = a), radius = (1.2f + (i % 2)) * density, center = Offset(size.width * fx, size.height * fy))
                  }

                  // Rosette, turning very slowly.
                  rotate(degrees = (clock.phase * 2.2f) % 360f, pivot = c) {
                      drawCircle(gold.copy(alpha = 0.35f), radius = 146f * s, center = c, style = Stroke(0.6f * s * 1.5f))
                      drawCircle(
                          gold.copy(alpha = 0.5f), radius = 134f * s, center = c,
                          style = Stroke(0.9f * s, pathEffect = PathEffect.dashPathEffect(floatArrayOf(1.5f * s, 5f * s)))
                      )
                      drawStar8(c, 94f * s, gold.copy(alpha = 0.55f), 0.9f * s * 1.4f)
                      rotate(22.5f, pivot = c) { drawStar8(c, 94f * s, gold.copy(alpha = 0.3f), 0.6f * s * 1.4f) }
                      drawCircle(gold.copy(alpha = 0.45f), radius = 94f * s, center = c, style = Stroke(0.8f * s * 1.4f))
                      for (k in 0 until 16) {
                          rotate(k * 22.5f, pivot = c) {
                              drawCircle(gold.copy(alpha = 0.8f), radius = 2f * s * 1.2f, center = Offset(c.x, c.y - 140f * s))
                          }
                      }
                  }
                  rotate(degrees = -(clock.phase * 1.4f) % 360f, pivot = c) {
                      rotate(22.5f, pivot = c) { drawStar8(c, 54f * s, gold.copy(alpha = 0.4f), 0.7f * s * 1.4f) }
                  }

                  // Breathing halo.
                  val haloR = 100f * s * breathe
                  drawCircle(
                      Brush.radialGradient(
                          listOf(gold.copy(alpha = 0.30f), gold.copy(alpha = 0.06f), Color.Transparent),
                          center = c,
                          radius = haloR
                      ),
                      radius = haloR,
                      center = c
                  )
                  drawCircle(Pal.GoldLight.copy(alpha = 0.45f), radius = 72f * s * breathe, center = c, style = Stroke(1f * density))

                  drawKaaba(Offset(c.x - 66f * s, c.y - 62f * s), 132f * s)
              }
          }

          private fun DrawScope.drawKaaba(topLeft: Offset, side: Float) {
              val k = side / 120f
              fun poly(vararg pts: Float): Path {
                  val p = Path()
                  var i = 0
                  while (i < pts.size) {
                      val x = topLeft.x + pts[i] * k
                      val y = topLeft.y + pts[i + 1] * k
                      if (i == 0) p.moveTo(x, y) else p.lineTo(x, y)
                      i += 2
                  }
                  p.close()
                  return p
              }
              val base = Path().apply {
                  moveTo(topLeft.x + 14f * k, topLeft.y + 88f * k)
                  lineTo(topLeft.x + 60f * k, topLeft.y + 109f * k)
                  lineTo(topLeft.x + 106f * k, topLeft.y + 88f * k)
              }
              drawPath(base, Pal.Mint.copy(alpha = 0.35f), style = Stroke(1f * k, cap = StrokeCap.Round))
              val roof = poly(60f, 22f, 24f, 38f, 60f, 54f, 96f, 38f)
              drawPath(roof, Color(0xFF1B1B20))
              drawPath(poly(24f, 38f, 60f, 54f, 60f, 100f, 24f, 84f), Color(0xFF0B0B0E))
              drawPath(poly(60f, 54f, 96f, 38f, 96f, 84f, 60f, 100f), Color(0xFF141418))
              drawPath(poly(24f, 44.4f, 60f, 60.4f, 60f, 65f, 24f, 49f), Pal.Gold)
              drawPath(poly(60f, 60.4f, 96f, 44.4f, 96f, 49f, 60f, 65f), Color(0xFFD9B566))
              val door = poly(67.9f, 68.9f, 76.6f, 65f, 76.6f, 88.9f, 67.9f, 92.8f)
              drawPath(door, Pal.Gold)
              drawPath(poly(69.4f, 70.5f, 75.1f, 68f, 75.1f, 87.6f, 69.4f, 90.1f), Color(0xFF7A5A1E), style = Stroke(0.6f * k))
              drawPath(roof, Pal.Gold.copy(alpha = 0.6f), style = Stroke(0.6f * k))
              val stone = Offset(topLeft.x + 58.6f * k, topLeft.y + 93f * k)
              drawCircle(Color(0xFF2A2A2E), radius = 1.8f * k, center = stone)
              drawCircle(Color(0xFFC9CED6), radius = 1.8f * k, center = stone, style = Stroke(0.7f * k))
          }

          /** Faint girih pattern behind Sakina screens. Drawn once; it never animates. */
          @Composable
          fun GirihBackdrop(modifier: Modifier = Modifier, alpha: Float = 0.05f) {
              Canvas(modifier = modifier) {
                  val cell = 56f * density
                  val color = Pal.Gold.copy(alpha = alpha)
                  val stroke = 0.7f * density
                  var y = 0f
                  while (y < size.height + cell) {
                      var x = 0f
                      while (x < size.width + cell) {
                          val c = Offset(x + cell / 2f, y + cell / 2f)
                          drawStar8(c, cell * 0.25f, color, stroke)
                          drawCircle(color, radius = cell * 0.125f, center = c, style = Stroke(stroke))
                          x += cell
                      }
                      y += cell
                  }
              }
          }

          /** Three tiny bars that move with the music (current track markers). */
          @Composable
          fun PlayingBars(clock: VisualizerClock, color: Color, modifier: Modifier = Modifier) {
              Canvas(modifier = modifier.size(width = 18.dp, height = 16.dp)) {
                  @Suppress("UNUSED_VARIABLE")
                  val tick = clock.frameTick
                  val levels = floatArrayOf(clock.bass, clock.mid, clock.high)
                  val step = size.width / 3f
                  val barW = step * 0.55f
                  for (i in 0 until 3) {
                      val barH = size.height * (0.2f + 0.8f * levels[i].coerceIn(0f, 1f))
                      val x = i * step + (step - barW) / 2f
                      drawRoundRect(color, topLeft = Offset(x, size.height - barH), size = Size(barW, barH), cornerRadius = CornerRadius(barW / 2f, barW / 2f))
                  }
              }
          }

          /**
           * Drives [VisualizerClock] from the display's frame clock (vsync) instead of a fixed delay.
           * Updates are throttled (~60 fps on phones, ~45 fps on TV boxes) to save battery and CPU.
           * Only draw-phase state is touched, so frames redraw canvases without recomposing the UI.
           */
          @Composable
          fun VisualizerTicker(clock: VisualizerClock, isPlaying: Boolean, isResumed: Boolean, isTv: Boolean) {
              LaunchedEffect(isPlaying, isResumed, isTv) {
                  if (!isResumed) return@LaunchedEffect
                  val rawBands = FloatArray(AudioSpectrumBus.BAND_COUNT)
                  val metrics = SpectrumSnapshot()
                  val minFrameNanos = if (isTv) 21_000_000L else 15_000_000L
                  var lastUpdateNanos = 0L

                  while (true) {
                      val now = withFrameNanos { it }
                      if (lastUpdateNanos != 0L && now - lastUpdateNanos < minFrameNanos) continue
                      val dt = if (lastUpdateNanos == 0L) {
                          0.016f
                      } else {
                          ((now - lastUpdateNanos) / 1_000_000_000f).coerceIn(0f, 0.06f)
                      }
                      lastUpdateNanos = now

                      if (isPlaying) {
                          AudioSpectrumBus.readSnapshot(rawBands, metrics)
                          val spinBoost = 1f + metrics.bass * 1.4f + metrics.beat * 1.8f
                          clock.phase += dt * spinBoost

                          for (i in 0 until AudioSpectrumBus.BAND_COUNT) {
                              val target = if (metrics.hasFreshData) rawBands[i] else 0f
                              val cur = clock.bands[i]
                              val next = if (target > cur) {
                                  cur + (target - cur) * 0.62f
                              } else {
                                  (cur - dt * 2.1f).coerceAtLeast(target)
                              }
                              clock.bands[i] = next
                              val curPeak = clock.peaks[i]
                              clock.peaks[i] = if (next >= curPeak) next else (curPeak - dt * 0.85f).coerceAtLeast(next)
                          }

                          val targetBass = if (metrics.hasFreshData) metrics.bass else 0f
                          val targetMid = if (metrics.hasFreshData) metrics.mid else 0f
                          val targetHigh = if (metrics.hasFreshData) metrics.high else 0f
                          val targetOverall = if (metrics.hasFreshData) metrics.overall else 0f

                          clock.bass = if (targetBass > clock.bass) {
                              clock.bass + (targetBass - clock.bass) * 0.65f
                          } else {
                              clock.bass + (targetBass - clock.bass) * 0.24f
                          }
                          clock.mid = if (targetMid > clock.mid) {
                              clock.mid + (targetMid - clock.mid) * 0.55f
                          } else {
                              clock.mid + (targetMid - clock.mid) * 0.22f
                          }
                          clock.high = if (targetHigh > clock.high) {
                              clock.high + (targetHigh - clock.high) * 0.55f
                          } else {
                              clock.high + (targetHigh - clock.high) * 0.25f
                          }
                          clock.overall = clock.overall + (targetOverall - clock.overall) * 0.35f
                          clock.beat = if (metrics.beat > clock.beat) {
                              metrics.beat
                          } else {
                              (clock.beat - dt * 3.8f).coerceAtLeast(0f)
                          }
                          clock.frameTick++
                      } else {
                          var anyAlive = false
                          for (i in 0 until AudioSpectrumBus.BAND_COUNT) {
                              if (clock.bands[i] > 0.002f) {
                                  clock.bands[i] = (clock.bands[i] - dt * 2.6f).coerceAtLeast(0f)
                                  anyAlive = true
                              } else {
                                  clock.bands[i] = 0f
                              }
                              if (clock.peaks[i] > 0.002f) {
                                  clock.peaks[i] = (clock.peaks[i] - dt * 1.8f).coerceAtLeast(0f)
                                  anyAlive = true
                              } else {
                                  clock.peaks[i] = 0f
                              }
                          }
                          clock.bass = (clock.bass - dt * 2.6f).coerceAtLeast(0f)
                          clock.mid = (clock.mid - dt * 2.6f).coerceAtLeast(0f)
                          clock.high = (clock.high - dt * 2.6f).coerceAtLeast(0f)
                          clock.overall = (clock.overall - dt * 2.6f).coerceAtLeast(0f)
                          clock.beat = (clock.beat - dt * 4.0f).coerceAtLeast(0f)
                          clock.frameTick++
                          if (!anyAlive && clock.bass <= 0.001f && clock.overall <= 0.001f && clock.beat <= 0.001f) {
                              break
                          }
                      }
                  }
              }
          }
