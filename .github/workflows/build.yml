              val hasActiveTrack = currentMediaId.isNotEmpty() || isPlaying

              val isQuranTrack = remember(currentTitle, currentArtist, currentAlbum) {
                  isQuranContent(currentTitle, currentArtist, currentAlbum)
              }
              val effectiveStyle = if (isQuranTrack && manualStyleOverrideId != currentMediaId) {
                  STYLE_ISLAMIC
              } else {
                  visualizerStyle
              }
              val isIslamicActive = effectiveStyle == STYLE_ISLAMIC

              val clock = remember { VisualizerClock() }

              LaunchedEffect(isPlaying, isResumed, isTv) {
                  if (!isResumed) return@LaunchedEffect
                  val rawBands = FloatArray(AudioSpectrumBus.BAND_COUNT)
                  val metrics = SpectrumSnapshot()
                  var lastTimeMs = System.currentTimeMillis()
                  val frameDelayMs = if (isTv) 24L else 28L

                  while (isResumed) {
                      val now = System.currentTimeMillis()
                      val dt = ((now - lastTimeMs) / 1000f).coerceIn(0f, 0.06f)
                      lastTimeMs = now

                      if (isPlaying) {
                          AudioSpectrumBus.readSnapshot(rawBands, metrics)
                          val spinBoost = 1f + metrics.bass * 1.4f + metrics.beat * 1.8f
                          clock.phase += dt * spinBoost

                          for (i in 0 until AudioSpectrumBus.BAND_COUNT) {
                              val target = if (metrics.hasFreshData) rawBands[i] else 0f
                              val cur = clock.bands[i]
                              val next = if (target > cur) {
                                  cur + (target - cur) * 0.62f
                              } else {
                                  (cur - dt * 2.1f).coerceAtLeast(target)
                              }
                              clock.bands[i] = next
                              val curPeak = clock.peaks[i]
                              clock.peaks[i] = if (next >= curPeak) next else (curPeak - dt * 0.85f).coerceAtLeast(next)
                          }

                          val targetBass = if (metrics.hasFreshData) metrics.bass else 0f
                          val targetMid = if (metrics.hasFreshData) metrics.mid else 0f
                          val targetHigh = if (metrics.hasFreshData) metrics.high else 0f
                          val targetOverall = if (metrics.hasFreshData) metrics.overall else 0f

                          clock.bass = if (targetBass > clock.bass) {
                              clock.bass + (targetBass - clock.bass) * 0.65f
                          } else {
                              clock.bass + (targetBass - clock.bass) * 0.24f
                          }
                          clock.mid = if (targetMid > clock.mid) {
                              clock.mid + (targetMid - clock.mid) * 0.55f
                          } else {
                              clock.mid + (targetMid - clock.mid) * 0.22f
                          }
                          clock.high = if (targetHigh > clock.high) {
                              clock.high + (targetHigh - clock.high) * 0.55f
                          } else {
                              clock.high + (targetHigh - clock.high) * 0.25f
                          }
                          clock.overall = clock.overall + (targetOverall - clock.overall) * 0.35f
                          clock.beat = if (metrics.beat > clock.beat) {
                              metrics.beat
                          } else {
                              (clock.beat - dt * 3.8f).coerceAtLeast(0f)
                          }
                          clock.frameTick++
                      } else {
                          var anyAlive = false
                          for (i in 0 until AudioSpectrumBus.BAND_COUNT) {
                              if (clock.bands[i] > 0.002f) {
                                  clock.bands[i] = (clock.bands[i] - dt * 2.6f).coerceAtLeast(0f)
                                  anyAlive = true
                              } else {
                                  clock.bands[i] = 0f
                              }
                              if (clock.peaks[i] > 0.002f) {
                                  clock.peaks[i] = (clock.peaks[i] - dt * 1.8f).coerceAtLeast(0f)
                                  anyAlive = true
                              } else {
                                  clock.peaks[i] = 0f
                              }
                          }
                          clock.bass = (clock.bass - dt * 2.6f).coerceAtLeast(0f)
                          clock.mid = (clock.mid - dt * 2.6f).coerceAtLeast(0f)
                          clock.high = (clock.high - dt * 2.6f).coerceAtLeast(0f)
                          clock.overall = (clock.overall - dt * 2.6f).coerceAtLeast(0f)
                          clock.beat = (clock.beat - dt * 4.0f).coerceAtLeast(0f)
                          clock.frameTick++
                          if (!anyAlive && clock.bass <= 0.001f && clock.overall <= 0.001f && clock.beat <= 0.001f) {
                              break
                          }
                      }
                      delay(frameDelayMs)
                  }
              }

