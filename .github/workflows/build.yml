          @Composable
          fun AuraFolderCard(
              folder: FolderGroup,
              isRemote: Boolean,
              onOpen: () -> Unit,
              onHideFolder: (() -> Unit)?
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (isFocused) 1.04f else 1f, label = "cardScale")
              val isQuranFolder = isQuranContent("", "", folder.name)
              val gradColors = if (isQuranFolder) {
                  AuraPalette.QuranFolderGradient
              } else {
                  AuraPalette.FolderGradients[abs(folder.name.hashCode()) % AuraPalette.FolderGradients.size]
              }
              val shape = RoundedCornerShape(22.dp)

              Box(
                  modifier = Modifier
                      .scale(scale)
                      .fillMaxWidth()
                      .height(138.dp)
                      .clip(shape)
                      .background(Brush.linearGradient(gradColors))
                      .border(
                          width = if (isFocused) 2.5.dp else 1.dp,
                          brush = when {
                              isFocused && isQuranFolder -> AuraPalette.GoldGradient
                              isFocused -> AuraPalette.PrimaryGradient
                              isQuranFolder -> Brush.linearGradient(listOf(AuraPalette.Gold.copy(alpha = 0.65f), Color(0x2210B981)))
                              else -> Brush.linearGradient(listOf(Color(0x44FFFFFF), Color(0x10FFFFFF)))
                          },
                          shape = shape
                      )
                      .onFocusChanged { isFocused = it.isFocused }
                      .clickable(onClick = onOpen)
              ) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val c = Offset(size.width * 0.85f, size.height * 0.22f)
