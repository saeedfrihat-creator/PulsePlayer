          /** «ليل ونور» — warm ink for music, emerald night and gold for Quran (Sakina). */
          internal object Pal {
              val Ink = Color(0xFF0C0B10)
              val Surface = Color(0xFF15131B)
              val Surface2 = Color(0xFF1F1C28)
              val Sheet = Color(0xFF17151E)
              val Field = Color(0xFF0E0D13)
              val Line = Color(0x1AF4F1EA)
              val LineStrong = Color(0x2EF4F1EA)
              val Text = Color(0xFFF4F1EA)
              val Muted = Color(0xFFA8A3B3)
              val Faint = Color(0xFF8A8597)
              val Ember = Color(0xFFFF8A5B)
              val Lilac = Color(0xFFA99BFF)
              val Danger = Color(0xFFFF7A85)
              val Teal = Color(0xFF5FD3C3)

              val Night = Color(0xFF061410)
              val NightDeep = Color(0xFF050F0C)
              val NightGlow = Color(0xFF11402F)
              val NightSurface = Color(0xFF0D211B)
              val Gold = Color(0xFFE6C77E)
              val GoldLight = Color(0xFFF3DFA6)
              val GoldDeep = Color(0xFFB79A57)
              val Mint = Color(0xFFEDF3EE)
              val Sage = Color(0xFF9FB5AA)
          }

          /** The colours of one screen. Folder and player screens switch mood with their content. */
          @Immutable
          data class Mood(
              val bg: Color,
              val surface: Color,
              val text: Color,
              val muted: Color,
              val accent: Color,
              val onAccent: Color,
              val line: Color,
              val isSakina: Boolean
          ) {
              companion object {
                  val Ember = Mood(Pal.Ink, Pal.Surface, Pal.Text, Pal.Muted, Pal.Ember, Pal.Ink, Pal.Line, false)
                  val Sakina = Mood(Pal.Night, Pal.NightSurface, Pal.Mint, Pal.Sage, Pal.Gold, Pal.Night, Color(0x2EE6C77E), true)

                  /** Player mood taken from the track's generated cover. */
                  fun fromCover(cover: CoverSpec): Mood =
                      if (cover.kind == CoverKind.QURAN || cover.kind == CoverKind.DHIKR ||
                          (cover.kind == CoverKind.FAVORITES && cover.accent == Pal.Gold)
                      ) Sakina else Ember.copy(accent = cover.accent)
              }
          }

          /**
           * Alexandria (interface) and Amiri (Quran titles) are bundled by the build when it can download
           * them; otherwise the system fonts are used. Looked up by name so the build never breaks.
           */
          internal object PulseFonts {
              var ui: FontFamily = FontFamily.Default
                  private set
              var quran: FontFamily = FontFamily.Serif
                  private set
              private var initialized = false

              @OptIn(ExperimentalTextApi::class)
              fun init(context: Context) {
                  if (initialized) return
                  initialized = true
                  val res = context.resources
                  val pkg = context.packageName
                  fun id(name: String): Int = res.getIdentifier(name, "font", pkg)

                  val alexandria = id("alexandria")
                  if (alexandria != 0) {
                      val weights = listOf(
                          FontWeight.Light,
                          FontWeight.Normal,
                          FontWeight.Medium,
                          FontWeight.SemiBold,
                          FontWeight.Bold,
                          FontWeight.ExtraBold
                      )
                      ui = FontFamily(
                          weights.map { w ->
                              Font(
                                  resId = alexandria,
                                  weight = w,
                                  variationSettings = FontVariation.Settings(FontVariation.weight(w.weight))
                              )
                          }
                      )
                  }
                  val amiriRegular = id("amiri_regular")
                  val amiriBold = id("amiri_bold")
                  if (amiriRegular != 0 && amiriBold != 0) {
                      quran = FontFamily(
                          Font(amiriRegular, FontWeight.Normal),
                          Font(amiriBold, FontWeight.Bold)
                      )
                  }
              }
          }

          private fun Typography.withFamily(f: FontFamily) = Typography(
              displayLarge = displayLarge.copy(fontFamily = f),
              displayMedium = displayMedium.copy(fontFamily = f),
              displaySmall = displaySmall.copy(fontFamily = f),
              headlineLarge = headlineLarge.copy(fontFamily = f),
              headlineMedium = headlineMedium.copy(fontFamily = f),
              headlineSmall = headlineSmall.copy(fontFamily = f),
              titleLarge = titleLarge.copy(fontFamily = f),
              titleMedium = titleMedium.copy(fontFamily = f),
              titleSmall = titleSmall.copy(fontFamily = f),
              bodyLarge = bodyLarge.copy(fontFamily = f),
              bodyMedium = bodyMedium.copy(fontFamily = f),
              bodySmall = bodySmall.copy(fontFamily = f),
              labelLarge = labelLarge.copy(fontFamily = f),
              labelMedium = labelMedium.copy(fontFamily = f),
              labelSmall = labelSmall.copy(fontFamily = f)
          )

          @Composable
          fun PulseTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Pal.Ember,
                      onPrimary = Pal.Ink,
                      secondary = Pal.Lilac,
                      tertiary = Pal.Gold,
                      background = Pal.Ink,
                      surface = Pal.Sheet,
                      surfaceVariant = Pal.Surface2,
                      onBackground = Pal.Text,
                      onSurface = Pal.Text,
                      onSurfaceVariant = Pal.Muted,
                      outline = Pal.LineStrong,
                      error = Pal.Danger
                  ),
                  typography = Typography().withFamily(PulseFonts.ui)
              ) {
                  ProvideTextStyle(TextStyle(fontFamily = PulseFonts.ui, color = Pal.Text)) {
                      content()
                  }
              }
          }

          /** 3:05, or 1:57:30 for long recitations. */
          internal fun formatTime(ms: Long): String {
              val totalSec = (ms / 1000).coerceAtLeast(0)
              val hours = totalSec / 3600
              val min = (totalSec % 3600) / 60
              val sec = totalSec % 60
              return if (hours > 0) {
                  String.format(Locale.US, "%d:%02d:%02d", hours, min, sec)
              } else {
                  String.format(Locale.US, "%d:%02d", min, sec)
              }
          }

          internal fun Context.showToast(text: String) {
              Toast.makeText(this, text, Toast.LENGTH_SHORT).show()
          }
