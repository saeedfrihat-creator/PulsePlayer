          @Composable
          fun MiniSpinningDisc(clock: VisualizerClock, isPlaying: Boolean, isIslamic: Boolean) {
              Canvas(modifier = Modifier.size(44.dp)) {
                  val c = Offset(size.width / 2f, size.height / 2f)
                  val r = size.minDimension / 2f
                  val phase = if (isPlaying) clock.phase else 0f
                  if (isIslamic) {
                      val deg = (phase * 14f) % 360f
                      val s = r * 0.62f
                      drawCircle(
                          brush = Brush.radialGradient(listOf(Color(0xFF0A4A3B), Color(0xFF041A15))),
                          radius = r,
                          center = c
                      )
                      rotate(degrees = deg, pivot = c) {
                          drawRect(AuraPalette.Gold, topLeft = Offset(c.x - s, c.y - s), size = Size(s * 2, s * 2), style = Stroke(2.2f))
                      }
                      rotate(degrees = deg + 45f, pivot = c) {
                          drawRect(AuraPalette.GoldLight, topLeft = Offset(c.x - s, c.y - s), size = Size(s * 2, s * 2), style = Stroke(2.2f))
                      }
                      drawCircle(AuraPalette.Gold, radius = r * 0.22f, center = c)
                  } else {
                      rotate(degrees = (phase * 55f) % 360f, pivot = c) {
                          drawCircle(
                              brush = Brush.radialGradient(listOf(Color(0xFF35246B), Color(0xFF0E0E1C))),
                              radius = r,
                              center = c
                          )
                          drawArc(
                              brush = AuraPalette.PrimaryGradient,
                              startAngle = -45f,
                              sweepAngle = 140f,
                              useCenter = false,
                              topLeft = Offset(3f, 3f),
                              size = Size(size.width - 6f, size.height - 6f),
                              style = Stroke(width = 3f, cap = StrokeCap.Round)
                          )
                          drawCircle(brush = AuraPalette.PrimaryGradient, radius = r * 0.34f, center = c)
                          drawCircle(color = AuraPalette.Obsidian, radius = r * 0.12f, center = c)
                      }
                  }
              }
          }

