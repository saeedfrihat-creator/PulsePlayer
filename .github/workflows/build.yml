          @Composable
          fun SongRowItem(
              song: SongItem,
              isCurrent: Boolean,
              isPlaying: Boolean,
              phase: Float,
              amplitude: Float,
              showFolderBadge: Boolean,
              onClick: () -> Unit,
              onManageClick: (() -> Unit)?
          ) {
              var isFocused by remember { mutableStateOf(false) }
              val bgColor = when {
                  isFocused -> Color(0xFF2C254A)
                  isCurrent -> Color(0xFF1F1C33)
                  else -> MaterialTheme.colorScheme.surface
              }
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(6.dp)
              ) {
                  Surface(
                      onClick = onClick,
                      shape = RoundedCornerShape(12.dp),
                      color = bgColor,
                      border = if (isFocused) BorderStroke(2.dp, Color(0xFFBB86FC)) else null,
                      modifier = Modifier
                          .weight(1f)
                          .onFocusChanged { isFocused = it.isFocused }
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 12.dp, vertical = 11.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          if (isCurrent && isPlaying) {
                              MiniEqualizerBars(phase = phase, amplitude = amplitude)
                          } else {
                              Icon(
                                  if (song.isRemote) Icons.Default.Cloud else Icons.Default.MusicNote,
                                  contentDescription = null,
                                  tint = if (isCurrent || isFocused) MaterialTheme.colorScheme.secondary else Color.Gray
                              )
                          }
                          Spacer(Modifier.width(10.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  song.title,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  color = if (isCurrent) MaterialTheme.colorScheme.secondary else Color.White,
                                  fontWeight = if (isCurrent || isFocused) FontWeight.Bold else FontWeight.Normal,
                                  fontSize = 15.sp
                              )
                              val subtitle = if (showFolderBadge) "${song.folder} • ${song.artist}" else song.artist
                              Text(
                                  subtitle,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  color = Color.Gray,
                                  fontSize = 12.sp
                              )
                          }
                          if (song.durationMs > 0L) {
                              Spacer(Modifier.width(8.dp))
                              Text(formatTime(song.durationMs), fontSize = 12.sp, color = Color.Gray)
                          }
                      }
                  }

                  if (onManageClick != null) {
                      TvIconButton(
                          icon = Icons.Default.Delete,
                          contentDescription = stringResource(R.string.cd_delete_or_hide),
                          onClick = onManageClick,
                          tint = Color(0xFFFF8A80),
                          size = 42
                      )
                  }
              }
          }

          @Composable
          fun TvNowPlayingPanel(
              title: String,
              artist: String,
              isPlaying: Boolean,
              positionMs: Long,
              durationMs: Long,
              shuffleEnabled: Boolean,
              repeatMode: Int,
              style: Int,
              phase: Float,
              amplitude: Float,
              onPlayPause: () -> Unit,
              onNext: () -> Unit,
              onPrev: () -> Unit,
              onRewind: () -> Unit,
              onForward: () -> Unit,
              onToggleShuffle: () -> Unit,
              onToggleRepeat: () -> Unit,
              onCycleStyle: () -> Unit,
              onFullScreen: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              Surface(
                  shape = RoundedCornerShape(20.dp),
                  color = MaterialTheme.colorScheme.surface,
                  modifier = modifier
              ) {
                  Column(
                      modifier = Modifier.fillMaxSize().padding(18.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .weight(1f)
                              .clip(RoundedCornerShape(18.dp))
                              .background(Color(0xFF0E0E18))
                      ) {
                          VisualizerStage(
                              style = style,
                              phase = phase,
                              amplitude = amplitude,
                              modifier = Modifier.fillMaxSize()
                          )
                          Row(
                              modifier = Modifier
                                  .align(Alignment.TopEnd)
                                  .padding(8.dp),
                              horizontalArrangement = Arrangement.spacedBy(4.dp)
                          ) {
                              TvIconButton(
                                  icon = Icons.Default.Palette,
                                  contentDescription = stringResource(R.string.cd_change_style),
                                  onClick = onCycleStyle,
                                  tint = Color(0xFF00E5FF),
                                  size = 38
                              )
                              TvIconButton(
                                  icon = Icons.Default.Fullscreen,
                                  contentDescription = stringResource(R.string.cd_fullscreen),
                                  onClick = onFullScreen,
                                  tint = Color.White,
                                  size = 38
                              )
                          }
                      }

                      Spacer(Modifier.height(12.dp))

                      Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {
                          Text(
                              title,
                              fontSize = 19.sp,
                              fontWeight = FontWeight.Bold,
                              maxLines = 1,
                              modifier = Modifier.basicMarquee()
                          )
                          if (artist.isNotBlank()) {
                              Spacer(Modifier.height(4.dp))
                              Text(
                                  artist,
                                  fontSize = 13.sp,
                                  color = Color.Gray,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }

                      Spacer(Modifier.height(10.dp))

                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                          Column(modifier = Modifier.fillMaxWidth()) {
                              val progress = if (durationMs > 0L) (positionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f) else 0f
                              LinearProgressIndicator(
                                  progress = { progress },
                                  modifier = Modifier.fillMaxWidth().height(6.dp).clip(RoundedCornerShape(4.dp))
                              )
                              Spacer(Modifier.height(6.dp))
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(formatTime(positionMs), fontSize = 12.sp, color = Color.Gray)
                                  Text(formatTime(durationMs), fontSize = 12.sp, color = Color.Gray)
                              }
                          }

                          Spacer(Modifier.height(6.dp))

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceEvenly,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              TvIconButton(Icons.Default.SkipPrevious, stringResource(R.string.cd_previous), onPrev)
                              TvIconButton(Icons.Default.FastRewind, stringResource(R.string.cd_rewind), onRewind)
                              TvIconButton(
                                  icon = if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                  contentDescription = stringResource(R.string.cd_play_pause),
                                  onClick = onPlayPause,
                                  filled = true,
                                  size = 56
                              )
                              TvIconButton(Icons.Default.FastForward, stringResource(R.string.cd_forward), onForward)
                              TvIconButton(Icons.Default.SkipNext, stringResource(R.string.cd_next), onNext)
                          }
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceEvenly
                      ) {
                          TvIconButton(
                              icon = Icons.Default.Shuffle,
                              contentDescription = stringResource(R.string.cd_shuffle),
                              onClick = onToggleShuffle,
                              tint = if (shuffleEnabled) Color(0xFF00E5FF) else Color.Gray
                          )
                          TvIconButton(
                              icon = if (repeatMode == Player.REPEAT_MODE_ONE) Icons.Default.RepeatOne else Icons.Default.Repeat,
                              contentDescription = stringResource(R.string.cd_repeat),
                              onClick = onToggleRepeat,
                              tint = if (repeatMode != Player.REPEAT_MODE_OFF) Color(0xFF00E5FF) else Color.Gray
                          )
                      }
                  }
              }
          }

          @Composable
          fun MobileControlBar(
              title: String,
              artist: String,
              isPlaying: Boolean,
              phase: Float,
              amplitude: Float,
              positionMs: Long,
              durationMs: Long,
              shuffleEnabled: Boolean,
              repeatMode: Int,
              onSeek: (Long) -> Unit,
              onPlayPause: () -> Unit,
