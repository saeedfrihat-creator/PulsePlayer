              val Danger = Color(0xFFFB7185)

              val EmeraldObsidian = Color(0xFF041411)
              val EmeraldGlow = Color(0xFF10B981)
              val EmeraldGlass = Color(0xCC071E19)
              val Gold = Color(0xFFD4AF37)
              val GoldLight = Color(0xFFFDE68A)
              val GoldDeep = Color(0xFFB45309)

              val PrimaryGradient = Brush.linearGradient(listOf(Violet, Cyan))
              val GoldGradient = Brush.linearGradient(listOf(GoldDeep, Gold, GoldLight))
              val PlayOnceGradient = Brush.linearGradient(listOf(Rose, Color(0xFFF59E0B)))

              val FolderGradients = listOf(
                  listOf(Color(0xFF3B1D7A), Color(0xFF123B5D)),
                  listOf(Color(0xFF6B1854), Color(0xFF281959)),
                  listOf(Color(0xFF0E4F5C), Color(0xFF14284B)),
                  listOf(Color(0xFF5A2546), Color(0xFF1F1D45)),
                  listOf(Color(0xFF253478), Color(0xFF123D54)),
                  listOf(Color(0xFF4C1D6E), Color(0xFF1B1938))
              )
              val QuranFolderGradient = listOf(Color(0xFF084236), Color(0xFF072320))
          }

          private const val MODE_REPEAT_ALL = 0
          private const val MODE_REPEAT_ONE = 1
          private const val MODE_PLAY_ONCE = 2
          private const val MODE_REPEAT_OFF = 3

          private const val STYLE_ISLAMIC = 4
          private const val TOTAL_STYLES = 5

          private fun isQuranContent(title: String, artist: String, folder: String): Boolean {
              val combined = "$title $artist $folder".lowercase(Locale.ROOT)
              if (combined.isBlank()) return false
              val keywords = listOf(
                  "قرآن", "قران", "القرآن", "القران", "سورة", "سوره", "مصحف", "تلاوة", "تلاوه",
                  "رقية", "رقيه", "أذكار", "اذكار", "دعاء",
                  "quran", "quraan", "koran", "surah", "sorah", "mushaf", "tilawah", "tilawa",
                  "العفاسي", "السديس", "المعيقلي", "الحصري", "المنشاوي", "عبدالباسط", "عبد الباسط",
                  "الدوسري", "القطامي", "الغامدي", "العجمي", "الشريم", "الحذيفي", "فارس عباد", "بندر بليلة",
                  "alafasy", "sudais", "muaiqly", "husary", "minshawi", "basit", "dosari", "ghamdi"
              )
              return keywords.any { combined.contains(it) }
          }

          class MainActivity : ComponentActivity() {
              private var controllerFuture: ListenableFuture<MediaController>? = null
              private val playerState = mutableStateOf<Player?>(null)
              private val isResumedState = mutableStateOf(false)

              override fun onStart() {
                  super.onStart()
                  val sessionToken = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  controllerFuture = MediaController.Builder(this, sessionToken).buildAsync()
                  controllerFuture?.addListener({
                      playerState.value = controllerFuture?.get()
                  }, ContextCompat.getMainExecutor(this))
              }

              override fun onResume() {
                  super.onResume()
                  isResumedState.value = true
              }

              override fun onPause() {
                  isResumedState.value = false
                  super.onPause()
              }

              override fun onStop() {
                  controllerFuture?.let { MediaController.releaseFuture(it) }
                  controllerFuture = null
                  playerState.value = null
                  super.onStop()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                  )
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = AuraPalette.Violet,
                              secondary = AuraPalette.Cyan,
                              tertiary = AuraPalette.Rose,
                              background = AuraPalette.Obsidian,
                              surface = AuraPalette.DeepNight,
                              onBackground = Color.White,
                              onSurface = Color.White
                          )
                      ) {
                          Surface(modifier = Modifier.fillMaxSize(), color = AuraPalette.Obsidian) {
                              PulseApp(
                                  player = playerState.value,
                                  isResumed = isResumedState.value
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun PulseApp(player: Player?, isResumed: Boolean) {
              val context = LocalContext.current
              val activity = context as? Activity
              val config = LocalConfiguration.current
              val isTv = (config.uiMode and Configuration.UI_MODE_TYPE_MASK) == Configuration.UI_MODE_TYPE_TELEVISION
              val isWideScreen = isTv || config.screenWidthDp >= 640

              val scope = rememberCoroutineScope()
              val prefs = remember { context.getSharedPreferences("homelab_prefs", Context.MODE_PRIVATE) }

              var selectedTab by remember { mutableIntStateOf(0) }
              var localSongs by remember { mutableStateOf<List<SongItem>>(emptyList()) }
              var remoteSongs by remember { mutableStateOf<List<SongItem>>(emptyList()) }

              var selectedLocalFolder by remember { mutableStateOf<String?>(null) }
              var selectedRemoteFolder by remember { mutableStateOf<String?>(null) }

              var isFullScreen by remember { mutableStateOf(false) }
              var visualizerStyle by remember { mutableIntStateOf(prefs.getInt("vis_style", 0) % TOTAL_STYLES) }
              var manualStyleOverrideId by remember { mutableStateOf<String?>(null) }

              var hiddenSongIds by remember {
                  mutableStateOf(prefs.getStringSet("hidden_songs", emptySet())?.toSet() ?: emptySet())
              }
              var hiddenLocalFolders by remember {
                  mutableStateOf(prefs.getStringSet("hidden_folders", emptySet())?.toSet() ?: emptySet())
              }

              var searchQuery by remember { mutableStateOf("") }
              var isLoadingRemote by remember { mutableStateOf(false) }
              var remoteError by remember { mutableStateOf<String?>(null) }
              var songToManage by remember { mutableStateOf<SongItem?>(null) }

              var showServerDialog by remember { mutableStateOf(false) }
              var homeLabMode by remember { mutableStateOf(prefs.getString("homelab_mode", "smb") ?: "smb") }
              var smbHost by remember { mutableStateOf(prefs.getString("smb_host", "") ?: "") }
              var smbShare by remember { mutableStateOf(prefs.getString("smb_share", "") ?: "") }
              var smbSubFolder by remember { mutableStateOf(prefs.getString("smb_subfolder", "") ?: "") }
              var smbUser by remember { mutableStateOf(prefs.getString("smb_user", "") ?: "") }
              var smbPass by remember { mutableStateOf(prefs.getString("smb_pass", "") ?: "") }

              var serverUrl by remember { mutableStateOf(prefs.getString("url", "http://192.168.1.100:4533") ?: "") }
              var serverUser by remember { mutableStateOf(prefs.getString("user", "") ?: "") }
              var serverPass by remember { mutableStateOf(prefs.getString("pass", "") ?: "") }

              val defaultPrompt = stringResource(R.string.select_song_prompt)
              var isPlaying by remember { mutableStateOf(false) }
              var currentTitle by remember { mutableStateOf(defaultPrompt) }
              var currentArtist by remember { mutableStateOf("") }
              var currentAlbum by remember { mutableStateOf("") }
              var currentMediaId by remember { mutableStateOf("") }
              var positionMs by remember { mutableLongStateOf(0L) }
              var durationMs by remember { mutableLongStateOf(0L) }
              var shuffleEnabled by remember { mutableStateOf(false) }
              var playbackMode by remember { mutableIntStateOf(prefs.getInt("playback_mode", MODE_REPEAT_ALL)) }

              val isQuranTrack = remember(currentTitle, currentArtist, currentAlbum) {
                  isQuranContent(currentTitle, currentArtist, currentAlbum)
              }
              val effectiveStyle = if (isQuranTrack && manualStyleOverrideId != currentMediaId) {
                  STYLE_ISLAMIC
              } else {
                  visualizerStyle
              }
              val isIslamicActive = effectiveStyle == STYLE_ISLAMIC

              // ساعة حركة معزولة تعمل بـ 30fps على الهاتف وتتوقف كلياً عند الخروج للخلفية
              val clock = remember { VisualizerClock() }

              LaunchedEffect(isPlaying, isResumed, isTv) {
                  if (!isResumed) return@LaunchedEffect
                  var lastTimeMs = System.currentTimeMillis()
                  val frameDelayMs = if (isTv) 25L else 33L
                  while (isResumed) {
                      val now = System.currentTimeMillis()
                      val dt = ((now - lastTimeMs) / 1000f).coerceIn(0f, 0.06f)
                      lastTimeMs = now
                      if (isPlaying) {
                          clock.phase += dt
                          clock.amplitude = (clock.amplitude + dt * 3.5f).coerceAtMost(1f)
                      } else {
                          clock.amplitude = (clock.amplitude - dt * 2.5f).coerceAtLeast(0f)
                          if (clock.amplitude <= 0.001f) break
                      }
                      delay(frameDelayMs)
                  }
              }

              // إبقاء الشاشة مضاءة على التلفاز فقط في الوضع المسرحي لحماية بطارية الهاتف
              DisposableEffect(isFullScreen, isTv) {
                  if (isFullScreen && isTv) {
                      activity?.window?.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
                  onDispose {
                      activity?.window?.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }

              fun applyPlaybackMode(mode: Int, showToast: Boolean = false) {
                  playbackMode = mode
                  prefs.edit().putInt("playback_mode", mode).apply()
                  when (mode) {
                      MODE_REPEAT_ALL -> {
                          PlaybackBridge.setStopAfterCurrent(false)
                          player?.repeatMode = Player.REPEAT_MODE_ALL
                          if (showToast) Toast.makeText(context, context.getString(R.string.mode_repeat_all), Toast.LENGTH_SHORT).show()
                      }
                      MODE_REPEAT_ONE -> {
                          PlaybackBridge.setStopAfterCurrent(false)
                          player?.repeatMode = Player.REPEAT_MODE_ONE
                          if (showToast) Toast.makeText(context, context.getString(R.string.mode_repeat_one), Toast.LENGTH_SHORT).show()
                      }
                      MODE_PLAY_ONCE -> {
                          player?.repeatMode = Player.REPEAT_MODE_OFF
                          PlaybackBridge.setStopAfterCurrent(true)
                          if (showToast) Toast.makeText(context, context.getString(R.string.mode_play_once), Toast.LENGTH_SHORT).show()
                      }
                      else -> {
                          PlaybackBridge.setStopAfterCurrent(false)
                          player?.repeatMode = Player.REPEAT_MODE_OFF
                          if (showToast) Toast.makeText(context, context.getString(R.string.mode_repeat_off), Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              fun cyclePlaybackMode() {
                  applyPlaybackMode((playbackMode + 1) % 4, showToast = true)
              }

              fun cycleVisualizerStyle() {
                  val next = (effectiveStyle + 1) % TOTAL_STYLES
                  visualizerStyle = next
                  manualStyleOverrideId = currentMediaId
                  prefs.edit().putInt("vis_style", next).apply()
              }

              fun saveHiddenSets(songs: Set<String>, folders: Set<String>) {
                  hiddenSongIds = songs
                  hiddenLocalFolders = folders
                  prefs.edit()
                      .putStringSet("hidden_songs", songs.toSet())
                      .putStringSet("hidden_folders", folders.toSet())
                      .apply()
              }

              fun hideSong(songId: String) {
                  saveHiddenSets(hiddenSongIds + songId, hiddenLocalFolders)
                  if (currentMediaId == songId) player?.pause()
              }

              fun hideLocalFolder(folderName: String) {
                  saveHiddenSets(hiddenSongIds, hiddenLocalFolders + folderName)
                  if (selectedLocalFolder == folderName) selectedLocalFolder = null
              }

              fun refreshLocal() {
                  scope.launch { localSongs = MusicRepository.loadLocalSongs(context) }
              }

              fun refreshHomeLab() {
                  if (homeLabMode == "smb") {
                      if (smbHost.isBlank() || smbShare.isBlank()) {
                          showServerDialog = true
                          return
                      }
                      scope.launch {
                          isLoadingRemote = true
                          remoteError = null
                          MusicRepository.loadSmbSongs(context, smbHost, smbShare, smbSubFolder, smbUser, smbPass)
                              .onSuccess { remoteSongs = it }
                              .onFailure {
                                  remoteError = context.getString(R.string.connection_failed, it.localizedMessage ?: "")
                              }
                          isLoadingRemote = false
                      }
                  } else {
                      if (serverUrl.isBlank() || serverUser.isBlank()) {
                          showServerDialog = true
                          return
                      }
                      scope.launch {
                          isLoadingRemote = true
                          remoteError = null
                          MusicRepository.loadNavidromeSongs(context, serverUrl, serverUser, serverPass)
                              .onSuccess { remoteSongs = it }
                              .onFailure {
                                  remoteError = context.getString(R.string.connection_failed, it.localizedMessage ?: "")
                              }
                          isLoadingRemote = false
                      }
                  }
              }

              val deleteLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartIntentSenderForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      Toast.makeText(context, context.getString(R.string.toast_deleted), Toast.LENGTH_SHORT).show()
                      refreshLocal()
                  }
              }

              fun deleteLocalSongPermanently(song: SongItem) {
                  if (currentMediaId == song.id) player?.pause()
                  runCatching {
                      val uri = Uri.parse(song.uri)
                      if (song.uri.startsWith("content://")) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              val pendingIntent = MediaStore.createDeleteRequest(context.contentResolver, listOf(uri))
                              val req = IntentSenderRequest.Builder(pendingIntent.intentSender).build()
                              deleteLauncher.launch(req)
                          } else {
                              val deleted = context.contentResolver.delete(uri, null, null)
                              if (deleted > 0) {
                                  Toast.makeText(context, context.getString(R.string.toast_deleted), Toast.LENGTH_SHORT).show()
                                  refreshLocal()
                              } else {
                                  hideSong(song.id)
                                  Toast.makeText(context, context.getString(R.string.toast_delete_failed_hidden), Toast.LENGTH_SHORT).show()
                              }
                          }
                      } else if (song.uri.startsWith("file://")) {
                          val file = uri.path?.let { File(it) }
                          if (file != null && file.delete()) {
                              Toast.makeText(context, context.getString(R.string.toast_deleted), Toast.LENGTH_SHORT).show()
                              refreshLocal()
                          } else {
                              hideSong(song.id)
                              Toast.makeText(context, context.getString(R.string.toast_delete_failed_hidden), Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.onFailure {
                      hideSong(song.id)
                      Toast.makeText(context, context.getString(R.string.toast_song_hidden), Toast.LENGTH_SHORT).show()
                  }
              }

              val currentOpenFolder = if (selectedTab == 0) selectedLocalFolder else selectedRemoteFolder

              BackHandler(enabled = !isFullScreen && currentOpenFolder != null) {
                  if (selectedTab == 0) selectedLocalFolder = null else selectedRemoteFolder = null
                  searchQuery = ""
              }

              BackHandler(enabled = isFullScreen) {
                  isFullScreen = false
              }

              val audioPermission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  Manifest.permission.READ_MEDIA_AUDIO
              } else {
                  Manifest.permission.READ_EXTERNAL_STORAGE
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { results ->
                  if (results[audioPermission] == true) refreshLocal()
              }

              LaunchedEffect(Unit) {
                  val perms = mutableListOf(audioPermission)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (ContextCompat.checkSelfPermission(context, audioPermission) == PackageManager.PERMISSION_GRANTED) {
                      refreshLocal()
                  } else {
                      permissionLauncher.launch(perms.toTypedArray())
                  }
              }

              DisposableEffect(player) {
                  if (player == null) {
                      isPlaying = false
                      return@DisposableEffect onDispose {}
                  }

                  applyPlaybackMode(playbackMode, showToast = false)
                  fun syncState() {
                      isPlaying = player.isPlaying
                      currentMediaId = player.currentMediaItem?.mediaId ?: ""
                      currentTitle = player.mediaMetadata.title?.toString()
                          ?: context.getString(R.string.select_song_prompt)
                      currentArtist = player.mediaMetadata.artist?.toString() ?: ""
                      currentAlbum = player.mediaMetadata.albumTitle?.toString() ?: ""
                      durationMs = player.duration.coerceAtLeast(0L)
                      positionMs = player.currentPosition.coerceAtLeast(0L)
                      shuffleEnabled = player.shuffleModeEnabled
                  }
                  syncState()

                  val listener = object : Player.Listener {
                      override fun onEvents(p: Player, events: Player.Events) = syncState()
                  }
                  player.addListener(listener)
                  onDispose { player.removeListener(listener) }
              }

              // تحديث شريط التقدم مرة كل ثانية فقط وعندما تكون الشاشة مفتوحة
              LaunchedEffect(player, isPlaying, isResumed) {
                  while (player != null && isPlaying && isResumed) {
                      positionMs = player.currentPosition.coerceAtLeast(0L)
                      durationMs = player.duration.coerceAtLeast(0L)
                      delay(1000L)
                  }
              }

              val visibleLocalSongs = remember(localSongs, hiddenSongIds, hiddenLocalFolders) {
                  localSongs.filter { it.id !in hiddenSongIds && it.folder !in hiddenLocalFolders }
              }

              val localFolders = remember(visibleLocalSongs) {
                  visibleLocalSongs
                      .groupBy { it.folder }
                      .map { (name, songs) -> FolderGroup(name, songs.sortedBy { it.title.lowercase() }) }
                      .sortedBy { it.name.lowercase() }
              }

              val remoteFolders = remember(remoteSongs) {
                  remoteSongs
                      .groupBy { it.folder }
                      .map { (name, songs) -> FolderGroup(name, songs.sortedBy { it.title.lowercase() }) }
                      .sortedBy { it.name.lowercase() }
              }

              val activeFolders = if (selectedTab == 0) localFolders else remoteFolders
              val allTabSongs = if (selectedTab == 0) visibleLocalSongs else remoteSongs

              fun playListFromIndex(list: List<SongItem>, index: Int) {
                  val p = player ?: return
                  if (list.isEmpty()) return
                  val mediaItems = list.map { song ->
                      MediaItem.Builder()
                          .setMediaId(song.id)
                          .setUri(song.uri)
                          .setMediaMetadata(
                              MediaMetadata.Builder()
                                  .setTitle(song.title)
                                  .setArtist(song.artist)
                                  .setAlbumTitle(song.folder)
                                  .build()
                          )
                          .build()
                  }
                  applyPlaybackMode(playbackMode, showToast = false)
                  p.setMediaItems(mediaItems, index.coerceIn(0, mediaItems.lastIndex), 0L)
                  p.prepare()
                  p.play()
              }

              val onPlayPause = {
                  player?.let {
                      if (it.isPlaying) {
                          it.pause()
                      } else {
                          if (it.playbackState == Player.STATE_ENDED ||
                              (it.duration > 0L && it.currentPosition >= it.duration - 500L)
                          ) {
                              it.seekTo(0L)
                          }
                          it.play()
                      }
                  }
                  Unit
              }
              val onNext = { player?.seekToNext(); player?.play(); Unit }
              val onPrev = { player?.seekToPrevious(); player?.play(); Unit }
              val onRewind = {
                  player?.let { it.seekTo((it.currentPosition - 15_000L).coerceAtLeast(0L)) }
                  Unit
              }
              val onForward = {
                  player?.let { it.seekTo((it.currentPosition + 15_000L).coerceAtMost(it.duration.coerceAtLeast(0L))) }
                  Unit
              }
              val onToggleShuffle = {
                  player?.let { it.shuffleModeEnabled = !it.shuffleModeEnabled }
                  Unit
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(if (isIslamicActive) AuraPalette.EmeraldObsidian else AuraPalette.Obsidian)
              ) {
                  // خلفية ثابتة موفرة للطاقة أثناء التصفح على الهاتف، ومتحركة في وضع الاستوديو والتلفاز
                  AmbientAuroraBackdrop(
                      clock = clock,
                      animate = isFullScreen || isTv,
                      isIslamic = isIslamicActive,
                      modifier = Modifier.fillMaxSize()
                  )

                  if (isFullScreen) {
                      FullScreenStudio(
                          title = currentTitle,
                          artist = currentArtist,
                          isPlaying = isPlaying,
                          isTv = isTv,
                          positionMs = positionMs,
                          durationMs = durationMs,
                          shuffleEnabled = shuffleEnabled,
                          playbackMode = playbackMode,
                          style = effectiveStyle,
                          clock = clock,
                          onSeek = { player?.seekTo(it) },
                          onPlayPause = onPlayPause,
                          onNext = onNext,
                          onPrev = onPrev,
                          onRewind = onRewind,
                          onForward = onForward,
                          onToggleShuffle = onToggleShuffle,
                          onCyclePlaybackMode = { cyclePlaybackMode() },
                          onCycleStyle = { cycleVisualizerStyle() },
                          onExit = { isFullScreen = false }
                      )
                  } else {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .statusBarsPadding()
                      ) {
                          AuraTopBar(
                              isTv = isTv,
                              isPlaying = isPlaying,
                              isIslamic = isIslamicActive,
                              clock = clock,
                              onOpenStudio = { isFullScreen = true },
                              onRefresh = { if (selectedTab == 0) refreshLocal() else refreshHomeLab() },
                              onOpenSettings = { showServerDialog = true }
                          )

                          val libraryContent: @Composable (Modifier) -> Unit = { mod ->
                              Column(modifier = mod) {
                                  GlassSegmentedSwitch(
                                      leftLabel = if (isTv) {
                                          stringResource(R.string.tab_device, localFolders.size)
                                      } else {
                                          stringResource(R.string.tab_phone, localFolders.size)
                                      },
                                      leftIcon = if (isTv) Icons.Default.Tv else Icons.Default.PhoneAndroid,
                                      rightLabel = stringResource(R.string.tab_homelab, remoteFolders.size),
                                      rightIcon = Icons.Default.Storage,
                                      selectedTab = selectedTab,
                                      onSelect = { tab ->
                                          selectedTab = tab
                                          searchQuery = ""
                                          if (tab == 1 && remoteSongs.isEmpty()) refreshHomeLab()
                                      },
                                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 6.dp)
                                  )

                                  GlassSearchBar(
                                      query = searchQuery,
                                      onQueryChange = { searchQuery = it },
                                      placeholder = if (currentOpenFolder == null) {
                                          stringResource(R.string.search_folders_or_songs)
                                      } else {
                                          stringResource(R.string.search_in_folder, currentOpenFolder)
                                      },
                                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 6.dp)
                                  )

                                  if (currentOpenFolder != null) {
                                      val openSongs = activeFolders.firstOrNull { it.name == currentOpenFolder }?.songs ?: emptyList()
                                      OpenFolderHeader(
                                          folderName = currentOpenFolder,
                                          songCount = openSongs.size,
                                          onBack = {
                                              if (selectedTab == 0) selectedLocalFolder = null else selectedRemoteFolder = null
                                              searchQuery = ""
                                          },
                                          onPlayAll = { playListFromIndex(openSongs, 0) }
                                      )
                                  }

                                  val bottomContentPad = if (isWideScreen) 16.dp else 128.dp

                                  if (selectedTab == 1 && isLoadingRemote) {
                                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                          CircularProgressIndicator(color = AuraPalette.Cyan)
                                      }
                                  } else if (selectedTab == 1 && remoteError != null) {
                                      Column(
                                          Modifier.fillMaxSize().padding(28.dp),
                                          horizontalAlignment = Alignment.CenterHorizontally,
                                          verticalArrangement = Arrangement.Center
                                      ) {
                                          Text(remoteError!!, color = AuraPalette.Danger, textAlign = TextAlign.Center)
                                          Spacer(Modifier.height(14.dp))
                                          GradientActionButton(
                                              text = stringResource(R.string.edit_server_settings),
                                              onClick = { showServerDialog = true }
                                          )
                                      }
                                  } else if (currentOpenFolder == null) {
                                      if (searchQuery.isNotBlank()) {
                                          val matchedSongs = allTabSongs.filter {
                                              it.title.contains(searchQuery, ignoreCase = true) ||
                                                  it.artist.contains(searchQuery, ignoreCase = true) ||
                                                  it.folder.contains(searchQuery, ignoreCase = true)
                                          }
                                          if (matchedSongs.isEmpty()) {
                                              Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                                  Text(stringResource(R.string.no_search_results), color = AuraPalette.MutedText)
                                              }
                                          } else {
                                              LazyColumn(
                                                  modifier = Modifier.fillMaxSize(),
                                                  contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 8.dp, bottom = bottomContentPad),
                                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                                              ) {
                                                  itemsIndexed(matchedSongs, key = { idx, item -> "${item.id}_s_$idx" }) { index, song ->
                                                      AuraSongCard(
                                                          song = song,
                                                          isCurrent = song.id == currentMediaId,
                                                          isPlaying = isPlaying,
                                                          clock = clock,
