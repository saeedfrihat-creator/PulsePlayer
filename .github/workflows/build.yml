                  )
                  Spacer(Modifier.height(18.dp))
                  Text(
                      folder.displayName,
                      fontSize = if (isTv) 32.sp else 28.sp,
                      fontWeight = FontWeight.Bold,
                      fontFamily = if (mood.isSakina) PulseFonts.quran else null,
                      color = if (mood.isSakina) Pal.GoldLight else mood.text,
                      textAlign = TextAlign.Center,
                      maxLines = 2,
                      overflow = TextOverflow.Ellipsis,
                      modifier = Modifier.padding(horizontal = 12.dp)
                  )
                  Spacer(Modifier.height(6.dp))
                  Text(
                      meta,
                      fontSize = 13.sp,
                      color = mood.muted,
                      textAlign = TextAlign.Center,
                      maxLines = 2,
                      modifier = Modifier.padding(horizontal = 12.dp)
                  )
                  if (isMixed) {
                      Spacer(Modifier.height(6.dp))
                      Text(
                          stringResource(R.string.mixed_folder_hint),
                          fontSize = 12.sp,
                          color = mood.accent,
                          textAlign = TextAlign.Center,
                          modifier = Modifier.padding(horizontal = 14.dp)
                      )
                  }
                  Spacer(Modifier.height(18.dp))
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      PillButton(
                          text = stringResource(R.string.play_folder),
                          onClick = onPlayAll,
                          icon = Icons.Rounded.PlayArrow,
                          container = mood.accent,
                          content = mood.onAccent
                      )
                      RoundIconButton(
                          icon = Icons.Rounded.Shuffle,
                          contentDescription = stringResource(R.string.cd_shuffle),
                          onClick = onShuffle,
                          size = 52.dp,
                          tint = mood.accent,
                          container = Color.Transparent,
                          borderColor = mood.accent.copy(alpha = 0.4f),
                          ring = mood.accent
                      )
                  }
                  if (canMove) {
                      Spacer(Modifier.height(12.dp))
                      PillButton(
                          text = stringResource(if (mood.isSakina) R.string.move_to_music else R.string.move_to_quran),
                          onClick = onMoveSection,
                          icon = Icons.Rounded.SwapHoriz,
                          container = mood.text.copy(alpha = 0.06f),
                          content = if (mood.isSakina) Pal.Mint else Pal.GoldLight,
                          borderColor = mood.line,
                          height = 42.dp,
                          fontSize = 13,
                          ring = mood.accent
                      )
                  }
              }
          }
