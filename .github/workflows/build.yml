          package com.pulse.player

          import android.content.Context
          import android.content.SharedPreferences
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.security.KeyStore
          import java.util.UUID
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          const val DEFAULT_NAVIDROME_URL = "http://192.168.1.100:4533"
          const val DEVICE_SOURCE_ID = "device"

          enum class SourceType { DEVICE, SMB, NAVIDROME }

          /**
           * One library the user added: the device's own audio, an SMB folder, or a Navidrome server.
           * The home screen shows the folders of every source together.
           */
          data class LibrarySource(
              val id: String,
              val type: SourceType,
              val label: String,
              /** DEVICE only: folder keys to include. Empty means every audio folder on the device. */
              val deviceFolders: List<String> = emptyList(),
              val smbHost: String = "",
              val smbShare: String = "",
              val smbSubFolder: String = "",
              val smbUser: String = "",
              val smbPass: String = "",
              val navUrl: String = "",
              val navUser: String = "",
              val navPass: String = ""
          ) {
              val isNetwork: Boolean
                  get() = type != SourceType.DEVICE

              val isConfigured: Boolean
                  get() = when (type) {
                      SourceType.DEVICE -> true
                      SourceType.SMB -> smbHost.isNotBlank() && smbShare.isNotBlank()
                      SourceType.NAVIDROME -> navUrl.isNotBlank() && navUser.isNotBlank()
                  }

              /** Identifies the scanned library on disk. Never contains a password. */
              val cacheKey: String
                  get() = when (type) {
                      SourceType.DEVICE -> "device|" + deviceFolders.joinToString(",")
                      SourceType.SMB -> "smb|${smbHost.trim()}|${smbShare.trim()}|${smbSubFolder.trim()}|${smbUser.trim()}"
                      SourceType.NAVIDROME -> "nav|${navUrl.trim().trimEnd('/')}|${navUser.trim()}"
                  }

              /** Short technical description shown under the label in settings. */
              val address: String
                  get() = when (type) {
                      SourceType.DEVICE -> ""
                      SourceType.SMB -> listOf(smbHost.trim(), smbShare.trim(), smbSubFolder.trim().replace('\\', '/'))
                          .filter { it.isNotBlank() }
                          .joinToString("/")
                      SourceType.NAVIDROME -> navUrl.trim()
                  }

              // Keep passwords out of logs and crash reports.
              override fun toString(): String = "LibrarySource(id=$id, type=$type, label=$label, address=$address)"
          }

          /**
           * Encrypts secrets with an AES-256-GCM key that lives inside the Android Keystore.
           * The key never leaves the device, so copied preference files are useless elsewhere.
           */
          object SecretCipher {
              private const val KEYSTORE = "AndroidKeyStore"
              private const val KEY_ALIAS = "pulse_homelab_secret_v1"
              private const val TRANSFORMATION = "AES/GCM/NoPadding"
              private const val TAG_BITS = 128

              private fun secretKey(): SecretKey {
                  val keyStore = KeyStore.getInstance(KEYSTORE).apply { load(null) }
                  val existing = keyStore.getKey(KEY_ALIAS, null) as? SecretKey
                  if (existing != null) return existing

                  val generator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, KEYSTORE)
                  generator.init(
                      KeyGenParameterSpec.Builder(
                          KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                  )
                  return generator.generateKey()
              }

              /** Returns "" for an empty secret or when the keystore is unavailable. */
              fun encrypt(plain: String): String {
                  if (plain.isEmpty()) return ""
                  return try {
                      val cipher = Cipher.getInstance(TRANSFORMATION)
                      cipher.init(Cipher.ENCRYPT_MODE, secretKey())
                      val iv = cipher.iv
                      val sealed = cipher.doFinal(plain.toByteArray(Charsets.UTF_8))
                      Base64.encodeToString(iv, Base64.NO_WRAP) + ":" + Base64.encodeToString(sealed, Base64.NO_WRAP)
                  } catch (e: Exception) {
                      ""
                  }
              }

              /** Returns "" when the value is missing, corrupted, or was encrypted on another device. */
              fun decrypt(stored: String): String {
                  if (stored.isEmpty()) return ""
                  return try {
                      val sep = stored.indexOf(':')
                      if (sep <= 0) return ""
                      val iv = Base64.decode(stored.substring(0, sep), Base64.NO_WRAP)
                      val sealed = Base64.decode(stored.substring(sep + 1), Base64.NO_WRAP)
                      val cipher = Cipher.getInstance(TRANSFORMATION)
                      cipher.init(Cipher.DECRYPT_MODE, secretKey(), GCMParameterSpec(TAG_BITS, iv))
                      String(cipher.doFinal(sealed), Charsets.UTF_8)
                  } catch (e: Exception) {
                      ""
                  }
              }
          }

          /**
           * The list of libraries, stored as JSON with every password encrypted. The decrypted list is
           * cached in memory, so playback threads (SMB / Navidrome) never hit the keystore per read.
           */
          object LibraryStore {
              const val PREFS_NAME = "homelab_prefs"
              private const val KEY_LIBRARIES = "libraries_v1"

              private val lock = Any()

              @Volatile
              private var cached: List<LibrarySource>? = null

              fun prefs(context: Context): SharedPreferences =
                  context.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun sources(context: Context): List<LibrarySource> {
                  cached?.let { return it }
                  synchronized(lock) {
                      cached?.let { return it }
                      val p = prefs(context)
                      val loaded = if (p.contains(KEY_LIBRARIES)) {
                          decode(p.getString(KEY_LIBRARIES, "[]") ?: "[]")
                      } else {
                          migrateLegacy(context, p)
                      }
                      cached = loaded
                      return loaded
                  }
              }

              fun source(context: Context, id: String): LibrarySource? = sources(context).firstOrNull { it.id == id }

              fun upsert(context: Context, source: LibrarySource) {
                  synchronized(lock) {
                      val current = sources(context).toMutableList()
                      val index = current.indexOfFirst { it.id == source.id }
                      val cleaned = source.copy(
                          label = source.label.trim(),
                          smbHost = source.smbHost.trim(),
                          smbShare = source.smbShare.trim(),
                          smbSubFolder = source.smbSubFolder.trim(),
                          smbUser = source.smbUser.trim(),
                          navUrl = source.navUrl.trim(),
                          navUser = source.navUser.trim()
                      )
                      if (index >= 0) current[index] = cleaned else current.add(cleaned)
                      persist(context, current)
                  }
              }

              fun remove(context: Context, id: String) {
                  synchronized(lock) {
                      persist(context, sources(context).filterNot { it.id == id })
                  }
              }

              fun newId(): String = UUID.randomUUID().toString().replace("-", "").take(12)

              private fun persist(context: Context, list: List<LibrarySource>) {
                  prefs(context).edit().putString(KEY_LIBRARIES, encode(list)).apply()
                  cached = list
              }

              private fun encode(list: List<LibrarySource>): String {
                  val arr = JSONArray()
                  for (s in list) {
                      arr.put(
                          JSONObject()
                              .put("id", s.id)
                              .put("type", s.type.name)
                              .put("label", s.label)
                              .put("deviceFolders", JSONArray(s.deviceFolders))
                              .put("smbHost", s.smbHost)
                              .put("smbShare", s.smbShare)
                              .put("smbSub", s.smbSubFolder)
                              .put("smbUser", s.smbUser)
                              .put("smbPassEnc", SecretCipher.encrypt(s.smbPass))
                              .put("navUrl", s.navUrl)
                              .put("navUser", s.navUser)
                              .put("navPassEnc", SecretCipher.encrypt(s.navPass))
                      )
                  }
                  return arr.toString()
              }

              private fun decode(json: String): List<LibrarySource> {
                  return try {
                      val arr = JSONArray(json)
                      val out = ArrayList<LibrarySource>(arr.length())
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val type = runCatching { SourceType.valueOf(o.optString("type")) }.getOrNull() ?: continue
                          val foldersJson = o.optJSONArray("deviceFolders")
                          val folders = ArrayList<String>()
                          if (foldersJson != null) {
                              for (j in 0 until foldersJson.length()) folders.add(foldersJson.optString(j))
                          }
                          out.add(
                              LibrarySource(
                                  id = o.optString("id").ifBlank { newId() },
                                  type = type,
                                  label = o.optString("label"),
                                  deviceFolders = folders,
                                  smbHost = o.optString("smbHost"),
                                  smbShare = o.optString("smbShare"),
                                  smbSubFolder = o.optString("smbSub"),
                                  smbUser = o.optString("smbUser"),
                                  smbPass = SecretCipher.decrypt(o.optString("smbPassEnc")),
                                  navUrl = o.optString("navUrl"),
                                  navUser = o.optString("navUser"),
                                  navPass = SecretCipher.decrypt(o.optString("navPassEnc"))
                              )
                          )
                      }
                      out
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              /** Turns the single Home Lab of versions before 3.1 into a library, once. */
              private fun migrateLegacy(context: Context, p: SharedPreferences): List<LibrarySource> {
                  val list = ArrayList<LibrarySource>()
                  val mode = p.getString("homelab_mode", "smb") ?: "smb"
                  val smbPass = p.getString("smb_pass", null) ?: SecretCipher.decrypt(p.getString("smb_pass_enc", "") ?: "")
                  val navPass = p.getString("pass", null) ?: SecretCipher.decrypt(p.getString("nav_pass_enc", "") ?: "")
                  val legacy = if (mode == "navidrome") {
                      LibrarySource(
                          id = newId(),
                          type = SourceType.NAVIDROME,
                          label = "Navidrome",
                          navUrl = p.getString("url", "") ?: "",
                          navUser = p.getString("user", "") ?: "",
                          navPass = navPass
                      )
                  } else {
                      val share = p.getString("smb_share", "") ?: ""
                      LibrarySource(
                          id = newId(),
                          type = SourceType.SMB,
                          label = share,
                          smbHost = p.getString("smb_host", "") ?: "",
                          smbShare = share,
                          smbSubFolder = p.getString("smb_subfolder", "") ?: "",
                          smbUser = p.getString("smb_user", "") ?: "",
                          smbPass = smbPass
                      )
                  }
                  if (legacy.isConfigured) list.add(legacy)
                  p.edit()
                      .putString(KEY_LIBRARIES, encode(list))
                      .remove("smb_pass")
                      .remove("pass")
                      .remove("smb_pass_enc")
                      .remove("nav_pass_enc")
                      .apply()
                  return list
              }
          }
