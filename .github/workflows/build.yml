          cat << 'EOF' > app/src/main/java/com/pulse/player/AudioSpectrum.kt
          package com.pulse.player

          import androidx.annotation.OptIn
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import androidx.media3.common.util.UnstableApi
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.log10
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.math.sqrt

          data class SpectrumSnapshot(
              var bass: Float = 0f,
              var mid: Float = 0f,
              var high: Float = 0f,
              var overall: Float = 0f,
              var beat: Float = 0f,
              var hasFreshData: Boolean = false
          )

          object AudioSpectrumBus {
              const val BAND_COUNT = 36

              @Volatile
              var analysisEnabled: Boolean = true

              private val lock = Any()
              private val latestBands = FloatArray(BAND_COUNT)
              private var latestBass = 0f
              private var latestMid = 0f
              private var latestHigh = 0f
              private var latestOverall = 0f
              private var latestBeat = 0f
              private var lastUpdateMs = 0L

              fun publish(
                  bands: FloatArray,
                  bass: Float,
                  mid: Float,
                  high: Float,
                  overall: Float,
                  beat: Float
              ) {
                  synchronized(lock) {
                      for (i in 0 until BAND_COUNT) {
                          val incoming = bands[i]
                          val prev = latestBands[i]
                          latestBands[i] = if (incoming > prev) {
                              prev + (incoming - prev) * 0.85f
                          } else {
                              prev + (incoming - prev) * 0.40f
                          }
                      }
                      latestBass = if (bass > latestBass) bass else latestBass * 0.65f + bass * 0.35f
                      latestMid = if (mid > latestMid) mid else latestMid * 0.65f + mid * 0.35f
                      latestHigh = if (high > latestHigh) high else latestHigh * 0.65f + high * 0.35f
                      latestOverall = overall
                      if (beat > latestBeat) latestBeat = beat
                      lastUpdateMs = System.currentTimeMillis()
                  }
              }

              fun readSnapshot(outBands: FloatArray, outMetrics: SpectrumSnapshot) {
                  val now = System.currentTimeMillis()
                  synchronized(lock) {
                      val fresh = (now - lastUpdateMs) < 350L
                      outMetrics.hasFreshData = fresh
                      if (fresh) {
                          System.arraycopy(latestBands, 0, outBands, 0, BAND_COUNT)
                          outMetrics.bass = latestBass
                          outMetrics.mid = latestMid
                          outMetrics.high = latestHigh
                          outMetrics.overall = latestOverall
                          outMetrics.beat = latestBeat
                          latestBeat *= 0.72f
                      } else {
                          outBands.fill(0f)
                          outMetrics.bass = 0f
                          outMetrics.mid = 0f
                          outMetrics.high = 0f
                          outMetrics.overall = 0f
                          outMetrics.beat = 0f
                      }
                  }
              }

              fun clear() {
                  synchronized(lock) {
                      latestBands.fill(0f)
                      latestBass = 0f
                      latestMid = 0f
                      latestHigh = 0f
                      latestOverall = 0f
                      latestBeat = 0f
                      lastUpdateMs = 0L
                  }
              }
          }

          @OptIn(UnstableApi::class)
          class SpectrumAudioProcessor : BaseAudioProcessor() {
              private val fftSize = 1024
              private val sampleBuffer = FloatArray(fftSize)
              private val fftReal = FloatArray(fftSize)
              private val fftImag = FloatArray(fftSize)
              private val hannWindow = FloatArray(fftSize) { i ->
                  (0.5 * (1.0 - cos(2.0 * PI * i / (fftSize - 1)))).toFloat()
              }
              private val magnitudes = FloatArray(fftSize / 2)
              private val tempBands = FloatArray(AudioSpectrumBus.BAND_COUNT)

              private var sampleCursor = 0
              private var sampleRate = 44100
              private var channelCount = 2
              private var encoding = C.ENCODING_PCM_16BIT

              private var avgBass = 0.08f
              private var lastBeatMs = 0L

              override fun onConfigure(inputAudioFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  val enc = inputAudioFormat.encoding
                  if (enc != C.ENCODING_PCM_16BIT && enc != C.ENCODING_PCM_FLOAT) {
                      return AudioProcessor.AudioFormat.NOT_SET
                  }
                  sampleRate = inputAudioFormat.sampleRate.coerceAtLeast(8000)
                  channelCount = inputAudioFormat.channelCount.coerceAtLeast(1)
                  encoding = enc
                  sampleCursor = 0
                  return inputAudioFormat
              }

              override fun queueInput(inputBuffer: ByteBuffer) {
                  val remaining = inputBuffer.remaining()
                  if (remaining == 0) return

                  val output = replaceOutputBuffer(remaining)
                  output.put(inputBuffer)
                  output.flip()

                  if (!AudioSpectrumBus.analysisEnabled) return

                  val readBuf = output.duplicate().order(ByteOrder.LITTLE_ENDIAN)
                  val channels = channelCount

                  if (encoding == C.ENCODING_PCM_16BIT) {
                      val bytesPerFrame = channels * 2
                      val frameCount = remaining / bytesPerFrame
                      for (f in 0 until frameCount) {
                          var mono = 0f
                          for (c in 0 until channels) {
                              mono += readBuf.short.toFloat() / 32768f
                          }
                          mono /= channels
                          sampleBuffer[sampleCursor++] = mono
                          if (sampleCursor >= fftSize) {
                              analyzeFrame()
                              sampleCursor = 0
                          }
                      }
                  } else if (encoding == C.ENCODING_PCM_FLOAT) {
                      val bytesPerFrame = channels * 4
                      val frameCount = remaining / bytesPerFrame
                      for (f in 0 until frameCount) {
                          var mono = 0f
                          for (c in 0 until channels) {
                              mono += readBuf.float
                          }
                          mono /= channels
                          sampleBuffer[sampleCursor++] = mono
                          if (sampleCursor >= fftSize) {
                              analyzeFrame()
                              sampleCursor = 0
                          }
                      }
                  }
              }

              private fun analyzeFrame() {
                  var sumSq = 0f
                  for (i in 0 until fftSize) {
                      val s = sampleBuffer[i]
                      sumSq += s * s
                      fftReal[i] = s * hannWindow[i]
                      fftImag[i] = 0f
                  }

                  val rms = sqrt(sumSq / fftSize)
                  if (rms < 0.0012f) {
                      tempBands.fill(0f)
                      avgBass *= 0.90f
                      AudioSpectrumBus.publish(tempBands, 0f, 0f, 0f, 0f, 0f)
                      return
                  }

                  computeFft(fftReal, fftImag)

                  val half = fftSize / 2
                  val invScale = 2f / fftSize
                  for (i in 1 until half) {
                      val re = fftReal[i]
                      val im = fftImag[i]
                      magnitudes[i] = sqrt(re * re + im * im) * invScale
                  }

                  val binHz = sampleRate.toFloat() / fftSize.toFloat()
                  val minFreq = 38f
                  val maxFreq = minOf(13500f, sampleRate * 0.45f)
                  val ratio = (maxFreq / minFreq).toDouble()
                  val bandCount = AudioSpectrumBus.BAND_COUNT

                  for (b in 0 until bandCount) {
                      val fLow = (minFreq * ratio.pow(b.toDouble() / bandCount)).toFloat()
                      val fHigh = (minFreq * ratio.pow((b + 1).toDouble() / bandCount)).toFloat()
                      val binStart = (fLow / binHz).toInt().coerceIn(1, half - 1)
                      val binEnd = (fHigh / binHz).toInt().coerceIn(binStart, half - 1)

                      var peak = 0f
                      var sum = 0f
                      val count = (binEnd - binStart + 1).coerceAtLeast(1)
                      for (k in binStart..binEnd) {
                          val m = magnitudes[k]
                          sum += m
                          if (m > peak) peak = m
                      }
                      val combined = peak * 0.65f + (sum / count) * 0.35f
                      val db = 20f * log10(combined.coerceAtLeast(1e-6f))
                      val tiltDb = (b.toFloat() / bandCount) * 11f
                      val norm = ((db + 56f + tiltDb) / 46f).coerceIn(0f, 1f)
                      tempBands[b] = norm.pow(1.22f)
                  }

                  var bassSum = 0f
                  for (i in 0 until 7) bassSum += tempBands[i]
                  val bass = (bassSum / 7f).coerceIn(0f, 1f)

                  var midSum = 0f
                  for (i in 7 until 22) midSum += tempBands[i]
                  val mid = (midSum / 15f).coerceIn(0f, 1f)

                  var highSum = 0f
                  for (i in 22 until bandCount) highSum += tempBands[i]
                  val high = (highSum / (bandCount - 22)).coerceIn(0f, 1f)

                  val overall = (rms * 3.4f).coerceIn(0f, 1f)

                  val now = System.currentTimeMillis()
                  val bassTrigger = bass > (avgBass * 1.24f + 0.05f) && bass > 0.22f
                  val beat = if (bassTrigger && (now - lastBeatMs) > 130L) {
                      lastBeatMs = now
                      ((bass - avgBass) * 2.6f + 0.45f).coerceIn(0.45f, 1f)
                  } else {
                      0f
                  }
                  avgBass = avgBass * 0.90f + bass * 0.10f

                  AudioSpectrumBus.publish(tempBands, bass, mid, high, overall, beat)
              }

              private fun computeFft(real: FloatArray, imag: FloatArray) {
                  val n = real.size
                  var j = 0
                  for (i in 1 until n) {
                      var bit = n shr 1
                      while ((j and bit) != 0) {
                          j = j xor bit
                          bit = bit shr 1
                      }
                      j = j xor bit
                      if (i < j) {
                          val tr = real[i]; real[i] = real[j]; real[j] = tr
                          val ti = imag[i]; imag[i] = imag[j]; imag[j] = ti
                      }
                  }

                  var len = 2
                  while (len <= n) {
                      val ang = -2.0 * PI / len
                      val wLenR = cos(ang).toFloat()
                      val wLenI = sin(ang).toFloat()
                      var i = 0
                      while (i < n) {
                          var wR = 1f
                          var wI = 0f
                          val half = len shr 1
                          for (k in 0 until half) {
                              val idx = i + k + half
                              val uR = real[i + k]
                              val uI = imag[i + k]
                              val vR = real[idx] * wR - imag[idx] * wI
                              val vI = real[idx] * wI + imag[idx] * wR
                              real[i + k] = uR + vR
                              imag[i + k] = uI + vI
                              real[idx] = uR - vR
                              imag[idx] = uI - vI
                              val nextWR = wR * wLenR - wI * wLenI
                              wI = wR * wLenI + wI * wLenR
                              wR = nextWR
                          }
                          i += len
                      }
                      len = len shl 1
                  }
              }

              override fun onFlush() {
                  sampleCursor = 0
                  avgBass = 0.08f
                  AudioSpectrumBus.clear()
              }

              override fun onReset() {
                  sampleCursor = 0
                  avgBass = 0.08f
                  AudioSpectrumBus.clear()
              }
          }
