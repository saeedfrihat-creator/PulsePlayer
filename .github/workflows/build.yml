          /** A folder: big generated cover, play all / shuffle, and its tracks. Quran folders switch to Sakina. */
          @Composable
          fun FolderScreen(
              vm: PulseViewModel,
              folderKey: String,
              isTv: Boolean,
              onBack: () -> Unit,
              onPlay: (List<SongItem>, Int, Boolean) -> Unit,
              onManageSong: (SongItem) -> Unit,
              onOpenStudio: () -> Unit,
              onOpenTvSearch: () -> Unit
          ) {
              val folder = vm.folderByKey(folderKey)
              if (folder == null) {
                  LaunchedEffect(folderKey) { onBack() }
                  return
              }
              val kind = vm.kindOf(folder)
              val mood = if (kind != IslamicKind.NONE) Mood.Sakina else Mood.Ember
              val cover = vm.coverOf(folder)
              val query = vm.folderQuery
              val songs = remember(folder, query) {
                  if (query.isBlank()) folder.songs else folder.songs.filter {
                      it.title.contains(query, ignoreCase = true) || it.artist.contains(query, ignoreCase = true)
                  }
              }
              val sourceLabel = vm.sourceLabel(folder.sourceId)
              val meta = listOf(songsCountText(folder.songs.size), folder.parentPath, if (vm.sources.size > 1) sourceLabel else "")
                  .filter { it.isNotBlank() }
                  .joinToString("  ·  ")
              var searchOpen by remember(folderKey) { mutableStateOf(false) }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(mood.bg)
              ) {
                  if (mood.isSakina) {
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(460.dp)
                              .background(Brush.verticalGradient(listOf(Color(0xFF0E3A2E), mood.bg)))
                      )
                      GirihBackdrop(modifier = Modifier.fillMaxWidth().height(420.dp), alpha = 0.07f)
                  } else {
                      Box(
                          modifier = Modifier
                              .offset(x = (-80).dp, y = (-140).dp)
                              .size(460.dp)
                              .background(Brush.radialGradient(listOf(cover.accent.copy(alpha = 0.20f), Color.Transparent)), CircleShape)
                      )
                  }

                  val folderArtKey = vm.artKeyOf(folder)
                  val canMoveFolder = !vm.isVirtualFolderKey(folder.key)
                  val isMixed = vm.isMixedFolder(folder.rawKey)
                  val header: @Composable () -> Unit = {
                      FolderHero(
                          folder = folder,
                          cover = cover,
                          artKey = folderArtKey,
                          mood = mood,
                          meta = meta,
                          isTv = isTv,
                          canMove = canMoveFolder,
                          isMixed = isMixed,
                          onPlayAll = { onPlay(folder.songs, 0, false) },
                          onShuffle = { onPlay(folder.songs, 0, true) },
                          onMoveSection = {
                              val target = if (mood.isSakina) LibrarySection.MUSIC else LibrarySection.QURAN
                              vm.moveFolderToSection(folder.rawKey, target)
                          }
                      )
                  }

                  val list: @Composable (Modifier, Boolean) -> Unit = { mod, withHeader ->
                      LazyColumn(
                          modifier = mod,
                          contentPadding = PaddingValues(start = 12.dp, end = 12.dp, top = 4.dp, bottom = if (isTv) 32.dp else 128.dp),
                          verticalArrangement = Arrangement.spacedBy(2.dp)
                      ) {
                          if (withHeader) {
                              item { header() }
                          }
                          if (searchOpen && !isTv) {
                              item {
                                  OutlinedTextField(
                                      value = vm.folderQuery,
                                      onValueChange = { vm.folderQuery = it },
                                      placeholder = { Text(stringResource(R.string.search_in_folder, folder.displayName), color = mood.muted, fontSize = 14.sp) },
                                      leadingIcon = { Icon(Icons.Rounded.Search, contentDescription = null, tint = mood.accent) },
                                      singleLine = true,
                                      shape = RoundedCornerShape(16.dp),
                                      colors = pulseFieldColors(mood.accent),
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(horizontal = 4.dp, vertical = 8.dp)
                                  )
                              }
                          }
                          if (songs.isEmpty()) {
                              item {
                                  Text(
                                      stringResource(R.string.no_songs_in_folder),
                                      color = mood.muted,
                                      textAlign = TextAlign.Center,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(vertical = 40.dp)
                                  )
                              }
                          }
                          itemsIndexed(songs, key = { i, s -> "${s.id}_$i" }) { index, song ->
                              TrackRow(
                                  number = index + 1,
                                  song = song,
                                  isCurrent = song.id == vm.currentMediaId,
                                  isPlaying = vm.isPlaying,
                                  clock = vm.clock,
                                  mood = mood,
                                  showFolder = false,
                                  onClick = { onPlay(songs, index, false) },
                                  onManage = { onManageSong(song) }
                              )
                          }
                      }
                  }

                  Column(modifier = Modifier.fillMaxSize().statusBarsPadding()) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = if (isTv) 48.dp else 16.dp, vertical = if (isTv) 24.dp else 10.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          RoundIconButton(
                              icon = Icons.AutoMirrored.Rounded.ArrowBack,
                              contentDescription = stringResource(R.string.back_to_folders),
                              onClick = onBack,
                              tint = mood.text,
                              container = mood.text.copy(alpha = 0.07f),
                              borderColor = mood.line,
                              ring = mood.accent
                          )
                          val topLabel = when {
                              folder.key == FAVORITES_QURAN_KEY -> stringResource(R.string.section_quran)
                              folder.key == FAVORITES_MUSIC_KEY -> stringResource(R.string.section_music)
                              mood.isSakina -> stringResource(if (kind == IslamicKind.DHIKR) R.string.dhikr_header else R.string.quran_header)
                              else -> sourceLabel.ifBlank { stringResource(R.string.section_music) }
                          }
                          Text(
                              topLabel,
                              fontSize = 13.sp,
                              color = mood.muted,
                              fontFamily = if (mood.isSakina) PulseFonts.quran else null
                          )
                          RoundIconButton(
                              icon = Icons.Rounded.Search,
                              contentDescription = stringResource(R.string.search_action),
                              onClick = {
                                  if (isTv) {
                                      onOpenTvSearch()
                                  } else {
                                      searchOpen = !searchOpen
                                      if (!searchOpen) vm.folderQuery = ""
                                  }
                              },
                              tint = mood.text,
                              container = mood.text.copy(alpha = 0.07f),
                              borderColor = mood.line,
                              ring = mood.accent
                          )
                      }
                      if (isTv) {
                          Row(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(start = 48.dp, end = 36.dp),
                              horizontalArrangement = Arrangement.spacedBy(40.dp)
                          ) {
                              Box(modifier = Modifier.width(360.dp)) { header() }
                              list(Modifier.weight(1f).fillMaxHeight(), false)
                          }
                      } else {
                          list(Modifier.fillMaxSize(), true)
                      }
                  }

                  if (!isTv && vm.hasActiveTrack) {
                      MiniPlayer(
                          title = vm.currentTitle.ifBlank { stringResource(R.string.select_song_prompt) },
                          subtitle = nowPlayingSubtitle(vm),
                          cover = vm.currentCover,
                          artKey = vm.currentArtKey,
                          progress = if (vm.durationMs > 0L) vm.positionMs.toFloat() / vm.durationMs else 0f,
                          isPlaying = vm.isPlaying,
                          mood = Mood.fromCover(vm.currentCover),
                          onOpen = onOpenStudio,
                          onPlayPause = { vm.playPause() },
                          onNext = { vm.next() },
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .navigationBarsPadding()
                              .padding(horizontal = 14.dp, vertical = 14.dp)
                      )
                  }
              }
          }

          @Composable
          private fun FolderHero(
              folder: FolderGroup,
              cover: CoverSpec,
              artKey: String?,
              mood: Mood,
              meta: String,
              isTv: Boolean,
              canMove: Boolean,
              isMixed: Boolean,
