          /** Remote-friendly search: the on-screen keyboard opens only when this dialog is shown. */
          @Composable
          fun TvSearchDialog(
              initialQuery: String,
              placeholder: String,
              onSearch: (String) -> Unit,
              onClear: () -> Unit,
              onDismiss: () -> Unit
          ) {
              var draftQuery by remember(initialQuery) { mutableStateOf(initialQuery) }
              val searchFocusRequester = remember { FocusRequester() }
              LaunchedEffect(Unit) {
                  delay(120L)
                  runCatching { searchFocusRequester.requestFocus() }
              }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = Pal.Sheet,
                  shape = RoundedCornerShape(26.dp),
                  title = { Text(stringResource(R.string.search_dialog_title), fontWeight = FontWeight.Bold, color = Pal.Text) },
                  text = {
                      OutlinedTextField(
                          value = draftQuery,
                          onValueChange = { draftQuery = it },
                          placeholder = { Text(placeholder, color = Pal.Faint) },
                          leadingIcon = { Icon(Icons.Rounded.Search, contentDescription = null, tint = Pal.Ember) },
                          singleLine = true,
                          shape = RoundedCornerShape(16.dp),
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                          keyboardActions = KeyboardActions(onSearch = { onSearch(draftQuery.trim()) }),
                          colors = pulseFieldColors(Pal.Ember),
                          modifier = Modifier
                              .fillMaxWidth()
                              .focusRequester(searchFocusRequester)
                      )
                  },
                  confirmButton = {
                      Button(
                          onClick = { onSearch(draftQuery.trim()) },
                          colors = ButtonDefaults.buttonColors(containerColor = Pal.Ember, contentColor = Pal.Ink)
                      ) { Text(stringResource(R.string.search_action), fontWeight = FontWeight.Bold, color = Pal.Ink) }
                  },
                  dismissButton = {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          if (draftQuery.isNotEmpty() || initialQuery.isNotEmpty()) {
                              TextButton(onClick = onClear) { Text(stringResource(R.string.clear), color = Pal.Muted) }
                          }
                          TextButton(onClick = onDismiss) { Text(stringResource(R.string.cancel), color = Pal.Muted) }
                      }
                  }
              )
          }

          @Composable
          fun ManageSongDialog(
              song: SongItem,
              cover: CoverSpec,
              artKey: String?,
              isFavorite: Boolean,
              isInQuranSection: Boolean,
              canDelete: Boolean,
              onToggleFavorite: () -> Unit,
              onMoveSongSection: () -> Unit,
              onMoveFolderSection: () -> Unit,
              onHideSong: () -> Unit,
              onHideFolder: () -> Unit,
              onDelete: () -> Unit,
              onDismiss: () -> Unit
          ) {
              val folderDisplay = song.folder.substringAfterLast('/').ifBlank { song.folder }
              val sheetShape = RoundedCornerShape(28.dp)
              val targetAccent = if (isInQuranSection) Pal.Ember else Pal.Gold
              val targetSectionName = stringResource(if (isInQuranSection) R.string.section_music else R.string.section_quran)

              val containerBrush = if (isInQuranSection) {
                  Brush.verticalGradient(listOf(Color(0xFF0E2920), Color(0xFF071914)))
              } else {
                  Brush.verticalGradient(listOf(Color(0xFF1C1926), Color(0xFF121019)))
              }
              val containerBorder = if (isInQuranSection) Pal.Gold.copy(alpha = 0.30f) else Color(0x28F4F1EA)
              val dividerColor = if (isInQuranSection) Pal.Gold.copy(alpha = 0.14f) else Pal.Line
              val mutedColor = if (isInQuranSection) Pal.Sage else Pal.Muted
              val focusRing = if (isInQuranSection) Pal.Gold else Pal.Ember

              Dialog(
                  onDismissRequest = onDismiss,
                  properties = DialogProperties(usePlatformDefaultWidth = false)
              ) {
                  Column(
                      modifier = Modifier
                          .padding(horizontal = 20.dp, vertical = 24.dp)
                          .widthIn(max = 420.dp)
                          .fillMaxWidth()
                          .clip(sheetShape)
                          .background(containerBrush)
                          .border(1.dp, containerBorder, sheetShape)
                          .padding(18.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      // Header: cover, title, folder, and close button
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          GenerativeCover(
                              spec = cover,
                              artKey = artKey,
                              modifier = Modifier.size(52.dp),
                              shape = RoundedCornerShape(14.dp)
                          )
                          Column(
                              modifier = Modifier.weight(1f),
                              verticalArrangement = Arrangement.spacedBy(3.dp)
                          ) {
                              Text(
                                  song.title,
                                  fontSize = if (isInQuranSection) 18.sp else 16.sp,
                                  fontFamily = if (isInQuranSection) PulseFonts.quran else null,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isInQuranSection) Pal.GoldLight else Pal.Text,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  listOf(song.artist, folderDisplay)
                                      .filter { it.isNotBlank() }
                                      .distinct()
                                      .joinToString(" · "),
                                  fontSize = 12.sp,
                                  color = mutedColor,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                          RoundIconButton(
                              icon = Icons.Rounded.Close,
                              contentDescription = stringResource(R.string.close),
                              onClick = onDismiss,
                              size = 36.dp,
                              iconSize = 18.dp,
                              tint = mutedColor,
                              container = Color(0x12FFFFFF),
                              borderColor = dividerColor,
                              ring = focusRing
                          )
                      }

                      HorizontalDivider(color = dividerColor, thickness = 1.dp)

                      Column(
                          modifier = Modifier.verticalScroll(rememberScrollState()),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          // Favorite
                          val favColor = Color(0xFFFF6B8B)
                          ManageActionRow(
                              icon = if (isFavorite) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                              title = stringResource(if (isFavorite) R.string.remove_from_favorites else R.string.add_to_favorites),
                              subtitle = null,
                              iconTint = if (isFavorite) favColor else Pal.Text,
                              iconBg = if (isFavorite) favColor.copy(alpha = 0.18f) else Color(0x14FFFFFF),
                              containerBg = if (isFavorite) favColor.copy(alpha = 0.09f) else Color(0x0BFFFFFF),
                              borderColor = if (isFavorite) favColor.copy(alpha = 0.30f) else dividerColor,
                              titleColor = Pal.Text,
                              subtitleColor = mutedColor,
                              ringColor = focusRing,
                              onClick = onToggleFavorite
                          )

                          // Move single track (accented glass highlight, crisp contrast)
                          ManageActionRow(
                              icon = if (isInQuranSection) Icons.Rounded.MusicNote else Icons.Rounded.MenuBook,
                              title = stringResource(if (isInQuranSection) R.string.action_move_to_music else R.string.action_move_to_quran),
                              subtitle = stringResource(R.string.action_this_track_only),
                              iconTint = if (isInQuranSection) Pal.Ember else Pal.GoldLight,
                              iconBg = targetAccent.copy(alpha = 0.20f),
                              containerBg = if (isInQuranSection) Pal.Ember.copy(alpha = 0.13f) else Color(0x2810B981),
                              borderColor = targetAccent.copy(alpha = 0.45f),
                              titleColor = if (isInQuranSection) Pal.Text else Pal.GoldLight,
                              subtitleColor = if (isInQuranSection) Pal.Muted else Pal.Mint.copy(alpha = 0.78f),
                              ringColor = targetAccent,
                              onClick = onMoveSongSection
                          )

                          // Move entire folder
                          ManageActionRow(
                              icon = Icons.Rounded.SwapHoriz,
                              title = stringResource(R.string.action_move_entire_folder),
                              subtitle = stringResource(R.string.action_folder_to_section, folderDisplay, targetSectionName),
                              iconTint = targetAccent,
                              iconBg = targetAccent.copy(alpha = 0.14f),
                              containerBg = Color(0x0BFFFFFF),
                              borderColor = dividerColor,
                              titleColor = Pal.Text,
                              subtitleColor = mutedColor,
                              ringColor = focusRing,
                              onClick = onMoveFolderSection
                          )

                          HorizontalDivider(
                              color = dividerColor,
                              thickness = 1.dp,
                              modifier = Modifier.padding(vertical = 2.dp)
                          )

                          // Hide single track
                          ManageActionRow(
                              icon = Icons.Rounded.VisibilityOff,
                              title = stringResource(R.string.action_hide_track),
                              subtitle = stringResource(R.string.action_from_pulse_only),
                              iconTint = mutedColor,
                              iconBg = Color(0x12FFFFFF),
                              containerBg = Color(0x08FFFFFF),
                              borderColor = dividerColor,
                              titleColor = Pal.Text,
                              subtitleColor = mutedColor,
                              ringColor = focusRing,
                              onClick = onHideSong
                          )

                          // Hide entire folder
                          ManageActionRow(
                              icon = Icons.Rounded.Folder,
                              title = stringResource(R.string.action_hide_folder),
                              subtitle = folderDisplay,
                              iconTint = mutedColor,
                              iconBg = Color(0x12FFFFFF),
                              containerBg = Color(0x08FFFFFF),
                              borderColor = dividerColor,
                              titleColor = Pal.Text,
                              subtitleColor = mutedColor,
                              ringColor = focusRing,
                              onClick = onHideFolder
                          )

                          // Permanent delete (local files only)
                          if (canDelete) {
                              ManageActionRow(
                                  icon = Icons.Rounded.Delete,
                                  title = stringResource(R.string.action_delete_track),
                                  subtitle = stringResource(R.string.action_delete_desc),
                                  iconTint = Pal.Danger,
                                  iconBg = Pal.Danger.copy(alpha = 0.18f),
                                  containerBg = Pal.Danger.copy(alpha = 0.10f),
                                  borderColor = Pal.Danger.copy(alpha = 0.36f),
                                  titleColor = Pal.Danger,
                                  subtitleColor = Color(0xFFDDA1A7),
                                  ringColor = Pal.Danger,
                                  onClick = onDelete
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ManageActionRow(
              icon: ImageVector,
              title: String,
              subtitle: String?,
              iconTint: Color,
              iconBg: Color,
              containerBg: Color,
              borderColor: Color,
              titleColor: Color,
              subtitleColor: Color,
              ringColor: Color,
              onClick: () -> Unit
          ) {
              val shape = RoundedCornerShape(16.dp)
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .focusGlow(shape, ring = ringColor, scaleTo = 1.025f)
                      .clip(shape)
                      .background(containerBg)
                      .border(1.dp, borderColor, shape)
                      .clickable(role = Role.Button, onClick = onClick)
                      .padding(horizontal = 12.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Box(
                      modifier = Modifier
                          .size(38.dp)
                          .clip(RoundedCornerShape(12.dp))
                          .background(iconBg),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(icon, contentDescription = null, tint = iconTint, modifier = Modifier.size(20.dp))
                  }
                  Column(
                      modifier = Modifier.weight(1f),
                      verticalArrangement = Arrangement.spacedBy(2.dp)
                  ) {
                      Text(
                          title,
                          fontSize = 14.sp,
                          fontWeight = FontWeight.SemiBold,
                          color = titleColor,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      if (!subtitle.isNullOrBlank()) {
                          Text(
                              subtitle,
                              fontSize = 12.sp,
                              color = subtitleColor,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
                  Icon(
                      Icons.Rounded.ChevronRight,
                      contentDescription = null,
                      tint = subtitleColor.copy(alpha = 0.65f),
                      modifier = Modifier.size(18.dp)
                  )
              }
          }

          @Composable
          fun SleepTimerDialog(
              remainingSec: Long,
              onSelectMinutes: (Int) -> Unit,
              onDismiss: () -> Unit
          ) {
              val options = listOf(
                  0 to R.string.sleep_off,
                  15 to R.string.sleep_15,
                  30 to R.string.sleep_30,
                  45 to R.string.sleep_45,
                  60 to R.string.sleep_60,
                  -1 to R.string.sleep_end_of_track
              )
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = Pal.Sheet,
                  shape = RoundedCornerShape(26.dp),
                  title = { Text(stringResource(R.string.sleep_timer), fontWeight = FontWeight.Bold, color = Pal.Text) },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          options.forEach { (mins, labelRes) ->
                              val selected = when {
                                  mins == 0 -> remainingSec == 0L
                                  mins < 0 -> remainingSec < 0L
                                  else -> false
                              }
                              DialogChoiceRow(
                                  label = stringResource(labelRes),
                                  selected = selected,
                                  onClick = { onSelectMinutes(mins) }
                              )
                          }
                      }
                  },
                  confirmButton = {},
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text(stringResource(R.string.close), color = Pal.Muted) }
                  }
              )
          }

          @Composable
          fun EqualizerDialog(
              currentPreset: Int,
              onSelect: (Int) -> Unit,
              onDismiss: () -> Unit
          ) {
              val presets = listOf(
                  EQ_NORMAL to R.string.eq_normal,
                  EQ_VOICE to R.string.eq_voice,
                  EQ_BASS to R.string.eq_bass,
                  EQ_WARM to R.string.eq_warm
              )
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = Pal.Sheet,
                  shape = RoundedCornerShape(26.dp),
                  title = { Text(stringResource(R.string.equalizer), fontWeight = FontWeight.Bold, color = Pal.Text) },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          presets.forEach { (preset, labelRes) ->
                              DialogChoiceRow(
                                  label = stringResource(labelRes),
                                  selected = currentPreset == preset,
                                  onClick = { onSelect(preset) }
                              )
                          }
                      }
                  },
                  confirmButton = {},
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text(stringResource(R.string.close), color = Pal.Muted) }
                  }
              )
          }

          @Composable
          private fun DialogChoiceRow(label: String, selected: Boolean, onClick: () -> Unit) {
              val shape = RoundedCornerShape(14.dp)
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .focusGlow(shape, ring = Pal.Ember, scaleTo = 1.03f)
                      .clip(shape)
                      .background(if (selected) Pal.Ember.copy(alpha = 0.16f) else Pal.Surface)
                      .border(1.dp, if (selected) Pal.Ember else Pal.Line, shape)
                      .clickable(role = Role.RadioButton, onClick = onClick)
                      .padding(horizontal = 14.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(
                      label,
                      fontSize = 15.sp,
                      fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium,
                      color = if (selected) Pal.Ember else Pal.Text
                  )
                  if (selected) {
                      Icon(Icons.Rounded.Check, contentDescription = null, tint = Pal.Ember, modifier = Modifier.size(18.dp))
                  }
              }
          }
