              fun classify(vararg parts: String): IslamicKind {
                  val combined = parts.joinToString(" ").lowercase(Locale.ROOT)
                  if (combined.isBlank()) return IslamicKind.NONE
                  if (quranKeywords.any { combined.contains(it) }) return IslamicKind.QURAN
                  if (dhikrKeywords.any { combined.contains(it) }) return IslamicKind.DHIKR
                  return IslamicKind.NONE
              }
