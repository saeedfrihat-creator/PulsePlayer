          @Composable
          fun AmbientAuroraBackdrop(
              clock: VisualizerClock,
              animate: Boolean,
              isIslamic: Boolean,
              modifier: Modifier = Modifier
          ) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  if (w <= 2f || h <= 2f) return@Canvas
                  val minDim = minOf(w, h)

                  if (animate) {
                      @Suppress("UNUSED_VARIABLE")
                      val tick = clock.frameTick
                  }
                  val phase = if (animate) clock.phase else 0f
                  val energy = if (animate) (clock.bass * 0.65f + clock.overall * 0.35f) else 0.12f
                  val beatLift = if (animate) clock.beat * 0.14f else 0f
                  val glowBoost = (0.16f + 0.16f * energy + beatLift).coerceIn(0.12f, 0.45f)

                  val c1 = if (isIslamic) AuraPalette.EmeraldGlow else AuraPalette.Violet
                  val c2 = if (isIslamic) AuraPalette.Gold else AuraPalette.Cyan
                  val c3 = if (isIslamic) Color(0xFF0D9488) else AuraPalette.Rose

                  val speedScale = if (isIslamic) 0.35f else 0.70f
                  val p = phase * speedScale

                  val o1 = Offset(w * 0.22f + cos(p * 0.28f) * w * 0.14f, h * 0.18f + sin(p * 0.21f) * h * 0.10f)
                  val o2 = Offset(w * 0.80f + cos(p * 0.23f + 2f) * w * 0.15f, h * 0.72f + sin(p * 0.31f + 1f) * h * 0.12f)
                  val o3 = Offset(w * 0.50f + sin(p * 0.19f) * w * 0.14f, h * 0.45f + cos(p * 0.25f) * h * 0.10f)

                  drawCircle(
                      brush = Brush.radialGradient(
                          listOf(c1.copy(alpha = glowBoost), Color.Transparent),
                          center = o1,
                          radius = minDim * (0.72f + beatLift * 0.4f)
                      ),
                      radius = minDim * (0.72f + beatLift * 0.4f),
                      center = o1
                  )
                  drawCircle(
                      brush = Brush.radialGradient(
                          listOf(c2.copy(alpha = glowBoost * (if (isIslamic) 0.68f else 0.85f)), Color.Transparent),
                          center = o2,
                          radius = minDim * 0.68f
                      ),
                      radius = minDim * 0.68f,
                      center = o2
                  )
                  drawCircle(
                      brush = Brush.radialGradient(
                          listOf(c3.copy(alpha = glowBoost * 0.45f), Color.Transparent),
                          center = o3,
                          radius = minDim * 0.55f
                      ),
                      radius = minDim * 0.55f,
                      center = o3
                  )
              }
          }

