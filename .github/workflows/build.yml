                      color = if (isFocused) Color(0xFF2C254A) else MaterialTheme.colorScheme.surface,
                      border = if (isFocused) BorderStroke(2.dp, Color(0xFFBB86FC)) else null,
                      modifier = Modifier
                          .weight(1f)
                          .onFocusChanged { isFocused = it.isFocused }
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 14.dp, vertical = 14.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(42.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(if (isRemote) Color(0xFF262047) else Color(0xFF1F2B3D)),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  Icons.Default.Folder,
                                  contentDescription = null,
                                  tint = if (isRemote) MaterialTheme.colorScheme.secondary else Color(0xFF64B5F6)
                              )
                          }
                          Spacer(Modifier.width(12.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  folder.name,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 15.sp,
                                  color = Color.White,
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis
