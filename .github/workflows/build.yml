          package com.pulse.player

          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import androidx.annotation.OptIn
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import java.lang.ref.WeakReference

          object PlaybackBridge {
              @Volatile
              var stopAfterCurrent: Boolean = false
                  private set

              private var exoPlayerRef: WeakReference<ExoPlayer>? = null
              private var serviceRef: WeakReference<PlaybackService>? = null

              @OptIn(UnstableApi::class)
              fun attach(service: PlaybackService, player: ExoPlayer) {
                  serviceRef = WeakReference(service)
                  exoPlayerRef = WeakReference(player)
                  player.pauseAtEndOfMediaItems = stopAfterCurrent
              }

              fun detach() {
                  exoPlayerRef = null
                  serviceRef = null
              }

              @OptIn(UnstableApi::class)
              fun setStopAfterCurrent(enabled: Boolean) {
                  stopAfterCurrent = enabled
                  exoPlayerRef?.get()?.let { p ->
                      Handler(p.applicationLooper).post {
                          p.pauseAtEndOfMediaItems = enabled
                      }
                  }
              }

              fun setVisualizerActive(active: Boolean) {
                  AudioSpectrumBus.analysisEnabled = active
                  if (!active) {
                      AudioSpectrumBus.clear()
                  }
              }

              fun stopPlayback(stopService: Boolean = false) {
                  AudioSpectrumBus.clear()
                  val p = exoPlayerRef?.get()
                  if (p != null) {
                      Handler(p.applicationLooper).post {
                          p.playWhenReady = false
                          p.pause()
                          p.stop()
                          p.clearMediaItems()
                          if (stopService) {
                              serviceRef?.get()?.shutdownService()
                          }
                      }
                  } else if (stopService) {
                      serviceRef?.get()?.shutdownService()
                  }
              }
          }

          @OptIn(UnstableApi::class)
          private class PulseRenderersFactory(
              context: Context,
              private val spectrumProcessor: SpectrumAudioProcessor
          ) : DefaultRenderersFactory(context) {
              override fun buildAudioSink(
                  context: Context,
                  enableFloatOutput: Boolean,
                  enableAudioTrackPlaybackParams: Boolean
              ): AudioSink {
                  return DefaultAudioSink.Builder(context)
                      .setEnableFloatOutput(enableFloatOutput)
                      .setEnableAudioTrackPlaybackParams(enableAudioTrackPlaybackParams)
                      .setAudioProcessors(arrayOf(spectrumProcessor))
                      .build()
              }
          }

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null
              private val retryHandler = Handler(Looper.getMainLooper())
              private var consecutiveRetries = 0

              @OptIn(UnstableApi::class)
              override fun onCreate() {
                  super.onCreate()
                  val audioAttributes = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                      .build()

                  val loadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(
                          30_000,
                          120_000,
                          2_500,
                          5_000
                      )
                      .setBackBuffer(15_000, true)
                      .build()

                  val spectrumProcessor = SpectrumAudioProcessor()
                  val renderersFactory = PulseRenderersFactory(this, spectrumProcessor)
                  val mediaSourceFactory = DefaultMediaSourceFactory(PulseDataSourceFactory(this))

                  val player = ExoPlayer.Builder(this, renderersFactory)
                      .setMediaSourceFactory(mediaSourceFactory)
                      .setLoadControl(loadControl)
                      .setAudioAttributes(audioAttributes, true)
                      .setHandleAudioBecomingNoisy(true)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .build()

                  player.addListener(object : Player.Listener {
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                          consecutiveRetries = 0
                          retryHandler.removeCallbacksAndMessages(null)
                      }

                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_READY) {
                              consecutiveRetries = 0
                          }
                      }

                      override fun onPlayerError(error: PlaybackException) {
                          if (consecutiveRetries < 3 && player.mediaItemCount > 0) {
                              consecutiveRetries++
                              val resumeIndex = player.currentMediaItemIndex.coerceAtLeast(0)
                              val resumePos = player.currentPosition.coerceAtLeast(0L)
                              val shouldPlay = player.playWhenReady
                              retryHandler.removeCallbacksAndMessages(null)
                              retryHandler.postDelayed({
                                  if (mediaSession != null && player.mediaItemCount > 0) {
                                      player.seekTo(resumeIndex, resumePos)
                                      player.prepare()
                                      if (shouldPlay) player.play()
                                  }
                              }, 1500L)
                          }
                      }
                  })

                  val openAppIntent = Intent(this, MainActivity::class.java).apply {
                      action = Intent.ACTION_MAIN
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or
                          Intent.FLAG_ACTIVITY_SINGLE_TOP or
                          Intent.FLAG_ACTIVITY_CLEAR_TOP or
                          Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                  }
                  val sessionActivityPendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openAppIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  PlaybackBridge.attach(this, player)
                  mediaSession = MediaSession.Builder(this, player)
                      .setSessionActivity(sessionActivityPendingIntent)
                      .build()
              }

              fun shutdownService() {
                  retryHandler.removeCallbacksAndMessages(null)
                  AudioSpectrumBus.clear()
                  runCatching { stopForeground(STOP_FOREGROUND_REMOVE) }
                  stopSelf()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? {
                  return mediaSession
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  val player = mediaSession?.player
                  val activelyPlaying = player != null &&
                      player.playWhenReady &&
                      player.mediaItemCount > 0 &&
                      player.playbackState != Player.STATE_ENDED
                  if (!activelyPlaying) {
                      shutdownService()
                  }
              }

              override fun onDestroy() {
                  retryHandler.removeCallbacksAndMessages(null)
                  PlaybackBridge.detach()
                  AudioSpectrumBus.clear()
                  mediaSession?.run {
                      player.release()
                      release()
                      mediaSession = null
                  }
                  super.onDestroy()
              }
          }
